<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secteur Est</title>
<meta name="description" content="Portail du Secteur Est – Ville de Schiltigheim : stock entretien, maintenance technique, registres de sécurité.">
<meta name="theme-color" content="#e83447">
<link rel="manifest" href="portail.webmanifest">
<link rel="icon" href="portail-192.png">
<link rel="apple-touch-icon" href="portail-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Secteur Est">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sch:#e83447;--sch-dk:#c8102e;--ink:#2b2a2a;--fg:var(--ink);--muted:#6b6566;--line:#ece4e5;--bg:#f6f2f2;--surface:#fff;
  --display:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid var(--sch);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none}
.lg img{height:40px}
.lg span{font:800 .66rem/1 var(--display);letter-spacing:.14em;color:var(--sch)}
.top h1{margin:0 0 0 6px;padding-left:12px;border-left:2px solid var(--line);font:800 1.25rem/1.1 var(--display);letter-spacing:.02em}
.top .sp{flex:1}
.who{font-size:.85rem;color:var(--muted);text-align:right;line-height:1.2}
.who button{border:0;background:none;color:var(--sch-dk);font:700 .85rem var(--body);padding:4px 0;cursor:pointer;text-decoration:underline}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hello{text-align:center;margin:8px 0 0}
.hello small{color:var(--muted)}
.hello h2{font:800 1.7rem/1.15 var(--display);margin:4px 0 8px}
.etat{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.etat.ok{background:#e7f6ee;color:#1d6b43}.etat.ko{background:#fde7ea;color:#b81c33}
.thit small { font-size: .74rem; color: #6b6567; line-height: 1.25; }
@media (prefers-color-scheme: dark) { .thit { background: var(--surface); border-color: var(--line); color: var(--ink); } .thit small, .theme p.ts { color: var(--muted); } }
.compte { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 16px; background: #faf7f7; border: 1px solid #f0e8e9; }
.hero{display:flex;justify-content:center;padding:6px 0 4px}
.bulles{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 8px;padding:6px 0 10px;max-width:900px;margin:0 auto}
.bulles>.bul{width:150px}
.bul{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center;max-width:150px;-webkit-tap-highlight-color:transparent;cursor:pointer;background:none;border:none;padding:0;font:inherit;min-height:0}
.bul .rond{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2) 72%);box-shadow:0 10px 22px -6px var(--sh,rgba(0,0,0,.35)),inset 0 -6px 12px rgba(0,0,0,.18);transition:transform .15s cubic-bezier(.3,1.6,.6,1),box-shadow .15s}
.bul .rond::before{content:"";position:absolute;top:10%;left:18%;width:42%;height:26%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(-20deg)}
.bul .rond svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));position:relative}
.bul:hover .rond{transform:translateY(-3px) scale(1.04)}
.bul:active .rond{transform:scale(.9);box-shadow:0 4px 10px -4px var(--sh,rgba(0,0,0,.35)),inset 0 -4px 10px rgba(0,0,0,.2)}
.bul b{font-family:var(--display);font-size:1.02rem;font-weight:800;line-height:1.1}
.bul small{font-size:.78rem;color:var(--muted);margin-top:-5px;line-height:1.2}
.bul small.ko{color:#b81c33;font-weight:700}
.bul small.okk{color:#1d6b43;font-weight:700}
.bul .nb{position:absolute;top:2px;right:2px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:#E5252A;color:#fff;font:800 .95rem/26px var(--body);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:center}
.bul.big .rond{width:150px;height:150px}
.bul.big b{font-size:1.2rem}
.bul:focus-visible{outline:none}
.bul:focus-visible .rond{outline:3px solid var(--sch);outline-offset:4px}
@media (prefers-reduced-motion:no-preference){
  .bul{animation:pop .45s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .bul.big .rond{animation:respire 3.2s ease-in-out infinite 1s}
  @keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
}
.bulsec{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin:6px 0 -6px}
@media (max-width:420px){.bulles{gap:18px 0}.bulles>.bul{width:33.3%}.bul .rond{width:86px;height:86px}.bul b{font-size:.9rem}.bul small{font-size:.7rem}.bul .nb{min-width:26px;height:26px;font-size:.82rem;line-height:22px;top:0;right:0}.bul.big .rond{width:128px;height:128px}.hello2 h2{font-size:1.4rem}}
/* ===== Signature sans responsable ===== */
.passbox{border:2px solid var(--sch);background:linear-gradient(180deg,#fff7f8,var(--paper))}
.passbox h3{font-size:1.1rem}
.orbite{position:relative;width:min(calc(100vw - 6px),700px);aspect-ratio:1;margin:4px 0 3cqw calc(50% - min(calc(100vw - 6px),700px) / 2);container-type:inline-size}
.orbite .anneau{position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(232,52,71,.28)}
.orbite .halo{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle,rgba(232,52,71,.10),rgba(232,52,71,0) 70%)}
.orbite .centre{position:absolute;left:30cqw;top:30cqw;width:40cqw;height:40cqw;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;text-decoration:none;
  box-shadow:0 2.5cqw 6cqw -1.5cqw rgba(200,30,50,.35),0 0 0 1.6cqw rgba(232,52,71,.08),inset 0 -1cqw 2cqw rgba(0,0,0,.04)}
.orbite .centre img{height:14cqw;width:auto}
.orbite .centre .se{font-family:var(--display);font-weight:800;font-size:5.6cqw;letter-spacing:.1em;color:var(--sch);line-height:1}
.orbite .centre .rs{font-size:2.15cqw;color:#6b6566;line-height:1.2;max-width:30cqw}
.orbite .bul{--k:1;position:absolute;width:22cqw;left:calc(var(--x) - 11cqw);top:calc(var(--y) - var(--r) * var(--k) / 2);gap:.9cqw;max-width:none}
.orbite .bul .rond{width:calc(var(--r) * var(--k));height:calc(var(--r) * var(--k))}
.orbite .bul b{font-size:clamp(.62rem,2.5cqw,1.02rem);white-space:nowrap}
.orbite .bul small{display:none}
.orbite .bul .nb{min-width:clamp(20px,5.2cqw,32px);height:clamp(20px,5.2cqw,32px);line-height:calc(clamp(20px,5.2cqw,32px) - 4px);font-size:clamp(.62rem,2.3cqw,.95rem);padding:0 .9cqw;top:-.6cqw;right:-.6cqw}
.orbite .bul.big b{font-size:clamp(.7rem,2.8cqw,1.1rem)}

.orbite .bul{--k:1}
.orbite .centre{left:33cqw;top:33cqw;width:34cqw;height:34cqw}.orbite .centre img{height:11cqw}.orbite .centre .se{font-size:4.6cqw}.orbite .centre .rs{font-size:2.6cqw}.orbite .bul b{font-size:clamp(.8rem,3.6cqw,1.2rem)}.orbite{margin-bottom:0}
.bul .rond svg.fill{fill:currentColor;stroke:none}
.sec{margin-top:8px}
.sec h3{font:800 1.15rem/1.2 var(--display);margin:22px 0 10px}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fi{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.fi:first-child{border-top:0}
.fi .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:transparent}
.fi.new .dot{background:var(--sch)}
.fi .tx{flex:1;min-width:0}
.fi strong{display:block;overflow-wrap:anywhere}
.fi .c{display:block;color:var(--muted);font-size:.9rem;white-space:pre-line;overflow-wrap:anywhere;max-height:3.9em;overflow:hidden}
.fi .w{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font:700 .72rem/1.5 var(--body);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.note{background:#fff8e6;border:1px solid #f3dfa8;color:#7a5200;border-radius:14px;padding:12px 14px;margin-top:16px;font-size:.95rem}
.pushbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:center}
.pushbox p{margin:0;flex:1;font-size:.95rem}.pushbox p small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.pushbox button{flex:none;border:0;border-radius:12px;padding:10px 14px;background:var(--sch);color:#fff;font:800 .95rem var(--display);letter-spacing:.02em;cursor:pointer}
.pushbox.on button{background:transparent;color:var(--sch-dk);border:2px solid var(--line)}
.pushfoot{text-align:center;color:var(--muted);font-size:.88rem;margin:18px 0 0}.lk{border:0;background:none;color:var(--sch-dk);font:700 .88rem var(--body);text-decoration:underline;cursor:pointer;padding:2px}
.install{display:none;margin-top:18px;width:100%;border:2px solid var(--sch);background:#fff;color:var(--sch-dk);border-radius:14px;padding:12px;font:800 1rem var(--display);letter-spacing:.02em;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2eded;--muted:#b9b0b1;--line:#3a3436;--bg:#1a1718;--surface:#242021}
  .top{background:#242021}.orbite .centre{background:#fff}.note{background:#3a2f12;border-color:#5a4a1c;color:#f3dfa8}.etat.ok{background:#173d29;color:#9fe0bb}.etat.ko{background:#4a1820;color:#ffb3bf}.install{background:#242021}}
</style>
</head>

<header class="top"><div class="top-in">
  <a class="lg" href="portail.html"><img id="logo" alt="Ville de Schiltigheim"><span>SECTEUR EST</span></a>

</div></header>

  <p class="pushfoot" id="pushfoot"></p>
  <footer>Ville de Schiltigheim · Secteur Est · Nelson Mandela · Stade de l'Aar · Stade du Canal</footer>
</main>

const depuis = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return "à l'instant"; if (m < 60) return `il y a ${m} min`; const h = Math.round(m / 60); if (h < 24) return `il y a ${h} h`; const d = Math.round(h / 24); return d === 1 ? 'hier' : `il y a ${d} jours`; };

function orbite(counts) {
  const R = 37, n = APPS.length;
  const B = APPS.map((a, k) => {
    const ang = -Math.PI / 2 + k * 2 * Math.PI / n;
    const nb = counts ? counts[a.id] || 0 : 0;
    return `<a class="bul" href="${a.url}" style="--c1:${a.c[0]};--c2:${a.c[1]};--sh:${a.c[2]};--x:${(50 + R * Math.cos(ang)).toFixed(2)}cqw;--y:${(50 + R * Math.sin(ang)).toFixed(2)}cqw;--r:21cqw" aria-label="${esc(a.t)}${nb ? `, ${nb} alerte${nb > 1 ? 's' : ''} non lue${nb > 1 ? 's' : ''}` : ''}">
      <span class="rond">${a.i}${nb ? `<span class="nb">${nb > 99 ? '99+' : nb}</span>` : ''}</span><b>${esc(a.court)}</b></a>`;
  }).join('');
  $('#orbite').innerHTML = `<div class="orbite"><span class="halo" aria-hidden="true"></span><span class="anneau" aria-hidden="true"></span>
    <div class="centre"><img src="${LOGO}" alt="Ville de Schiltigheim"><span class="se">SECTEUR EST</span><span class="rs">Vos applications</span></div>${B}</div>`;
}
orbite(null);

async function start() {
  if (!window.supabase) { $('#feed').innerHTML = '<div class="empty">Pas de réseau : touchez une application pour l\'ouvrir.</div>'; return; }
  const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch { /* hors connexion */ }
  if (!session) {
    $('#msg').innerHTML = '<div class="note"><strong>Connexion :</strong> ouvrez une des trois applications et connectez-vous. Le même compte sert pour les trois, et le portail affichera ensuite vos alertes.</div>';
    $('#feed').innerHTML = '<div class="empty">Connectez-vous pour voir vos alertes.</div>';
    return;
  }
  const uid = session.user.id;
  drawPush(sb, uid);
  const prof = await sb.from('profiles').select('full_name').eq('id', uid).maybeSingle();
  const nom = (prof.data && prof.data.full_name) || session.user.email || '';
  $('#bonjour').textContent = `${new Date().getHours() < 18 ? 'Bonjour' : 'Bonsoir'} ${nom.split(/\s+/)[0] || ''} 👋`;
  $('#who').innerHTML = `${esc(nom)}<br><button type="button" id="out">Se déconnecter</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  // Alertes de chaque application (chacun ne voit que les siennes)
  const res = await Promise.all(APPS.map((a) => sb.from(a.table).select('id, titre, corps, lien, lu, created_at').order('created_at', { ascending: false }).limit(30)
    .then((r) => ({ a, rows: r.error ? [] : r.data, ok: !r.error }))));
  const counts = {}; let all = [];
  for (const { a, rows } of res) { counts[a.id] = rows.filter((x) => !x.lu).length; all.push(...rows.map((x) => ({ ...x, a }))); }
  orbite(counts);
  const tot = Object.values(counts).reduce((s, n) => s + n, 0);
  const etat = $('#etat'); etat.hidden = false;
  etat.className = `etat ${tot ? 'ko' : 'ok'}`;
  etat.textContent = tot ? `● ${tot} alerte${tot > 1 ? 's' : ''} non lue${tot > 1 ? 's' : ''}` : '✔ Rien de nouveau';
  all.sort((x, y) => (x.lu === y.lu ? 0 : x.lu ? 1 : -1) || y.created_at.localeCompare(x.created_at));
  all = all.slice(0, 12);
  $('#feed').innerHTML = all.length ? `<div class="feed">${all.map((n) => `<a class="fi ${n.lu ? '' : 'new'}" href="${n.a.url}index.html${esc(n.lien || '')}"><span class="dot"></span><span class="tx">
      <strong>${esc(n.titre)}</strong>${n.corps ? `<span class="c">${esc(n.corps)}</span>` : ''}
      <span class="w"><span class="tag" style="background:${n.a.tag}">${esc(n.a.court)}</span>${esc(depuis(n.created_at))}</span></span></a>`).join('')}</div>`
    : '<div class="empty">Aucune alerte pour l\'instant.</div>';
  try { if (navigator.setAppBadge) { if (tot) navigator.setAppBadge(tot); else navigator.clearAppBadge(); } } catch { /* rien */ }
}
const b64 = (s) => { const p = '='.repeat((4 - (s.length % 4)) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map((c) => c.charCodeAt(0))); };
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'non';
  if (Notification.permission === 'denied') return 'bloque';
  try { const reg = swReg || (await navigator.serviceWorker.getRegistration('./portail')); const sub = reg && (await reg.pushManager.getSubscription()); return sub && Notification.permission === 'granted' ? 'actif' : 'inactif'; } catch { return 'inactif'; }
}
async function subscribe(sb, uid) {
  const reg = swReg || (await navigator.serviceWorker.register('portail-sw.js', { scope: './portail' }));
  swReg = reg;
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) }));
  const j = sub.toJSON();
  const { error } = await sb.from('pt_push').upsert({ endpoint: j.endpoint, user_id: uid, abonnement: j }, { onConflict: 'endpoint' });
  if (error) throw error;
  return reg;
}
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { /* rien */ } };
async function drawPush(sb, uid, err) {
  let st = await pushState();
  const box = $('#push'), foot = $('#pushfoot');
  // Déjà autorisé mais abonnement perdu : on le refait en silence, sans rien demander
  if (st === 'inactif' && 'Notification' in window && Notification.permission === 'granted' && lsGet('pt.push') === 'oui') {
    try { await subscribe(sb, uid); st = 'actif'; } catch { /* on proposera le bouton */ }
  }
  box.innerHTML = ''; foot.innerHTML = '';
  if (st === 'non') return;
  if (st === 'actif') {
    // Activé une fois pour toutes : plus de question, juste une ligne discrète en bas
    foot.innerHTML = '🔔 Alertes reçues sur ce téléphone · <button type="button" class="lk" id="pushoff">Couper</button>';
    $('#pushoff').onclick = async () => {
      try { const reg = swReg || (await navigator.serviceWorker.getRegistration('./portail')); const sub = reg && (await reg.pushManager.getSubscription()); if (sub) { await sb.from('pt_push').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch { /* rien */ }
      lsSet('pt.push', 'non'); drawPush(sb, uid);
    };
    return;
  }
  const activer = async (btn) => {
    if (btn) btn.disabled = true;
    try {
      if ((await Notification.requestPermission()) !== 'granted') return drawPush(sb, uid);
      const reg = await subscribe(sb, uid);
      lsSet('pt.push', 'oui');
      try { await reg.showNotification('Secteur Est', { body: "C'est prêt : les alertes des trois applications arriveront ici.", icon: 'portail-192.png', tag: 'pt-test' }); } catch (_) {}
    } catch (x) { return drawPush(sb, uid, 'Activation impossible : ' + (x && x.message ? x.message : x)); }
    drawPush(sb, uid);
  };
  if (st === 'bloque' || lsGet('pt.push') === 'non') {
    // Refusé ou « plus tard » : on ne redemande pas, un simple lien en bas suffit
    foot.innerHTML = st === 'bloque' ? '🔕 Alertes bloquées : autorisez-les dans Réglages › Notifications › Secteur Est.'
      : '🔕 Alertes non activées · <button type="button" class="lk" id="pushon">Activer</button>';
    const on = $('#pushon'); if (on) on.onclick = () => activer(on);
    return;
  }
  box.innerHTML = `<div class="pushbox"><p><strong>Recevoir toutes les alertes ici</strong><small>${err ? esc(err) : 'Une seule icône pour les trois applications, comme WhatsApp ou vos e-mails. À faire une seule fois.'}</small></p>
    <span style="display:flex;flex-direction:column;gap:6px"><button type="button" id="pushb">Activer</button><button type="button" class="lk" id="pushlater">Plus tard</button></span></div>`;
  $('#pushb').onclick = (e) => activer(e.target);
  $('#pushlater').onclick = () => { lsSet('pt.push', 'non'); drawPush(sb, uid); };
}
start().catch(() => { $('#feed').innerHTML = '<div class="empty">Impossible de charger les alertes. Les applications restent accessibles ci-dessus.</div>'; });
