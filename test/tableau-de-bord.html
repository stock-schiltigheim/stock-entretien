:root{--ink:#2b3142;--muted:#6b7286;--line:#e3e6ee;--b:#34497e;--mc1:#5a6fa8;--mc2:#2f4275;--rg1:#6d8bc8;--rg2:#45609e;--st1:#8db3e4;--st2:#5584c6;--red:#E73446;--green:#1f8a4c}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f7fa;color:var(--ink)}
header{background:#fff;border-bottom:3px solid var(--red)}.hd{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.hd img{height:46px}.hd .t{border-left:1px solid var(--line);padding-left:14px}.hd h1{font:800 1.25rem/1.15 Raleway,system-ui;color:var(--b);margin:0}.hd small{color:var(--muted)}
.hd .sp{flex:1}.btn{border:1.5px solid #d5d9e6;background:#fff;color:var(--b);font:700 .9rem system-ui;border-radius:999px;padding:8px 14px;text-decoration:none;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.per{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}.per button{border:1.5px solid #d5d9e6;background:#fff;border-radius:999px;padding:8px 14px;font:700 .9rem system-ui;color:var(--b);cursor:pointer}
.per button[aria-pressed=true]{background:#425a93;border-color:#425a93;color:#fff}
.lead{font:800 1.15rem/1.35 Raleway,system-ui;color:var(--b);margin:0 0 14px}
.app{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c2);border-radius:18px;padding:16px 18px;margin:0 0 16px;box-shadow:0 6px 18px rgba(52,73,126,.06);break-inside:avoid}
.app h2{font:800 1.08rem Raleway,system-ui;color:var(--c2);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.app h2 i{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--c1),var(--c2));display:inline-block}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#f8f9fc;border-radius:14px;padding:10px 12px}.k b{display:block;font:800 1.6rem/1.1 Raleway,system-ui;color:var(--c2)}.k span{color:var(--muted);font-size:.86rem}
.k.bad b{color:var(--red)}.k.good b{color:var(--green)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ch{margin-top:14px}.ch svg{width:100%;height:auto;display:block}.leg{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{color:var(--muted);font-size:.82rem;margin:8px 0 0}.msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.pied{color:var(--muted);font-size:.8rem;text-align:center;margin-top:20px}
@media(max-width:640px){.hd{flex-wrap:wrap;gap:10px}.hd img{height:38px}.hd .sp{display:none}.hd .t{flex:1 1 calc(100% - 60px);min-width:0}.hd h1{font-size:1.15rem}.hd .btn{flex:1;text-align:center}}
@media print{body{background:#fff}.no-print{display:none!important}.app{box-shadow:none}header{border-bottom-width:2px}main{padding-top:8px}@page{size:A4;margin:12mm}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const CFG={url:'https://lcuopqnrslkzovhrefwt.supabase.co',key:'sb_publishable_6nda-jAsL9CKERiTTTMHzA_9oMHxK8s'};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:0});const eur=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const PER=[['mois','Ce mois-ci'],['3m','3 derniers mois'],['12m','12 derniers mois'],['annee','Année '+new Date().getFullYear()]];
let P=(()=>{try{return localStorage.getItem('tb-per')||'12m'}catch(e){return '12m'}})(),D=null;
function bornes(p){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),1);if(p==='3m')d.setMonth(d.getMonth()-2);if(p==='12m')d.setMonth(d.getMonth()-11);if(p==='annee')d.setMonth(0);return d}
const dans=(v,deb)=>v&&new Date(v)>=deb;
const jours=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/864e5));
const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function barres(series,c1,c2,lab1,lab2){const W=640,H=170,pad=26,n=series.length,max=Math.max(1,...series.flatMap(s=>[s.a,s.b])),bw=(W-pad)/n;
 let g=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="${esc(lab1)} et ${esc(lab2)} par mois">`;
 [0,.5,1].forEach(t=>{const y=H-t*(H-10);g+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#eceef4"/><text x="${pad-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#8a90a0">${Math.round(max*t)}</text>`});
 series.forEach((s,i)=>{const x=pad+i*bw+bw*.14,w=bw*.34,ha=(H-10)*s.a/max,hb=(H-10)*s.b/max;
  g+=`<rect x="${x}" y="${H-ha}" width="${w}" height="${ha}" rx="3" fill="${c1}"><title>${esc(s.l)} · ${lab1} : ${s.a}</title></rect><rect x="${x+w+2}" y="${H-hb}" width="${w}" height="${hb}" rx="3" fill="${c2}"><title>${esc(s.l)} · ${lab2} : ${s.b}</title></rect>`;
  g+=`<text x="${pad+i*bw+bw/2}" y="${H+16}" font-size="10" text-anchor="middle" fill="#6b7286">${esc(s.l)}</text>`});
 return g+`</svg><div class="leg"><span><i style="background:${c1}"></i>${esc(lab1)}</span><span><i style="background:${c2}"></i>${esc(lab2)}</span></div>`}
function moisDepuis(deb){const L=[],d=new Date(deb),n=new Date();while(d<=n){L.push({y:d.getFullYear(),m:d.getMonth(),l:MOIS[d.getMonth()]});d.setMonth(d.getMonth()+1)}return L}
const cleMois=v=>{const d=new Date(v);return d.getFullYear()*12+d.getMonth()};
function rendu(){
 $('#per').innerHTML=PER.map(([k,l])=>`<button aria-pressed="${k===P}" data-p="${k}">${l}</button>`).join('');
 const deb=bornes(P),lib={mois:'ce mois-ci','3m':'les 3 derniers mois','12m':'les 12 derniers mois',annee:'l\'année '+new Date().getFullYear()}[P];$('#quand').textContent=PER.find(x=>x[0]===P)[1]+' · imprimé le '+new Date().toLocaleDateString('fr-FR');
 const {iv,sig,ctrl,nc,rub,vis,mv,prod,st,sites,regSites,zones,lieux}=D;
 const nomLieu=id=>{const l=lieux.find(x=>x.id===id);return l?(l.court||l.nom):(id||'—')};
 // Maintenance
 const crees=iv.filter(i=>dans(i.creeLe,deb)),term=iv.filter(i=>i.statut==='terminee'&&dans(i.termineLe,deb)),ouverts=iv.filter(i=>i.statut!=='terminee');
 const delais=term.filter(i=>i.creeLe).map(i=>jours(i.creeLe,i.termineLe)),md=med(delais);
 const urg=ouverts.filter(i=>i.priorite==='urgente'||(i.echeance&&new Date(i.echeance)<new Date(new Date().toDateString()))).length;
 const sq=sig.filter(s=>dans(s.creeLe||s.cree_le||s.date,deb)).length;
 const parSite={};crees.forEach(i=>{(parSite[i.site]=parSite[i.site]||{c:0,t:0,o:0}).c++});term.forEach(i=>{(parSite[i.site]=parSite[i.site]||{c:0,t:0,o:0}).t++});ouverts.forEach(i=>{(parSite[i.site]=parSite[i.site]||{c:0,t:0,o:0}).o++});
 const M=moisDepuis(P==='mois'?bornes('3m'):deb).map(m=>({l:m.l,k:m.y*12+m.m}));M.forEach(m=>{m.a=iv.filter(i=>i.creeLe&&cleMois(i.creeLe)===m.k).length;m.b=iv.filter(i=>i.statut==='terminee'&&i.termineLe&&cleMois(i.termineLe)===m.k).length});
 const lead=`${P==='mois'?'Ce mois-ci':'Sur '+lib} : ${fmt(crees.length)} bons ouverts, ${fmt(term.length)} clôturés${md!=null?` en ${fmt(md)} jour${md>=2?'s':''} (délai médian)`:''} ; ${fmt(ctrl.filter(c=>dans(c.date_controle,deb)).length)} contrôles d'équipements de sécurité réalisés.`;
 // ERP
 const cP=ctrl.filter(c=>dans(c.date_controle,deb)),conf=cP.length?Math.round(100*cP.filter(c=>c.conforme).length/cP.length):null,ncP=nc.filter(x=>dans(x.date_controle||x.cree_le,deb)).length;
 const aj=new Date(new Date().toDateString()),rubD=rub.filter(r=>r.prochain),rubOk=rubD.filter(r=>new Date(r.prochain)>=aj).length,rubKo=rubD.length-rubOk;
 const visP=vis.filter(v=>dans(v.date_visite,deb)).length;
 // Stocks
 const pr={};prod.forEach(x=>pr[x.id]=x);const so=mv.filter(m=>m.kind==='sortie'&&dans(m.created_at,deb)),en=mv.filter(m=>m.kind==='entree'&&dans(m.created_at,deb));
 const cout=so.reduce((s,m)=>s+Math.abs(Number(m.quantity||0))*Number(m.unit_price??pr[m.product_id]?.unit_price??0),0);
 const sansPrix=so.filter(m=>m.unit_price==null&&pr[m.product_id]?.unit_price==null).length;
 const bas=st.filter(x=>x.in_use!==false&&Number(x.min_quantity)>0&&Number(x.quantity)<=Number(x.min_quantity)).length;
 const top={};so.forEach(m=>top[m.product_id]=(top[m.product_id]||0)+Math.abs(Number(m.quantity||0)));const top5=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('#out').innerHTML=`<p class="lead">${esc(lead)}</p>
 <section class="app" style="--c1:var(--mc1);--c2:var(--mc2)"><h2><i></i>Maintenance & Interventions</h2><div class="kp">
  <div class="k"><b>${fmt(crees.length)}</b><span>bons ouverts</span></div><div class="k good"><b>${fmt(term.length)}</b><span>bons clôturés</span></div>
  <div class="k"><b>${md!=null?fmt(md)+' j':'—'}</b><span>délai médian de clôture</span></div><div class="k"><b>${fmt(ouverts.length)}</b><span>en cours aujourd'hui</span></div>
  <div class="k ${urg?'bad':'good'}"><b>${fmt(urg)}</b><span>urgents ou en retard</span></div><div class="k"><b>${fmt(sq)}</b><span>signalements QR des usagers</span></div></div>
  ${M.length>1?`<div class="ch">${barres(M,'#8ea0cc','#2f4275','Bons ouverts','Bons clôturés')}</div>`:''}
  ${Object.keys(parSite).length?`<table><tr><th>Site</th><th class="n">Ouverts</th><th class="n">Clôturés</th><th class="n">En cours</th></tr>${Object.entries(parSite).sort((a,b)=>b[1].c-a[1].c).map(([s,v])=>`<tr><td>${esc(nomLieu(s))}</td><td class="n">${v.c}</td><td class="n">${v.t}</td><td class="n">${v.o}</td></tr>`).join('')}</table>`:''}</section>
 <section class="app" style="--c1:var(--rg1);--c2:var(--rg2)"><h2><i></i>Conformité ERP</h2><div class="kp">
  <div class="k"><b>${fmt(cP.length)}</b><span>contrôles d'extincteurs et BAES</span></div><div class="k ${conf==null?'':conf>=95?'good':'bad'}"><b>${conf==null?'—':conf+' %'}</b><span>conformes au contrôle</span></div>
  <div class="k ${ncP?'bad':'good'}"><b>${fmt(ncP)}</b><span>non-conformités relevées</span></div><div class="k ${rubKo?'bad':'good'}"><b>${rubD.length?fmt(rubOk)+' / '+fmt(rubD.length):'—'}</b><span>rubriques du registre à jour</span></div>
  <div class="k"><b>${fmt(visP)}</b><span>visites d'entreprises enregistrées</span></div></div>
  ${rubKo?`<p class="note">${fmt(rubKo)} contrôle${rubKo>1?'s':''} réglementaire${rubKo>1?'s':''} dépassé${rubKo>1?'s':''} à ce jour.</p>`:''}</section>
 <section class="app" style="--c1:var(--st1);--c2:var(--st2)"><h2><i></i>Gestion des stocks</h2><div class="kp">
  <div class="k"><b>${fmt(so.length)}</b><span>sorties de produits</span></div><div class="k"><b>${fmt(en.length)}</b><span>livraisons rangées</span></div>
  <div class="k"><b>${cout?eur(cout):'—'}</b><span>valeur des produits sortis (HT)</span></div><div class="k ${bas?'bad':'good'}"><b>${fmt(bas)}</b><span>produits sous le seuil aujourd'hui</span></div></div>
  ${top5.length?`<table><tr><th>Produits les plus utilisés</th><th class="n">Quantité sortie</th></tr>${top5.map(([id,q])=>`<tr><td>${esc(pr[id]?.name||'Produit')}</td><td class="n">${fmt(q)}</td></tr>`).join('')}</table>`:''}
  ${sansPrix?`<p class="note">${fmt(sansPrix)} sortie${sansPrix>1?'s':''} sans prix renseigné : non comptée${sansPrix>1?'s':''} dans la valeur.</p>`:''}</section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;P=b.dataset.p;try{localStorage.setItem('tb-per',P)}catch(_){}rendu()});
(async()=>{const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data:{session}}=await sb.auth.getSession();if(!session){$('#out').innerHTML='<div class="msg">Connectez-vous d\'abord au <a href="portail.html">Portail de proximité</a>, puis revenez ici.</div>';return}
 try{const m=await sb.rpc('mc_moi');const d=m.data;if(!(d&&d.actif!==false&&(d.admin||d.profil==='secteur'||d.profil==='responsable'))){$('#out').innerHTML='<div class="msg">Ce tableau de bord est réservé aux responsables.</div>';return}}catch(e){}
 const ok=r=>(r&&!r.error&&r.data)||[];const docs=r=>ok(r).map(x=>({id:x.id,...(x.data||{})}));
 const R=await Promise.all([sb.from('mc_docs').select('id,data').eq('col','interventions'),sb.from('mc_docs').select('id,data').eq('col','signalements'),
  sb.from('reg_equip_controles').select('date_controle,conforme'),sb.from('reg_equip_nc').select('date_controle,cree_le'),sb.from('reg_rubriques').select('id,prochain'),sb.from('reg_visites').select('date_visite'),
  sb.from('movements').select('kind,quantity,unit_price,product_id,created_at,site_id'),sb.from('products').select('id,name,unit_price'),sb.from('stocks').select('quantity,min_quantity,in_use'),
  sb.from('mc_lieux').select('id,nom,court')]);
 D={iv:docs(R[0]),sig:docs(R[1]),ctrl:ok(R[2]),nc:ok(R[3]),rub:ok(R[4]),vis:ok(R[5]),mv:ok(R[6]),prod:ok(R[7]),st:ok(R[8]),lieux:ok(R[9]),sites:[],regSites:[],zones:[]};
 rendu()})();
