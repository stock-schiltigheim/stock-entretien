<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registres">
<title>Registres de sécurité</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Registres de sécurité — registre administratif : bandeau marine, intercalaires,
   sommaire lettré A→YZ comme le classeur papier. Téléphone d'abord. */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --sunk:#F4F6F9; --fg:#141C26; --muted:#5A6676; --line:#D5DBE3;
  --navy:#1B2F4A; --navy-fg:#FFFFFF; --navy-soft:#E4EAF2; --accent:#1F5F99; --signal:#E3A21A;
  --t1:#1F5F99; --t2:#2F7A52; --t3:#A26A12;
  --ok:#22704A; --ok-bg:#E2F1E8; --warn:#8A5A00; --warn-bg:#FCF0D8;
  --bad:#A3271F; --bad-bg:#F9E1DE; --info:#1F5F99; --info-bg:#E1EBF6; --none:#5A6676; --none-bg:#EDF0F4;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141B; --paper:#171E28; --sunk:#1D2531; --fg:#E6EBF2; --muted:#9AA6B6; --line:#2C3644;
  --navy:#22385A; --navy-fg:#F1F5FB; --navy-soft:#1F2B3C; --accent:#8FB3DC;
  --t1:#8FB3DC; --t2:#82C9A2; --t3:#E8B866;
  --ok:#82C9A2; --ok-bg:#16301F; --warn:#E8B866; --warn-bg:#352812; --bad:#F09A90; --bad-bg:#3A1A17;
  --info:#8FB3DC; --info-bg:#1D2B3E; --none:#9AA6B6; --none-bg:#222B37; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;min-height:42px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.6;cursor:progress}
button.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-fg);font-weight:600}
button.link{border:none;background:none;padding:4px 0;min-height:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:42px;font-size:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
a{color:var(--accent)}

/* bandeau */
.band{background:var(--navy);color:var(--navy-fg);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brandrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.seal{flex:0 0 auto;width:42px;height:42px;border:2px solid var(--navy-fg);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.72rem}
.band .eyebrow{color:var(--navy-fg);opacity:.85}
.band h1{font-size:1.3rem;font-weight:800;line-height:1.15}
.who{font-size:.8rem;text-align:right;line-height:1.3}
@media (max-width:600px){.band .eyebrow{display:none}.band h1{font-size:1.1rem}.seal{width:36px;height:36px;font-size:.62rem}.who{font-size:.74rem}}
.who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--navy-fg);min-height:32px;padding:3px 10px;font-size:.8rem;margin-top:4px}
.dividers{display:flex;gap:6px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.dividers::-webkit-scrollbar{display:none}
.dividers a{flex:0 0 auto;border-radius:8px 8px 0 0;background:rgba(255,255,255,.12);color:var(--navy-fg);text-decoration:none;
  padding:9px 15px 8px;min-height:44px;display:flex;flex-direction:column;line-height:1.2;position:relative}
.dividers .tn{font-family:var(--display);font-weight:700;font-size:.9rem}
.dividers .ts{font-size:.7rem;opacity:.85}
.dividers a[aria-current="page"]{background:var(--bg);color:var(--fg)}
.dividers a[aria-current="page"] .ts{color:var(--muted);opacity:1}
.dividers .dot{position:absolute;top:0;left:14px;width:22px;height:4px;border-radius:0 0 3px 3px}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.notice{padding:12px 14px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:.9rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.sectitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sectitle h2{font-size:1.15rem;font-weight:800}
.sectitle h3{font-size:1.02rem;font-weight:700}
h4{margin:0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.addrow{display:flex;gap:8px} .addrow input{flex:1;min-width:0}

/* page de garde */
.cover{overflow:hidden}
.cover-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;padding:18px 20px 16px;border-top:6px solid var(--sc,var(--navy))}
.cover-top h2{font-size:1.4rem;font-weight:800;line-height:1.15;margin-top:3px}
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap}
.seg a{border-radius:6px;padding:7px 12px;font-weight:500;text-decoration:none;color:var(--fg);font-size:.9rem}
@media (max-width:600px){.cover-top{flex-direction:column;align-items:stretch}.seg{display:grid;grid-template-columns:repeat(4,1fr)}.seg a{text-align:center;padding:8px 4px;font-size:.84rem}.seg .long{display:none}}
.seg .short{display:none}@media (max-width:600px){.seg .short{display:inline}}
.seg a[aria-current="page"]{background:var(--navy);color:var(--navy-fg)}
.fichebox summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-weight:600;font-size:.88rem}
.fichebox summary::-webkit-details-marker{display:none}
.fichebox summary::after{content:"▾";color:var(--muted)}
.fichebox[open] summary::after{content:"▴"}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line)}
.fiche>label,.fiche>div{padding:11px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fiche input,.fiche select{border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:3px 0;min-height:32px;background:transparent;font-weight:600}
.fiche input:focus,.fiche select:focus{border-bottom-color:var(--accent);outline:none}
.fiche .val{font-weight:600;margin-top:3px;color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.tile{border:none;border-right:1px solid var(--line);border-radius:0;padding:13px 18px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:last-child{border-right:none}
.tile .n{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.tile .l{font-size:.76rem;color:var(--muted);font-weight:500}
.tile[aria-pressed="true"]{background:var(--navy-soft);box-shadow:inset 0 -3px 0 var(--navy)}
.tile.ok .n{color:var(--ok)} .tile.proche .n{color:var(--info)} .tile.retard .n{color:var(--bad)} .tile.obs .n{color:var(--warn)}
@media (max-width:600px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.tile:nth-child(2){border-right:none}.tile:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* sommaire lettré */
.toc{overflow:hidden}
.toc-cols,.rowhead{display:grid;grid-template-columns:58px minmax(0,1fr) 105px 105px 160px;align-items:center}
.toc-cols{background:var(--navy);color:var(--navy-fg);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.toc-cols span{padding:9px 12px}
.row{border-top:1px solid var(--line)} .row:first-child{border-top:none}
.rowhead{width:100%;border:none;border-radius:0;background:transparent;padding:0;text-align:left;min-height:58px}
.rowhead:hover{background:var(--sunk)}
.rowhead[aria-expanded="true"]{background:var(--navy-soft)}
.rowhead>span{padding:10px 12px}
.letter{align-self:stretch;display:flex!important;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.02rem;border-right:1px solid var(--line);background:var(--sunk)}
.s-retard .letter{box-shadow:inset 4px 0 0 var(--bad)} .s-obs .letter{box-shadow:inset 4px 0 0 var(--warn)} .s-proche .letter{box-shadow:inset 4px 0 0 var(--info)} .s-ok .letter{box-shadow:inset 4px 0 0 var(--ok)}
.rname{font-weight:600}
.rdetail{display:block;font-size:.8rem;color:var(--muted)}
.rmeta{display:none;font-size:.8rem;color:var(--muted);margin-top:3px}
.clip{font-size:.76rem;color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap}
.cell{font-size:.86rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-proche{background:var(--info-bg);color:var(--info)} .p-retard{background:var(--bad-bg);color:var(--bad)} .p-obs{background:var(--warn-bg);color:var(--warn)} .p-vide{background:var(--none-bg);color:var(--none)}
@media (max-width:700px){.toc-cols{display:none}.rowhead{grid-template-columns:50px minmax(0,1fr)}.rowhead .cell{display:none}.rmeta{display:block}}
.panel{padding:16px 18px 20px 70px;display:flex;flex-direction:column;gap:16px;border-top:1px dashed var(--line)}
@media (max-width:700px){.panel{padding:14px 14px 18px}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.obslist,.pjlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;gap:6px}
.ob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.ob input{width:20px;height:20px;min-height:0;margin-top:2px}
.ob.done .t{text-decoration:line-through;color:var(--muted)}
.pj{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.ftype{display:grid;place-items:center;height:30px;border-radius:4px;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--display);font-weight:800;font-size:.66rem}
.pj a{font-weight:600;overflow-wrap:anywhere;text-underline-offset:3px}
.pj .m{display:block;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.pjgroup{display:flex;align-items:center;gap:10px;padding:8px 2px 2px;font-weight:600;font-size:.88rem}
.pjgroup .code{font-family:var(--display);font-weight:800;min-width:28px}
.box{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
input[type=file]{padding:6px;font-size:.85rem}

/* passages signés */
.visit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.visit .m{display:block;font-size:.78rem;color:var(--muted)}
.sigimg{height:46px;max-width:150px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px;object-fit:contain}
.visitform{border:1.5px solid var(--navy);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.visitform textarea{min-height:70px;resize:vertical}
.attest{font-size:.86rem;background:var(--sunk);border-left:3px solid var(--navy);padding:9px 12px}
.padwrap{position:relative}
.pad{display:block;width:100%;height:190px;background:#fff;border:1.5px dashed #8A96A8;border-radius:8px;touch-action:none;cursor:crosshair}
.padhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.8rem;color:#8A96A8;pointer-events:none}
.padline{position:absolute;left:8%;right:8%;bottom:38px;border-bottom:1px solid #C3CAD6;pointer-events:none}
.chk{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:.88rem}
.chk input{width:20px;height:20px;min-height:0;flex:0 0 auto;margin-top:1px}
td .sigimg{height:38px}

/* alertes */
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;text-decoration:none;color:inherit;border:1px solid transparent}
.alert.rouge{background:var(--bad-bg);border-color:var(--bad)} .alert.rouge .ic{color:var(--bad)}
.alert.orange{background:var(--warn-bg)} .alert.orange .ic{color:var(--warn)}
.alert .ic{font-weight:800;font-family:var(--display);font-size:1.05rem;width:22px;text-align:center}
.alert .go{font-size:.8rem;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;text-align:center;margin-left:4px;vertical-align:1px}
.p-nc{background:var(--bad);color:#fff}
/* équipements (BAES, extincteurs) */
.daelist{display:flex;flex-direction:column}
.daerow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.daerow:first-child{border-top:none}
.daerow:hover{background:var(--sunk)}
.daecode{font-family:var(--display);font-weight:800;font-size:.9rem;border:1.5px solid var(--fg);border-radius:6px;padding:4px 8px;white-space:nowrap}
.checks2{display:flex;flex-direction:column;gap:8px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.ck .opts{display:flex;gap:6px}
.ck .opts button{min-height:40px;padding:6px 12px;font-weight:600}
.ck .opts button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.ck .opts button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.ck.bad{border-color:var(--bad)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox .qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:6px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.label{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:2px solid #0E7A3A;border-radius:10px;background:#fff;color:#111;break-inside:avoid}
.label .qr{width:110px;height:110px}
.label .t1{font-family:var(--display);font-weight:800;color:#0E7A3A;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.label .t2{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1}
.label .t3{font-size:.82rem}
.label .t4{font-size:.72rem;color:#444;margin-top:4px}
.yearsel{width:auto;min-width:120px;font-weight:700}
.dl{border:none;background:none;min-height:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.labels{grid-template-columns:repeat(2,1fr);gap:8mm}.label{border-width:1.5px}}
.small-labels{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.small-labels .label{grid-template-columns:84px minmax(0,1fr);gap:8px;padding:8px}
.small-labels .label .qr{width:84px;height:84px}
.small-labels .label .t2{font-size:.95rem;white-space:nowrap;letter-spacing:-.01em}
.small-labels .label .t1{font-size:.62rem;letter-spacing:.04em}
@media (max-width:600px){.daerow{grid-template-columns:auto minmax(0,1fr)}.daerow>.pill{grid-column:2;justify-self:start}}
@media print{.small-labels{grid-template-columns:repeat(3,1fr);gap:4mm}}

/* photos */
.eqthumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--sunk);flex:0 0 auto}
.eqphoto{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.eqphoto img{width:180px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.eqphoto .ph-empty{width:180px;max-width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
.photobtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;min-height:42px;font-weight:600;color:var(--fg)}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.ckphoto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ckphoto img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* scanner */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:30px;min-height:58px;padding:0 22px;background:var(--navy);color:var(--navy-fg);font-weight:800;font-size:1.02rem;box-shadow:0 4px 16px rgba(0,0,0,.28);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.scanbox{position:relative;width:100%;max-width:420px;aspect-ratio:1;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{min-height:76px;font-size:1.15rem;font-weight:800;border-radius:10px}
.quick .qok{background:var(--ok);border-color:var(--ok);color:#fff}
.quick .qko{background:var(--bad);border-color:var(--bad);color:#fff}
.fabs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px}
.fabs .fab{position:static}
.fab.alt{background:var(--paper);color:var(--fg);border:1px solid var(--line)}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.cam .cambar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.cam .cambar button{min-height:48px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:0 14px;font-weight:600}

<script>
(() => {
'use strict';
const CFG = window.REG_CONFIG;
const PALETTE = ['#1F5F99', '#2F7A52', '#A26A12', '#7A3E9D', '#1C7C86', '#B3471E', '#4E5D2F', '#8C2F55', '#3E4C9A', '#6B5B2A'];
const siteColor = (id) => { const i = S.sites.findIndex((x) => x.id === id); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; };
const shortName = (s) => (s.court || s.nom || '').replace(/^(Stade (de l'|du |de la |des |de )|Centre sportif |Gymnase (de l'|du |de la |des |de )?|Nelson )/i, '');
const multiSecteur = () => new Set(S.sites.map((x) => x.secteur || 'Est')).size > 1;
const S = { sb: null, me: null, admin: false, mesSites: [], sites: [], rub: [], obs: [], pieces: [], visites: [], visitFor: null, ctl: [], eq: [], eqCtlBy: new Map(), params: {}, annee: String(new Date().getFullYear()), pjAnnee: 'all', eqSite: 'all', eqZone: 'all', eqQ: '', eqForm: null, eqCheck: null, ronde: null, people: {}, urls: {},
  filter: 'all', open: null, pjFilter: 'all', confirm: null, loadedAt: 0, busy: false };
const main = document.getElementById('main');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fr = (s) => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const days = (s) => Math.round((new Date(s + 'T12:00') - new Date(today() + 'T12:00')) / 864e5);
const plus12 = (s) => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y + 1, m - 1, d)); return t.toISOString().slice(0, 10); };
const siteOf = (id) => S.sites.find((s) => s.id === id);
const rubOf = (site) => S.rub.filter((r) => r.site_id === site);
const openObs = (rid) => S.obs.filter((o) => o.rubrique_id === rid && !o.levee);
const piecesOf = (rid) => S.pieces.filter((p) => p.rubrique_id === rid).sort((a, b) => b.ajoute_le.localeCompare(a.ajoute_le));
const visitesOf = (rid) => S.visites.filter((v) => v.rubrique_id === rid);
const nameOf = (id) => (id && S.people[id]?.full_name) || '';
const resLabel = { conforme: 'Conforme', observations: 'Avec observations', non_conforme: 'Non conforme', '': '—' };
const RES_OPTS = (v) => ['', 'conforme', 'observations', 'non_conforme'].map((k) => `<option value="${k}" ${v === k ? 'selected' : ''}>${k ? resLabel[k] : 'Non renseigné'}</option>`).join('');
const avisLabel = (a) => ({ favorable: 'Favorable', defavorable: 'Défavorable' }[a] || '—');
const TYPES = { 'application/pdf': 'PDF', 'image/jpeg': 'JPG', 'image/png': 'PNG', 'image/webp': 'IMG' };
const ACCEPT = '.pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp';
const fmtSize = (b) => (!b ? '' : b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(b / 1024)) + ' Ko');

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, err ? 4200 : 2400); }
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'Adresse e-mail ou mot de passe incorrect.';
  if (/row-level security|permission denied/i.test(m)) return 'Vous n\'avez pas l\'autorisation de faire cette modification.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion Internet. Réessayez.';
  if (/exceeded the maximum allowed size|Payload too large/i.test(m)) return 'Fichier trop lourd : 20 Mo maximum.';
  if (/mime type|invalid_mime/i.test(m)) return 'Format refusé : PDF, JPG, PNG ou WEBP uniquement.';
  return m || 'Une erreur est survenue.';
}
function busy(btn, on) { if (btn) btn.disabled = on; }
function statut(r) {
  const n = openObs(r.id).length;
  if (!r.dernier && !r.prochain) return { k: 'vide', l: 'À renseigner' };
  if (r.resultat === 'non_conforme') return { k: 'retard', l: 'Non conforme' };
  if (r.prochain && r.prochain < today()) return { k: 'retard', l: 'En retard' };
  if (n > 0) return { k: 'obs', l: n + (n > 1 ? ' observations' : ' observation') + ' à lever' };
  if (r.prochain && days(r.prochain) <= 60) return { k: 'proche', l: 'Échéance dans ' + days(r.prochain) + ' j' };
  return { k: 'ok', l: 'À jour' };
}
function counts(site) {
  const rs = rubOf(site); const st = rs.map(statut); const c = (k) => st.filter((x) => x.k === k).length;
  const ids = new Set(rs.map((r) => r.id));
  return { total: rs.length, ok: c('ok'), proche: c('proche'), retard: c('retard'), obs: S.obs.filter((o) => !o.levee && ids.has(o.rubrique_id)).length };
}

// ---------------------------------------------------------------------
// Données
// ---------------------------------------------------------------------
async function loadAll() {
  const sb = S.sb;
  const [sites, rub, obs, pieces, people, visites] = await Promise.all([
    sb.from('reg_sites').select('*').order('ordre'),
    sb.from('reg_rubriques').select('*').order('ordre').order('created_at'),
    sb.from('reg_observations').select('*').order('cree_le'),
    sb.from('reg_pieces').select('*'),
    sb.rpc('reg_personnes'),
    sb.from('reg_visites').select('*').order('date_visite', { ascending: false }),
  ]);
  for (const r of [sites, rub, obs, pieces, people, visites]) if (r.error) throw r.error;
  const [ctl, eq, eqCtl, params] = await Promise.all([
    sb.from('reg_controles').select('*').order('date_controle', { ascending: false }),
    sb.from('reg_equipements').select('*').order('code'),
    sb.from('reg_equip_controles').select('*').order('date_controle', { ascending: false }),
    sb.from('reg_parametres').select('*').maybeSingle(),
  ]);
  S.v2 = !ctl.error && !eq.error;
  S.ctl = ctl.data || []; S.eq = eq.data || []; S.eqCtlAll = eqCtl.data || []; S.params = params.data || {}; indexEq();
  S.visites = visites.data;
  S.sites = sites.data; S.rub = rub.data; S.obs = obs.data; S.pieces = pieces.data;
  S.people = Object.fromEntries((people.data || []).map((p) => [p.id, p]));
  S.urls = {};
  const paths = [...S.pieces.map((p) => p.chemin), ...S.visites.map((v) => v.signature), ...S.eq.map((e) => e.photo).filter(Boolean), ...(S.eqCtlAll || []).map((c) => c.photo).filter(Boolean)];
  if (paths.length) {
    const { data } = await sb.storage.from('registres').createSignedUrls(paths, 3600);
    (data || []).forEach((d) => { if (d.signedUrl) S.urls[d.path] = d.signedUrl; });
  }
  S.loadedAt = Date.now();
}
async function reload() {
  try { await loadAll(); } catch (e) { toast(errMsg(e), true); }
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.me && Date.now() - S.loadedAt > 60000 && !editing() && !S.visitFor) reload();
});
function editing() { const a = document.activeElement; return a && main.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName); }

// ---------------------------------------------------------------------
// Navigation : #/sommaire, #/site/<id>[/pieces|/commission], #/acces
// ---------------------------------------------------------------------
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'site' && S.mesSites.includes(p[1])) return { v: 'site', site: p[1], mode: ['pieces', 'commission', 'historique'].includes(p[2]) ? p[2] : 'registre' };
  if (p[0] === 'acces' && S.admin) return { v: 'acces' };
  if (p[0] === 'sauvegarde' && S.admin) return { v: 'sauvegarde' };
  if (p[0] === 'scan') return { v: 'scan' };
  if (p[0] === 'num') return { v: 'num' };
  if (p[0] === 'e' && p[1]) return { v: 'eqfiche', id: p[1] };
  if (p[0] === 'eq' && CATS[p[1]]) return { v: 'eq', cat: p[1] };
  if (p[0] === 'ronde' && CATS[p[1]]) return { v: 'ronde', cat: p[1] };
  if (p[0] === 'etiquettes' && CATS[p[1]]) return { v: 'etiquettes', cat: p[1], id: p[2] || '' };
  if (p[0] === 'sommaire' && (S.admin || S.mesSites.length > 1)) return { v: 'sommaire' };
  return S.admin || S.mesSites.length > 1 ? { v: 'sommaire' } : { v: 'site', site: S.mesSites[0], mode: 'registre' };
}
let lastKey = '';
window.addEventListener('hashchange', () => {
  const r = route(); const key = r.v + (r.site || '') + (r.id || '') + (r.cat || '');
  if (key !== lastKey) { S.filter = 'all'; S.open = null; S.pjFilter = 'all'; S.visitFor = null; S.eqForm = null; S.eqCheck = null; if (r.v !== 'ronde') S.ronde = null; window.scrollTo(0, 0); }

});

function renderTabs(r) {
  const tabs = [];
  if (S.admin || S.mesSites.length > 1) tabs.push({ href: '#/sommaire', n: 'Sommaire', s: S.admin ? 'Supervision' : 'Mes sites', cur: r.v === 'sommaire' });

  const nAl = alertes().filter((a) => a.niveau === 'rouge').reduce((t, a) => t + (a.n || 1), 0);
  if (tabs[0] && tabs[0].href === '#/sommaire') tabs[0].badge = nAl;

  S.sites.forEach((x) => { const t = tabs.find((y) => y.href === '#/site/' + x.id); if (t) t.badge = AL.filter((a) => a.niveau === 'rouge' && a.site === x.id && !a.cat).length; });
  const curCat = r.cat || (r.v === 'eqfiche' ? S.eq.find((e) => e.id === r.id)?.categorie : '');
  for (const [k, C] of Object.entries(CATS)) { const n = S.eq.filter((e) => e.categorie === k).length;
    tabs.push({ href: '#/eq/' + k, n: C.court, s: n + ' ' + (n > 1 ? C.plur : C.un), cur: curCat === k, color: C.color, badge: AL.filter((a) => a.cat === k && a.niveau === 'rouge').reduce((t, a) => t + (a.n || 1), 0) }); }
  if (S.v2 && S.eq.length) tabs.push({ href: '#/num', n: '🔢 Par numéro', s: 'Recherche rapide', cur: r.v === 'num' });
  if (S.admin) tabs.push({ href: '#/acces', n: 'Accès', s: 'Qui peut entrer', cur: r.v === 'acces' });
  if (S.admin) tabs.push({ href: '#/sauvegarde', n: 'Réglages', s: S.params.derniere_sauvegarde ? 'Le ' + fr(S.params.derniere_sauvegarde) : 'Jamais faite', cur: r.v === 'sauvegarde' });

function render() {
  if (!S.me) return;

function renderSommaire() {

function initPad(cv, onInk) {
  const ratio = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.round(rect.width * ratio); cv.height = Math.round(rect.height * ratio);
  const ctx = cv.getContext('2d');
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0E1B33'; ctx.lineWidth = 2.4 * ratio;
  let drawing = false, last = null, ink = 0;
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * ratio, (e.clientY - b.top) * ratio]; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; e.preventDefault(); const p = pt(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
    ink += Math.hypot(p[0] - last[0], p[1] - last[1]) / ratio; last = p; onInk(ink); });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  return { clear() { ctx.clearRect(0, 0, cv.width, cv.height); ink = 0; onInk(0); }, ink: () => ink,
    blob() { // signature sur fond blanc, recadrée
      const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
      const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0);
      return new Promise((res) => out.toBlob(res, 'image/png')); } };
}

function wireVisit(r, site, P) {

    $('#v-att', P).textContent = `Je soussigné(e) ${n}, intervenant(e) pour l'entreprise ${e}, atteste avoir réalisé l'intervention décrite ci-dessus au ${siteOf(site).nom} le ${fr(d)}.`; };
  ['#v-int', '#v-ent', '#v-date'].forEach((k) => $(k, P).addEventListener('input', att)); att();

  $('#v-rem', P).addEventListener('input', syncObs); syncObs();

    try {
      const blob = await pad.blob();

      if (up.error) throw up.error;
      const ins = await S.sb.from('reg_visites').insert({ site_id: site, rubrique_id: r.id, date_visite: date, entreprise: ent, intervenant: int, objet: obj, resultat: res, remarques: rem, signature: chemin, vise_par: S.me.id }).select().single();
      if (ins.error) { await S.sb.storage.from('registres').remove([chemin]); throw ins.error; }
      if ($('#v-upd', P).checked) {
        const u = await S.sb.from('reg_rubriques').update({ dernier: date, intervenant: ent, resultat: res || r.resultat, prochain: plus12(date) }).eq('id', r.id);
        if (u.error) toast(errMsg(u.error), true);
      }
      if (S.v2) await S.sb.from('reg_controles').insert({ site_id: site, rubrique_id: r.id, date_controle: date, intervenant: ent + ' (' + int + ')', resultat: res, remarques: rem, visite_id: ins.data.id });
      const lines = rem.split('\n').map((l) => l.trim()).filter(Boolean);
      if (lines.length && $('#v-obs', P).checked) {

        if (o.error) toast(errMsg(o.error), true);
      }

      await reload();
    } catch (err) { toast(errMsg(err), true); } finally { busy(e.target, false); }
  };
}

function fileType(f) { const e = (f.name.split('.').pop() || '').toLowerCase(); return { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' }[e] || f.type; }
async function shrinkPhoto(file, type) {
  // Photos de plus de 1,5 Mo : réduites à 2000 px pour économiser l'espace
  if (!/^image\/(jpeg|png|webp)$/.test(type) || file.size < 1.5 * 1048576 || !window.createImageBitmap) return { blob: file, type };
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? { blob, type: 'image/jpeg' } : { blob: file, type };
  } catch (e) { return { blob: file, type }; }
}
async function uploadPiece(file, site, rubriqueId, titre, btn) {
  if (!file) { toast('Choisissez d\'abord un fichier.', true); return false; }
  let type = fileType(file);
  if (!TYPES[type]) { toast('Formats acceptés : PDF, JPG, PNG ou WEBP.', true); return false; }
  if (S.busy) return false;
  S.busy = true; busy(btn, true); toast('Envoi en cours…');
  try {
    const sh = await shrinkPhoto(file, type); type = sh.type;
    if (sh.blob.size > 20 * 1048576) { toast('Fichier trop lourd : 20 Mo maximum.', true); return false; }
    let nom = file.name; if (type === 'image/jpeg' && !/\.jpe?g$/i.test(nom)) nom = nom.replace(/\.[^.]+$/, '') + '.jpg';
    const safe = nom.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(-80) || 'document';
    const chemin = site + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + '-' + safe;
    const up = await S.sb.storage.from('registres').upload(chemin, sh.blob, { contentType: type, upsert: false });
    if (up.error) throw up.error;
    const { data, error } = await S.sb.from('reg_pieces').insert({ site_id: site, rubrique_id: rubriqueId === 'general' ? null : rubriqueId, titre: (titre || '').trim(), nom_fichier: nom, chemin, type, taille: sh.blob.size, ajoute_par: S.me.id }).select().single();
    if (error) { await S.sb.storage.from('registres').remove([chemin]); throw error; }
    const s = await S.sb.storage.from('registres').createSignedUrl(chemin, 3600);
    if (s.data) S.urls[chemin] = s.data.signedUrl;
    S.pieces.push(data); toast('Pièce jointe ajoutée'); return true;
  } catch (e) { toast(errMsg(e), true); return false; } finally { S.busy = false; busy(btn, false); }
}

    const sc = siteOf(r.site_id)?.court || ''; const lab = (r.lettre ? r.lettre + ' · ' : '') + r.nom;
    const base = { site: r.site_id, href: '#/site/' + r.site_id, rid: r.id };

    else if (r.prochain && r.prochain < t) out.push({ ...base, niveau: 'rouge', texte: 'Contrôle en retard : ' + lab, sub: sc + ' · prévu le ' + fr(r.prochain) });
    else if (r.prochain && days(r.prochain) <= 30) out.push({ ...base, niveau: 'orange', texte: 'Contrôle à prévoir : ' + lab, sub: sc + ' · avant le ' + fr(r.prochain) });
  }
  for (const x of S.sites) {
    const ids = new Set(rubOf(x.id).map((r) => r.id));
    const n = S.obs.filter((o) => !o.levee && ids.has(o.rubrique_id)).length;
    if (n) out.push({ niveau: 'orange', site: x.id, href: '#/site/' + x.id, texte: n + (n > 1 ? ' observations à lever' : ' observation à lever'), sub: x.court });
  }
  out.push(...alertesEquipements());
  if (S.admin && S.v2) {
    const ls = S.params.derniere_sauvegarde;
    if (!ls || days(ls.slice(0, 10)) < -30) out.push({ niveau: 'orange', site: '', href: '#/sauvegarde', texte: 'Sauvegarde à faire', sub: ls ? 'Dernière le ' + fr(ls) : 'Aucune sauvegarde pour l\'instant' });
  }

}

function yearsFor(site) {
  const ys = new Set([String(new Date().getFullYear())]);
  S.ctl.filter((c) => c.site_id === site).forEach((c) => ys.add(c.date_controle.slice(0, 4)));
  S.pieces.filter((p) => p.site_id === site).forEach((p) => ys.add(p.ajoute_le.slice(0, 4)));
  S.visites.filter((v) => v.site_id === site).forEach((v) => ys.add(v.date_visite.slice(0, 4)));

}

async function zipAnnee(x, annee, list, pcs, vis, btn) {
  busy(btn, true);
  try {
    await loadJSZip();
    const zip = new JSZip(); const root = cleanName(`Registre ${x.court} ${annee}`);
    const rub = (rid) => S.rub.find((r) => r.id === rid);
    zip.file(root + '/Controles ' + annee + '.csv', csv([['Date', 'Réf.', 'Rubrique', 'Intervenant', 'Résultat', 'Référence', 'Remarques'],
      ...list.map((c) => { const r = rub(c.rubrique_id); return [fr(c.date_controle), r?.lettre || '', r?.nom || '', c.intervenant, resLabel[c.resultat || ''], c.reference, c.remarques]; })]));
    const ids = new Set(rubOf(x.id).map((r) => r.id));
    zip.file(root + '/Observations ' + annee + '.csv', csv([['Relevée le', 'Réf.', 'Rubrique', 'Observation', 'Levée le'],
      ...S.obs.filter((o) => ids.has(o.rubrique_id) && o.cree_le.startsWith(annee)).map((o) => { const r = rub(o.rubrique_id); return [fr(o.cree_le), r?.lettre || '', r?.nom || '', o.texte, o.levee ? fr(o.levee_le) : '']; })]));
    zip.file(root + '/Passages signes ' + annee + '.csv', csv([['Date', 'Réf.', 'Entreprise', 'Intervenant', 'Objet', 'Résultat', 'Remarques', 'Visé par'],
      ...vis.map((v) => [fr(v.date_visite), rub(v.rubrique_id)?.lettre || '', v.entreprise, v.intervenant, v.objet, resLabel[v.resultat || ''], v.remarques, nameOf(v.vise_par)])]));
    const files = [...pcs.map((p) => { const r = rub(p.rubrique_id); return { path: p.chemin, dir: 'Pieces jointes/' + cleanName(r ? (r.lettre ? r.lettre + ' - ' : '') + r.nom : 'Documents generaux'), name: cleanName(p.nom_fichier) }; }),
      ...vis.map((v) => ({ path: v.signature, dir: 'Signatures', name: cleanName(v.date_visite + ' ' + v.entreprise + ' ' + v.intervenant) + '.png' }))];
    const used = new Set(); const fails = [];
    for (let i = 0; i < files.length; i++) {
      toast(`Préparation : fichier ${i + 1} sur ${files.length}…`);
      try { zip.file(root + '/' + uniqueName(used, files[i].dir + '/' + files[i].name), await fetchStored(files[i].path)); } catch (e) { fails.push(files[i].dir + '/' + files[i].name); }
    }
    if (fails.length) zip.file(root + '/FICHIERS MANQUANTS.txt', 'Ces fichiers n\'ont pas pu être récupérés :\r\n' + fails.join('\r\n'));
    toast('Création du fichier zip…');
    saveBlob(await zip.generateAsync({ type: 'blob' }), root + '.zip');
    toast(fails.length ? `Téléchargé, sauf ${fails.length} fichier(s) introuvable(s).` : 'Année ' + annee + ' téléchargée', !!fails.length);
  } catch (e) { toast(errMsg(e), true); } finally { busy(btn, false); }
}

function eqStatut(e) {

  if (S.lbZone && zones.includes(S.lbZone)) list = list.filter((e) => e.zone === S.lbZone);
  list.sort((a, b) => a.code.localeCompare(b.code, 'fr', { numeric: true }));
  const FMT = { 18: [3, 6], 24: [3, 8], 40: [4, 10] };
  if (!S.lbFmt) { try { S.lbFmt = localStorage.getItem('reg.lbFmt') || '24'; S.lbCut = localStorage.getItem('reg.lbCut') === '1'; } catch (_) { S.lbFmt = '24'; } }
  if (!FMT[S.lbFmt]) S.lbFmt = '24';
  const N = FMT[S.lbFmt][0] * FMT[S.lbFmt][1];
  S.lbStart = Math.min(N, Math.max(1, parseInt(S.lbStart, 10) || 1));
  const cells = [...Array(S.lbStart - 1).fill(null), ...list];
  const pages = []; for (let k = 0; k < cells.length; k += N) pages.push(cells.slice(k, k + N));
  const cellHTML = (e) => !e ? '<div class="cell"></div>' : `<div class="cell"><div class="q">${qrSVG(appBase() + '#/e/' + e.id)}</div><div class="tx">
    <div class="c1" style="color:${C.color}">${esc(C.etiquette)}</div><div class="c2">${esc(e.code)}</div>
    <div class="c3">${esc(e.emplacement || e.zone || '')}</div><div class="c4">${esc(siteOf(e.site_id)?.court || '')} · Scannez pour le contrôle</div></div></div>`;
  main.innerHTML = `
    <div class="no-print" style="display:flex;flex-direction:column;gap:10px"><a href="#/eq/${cat}" class="small" style="font-weight:600">‹ ${C.titre}</a>
      <div class="actions"><div class="sectitle"><h2>Étiquettes QR</h2><span class="small muted">${esc(titre)} · ${list.length} étiquette${list.length > 1 ? 's' : ''} · ${pages.length} page${pages.length > 1 ? 's' : ''} A4</span></div>
        <span style="display:flex;gap:8px;align-items:center">${zones.length > 1 ? `<select id="lb-zone" style="width:auto" aria-label="Zone"><option value="">Toutes les zones</option>${zones.map((z) => `<option ${S.lbZone === z ? 'selected' : ''}>${esc(z)}</option>`).join('')}</select>` : ''}<button type="button" class="primary" id="lb-print">Imprimer</button></span></div>
      <div class="lbopts">
        <div class="seg" role="group" aria-label="Format">${Object.keys(FMT).map((f) => `<a href="#" data-fmt="${f}" ${S.lbFmt === f ? 'aria-current="page"' : ''}>${f} par page</a>`).join('')}</div>
        <label>Commencer à la case <input type="number" id="lb-start" min="1" max="${N}" value="${S.lbStart}"></label>
        <label><input type="checkbox" id="lb-cut" ${S.lbCut ? 'checked' : ''}> Traits de découpe</label>
      </div>
      <p class="small muted" style="margin:0">Planches A4 de ${N} étiquettes (${S.lbFmt === '40' ? '52,5 × 29,7 mm' : S.lbFmt === '24' ? '70 × 37 mm' : '70 × 49,5 mm'}). À l'impression, choisissez <b>Marges : aucune</b> et <b>Échelle : 100 %</b>. « Commencer à la case » sert à finir une planche déjà entamée. Cochez « Traits de découpe » pour du papier normal à découper.</p></div>
    ${list.length ? `<div class="sheets" id="lb-sheets">${pages.map((pg) => `<div class="sheet f${S.lbFmt}${S.lbCut ? ' cut' : ''}">${pg.map(cellHTML).join('')}</div>`).join('')}</div>` : '<div class="paper empty">Aucune étiquette à imprimer.</div>'}`;
  let lp = $('#lbpage'); if (!lp) { lp = document.createElement('style'); lp.id = 'lbpage'; document.head.appendChild(lp); }
  lp.textContent = '@page{size:A4 portrait;margin:0}';
  const fit = () => { const sh = $('#lb-sheets'); if (!sh) return; const w = main.clientWidth; const a4 = 210 * 96 / 25.4; sh.style.zoom = String(Math.min(1, w / a4)); };
  fit(); window.onresize = fit;
  $$('#lb-sheets .c2').forEach((el) => { let f = parseFloat(getComputedStyle(el).fontSize); let k = 0; while (el.scrollWidth > el.clientWidth + 0.5 && f > 6 && k++ < 40) { f -= 0.4; el.style.fontSize = f + 'px'; } });
  const z = $('#lb-zone'); if (z) z.onchange = (ev) => { S.lbZone = ev.target.value; renderEtiquettes(cat, arg); };
  $$('[data-fmt]').forEach((a) => { a.onclick = (ev) => { ev.preventDefault(); S.lbFmt = a.dataset.fmt; try { localStorage.setItem('reg.lbFmt', S.lbFmt); } catch (_) {} renderEtiquettes(cat, arg); }; });
  $('#lb-start').onchange = (ev) => { S.lbStart = ev.target.value; renderEtiquettes(cat, arg); };
  $('#lb-cut').onchange = (ev) => { S.lbCut = ev.target.checked; try { localStorage.setItem('reg.lbCut', S.lbCut ? '1' : '0'); } catch (_) {} renderEtiquettes(cat, arg); };
  $('#lb-print').onclick = () => {
    const sh = $('#lb-sheets'); if (!sh) return toast('Aucune étiquette à imprimer.', true);
    let ps = $('#printsheets'); if (!ps) { ps = document.createElement('div'); ps.id = 'printsheets'; document.body.appendChild(ps); }
    ps.innerHTML = sh.outerHTML.replace('id="lb-sheets"', '');
    document.body.classList.add('printing-labels');
    const done = () => { document.body.classList.remove('printing-labels'); ps.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
  };
}

function renderSauvegarde() {

  main.innerHTML = `

      <div class="sectitle"><h3>Sauvegarde complète</h3></div>
      <p style="margin:0">Un seul fichier zip avec tout le contenu des trois registres, des BAES et des extincteurs : les tableaux (lisibles dans Excel), les pièces jointes et les signatures. À ranger sur votre ordinateur ou votre OneDrive.</p>
      <div class="fiche paper" style="border-radius:8px">
        <div><div class="eyebrow">Dernière sauvegarde</div><div class="val num">${ls ? fr(ls) + (nameOf(S.params.sauvegarde_par) ? ' · ' + esc(nameOf(S.params.sauvegarde_par)) : '') : 'Jamais'}</div></div>
        <div><div class="eyebrow">Contrôles enregistrés</div><div class="val num">${S.ctl.length}</div></div>
        <div><div class="eyebrow">Fichiers à sauvegarder</div><div class="val num">${nFiles}</div></div>
        <div><div class="eyebrow">BAES / extincteurs</div><div class="val num">${S.eq.filter((e) => e.categorie === 'baes').length} / ${S.eq.filter((e) => e.categorie === 'extincteur').length}</div></div></div>
      <div class="actions"><span class="small muted">Conseil : une sauvegarde par mois. Une alerte vous le rappelle après 30 jours.</span><button type="button" class="primary" id="bk-go">Télécharger la sauvegarde</button></div>
    </section>
    <section class="paper box">
      <div class="sectitle"><h3>Réglages</h3></div>
      <div class="grid2">
        <label for="bk-f1">Contrôle mensuel des BAES (tous les … jours)<input type="number" id="bk-f1" min="1" max="365" step="1" value="${S.params.baes_frequence_jours || 30}"></label>
        <label for="bk-f2">Test d'autonomie des BAES (tous les … jours)<input type="number" id="bk-f2" min="1" max="730" step="1" value="${S.params.autonomie_frequence_jours || 182}"></label>
        <label for="bk-f3">Contrôle visuel des extincteurs (tous les … jours)<input type="number" id="bk-f3" min="1" max="365" step="1" value="${S.params.extincteur_frequence_jours || 30}"></label></div>
      <div><button type="button" id="bk-freq-save">Enregistrer</button></div>
    </section>
    <section class="paper box">
      <div class="sectitle"><h3>Sites et secteurs</h3><span class="small muted num">${S.sites.length} site${S.sites.length > 1 ? 's' : ''}</span></div>
      <p class="small muted" style="margin:0">Pour élargir le registre à d'autres bâtiments. Chaque nouveau site reçoit automatiquement le sommaire A → YZ ; ouvrez ensuite son accès aux responsables dans l'onglet Accès.</p>
      <div class="tablewrap"><table style="min-width:480px"><thead><tr><th>Site</th><th>Nom court</th><th>Secteur</th><th>Préfixe des codes</th></tr></thead><tbody>
        ${S.sites.map((x) => `<tr><td><b>${esc(x.nom)}</b></td><td>${esc(x.court)}</td><td>${esc(x.secteur || 'Est')}</td><td class="num">${esc(x.prefixe || '')}</td></tr>`).join('')}</tbody></table></div>
      ${S.sites.some((x) => 'secteur' in x) ? `<form class="grid2" id="site-f" novalidate>
        <label for="ns-nom">Nom complet<input id="ns-nom" placeholder="Gymnase des Malteries"></label>
        <label for="ns-court">Nom court (onglets)<input id="ns-court" placeholder="Gymnase Malteries"></label>
        <label for="ns-sec">Secteur<input id="ns-sec" list="ns-secs" value="Est"><datalist id="ns-secs">${[...new Set(S.sites.map((x) => x.secteur || 'Est'))].map((v) => `<option value="${esc(v)}">`).join('')}</datalist></label>
        <label for="ns-pre">Préfixe des codes (3 lettres)<input id="ns-pre" maxlength="4" placeholder="MAL"></label>
        <label class="chk"><input type="checkbox" id="ns-stade">C'est un stade (ajoute les rubriques T, U, V)</label>

    busy($('#ns-go'), false);
    if (error) return toast(errMsg(error), true);
    const mine = await S.sb.rpc('reg_mes_sites'); if (mine.data) S.mesSites = mine.data;

    if (!(patch.baes_frequence_jours >= 1 && patch.baes_frequence_jours <= 365 && patch.extincteur_frequence_jours >= 1 && patch.extincteur_frequence_jours <= 365 && patch.autonomie_frequence_jours >= 1 && patch.autonomie_frequence_jours <= 730)) return toast('Indiquez des nombres de jours valides.', true);

    if (error) return toast(errMsg(error), true);
    Object.assign(S.params, patch); toast('Fréquences enregistrées'); renderTabs(route());
  };
}
async function sauvegarde(btn) {
  busy(btn, true);
  try {
    await loadAll();
    await loadJSZip();
    const zip = new JSZip(); const d = today(); const root = 'Sauvegarde registres ' + d;
    const tables = { sites: S.sites, rubriques: S.rub, controles: S.ctl, observations: S.obs, passages_signes: S.visites, pieces_jointes: S.pieces, equipements: S.eq.map((e) => ({ ...e, site: siteOf(e.site_id)?.nom, etat: eqStatut(e).l })), equipements_controles: S.eqCtlAll.map((c) => { const e = S.eq.find((x) => x.id === c.equipement_id); return { ...c, code: e?.code, categorie: e?.categorie, par: nameOf(c.cree_par) }; }),
      acces: Object.values(S.people).filter((p) => (p.sites || []).length).map((p) => ({ personne: p.full_name, sites: (p.sites || []).join(', ') })) };
    zip.file(root + '/LISEZMOI.txt', `Sauvegarde des registres de sécurité – Secteur Est\r\nFaite le ${fr(d)} par ${S.me.full_name}.\r\n\r\n- tableaux/ : un fichier .csv par table, à ouvrir avec Excel.\r\n- sauvegarde-complete.json : toutes les données, pour une restauration.\r\n- fichiers/ : pièces jointes, signatures et photos des équipements, rangées par site.\r\n`);
    zip.file(root + '/sauvegarde-complete.json', JSON.stringify({ application: 'registres-securite', version: 2, date: new Date().toISOString(), par: S.me.full_name, ...tables }, null, 1));
    for (const [k, v] of Object.entries(tables)) zip.file(root + '/tableaux/' + k + '.csv', tableCsv(v));
    const files = [...S.pieces.map((p) => p.chemin), ...S.visites.map((v) => v.signature), ...S.eq.map((e) => e.photo).filter(Boolean), ...S.eqCtlAll.map((c) => c.photo).filter(Boolean)];
    const fails = [];
    for (let i = 0; i < files.length; i++) {
      toast(`Sauvegarde : fichier ${i + 1} sur ${files.length}…`);
      try { zip.file(root + '/fichiers/' + files[i], await fetchStored(files[i])); } catch (e) { fails.push(files[i]); }
    }
    if (fails.length) zip.file(root + '/FICHIERS MANQUANTS.txt', fails.join('\r\n'));
    toast('Création du fichier zip…');
    saveBlob(await zip.generateAsync({ type: 'blob' }), cleanName(root) + '.zip');
    const up = await S.sb.from('reg_parametres').update({ derniere_sauvegarde: new Date().toISOString(), sauvegarde_par: S.me.id }).eq('id', 1).select().maybeSingle();
    if (up.data) S.params = up.data;
    toast(fails.length ? `Sauvegarde téléchargée, sauf ${fails.length} fichier(s) introuvable(s).` : 'Sauvegarde téléchargée', !!fails.length);
    render();
  } catch (e) { toast(errMsg(e), true); } finally { busy(btn, false); }
}


const ROLE = { secteur: 'Responsable de secteur', responsable: 'Responsable d\'installation', agent: 'Agent d\'entretien' };
function renderAcces() {
  const people = Object.values(S.people).filter((p) => p.active).sort((a, b) => (a.role === 'secteur' ? -1 : 0) - (b.role === 'secteur' ? -1 : 0) || a.full_name.localeCompare(b.full_name));
  const stockSite = (n) => ({ 1: 'Mandela', 2: 'Aar' }[n] || '');
  main.innerHTML = `
    <div class="sectitle"><h2>Accès aux registres</h2></div>
    <div class="notice">Seules les personnes cochées ici entrent dans l'application, et seulement sur les sites cochés. Elles se connectent avec leur compte Stock Entretien. Une personne sans compte le crée d'abord dans Stock Entretien, puis vous validez son compte là-bas avant de cocher ses sites ici.</div>
    <div class="paper">${people.map((p) => p.role === 'secteur'
      ? `<div class="person"><div><b>${esc(p.full_name)}</b>${p.id === S.me.id ? ' (vous)' : ''}<div class="small muted">${ROLE.secteur} · administrateur, accès à tous les registres</div></div><span class="pill p-ok">Tous les sites</span></div>`
      : `<div class="person" data-person="${p.id}"><div style="min-width:0"><b>${esc(p.full_name)}</b><div class="small muted">${esc(ROLE[p.role] || '')}${stockSite(p.stock_site) ? ' · ' + stockSite(p.stock_site) + ' dans Stock Entretien' : ''}</div>
          <div class="checks">${S.sites.map((s) => `<label><input type="checkbox" value="${s.id}" ${(p.sites || []).includes(s.id) ? 'checked' : ''}>${esc(s.court)}</label>`).join('')}</div></div>
          <button type="button" data-save="${p.id}">Enregistrer</button></div>`).join('') || '<div class="empty">Aucun compte actif.</div>'}</div>`;
  $$('[data-save]').forEach((b) => { b.onclick = async () => {
    const id = b.dataset.save; const row = $(`[data-person="${id}"]`);
    const sites = $$('input:checked', row).map((i) => i.value);
    busy(b, true);
    const { error } = sites.length ? await S.sb.from('reg_acces').upsert({ user_id: id, sites }) : await S.sb.from('reg_acces').delete().eq('user_id', id);
    busy(b, false);
    if (error) return toast(errMsg(error), true);
    S.people[id].sites = sites; toast(sites.length ? 'Accès enregistré' : 'Accès retiré');
  }; });
}

function authShell(html) { $('#band').hidden = true; main.innerHTML = `<div class="auth"><div style="text-align:center"><div class="seal" style="margin:0 auto 10px;border-color:var(--navy);color:var(--navy)" aria-hidden="true">ERP</div><span class="eyebrow">Secteur Est</span><h2 style="font-size:1.5rem;font-weight:800">Registres de sécurité</h2></div>${html}</div>`; }
function renderLogin() {
  authShell(`<form class="paper" id="lf" novalidate>
      <label for="l-email">Adresse e-mail<input type="email" id="l-email" autocomplete="email" inputmode="email" autocapitalize="none" required></label>
      <label for="l-pw">Mot de passe<input type="password" id="l-pw" autocomplete="current-password" required></label>
      <button type="submit" class="primary" id="l-go">Se connecter</button>
      <p class="small muted" style="margin:0">Utilisez le même compte que pour Stock Entretien. Pas encore de compte ou mot de passe oublié : <a href="${esc(CFG.stockUrl)}">ouvrir Stock Entretien</a>.</p>
    </form>`);
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), pw = $('#l-pw').value;
    if (!/^\S+@\S+\.\S+$/.test(email) || !pw) return toast('Saisissez votre adresse e-mail et votre mot de passe.', true);
    busy($('#l-go'), true);
    const { error } = await S.sb.auth.signInWithPassword({ email, password: pw });
    busy($('#l-go'), false);
    if (error) return toast(errMsg(error), true);
    afterLogin();
  };
}
function renderNoAccess(title, text) {
  authShell(`<div class="paper"><h3>${title}</h3><p style="margin:0">${text}</p>
    <button type="button" class="primary" id="na-retry">Vérifier à nouveau</button><button type="button" id="na-out">Se déconnecter</button></div>`);
  $('#na-retry').onclick = () => afterLogin();
  $('#na-out').onclick = async () => { await S.sb.auth.signOut(); renderLogin(); };
}
async function afterLogin() {
  const { data: { user } } = await S.sb.auth.getUser();
  if (!user) return renderLogin();
  main.innerHTML = '<div class="loading">Chargement des registres…</div>';
  const [prof, mine, adm] = await Promise.all([
    S.sb.from('profiles').select('id, full_name, role, active').eq('id', user.id).maybeSingle(),
    S.sb.rpc('reg_mes_sites'), S.sb.rpc('reg_is_admin')]);
  if (mine.error && /reg_mes_sites|function/i.test(mine.error.message || '')) return renderNoAccess('Base à préparer', 'La base de données des registres n\'est pas encore installée. Exécutez le script SQL fourni dans Supabase.');
  if (prof.error || mine.error) return renderNoAccess('Connexion impossible', esc(errMsg(prof.error || mine.error)));
  const me = prof.data;
  if (!me || !me.active) return renderNoAccess('Compte en attente', 'Votre compte Stock Entretien n\'est pas encore validé par le responsable de secteur.');
  S.me = me; S.admin = !!adm.data; S.mesSites = mine.data || [];
  if (!S.mesSites.length) { S.me = null; return renderNoAccess('Accès non autorisé', 'Votre compte n\'a pas encore accès aux registres de sécurité. Demandez au responsable de secteur de vous l\'ouvrir.'); }
  $('#who-name').textContent = me.full_name + (S.admin ? ' · administrateur' : '');
  $('#band').hidden = false;
  try { await loadAll(); } catch (e) { return renderNoAccess('Chargement impossible', esc(errMsg(e))); }
  render();
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-dl]'); if (b) { e.preventDefault(); downloadPath(b.dataset.dl, b.dataset.name); } });
$('#logout').onclick = async () => { await S.sb.auth.signOut(); S.me = null; renderLogin(); };

async function boot() {
  if (!window.supabase) { authShell('<div class="notice bad">Impossible de charger l\'application. Vérifiez la connexion Internet, puis rechargez la page.</div>'); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data: { session } } = await S.sb.auth.getSession();
  if (!session) return renderLogin();
  afterLogin();
}
boot();
})();
