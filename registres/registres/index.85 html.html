<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="reg-version" content="209ecd654ef7">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registres">
<title>Registres de sécurité</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap">
<style>
/* Registres de sécurité — registre administratif : bandeau marine, intercalaires,
   sommaire lettré A→YZ comme le classeur papier. Téléphone d'abord. */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --sunk:#F4F6F9; --fg:#141C26; --muted:#5A6676; --line:#D5DBE3;
  --navy:#1B2F4A; --navy-fg:#FFFFFF; --navy-soft:#E4EAF2; --accent:#1F5F99; --signal:#E3A21A;
  --t1:#1F5F99; --t2:#2F7A52; --t3:#A26A12;
  --ok:#22704A; --ok-bg:#E2F1E8; --warn:#8A5A00; --warn-bg:#FCF0D8;
  --bad:#A3271F; --bad-bg:#F9E1DE; --info:#1F5F99; --info-bg:#E1EBF6; --none:#5A6676; --none-bg:#EDF0F4;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141B; --paper:#171E28; --sunk:#1D2531; --fg:#E6EBF2; --muted:#9AA6B6; --line:#2C3644;
  --navy:#22385A; --navy-fg:#F1F5FB; --navy-soft:#1F2B3C; --accent:#8FB3DC;
  --t1:#8FB3DC; --t2:#82C9A2; --t3:#E8B866;
  --ok:#82C9A2; --ok-bg:#16301F; --warn:#E8B866; --warn-bg:#352812; --bad:#F09A90; --bad-bg:#3A1A17;
  --info:#8FB3DC; --info-bg:#1D2B3E; --none:#9AA6B6; --none-bg:#222B37; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;min-height:42px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.6;cursor:progress}
button.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-fg);font-weight:600}
button.link{border:none;background:none;padding:4px 0;min-height:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:42px;font-size:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
a{color:var(--accent)}

/* bandeau */
.band{background:var(--navy);color:var(--navy-fg);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brandrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.seal{flex:0 0 auto;width:42px;height:42px;border:2px solid var(--navy-fg);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.72rem}
.band .eyebrow{color:var(--navy-fg);opacity:.85}
.band h1{font-size:1.3rem;font-weight:800;line-height:1.15}
.who{font-size:.8rem;text-align:right;line-height:1.3}
@media (max-width:600px){.band .eyebrow{display:none}.band h1{font-size:1.1rem}.seal{width:36px;height:36px;font-size:.62rem}.who{font-size:.74rem}}
.bell{position:relative;flex:none;width:46px;height:46px;min-height:46px!important;padding:0!important;border-radius:50%!important;display:grid;place-items:center;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.35)!important;color:var(--navy-fg)!important;margin:0!important}
.bell svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bub{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#E5252A;color:#fff;font:800 .74rem/22px var(--body);text-align:center;border:2px solid var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.whobox{display:flex;align-items:center;gap:12px}
.npanel{position:fixed;z-index:40;top:calc(70px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:min(420px,calc(100vw - 20px));max-height:calc(100vh - 100px);overflow:auto;background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.npanel .nh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.npanel .nh h3{margin:0;font-size:1rem}
.nitem{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:11px 14px;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;border-radius:0;min-height:0;color:var(--fg);font:inherit}
.nitem:hover{background:var(--sunk)}
.nitem .nd{width:10px;height:10px;border-radius:50%;margin-top:6px;background:transparent}
.nitem.new .nd{background:#1E6FD9}
.nitem.new.urg .nd{background:#E5252A}
.nitem b{display:block;font-size:.92rem}
.nitem.urg b{color:var(--bad)}
.nitem:not(.new){opacity:.62}
.nitem .nt{font-size:.84rem;color:var(--fg)}
.nitem .nw{font-size:.74rem;color:var(--muted);margin-top:2px}
.npush{padding:12px 14px;background:var(--sunk);font-size:.86rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media print{.npanel{display:none!important}}
/* contrôles internes */
.subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:-6px}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;padding:8px 12px 10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.88rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--navy)}
.subnav a .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hubcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-decoration:none;color:var(--fg);overflow:hidden}
.hubcard:hover{border-color:var(--muted)}
.hubcard .top{padding:16px 18px 12px;border-top:4px solid var(--hc)}
.hubcard .name{font-family:var(--display);font-weight:800;font-size:1.1rem;display:block;margin-top:2px}
.hubcard .desc{font-size:.82rem;color:var(--muted);margin-top:4px;display:block}
.hubcard .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:auto}
.hubcard .kv span{padding:10px 14px;font-size:.74rem;color:var(--muted)}
.hubcard .kv span+span{border-left:1px solid var(--line)}
.hubcard .kv b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--fg)}
.hubtools{display:flex;gap:10px;flex-wrap:wrap}
.hubtools a{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;color:var(--fg);font-weight:600}
@media print{.subnav{display:none!important}}
.bilan{display:flex;flex-direction:column;gap:12px}
.bilan .opts{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center}
.bilan .opts label{display:inline-flex;flex-direction:row;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.bilan .opts input[type=checkbox]{width:auto;min-height:0}
.bilan select{width:auto}
/* exercices d'évacuation */
.exsites{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.excard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.excard .top{padding:14px 18px 0;border-top:6px solid var(--sc)}
.excard .name{font-family:var(--display);font-weight:800;font-size:1.08rem;display:block}
.excard .rows{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.excard .rows span{padding:9px 18px;font-size:.78rem;color:var(--muted)}
.excard .rows span+span{border-left:1px solid var(--line)}
.excard .rows b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--fg)}
.excard .btns{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}
.exsec{display:flex;flex-direction:column;gap:12px}
.exsec h3 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--navy-fg);font-size:.82rem;margin-right:8px}
.chrono{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk)}
.chrono .t{font-family:var(--display);font-weight:800;font-size:3.2rem;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
.chrono.run{border-color:#E5252A;background:#FFF1F0}
.chrono.run .t{color:#C8102E}
.chrono button{min-height:56px;font-size:1.05rem;font-weight:800;padding:0 26px;border-radius:30px}
.chrono .go{background:#C8102E;border-color:#C8102E;color:#fff}
.exphotos{display:flex;gap:8px;flex-wrap:wrap}
.exphotos img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.actrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.actrow.done .t{text-decoration:line-through;color:var(--muted)}
.actadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;gap:8px;align-items:end}
@media (max-width:600px){.actadd{grid-template-columns:1fr 1fr}.actadd input:first-child{grid-column:1/-1}}
.crsheet{display:flex;flex-direction:column;gap:14px}
.crgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.crgrid div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.crgrid b{display:block;font-family:var(--display);font-size:1.15rem}
.crsign img{max-width:260px;max-height:110px;border-bottom:1px solid var(--line)}
details.proc summary{cursor:pointer;font-weight:700}
.crck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
details.proc ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--navy-fg);min-height:32px;padding:3px 10px;font-size:.8rem;margin-top:4px}
.dividers{display:flex;gap:6px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.dividers::-webkit-scrollbar{display:none}
.dividers a{flex:0 0 auto;border-radius:8px 8px 0 0;background:rgba(255,255,255,.12);color:var(--navy-fg);text-decoration:none;
  padding:9px 15px 8px;min-height:44px;display:flex;flex-direction:column;line-height:1.2;position:relative}
.dividers .tn{font-family:var(--display);font-weight:700;font-size:.9rem}
.dividers .ts{font-size:.7rem;opacity:.85}
.dividers a[aria-current="page"]{background:var(--bg);color:var(--fg)}
.dividers a[aria-current="page"] .ts{color:var(--muted);opacity:1}
.dividers .dot{position:absolute;top:0;left:14px;width:22px;height:4px;border-radius:0 0 3px 3px}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.notice{padding:12px 14px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:.9rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.sectitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sectitle h2{font-size:1.15rem;font-weight:800}
.sectitle h3{font-size:1.02rem;font-weight:700}
h4{margin:0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.addrow{display:flex;gap:8px} .addrow input{flex:1;min-width:0}

/* page de garde */
.cover{overflow:hidden}
.cover-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;padding:18px 20px 16px;border-top:6px solid var(--sc,var(--navy))}
.cover-top h2{font-size:1.4rem;font-weight:800;line-height:1.15;margin-top:3px}
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap}
.seg a{border-radius:6px;padding:7px 12px;font-weight:500;text-decoration:none;color:var(--fg);font-size:.9rem}
@media (max-width:600px){.cover-top{flex-direction:column;align-items:stretch}.seg{display:grid;grid-template-columns:repeat(5,1fr)}.seg a{font-size:.78rem!important;padding:8px 2px!important}.seg a{text-align:center;padding:8px 4px;font-size:.84rem}.seg .long{display:none}}
.seg .short{display:none}@media (max-width:600px){.seg .short{display:inline}}
.seg a[aria-current="page"]{background:var(--navy);color:var(--navy-fg)}
.fichebox summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-weight:600;font-size:.88rem}
.fichebox summary::-webkit-details-marker{display:none}
.fichebox summary::after{content:"▾";color:var(--muted)}
.fichebox[open] summary::after{content:"▴"}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line)}
.fiche>label,.fiche>div{padding:11px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fiche input,.fiche select{border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:3px 0;min-height:32px;background:transparent;font-weight:600}
.fiche input:focus,.fiche select:focus{border-bottom-color:var(--accent);outline:none}
.fiche .val{font-weight:600;margin-top:3px;color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.tile{border:none;border-right:1px solid var(--line);border-radius:0;padding:13px 18px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:last-child{border-right:none}
.tile .n{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.tile .l{font-size:.76rem;color:var(--muted);font-weight:500}
.tile[aria-pressed="true"]{background:var(--navy-soft);box-shadow:inset 0 -3px 0 var(--navy)}
.tile.ok .n{color:var(--ok)} .tile.proche .n{color:var(--info)} .tile.retard .n{color:var(--bad)} .tile.obs .n{color:var(--warn)}
@media (max-width:600px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.tile:nth-child(2){border-right:none}.tile:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* sommaire lettré */
.toc{overflow:hidden}
.toc-cols,.rowhead{display:grid;grid-template-columns:58px minmax(0,1fr) 105px 105px 160px;align-items:center}
.toc-cols{background:var(--navy);color:var(--navy-fg);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.toc-cols span{padding:9px 12px}
.row{border-top:1px solid var(--line)} .row:first-child{border-top:none}
.rowhead{width:100%;border:none;border-radius:0;background:transparent;padding:0;text-align:left;min-height:58px}
.rowhead:hover{background:var(--sunk)}
.rowhead[aria-expanded="true"]{background:var(--navy-soft)}
.rowhead>span{padding:10px 12px}
.letter{align-self:stretch;display:flex!important;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.02rem;border-right:1px solid var(--line);background:var(--sunk)}
.s-retard .letter{box-shadow:inset 4px 0 0 var(--bad)} .s-obs .letter{box-shadow:inset 4px 0 0 var(--warn)} .s-proche .letter{box-shadow:inset 4px 0 0 var(--info)} .s-ok .letter{box-shadow:inset 4px 0 0 var(--ok)}
.rname{font-weight:600}
.rdetail{display:block;font-size:.8rem;color:var(--muted)}
.rperio{display:block;font-size:.76rem;font-weight:600;color:#3d5a80;margin-top:2px}
.perhint{margin:0;padding:10px 12px;border-radius:10px;background:#eef3fb;border-left:4px solid #3d5a80;font-size:.85rem;line-height:1.45}
.rmeta{display:none;font-size:.8rem;color:var(--muted);margin-top:3px}
.clip{font-size:.76rem;color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap}
.cell{font-size:.86rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-proche{background:var(--info-bg);color:var(--info)} .p-retard{background:var(--bad-bg);color:var(--bad)} .p-obs{background:var(--warn-bg);color:var(--warn)} .p-vide{background:var(--none-bg);color:var(--none)}
@media (max-width:700px){.toc-cols{display:none}.rowhead{grid-template-columns:50px minmax(0,1fr)}.rowhead .cell{display:none}.rmeta{display:block}}
.panel{padding:16px 18px 20px 70px;display:flex;flex-direction:column;gap:16px;border-top:1px dashed var(--line)}
@media (max-width:700px){.panel{padding:14px 14px 18px}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.obslist,.pjlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;gap:6px}
.ob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.ob input{width:20px;height:20px;min-height:0;margin-top:2px}
.ob.done .t{text-decoration:line-through;color:var(--muted)}
.pj{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.ftype{display:grid;place-items:center;height:30px;border-radius:4px;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--display);font-weight:800;font-size:.66rem}
.pj a{font-weight:600;overflow-wrap:anywhere;text-underline-offset:3px}
.pj .m{display:block;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.pjgroup{display:flex;align-items:center;gap:10px;padding:8px 2px 2px;font-weight:600;font-size:.88rem}
.pjgroup .code{font-family:var(--display);font-weight:800;min-width:28px}
.box{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
input[type=file]{padding:6px;font-size:.85rem}

/* passages signés */
.visit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.visit .m{display:block;font-size:.78rem;color:var(--muted)}
.sigimg{height:46px;max-width:150px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px;object-fit:contain}
.visitform{border:1.5px solid var(--navy);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.visitform textarea{min-height:70px;resize:vertical}
.attest{font-size:.86rem;background:var(--sunk);border-left:3px solid var(--navy);padding:9px 12px}
.padwrap{position:relative}
.pad{display:block;width:100%;height:190px;background:#fff;border:1.5px dashed #8A96A8;border-radius:8px;touch-action:none;cursor:crosshair}
.padhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.8rem;color:#8A96A8;pointer-events:none}
.padline{position:absolute;left:8%;right:8%;bottom:38px;border-bottom:1px solid #C3CAD6;pointer-events:none}
.chk{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:.88rem}
.chk input{width:20px;height:20px;min-height:0;flex:0 0 auto;margin-top:1px}
td .sigimg{height:38px}

/* alertes */
.alerts{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.alerts>.sectitle{padding:11px 16px;border-bottom:1px solid var(--line)}
.alerts>.sectitle h3{font-size:.95rem}
.alerts>p{padding:9px 16px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);font-size:.92rem}
.alert:last-child{border-bottom:none}
.alert:hover{background:var(--sunk)}
.alert b{font-weight:600}
.alert .ic{font-size:0;width:8px;height:8px;border-radius:50%;background:var(--warn);opacity:.85}
.alert.rouge .ic{background:var(--bad)}
.alert .go{font-size:.8rem;color:var(--muted);white-space:nowrap}
/* accueil : synthèse */
.synth{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.synth a{padding:14px 18px;text-decoration:none;color:var(--fg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.synth a:last-child{border-right:none}
.synth a:hover{background:var(--sunk)}
.synth .v{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.synth .v small{font-size:.8rem;font-weight:600;color:var(--muted)}
.synth .l{font-size:.78rem;color:var(--muted)}
.synth .s{font-size:.74rem;display:flex;align-items:center;gap:6px;color:var(--muted);margin-top:4px}
.synth .s i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.synth .s.w i{background:var(--warn)} .synth .s.b i{background:var(--bad)}
@media (max-width:700px){.synth{grid-template-columns:repeat(2,minmax(0,1fr))}.synth a:nth-child(2){border-right:none}.synth a:nth-child(-n+2){border-bottom:1px solid var(--line)}}
details.attn{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.attn>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:.92rem}
details.attn>summary::-webkit-details-marker{display:none}
details.attn>summary b{font-weight:700}
details.attn>summary .cnt{color:var(--muted);font-size:.84rem}
details.attn>summary .cnt em{font-style:normal;color:var(--bad);font-weight:600}
details.attn>summary .chev{margin-left:auto;color:var(--muted);font-size:.84rem}
details.attn[open]>summary{border-bottom:1px solid var(--line)}
details.attn .alerts{border:none;border-radius:0}
.sitecard .counts b{color:var(--fg)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;text-align:center;margin-left:4px;vertical-align:1px}
.p-nc{background:var(--bad);color:#fff}
/* équipements (BAES, extincteurs) */
.daelist{display:flex;flex-direction:column}
.daerow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.daerow:first-child{border-top:none}
.daerow:hover{background:var(--sunk)}
.daecode{font-family:var(--display);font-weight:800;font-size:.9rem;border:1.5px solid var(--fg);border-radius:6px;padding:4px 8px;white-space:nowrap}
.checks2{display:flex;flex-direction:column;gap:8px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.ck .opts{display:flex;gap:6px}
.ck .opts button{min-height:40px;padding:6px 12px;font-weight:600}
.ck .opts button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.ck .opts button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.ck.bad{border-color:var(--bad)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox .qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:6px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.label{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:2px solid #0E7A3A;border-radius:10px;background:#fff;color:#111;break-inside:avoid}
.label .qr{width:110px;height:110px}
.label .t1{font-family:var(--display);font-weight:800;color:#0E7A3A;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.label .t2{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1}
.label .t3{font-size:.82rem}
.label .t4{font-size:.72rem;color:#444;margin-top:4px}
.yearsel{width:auto;min-width:120px;font-weight:700}
.dl{border:none;background:none;min-height:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.labels{grid-template-columns:repeat(2,1fr);gap:8mm}.label{border-width:1.5px}}
.small-labels{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.small-labels .label{grid-template-columns:84px minmax(0,1fr);gap:8px;padding:8px}
.small-labels .label .qr{width:84px;height:84px}
.small-labels .label .t2{font-size:.95rem;white-space:nowrap;letter-spacing:-.01em}
.small-labels .label .t1{font-size:.62rem;letter-spacing:.04em}
@media (max-width:600px){.daerow{grid-template-columns:auto minmax(0,1fr)}.daerow>.pill{grid-column:2;justify-self:start}}
@media print{.small-labels{grid-template-columns:repeat(3,1fr);gap:4mm}}

/* photos */
.eqthumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--sunk);flex:0 0 auto}
.eqphoto{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.eqphoto img{width:180px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.eqphoto .ph-empty{width:180px;max-width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
.photobtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;min-height:42px;font-weight:600;color:var(--fg)}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.ckphoto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ckphoto img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* scanner */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:30px;min-height:58px;padding:0 22px;background:var(--navy);color:var(--navy-fg);font-weight:800;font-size:1.02rem;box-shadow:0 4px 16px rgba(0,0,0,.28);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.scanbox{position:relative;width:100%;max-width:420px;aspect-ratio:1;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{min-height:76px;font-size:1.15rem;font-weight:800;border-radius:10px}
.quick .qok{background:var(--ok);border-color:var(--ok);color:#fff}
.quick .qko{background:var(--bad);border-color:var(--bad);color:#fff}
.fabs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px}
.fabs .fab{position:static}
.fab.alt{background:var(--paper);color:var(--fg);border:1px solid var(--line)}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.cam .cambar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.cam .cambar button{min-height:48px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:0 14px;font-weight:600}
.cam .shoot{width:74px;height:74px;min-height:74px!important;border-radius:50%!important;background:#fff!important;border:5px solid rgba(255,255,255,.45)!important;background-clip:padding-box!important;padding:0!important;flex:none}
.cam .cammsg{color:#fff;text-align:center;padding:10px 16px;font-size:.92rem}
.numin{font-size:1.6rem!important;font-weight:800;text-align:center;letter-spacing:.04em;min-height:62px}
.numres .daerow{grid-template-columns:auto 1fr auto}
@media print{.fab,.fabs{display:none!important}}
/* planches d'étiquettes A4 */
.sheets{display:flex;flex-direction:column;align-items:center;gap:16px}
.sheet{width:210mm;height:297mm;background:#fff;color:#111;display:grid;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet.f18{grid-template-columns:repeat(3,70mm);grid-template-rows:repeat(6,49.5mm);--q:34mm;--pad:4mm}
.sheet.f24{grid-template-columns:repeat(3,70mm);grid-template-rows:repeat(8,37.125mm);--q:29mm;--pad:3.5mm}
.sheet.f40{grid-template-columns:repeat(4,52.5mm);grid-template-rows:repeat(10,29.7mm);--q:22mm;--pad:2.5mm}
.cell{display:flex;align-items:center;gap:2.2mm;padding:var(--pad);overflow:hidden;min-width:0;line-height:1.15;font-family:var(--body)}
.sheet.cut .cell{outline:.2mm dashed #b5b5b5;outline-offset:-.1mm}
.cell .q{flex:none;width:var(--q);height:var(--q)}
.cell .q svg{width:100%;height:100%;display:block}
.cell .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:.6mm}
.cell .c1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.cell .c2{font-family:var(--display);font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.cell .c3{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;color:#222}
.cell .c4{color:#555}
.f18 .c1{font-size:7pt}.f18 .c2{font-size:12.5pt}.f18 .c3{font-size:7.5pt;-webkit-line-clamp:3}.f18 .c4{font-size:6.5pt}
.f24 .c1{font-size:6pt}.f24 .c2{font-size:10.5pt}.f24 .c3{font-size:6.5pt}.f24 .c4{font-size:5.5pt}
.f40 .c1{font-size:5pt}.f40 .c2{font-size:7pt;letter-spacing:-.03em}.f40 .c3{font-size:5.5pt;-webkit-line-clamp:2}.f40 .c4{display:none}
.lbopts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbopts label{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem}
.lbopts input[type=number]{width:70px}
.lbopts input[type=checkbox]{width:auto;min-height:0}
#printsheets{display:none}
@media print{
  body.printing-labels>*:not(#printsheets){display:none!important}
  body.printing-labels #printsheets{display:block}
  body.printing-labels #printsheets .sheets{display:block;zoom:1!important}
  body.printing-labels .sheet{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  body.printing-labels .sheet:last-child{break-after:auto;page-break-after:auto}
}

/* tableaux */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.86rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--navy);color:var(--navy-fg);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
tr:last-child td{border-bottom:none}
td.code{font-family:var(--display);font-weight:800;width:52px;background:var(--sunk)}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:18px 20px}
.sign .line{border-bottom:1px solid var(--muted);height:60px}

/* sommaire général */
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sitecard{text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);overflow:hidden}
.sitecard:hover{border-color:var(--muted)}
.sitecard .top{padding:15px 18px 0;border-top:6px solid var(--sc)}
.sitecard .name{font-family:var(--display);font-weight:800;font-size:1.12rem;display:block;margin-top:2px}
.sitecard .counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.sitecard .counts span{padding:9px 18px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line)}
.sitecard .counts span:nth-child(odd){border-right:1px solid var(--line)}
.sitecard .counts b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:800}
.sitecard .foot{padding:0 18px 13px;font-size:.78rem;color:var(--muted)}

/* accès */
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.person:first-child{border-top:none}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:.88rem}
.checks input{width:20px;height:20px;min-height:0}

/* connexion */
.auth{max-width:420px;margin:28px auto;display:flex;flex-direction:column;gap:14px}
.auth .paper{padding:20px;display:flex;flex-direction:column;gap:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-fg);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.panel{animation:open .18s ease-out}@keyframes open{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}

/* impression (vue commission) */
.print-only{display:none}
@media print{
  .fichebox summary{display:none!important}
  :root{--bg:#fff;--paper:#fff;--sunk:#f1f3f6;--fg:#000;--muted:#444;--line:#999;--navy:#1B2F4A;--navy-fg:#fff;color-scheme:light}
  body{font-size:11.5px;padding:0}
  .band,.no-print,.toast,.seg,.strip{display:none!important}
  .print-only{display:block}
  main{padding-top:0;gap:12px}
  .paper{border-color:#999}
  table{min-width:0}
  thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.code{-webkit-print-color-adjust:exact;print-color-adjust:exact}

}
/* ===== Charte de la Ville de Schiltigheim ===== */
:root{--sch:#e83447;--navy:#d42c40;--navy-fg:#ffffff;--navy-soft:#fde7ea;--accent:#c4223a;
  --bg:#f6f4f4;--paper:#ffffff;--sunk:#f3eeee;--fg:#2b2a2a;--muted:#5f5a5b;--line:#e4dddd;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--navy:#ff6676;--navy-fg:#2a0a0e;--navy-soft:#3a1a1e;--accent:#ff8a96;--bg:#161314;--paper:#211c1d;--sunk:#2a2324;--fg:#f1eceb;--muted:#b3a9aa;--line:#3a3132}}
.band{background:#fff;color:#2b2a2a;border-bottom:4px solid var(--sch);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{gap:14px}
.logo-sch{display:flex;flex-direction:column;align-items:center;flex:none;gap:1px}
.logo-sch img{height:52px;width:auto;display:block}
.logo-sch span{display:block;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sch);line-height:1}
.brand-tx{border-left:2px solid #eee;padding-left:14px;min-width:0}
.band h1,.brand-tx h1{font-family:var(--display);font-size:1.35rem;font-weight:800;line-height:1.05;color:#2b2a2a}
.brand-tx span{font-size:.8rem;color:#6b6566}
.who{color:#2b2a2a}
.who button{border-color:#e4dddd;color:#2b2a2a;background:#fff}
.who button:hover{background:#f6eeef}
.bell{background:#f4eeee!important;border:none!important;color:#2b2a2a!important}
.bub{border-color:#fff}
.dividers{margin-top:12px;gap:4px}
.dividers a{background:#f4eeee;color:#2b2a2a}
.dividers a:hover{background:#ece3e4}
.dividers a[aria-current="page"]{background:var(--sch);color:#fff}
.dividers a[aria-current="page"] .ts{color:#ffe1e5}
.dividers a[aria-current="page"] .badge{background:#fff;color:var(--sch)}
.dividers .dot{display:none}
thead th{background:#3c3a3a;color:#fff}
button.primary,.fab{background:var(--sch);border-color:var(--sch);color:#fff}
.fab.alt{background:#fff;color:#2b2a2a}
.subnav a[aria-current="page"]{border-bottom-color:var(--sch)}
.exsec h3 .n{background:var(--sch);color:#fff}
@media (max-width:600px){.band h1,.brand-tx h1{font-size:1.08rem}.brand-tx span{display:none}.logo-sch img{height:44px}.logo-sch span{font-size:.62rem}.who{font-size:.72rem}.whobox{gap:8px}.bell{width:40px;height:40px;min-height:40px!important}.who button{white-space:nowrap;padding:3px 8px}.brand{gap:10px}.brand-tx{padding-left:10px}.brand-tx h1{font-size:1rem;line-height:1.1}}
@media (max-width:440px){.who #who-name{display:none}.who br{display:none}}
/* ===== Onglets en pastilles ===== */
.dividers{gap:8px;padding:2px 2px 12px;margin-top:12px}
.dividers a{flex:none;flex-direction:row;align-items:center;gap:9px;padding:5px 15px 5px 5px;border-radius:999px;background:#fff;border:1px solid #ece4e5;box-shadow:0 1px 3px rgba(43,42,42,.07);min-height:48px;color:#2b2a2a;transition:transform .12s,box-shadow .12s}
.dividers a:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(43,42,42,.1);background:#fff}
.dividers a:active{transform:scale(.96)}
.dividers .tic{position:relative;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2) 75%);box-shadow:inset 0 -3px 6px rgba(0,0,0,.18)}
.dividers .tic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dividers .tb{position:absolute;top:-5px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#E5252A;color:#fff;font:800 .66rem/16px var(--body);border:1.5px solid #fff;text-align:center}
.dividers .tt{display:flex;flex-direction:column;line-height:1.15}
.dividers .tn{font-family:var(--display);font-weight:800;font-size:.95rem}

.sheet2 .fx2{position:absolute;top:12px;right:12px;width:38px;height:38px;min-height:0;border-radius:50%;padding:0;border:1px solid #ece4e5;background:#fff;font-size:1rem}
.sheet2 .theme{margin-top:14px}.sheet2 .theme h4{margin:0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#c8102e}
.sheet2 .theme p{margin:2px 4px 8px;font-size:.82rem;color:#6b6567}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;align-items:start}
@media (max-width:520px){.thgrid{grid-template-columns:1fr 1fr}}
.thit{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#faf7f7;border:1px solid #f0e8e9;text-decoration:none;color:#2b2a2a;min-height:62px}
a.thit:hover{background:#fff;box-shadow:0 4px 12px -6px rgba(0,0,0,.2)}
.thit .tic{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2) 75%);box-shadow:0 4px 10px -4px var(--c2)}
.thit .tic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thit .tb{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e83447;color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.thit .tt{display:flex;flex-direction:column;min-width:0;gap:1px;flex:1}.thit b{font-size:.9rem;line-height:1.2}.thit small{font-size:.74rem;color:#6b6567}
.thit.multi{grid-column:span 2;align-items:flex-start}
@media (min-width:521px){.thit.multi{grid-column:auto}}
.thit .sitechips{display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:5px}
.thit .sitechips a{display:inline-block;width:auto;font-size:.74rem;font-weight:700;text-decoration:none;padding:4px 10px;border-radius:20px;color:#fff;background:var(--sc)}
body.feuille-ouverte{overflow:hidden}
/* ===== Main courante ===== */
.btchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700;text-decoration:none;background:#e6eefb;color:#1f3b63;white-space:nowrap}
.btchip.bt-terminee{background:#e5f3ea;color:#0b5a2b}.btchip.bt-en_cours,.btchip.bt-planifiee{background:#fff1d6;color:#7a4a00}
.btmk{min-height:32px!important;padding:0 10px!important;border-radius:20px!important;font-size:.78rem!important;border-style:dashed!important}
.obact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
/* ===== Hors ligne ===== */
#offbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px 14px;font-size:.86rem;text-align:center;box-shadow:0 4px 12px -8px rgba(0,0,0,.5)}
#offbar.off{background:#2b2b2b;color:#fff}#offbar.wait{background:#fff1d6;color:#7a4a00;border:1px solid #f0c977}
#offbar button{min-height:34px;border-radius:20px;padding:0 14px;font-size:.84rem}
/* ===== Attestation et journal ===== */
.attbox{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:14px;border:2px solid #f2b8bf;background:#fff8f9}
.attbox.ok{border-color:#9fd4b1;background:#f1faf4}
.attbox .h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.attbox .h>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.attbox .h b{font-size:1.05rem}.attbox .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:#e83447;color:#fff;flex:none}
.attbox.ok .ic{background:#0E7A3A}.attbox .sigimg{max-height:64px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.attform{display:flex;flex-direction:column;gap:10px}
.jbox{display:flex;flex-direction:column;gap:10px}.jbox .tete{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.jbox h3{margin:0;font-size:1.15rem}
.jfil{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.jfil button{border-radius:20px;min-height:36px;padding:0 14px;font-size:.85rem}
.jfil button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.jlist{list-style:none;margin:0;padding:0;background:var(--paper,#fff);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.jlist li{display:grid;grid-template-columns:48px 26px minmax(0,1fr);gap:6px;padding:9px 12px;border-top:1px solid var(--line);font-size:.88rem;align-items:start}
.jlist li.jday{display:block;background:var(--sunk);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 12px}
.jlist li:first-child{border-top:none}.jlist .t{color:var(--muted);font-size:.82rem;padding-top:1px}
.jlist .i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:#e5f3ea;color:#0E7A3A}
.jlist .ja-modif .i{background:#e6eefb;color:#1f5fd6}.jlist .ja-suppr .i{background:#fde4e6;color:#B3261E}
.jlist .d{display:block;color:#1f3b63;font-size:.82rem;margin-top:2px}.jlist .q{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
/* ===== Personnel formé ===== */
.perso{display:flex;flex-direction:column;gap:12px}
.perso .tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.perso .tete h3{margin:0;font-size:1.15rem}
.perso .cpt{display:flex;gap:6px}.perso .cpt span{padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:700}
.perso .cpt .r{background:#fde4e6;color:#B3261E}.perso .cpt .v{background:#e5f3ea;color:#0E7A3A}
.couv{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.couv>div{border-radius:12px;padding:10px 6px;text-align:center;background:#e5f3ea;color:#0E7A3A;display:flex;flex-direction:column;gap:2px}
.couv>div.no{background:#f1f1f1;color:#8a8a8a}.couv b{font-size:1.4rem;line-height:1}.couv span{font-size:.74rem;font-weight:700}
@media (max-width:600px){.couv{grid-template-columns:repeat(3,1fr)}}
.pcard2{background:var(--paper,#fff);border:1px solid var(--line);border-left:5px solid #0E7A3A;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard2.bad{border-left-color:#B3261E}.pcard2.off{opacity:.6;border-left-color:#bbb}
.pcard2 .who{display:flex;align-items:center;gap:12px}.pcard2 .who>div{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.pcard2 .who>div>b{font-size:1.05rem;color:var(--fg)}
.pcard2 .who>div>.small{font-size:.85rem}
.pcard2 .ini{width:42px;height:42px;border-radius:50%;background:#e83447;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:30px;font-size:.84rem;background:#e5f3ea;color:#0b5a2b}
.fchip span{font-size:.76rem;opacity:.85}.fchip a{text-decoration:none}
.fchip.f-retard{background:#fde4e6;color:#9b1c1c}.fchip.f-proche{background:#fff1d6;color:#8a5300}
.fchip .fx{border:none;background:rgba(0,0,0,.07);border-radius:20px;min-width:24px;height:24px;padding:0 6px;font-size:.8rem;cursor:pointer;color:inherit}
.addf{border-style:dashed!important}
.pf-form{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:2px dashed #f2b8bf;background:#fff8f9}
.pf-form .filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px dashed var(--muted);background:#fff;border-radius:10px;padding:10px 14px;min-height:46px;font-weight:700;color:var(--fg)}
.pf-form .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pf-form .acts{display:flex;gap:8px;justify-content:flex-end}
/* ===== Dossier de commission ===== */
.dossbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,#e83447,#c41f33);color:#fff;box-shadow:0 10px 22px -12px rgba(200,30,50,.7)}
.dossbox>div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.dossbox b{font-size:1.1rem}
.dossbox .muted{color:#ffe1e5!important}
.dossbox button{background:#fff!important;color:#c41f33!important;border:none!important;min-height:52px;padding:0 22px;border-radius:30px;font-weight:800;font-size:1rem}
/* ===== Accueil en cercle ===== */
.orbite{position:relative;width:min(calc(100vw - 6px),700px);aspect-ratio:1;margin:4px 0 3cqw calc(50% - min(calc(100vw - 6px),700px) / 2);container-type:inline-size}
.orbite .anneau{position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(232,52,71,.28)}
.orbite .halo{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle,rgba(232,52,71,.10),rgba(232,52,71,0) 70%)}
.orbite .centre{position:absolute;left:30cqw;top:30cqw;width:40cqw;height:40cqw;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;text-decoration:none;
  box-shadow:0 2.5cqw 6cqw -1.5cqw rgba(200,30,50,.35),0 0 0 1.6cqw rgba(232,52,71,.08),inset 0 -1cqw 2cqw rgba(0,0,0,.04)}
.orbite .centre img{height:14cqw;width:auto}
.orbite .centre .se{font-family:var(--display);font-weight:800;font-size:5.6cqw;letter-spacing:.1em;color:var(--sch);line-height:1}
.orbite .centre .rs{font-size:2.15cqw;color:#6b6566;line-height:1.2;max-width:30cqw}
.orbite .bul{--k:1;position:absolute;width:22cqw;left:calc(var(--x) - 11cqw);top:calc(var(--y) - var(--r) * var(--k) / 2);gap:.9cqw;max-width:none}
.orbite .bul .rond{width:calc(var(--r) * var(--k));height:calc(var(--r) * var(--k))}
.orbite .bul b{font-size:clamp(.62rem,2.5cqw,1.02rem);white-space:nowrap}
.orbite .bul small{display:none}
.orbite .bul .nb{min-width:clamp(20px,5.2cqw,32px);height:clamp(20px,5.2cqw,32px);line-height:calc(clamp(20px,5.2cqw,32px) - 4px);font-size:clamp(.62rem,2.3cqw,.95rem);padding:0 .9cqw;top:-.6cqw;right:-.6cqw}
.orbite .bul.big b{font-size:clamp(.7rem,2.8cqw,1.1rem)}
@container (max-width:460px){.orbite .bul{--k:1.12}.orbite .bul b,.orbite .bul.big b{font-size:3.1cqw}.orbite .centre .rs{font-size:2.6cqw}}
@media (prefers-reduced-motion:no-preference){
  .orbite .centre{animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
  .orbite .anneau{animation:tourne 60s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
}
@media (prefers-color-scheme:dark){.orbite .centre{background:#fff}}
</style>

function render() {
  if (!S.me) return;
  const r = route(); lastKey = r.v + (r.site || '') + (r.id || '') + (r.cat || '');
  renderTabs(r); renderNavTheme(r);
  $('#fab').hidden = !(S.v2 && S.eq.length) || r.v === 'scan' || r.v === 'num' || r.v === 'eqfiche' || r.v === 'ronde' || r.v === 'exercices' || r.v === 'exfiche' || r.v === 'interne' || r.v === 'accueil' || r.v === 'registres' || r.v === 'documents' || r.v === 'affiche';
  if (r.v !== 'scan') stopScan();
  if (r.v !== 'etiquettes') { const lp = $('#lbpage'); if (lp) lp.remove(); }
  if (r.v === 'scan') return renderScan();
  if (r.v === 'num') { renderNum(); return sousNav('num'); }
  if (r.v === 'interne') { renderInterne(); brancherBilan(); sousNav('interne'); if (S.goBilan) { S.goBilan = false; setTimeout(() => { const b = $('#bilan'); if (b) b.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 80); } return; }
  if (r.v !== 'exfiche') { clearInterval(exTick); exTick = 0; }
  if (r.v === 'exercices') { renderExercices(); return sousNav('exercices'); }
  if (r.v === 'exfiche') return renderExFiche(r.id);
  notifVue();
  if (r.v === 'accueil') { renderAccueil(); pushCarte(); return; }
  if (r.v === 'registres') return renderRegistres();
  if (r.v === 'documents') return renderDocuments();
  if (r.v === 'affiche') return renderAffiche(r.site);
  if (r.v === 'sommaire') { renderSommaire(); brancherAttn(); pushCarte(); return; }
  if (r.v === 'acces') return renderAcces();
  if (r.v === 'sauvegarde') return renderSauvegarde();
  if (r.v === 'eq') { renderEq(r.cat); return sousNav('eq-' + r.cat); }
  if (r.v === 'eqfiche') return renderEqFiche(r.id);
  if (r.v === 'ronde') return renderRonde(r.cat);
  if (r.v === 'etiquettes') return renderEtiquettes(r.cat, r.id);
  return renderSite(r.site, r.mode);
}

function sousNav(cur) {
  if (!S.v2) return;
  const AL = alertes(); const red = (f) => AL.filter((a) => a.niveau === 'rouge' && f(a)).reduce((t, a) => t + (a.n || 1), 0);

    ...(S.exOK ? [['exercices', '#/exercices', 'Exercices d\'évacuation', red((a) => /^#\/(exercices|ex\/)/.test(a.href))]] : []),
    ['num', '#/num', 'Par numéro', 0]];

      <div><button type="button" class="primary" id="bl-go">📄 Créer le bilan PDF</button></div></section>

    ${alertesHTML(alertes().filter((a) => a.cat || /^#\/(exercices|ex\/)/.test(a.href)), 'Points d\'attention', true)}`;

function brancherBilan() {
  const b = $('#bl-go'); if (!b) return;

    const cats = [$('#bl-baes').checked && 'baes', $('#bl-ext').checked && 'extincteur'].filter(Boolean);

    busy(b, false);
  };
}

function initPad(cv, onInk) {

function fileType(f) { const e = (f.name.split('.').pop() || '').toLowerCase(); return { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', docx: MIME_DOCX, doc: 'application/msword', xlsx: MIME_XLSX, xls: 'application/vnd.ms-excel' }[e] || f.type; }
async function shrinkPhoto(file, type) {
  // Photos de plus de 1,5 Mo : réduites à 2000 px pour économiser l'espace
  if (!/^image\/(jpeg|png|webp)$/.test(type) || file.size < 1.5 * 1048576 || !window.createImageBitmap) return { blob: file, type };
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? { blob, type: 'image/jpeg' } : { blob: file, type };
  } catch (e) { return { blob: file, type }; }
}
async function uploadPiece(file, site, rubriqueId, titre, btn) {
  if (!file) { toast('Choisissez d\'abord un fichier.', true); return false; }
  let type = fileType(file);
  if (!TYPES[type]) { toast('Formats acceptés : PDF, photos (JPG, PNG, WEBP), Word ou Excel.', true); return false; }
  if (S.busy) return false;
  S.busy = true; busy(btn, true); toast('Envoi en cours…');
  try {
    const sh = await shrinkPhoto(file, type); type = sh.type;
    if (sh.blob.size > 20 * 1048576) { toast('Fichier trop lourd : 20 Mo maximum.', true); return false; }
    let nom = file.name; if (type === 'image/jpeg' && !/\.jpe?g$/i.test(nom)) nom = nom.replace(/\.[^.]+$/, '') + '.jpg';
    const safe = nom.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(-80) || 'document';
    const chemin = site + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + '-' + safe;
    const up = await S.sb.storage.from('registres').upload(chemin, sh.blob, { contentType: type, upsert: false });
    if (up.error) throw (/mime|not supported|invalid/i.test(up.error.message || '') && /WORD|EXCEL/.test(TYPES[type]) ? new Error('Word et Excel : exécutez d\'abord la petite mise à jour Supabase des formats.') : up.error);
    const { data, error } = await S.sb.from('reg_pieces').insert({ site_id: site, rubrique_id: rubriqueId === 'general' ? null : rubriqueId, titre: (titre || '').trim(), nom_fichier: nom, chemin, type, taille: sh.blob.size, ajoute_par: S.me.id }).select().single();
    if (error) { await S.sb.storage.from('registres').remove([chemin]); throw error; }
    S.lastUpload = data;
    const s = await S.sb.storage.from('registres').createSignedUrl(chemin, 3600);
    if (s.data) S.urls[chemin] = s.data.signedUrl;
    S.pieces.push(data); toast('Pièce jointe ajoutée'); return true;
  } catch (e) { toast(errMsg(e), true); return false; } finally { S.busy = false; busy(btn, false); }
}

  }

    const sc = siteOf(x.site_id)?.court || ''; const lab = (x.numero ? 'n° ' + x.numero + ' · ' : '') + (x.texte.length > 70 ? x.texte.slice(0, 68) + '…' : x.texte);

  }
  if (S.persOK) for (const f of formationsActuelles()) {
    const a = S.pers.find((z) => z.id === f.personne_id); if (!a || !a.actif || !f.recyclage) continue;
    const base = { site: a.site_id, href: '#/site/' + a.site_id + '/personnel' }; const sc = siteOf(a.site_id)?.court || '';
    if (f.recyclage < t) out.push({ ...base, niveau: 'rouge', texte: 'Formation à renouveler : ' + forLabel(f) + ' · ' + a.nom, sub: sc + ' · expirée le ' + fr(f.recyclage) });
    else if (days(f.recyclage) <= 60) out.push({ ...base, niveau: 'orange', texte: 'Recyclage à prévoir : ' + forLabel(f) + ' · ' + a.nom, sub: sc + ' · avant le ' + fr(f.recyclage) });
  }

async function zipAnnee(x, annee, list, pcs, vis, btn) {
  busy(btn, true);
  try {
    await loadJSZip();
    const zip = new JSZip(); const root = cleanName(`Registre ${x.court} ${annee}`);
    const rub = (rid) => S.rub.find((r) => r.id === rid);
    zip.file(root + '/Controles ' + annee + '.csv', csv([['Date', 'Réf.', 'Rubrique', 'Intervenant', 'Résultat', 'Référence', 'Remarques'],
      ...list.map((c) => { const r = rub(c.rubrique_id); return [fr(c.date_controle), r?.lettre || '', r?.nom || '', c.intervenant, resLabel[c.resultat || ''], c.reference, c.remarques]; })]));
    const ids = new Set(rubOf(x.id).map((r) => r.id));
    zip.file(root + '/Observations ' + annee + '.csv', csv([['Relevée le', 'Réf.', 'Rubrique', 'Observation', 'Levée le'],
      ...S.obs.filter((o) => ids.has(o.rubrique_id) && o.cree_le.startsWith(annee)).map((o) => { const r = rub(o.rubrique_id); return [fr(o.cree_le), r?.lettre || '', r?.nom || '', o.texte, o.levee ? fr(o.levee_le) : '']; })]));
    zip.file(root + '/Passages signes ' + annee + '.csv', csv([['Date', 'Réf.', 'Entreprise', 'Intervenant', 'Objet', 'Résultat', 'Remarques', 'Visé par'],
      ...vis.map((v) => [fr(v.date_visite), rub(v.rubrique_id)?.lettre || '', v.entreprise, v.intervenant, v.objet, resLabel[v.resultat || ''], v.remarques, nameOf(v.vise_par)])]));
    const files = [...pcs.map((p) => { const r = rub(p.rubrique_id); return { path: p.chemin, dir: 'Pieces jointes/' + cleanName(r ? (r.lettre ? r.lettre + ' - ' : '') + r.nom : 'Documents generaux'), name: cleanName(p.nom_fichier) }; }),
      ...vis.map((v) => ({ path: v.signature, dir: 'Signatures', name: cleanName(v.date_visite + ' ' + v.entreprise + ' ' + v.intervenant) + '.png' }))];
    const used = new Set(); const fails = [];
    for (let i = 0; i < files.length; i++) {
      toast(`Préparation : fichier ${i + 1} sur ${files.length}…`);
      try { zip.file(root + '/' + uniqueName(used, files[i].dir + '/' + files[i].name), await fetchStored(files[i].path)); } catch (e) { fails.push(files[i].dir + '/' + files[i].name); }
    }
    if (fails.length) zip.file(root + '/FICHIERS MANQUANTS.txt', 'Ces fichiers n\'ont pas pu être récupérés :\r\n' + fails.join('\r\n'));
    toast('Création du fichier zip…');
    saveBlob(await zip.generateAsync({ type: 'blob' }), root + '.zip');
    toast(fails.length ? `Téléchargé, sauf ${fails.length} fichier(s) introuvable(s).` : 'Année ' + annee + ' téléchargée', !!fails.length);
  } catch (e) { toast(errMsg(e), true); } finally { busy(btn, false); }
}

const eqCtl = (e) => S.eqCtlBy.get(e.id) || [];
function eqStatut(e) {
  if (!e.actif) return { k: 'vide', l: 'Hors service' };
  const t = today(); const C = CATS[e.categorie]; const ctl = eqCtl(e);
  if (ctl[0] && !ctl[0].conforme) return { k: 'retard', l: 'Contrôle non conforme' };
  const ech = e.categorie === 'baes' ? [['Batterie à remplacer', e.batterie_remplacement]] : [['Vérification annuelle', e.verification_annuelle], ['Révision décennale', e.revision_decennale]];
  const exp = ech.find((x) => x[1] && x[1] < t); if (exp) return { k: 'retard', l: exp[0] + (e.categorie === 'baes' ? '' : ' dépassée') };
  const last = ctl.find((c) => c.type_controle === 'mensuel');
  if (!last) return { k: 'obs', l: 'Jamais contrôlé' };
  if (days(last.date_controle) < -(S.params[C.freqKey] || 30)) return { k: 'obs', l: C.controles.mensuel.nom + ' à faire' };
  if (e.categorie === 'baes') { const au = ctl.find((c) => c.type_controle === 'autonomie'); if (!au || days(au.date_controle) < -(S.params.autonomie_frequence_jours || 182)) return { k: 'obs', l: 'Test d\'autonomie à faire' }; }

}

async function uploadEqPhoto(file, e, kind, dossier = 'equipements') {

  let type = fileType(file);
  if (!/^image\/(jpeg|png|webp)$/.test(type) && /^image\//.test(file.type || '')) type = 'image/jpeg';
  if (!/^image\/(jpeg|png|webp)$/.test(type)) throw new Error('Choisissez une photo (JPG, PNG ou WEBP).');
  const sh = await shrinkPhoto(file, type);
  if (sh.blob.size > 20 * 1048576) throw new Error('Photo trop lourde : 20 Mo maximum.');
  const ext = sh.type === 'image/png' ? 'png' : sh.type === 'image/webp' ? 'webp' : 'jpg';
  const path = e.site_id + '/' + dossier + '/' + e.id + '/' + kind + '-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + '.' + ext;
  const up = await S.sb.storage.from('registres').upload(path, sh.blob, { contentType: sh.type, upsert: false });
  if (up.error) throw up.error;
  const sg = await S.sb.storage.from('registres').createSignedUrl(path, 3600);
  if (sg.data) S.urls[path] = sg.data.signedUrl;
  return path;
}

function renderEtiquettes(cat, arg) {

        <label>Commencer à la case <input type="number" id="lb-start" min="1" max="${N}" value="${S.lbStart}"></label>

  let lp = $('#lbpage'); if (!lp) { lp = document.createElement('style'); lp.id = 'lbpage'; document.head.appendChild(lp); }

  const fit = () => { const sh = $('#lb-sheets'); if (!sh) return; const w = main.clientWidth; const a4 = 210 * 96 / 25.4; sh.style.zoom = String(Math.min(1, w / a4)); };

  $('#lb-cut').onchange = (ev) => { S.lbCut = ev.target.checked; try { localStorage.setItem('reg.lbCut', S.lbCut ? '1' : '0'); } catch (_) {} renderEtiquettes(cat, arg); };

  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = res; sc.onerror = () => { xlsxLoading = null; rej(new Error('Le module Excel ne se charge pas. Utilisez la sauvegarde complète (zip).')); }; document.head.appendChild(sc); });
  return xlsxLoading;
}
async function noterSauvegarde() {
  const up = await S.sb.from('reg_parametres').update({ derniere_sauvegarde: new Date().toISOString(), sauvegarde_par: S.me.id }).eq('id', 1).select().maybeSingle();
  if (up.data) S.params = up.data;
}
async function classeurExcel() {
  await loadXLSX(); const X = window.XLSX; const wb = X.utils.book_new();

    const keys = Object.keys(rows[0] || { '(vide)': '' }); ws['!cols'] = keys.map((k) => ({ wch: Math.min(60, Math.max(10, k.length + 2, ...rows.slice(0, 200).map((r) => String(r[k] ?? '').length))) }));
    X.utils.book_append_sheet(wb, ws, nom.slice(0, 31)); };
  const sn = (id) => siteOf(id)?.nom || ''; const rubN = (rid) => { const r = S.rub.find((z) => z.id === rid); return r ? (r.lettre ? r.lettre + ' · ' : '') + r.nom : ''; };
  const eqOf = (id) => S.eq.find((e) => e.id === id) || {};

  sh(S.ctl.map((c) => ({ 'Site': sn(c.site_id), 'Rubrique': rubN(c.rubrique_id), 'Date': fr(c.date_controle), 'Intervenant': c.intervenant, 'Résultat': resLabel[c.resultat || ''], 'Référence': c.reference || '', 'Remarques': c.remarques || '', 'Passage signé': c.visite_id ? 'Oui' : '' })), 'Contrôles');
  sh(S.obs.map((o) => ({ 'Rubrique': rubN(o.rubrique_id), 'Observation': o.texte, 'Relevée le': fr(o.cree_le), 'Levée': o.levee ? 'Oui' : 'Non', 'Levée le': fr(o.levee_le), 'Par': nameOf(o.levee_par) || '' })), 'Observations');
  sh(S.visites.map((v) => ({ 'Site': sn(v.site_id), 'Date': fr(v.date_visite), 'Rubrique': rubN(v.rubrique_id), 'Entreprise': v.entreprise, 'Intervenant': v.intervenant, 'Téléphone': v.telephone || '', 'Objet': v.objet, 'Résultat': resLabel[v.resultat || ''], 'Remarques': v.remarques, 'Visé par': nameOf(v.vise_par) || (v.a_distance ? 'Signé sans responsable' : '') })), 'Passages signés');
  sh(S.eq.map((e) => ({ 'N°': e.code, 'Type': e.categorie === 'baes' ? 'BAES' : 'Extincteur', 'Site': sn(e.site_id), 'Niveau': e.zone || '', 'Emplacement': e.emplacement || '', 'Modèle': typeLabel(e), 'Marque': e.marque || '', 'État': eqStatut(e).l, 'En service': e.actif ? 'Oui' : 'Non' })), 'BAES et extincteurs');
  sh(S.eqCtlAll.map((c) => { const e = eqOf(c.equipement_id); return { 'Date': fr(c.date_controle), 'N°': e.code || '', 'Site': sn(e.site_id), 'Contrôle': c.type_controle === 'autonomie' ? 'Test d\'autonomie' : 'Contrôle mensuel', 'Résultat': c.conforme ? 'Conforme' : 'NON CONFORME', 'Remarques': c.remarques || '', 'Par': nameOf(c.cree_par) || '' }; }), 'Contrôles BAES-extincteurs');
  if (S.presOK) sh(S.pres.map((x) => ({ 'Site': sn(x.site_id), 'Commission du': fr(x.date_commission), 'N°': x.numero, 'Prescription': x.texte, 'Qui': x.qui, 'Pour le': fr(x.echeance), 'État': x.statut === 'levee' ? 'Levée' : x.statut === 'en_cours' ? 'En cours' : 'À faire', 'Levée le': fr(x.levee_le), 'Commentaire': x.commentaire })), 'Prescriptions');
  if (S.exOK) sh(S.ex.map((x) => ({ 'Site': sn(x.site_id), 'Date': fr(x.date_exercice), 'Heure': x.heure || '', 'Type': x.type_exercice === 'inopine' ? 'Inopiné' : 'Annoncé', 'Scénario': x.scenario || '', 'Durée': mmss(x.duree_sec), 'Personnes': (x.nb_ville || 0) + (x.nb_exterieurs || 0), 'Problèmes': exProblemes(x).map(exPointLabel).join(', '), 'Actions': (x.actions || []).map((a) => a.texte + (a.fait ? ' (fait)' : '')).join(' ; '), 'Responsable': x.responsable || '' })), 'Exercices');
  if (S.persOK) { sh(S.pers.map((a) => ({ 'Site': sn(a.site_id), 'Agent': a.nom, 'Fonction': a.fonction, 'Téléphone': a.telephone, 'En poste': a.actif ? 'Oui' : 'Non' })), 'Personnel');
    sh(S.forms.map((f) => ({ 'Site': sn(f.site_id), 'Agent': S.pers.find((a) => a.id === f.personne_id)?.nom || '', 'Formation': forLabel(f), 'Suivie le': fr(f.date_formation), 'À recycler le': fr(f.recyclage), 'Organisme': f.organisme, 'État': forEtat(f).l })), 'Formations'); }
  if (S.attOK) sh(S.att.map((a) => ({ 'Site': sn(a.site_id), 'Signée par': a.nom, 'Qualité': a.qualite, 'Mention': a.mention, 'Le': heureFr(a.signe_le) })), 'Attestations');

}
async function sauvegardeExcel(btn) {
  busy(btn, true);
  try { toast('Préparation du fichier Excel…'); await loadAll(); const data = await classeurExcel();
    saveBlob(new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'Sauvegarde registres ' + today() + '.xlsx');
    await noterSauvegarde(); toast('Sauvegarde Excel enregistrée sur votre appareil'); render();
  } catch (e) { toast(errMsg(e), true); } finally { busy(btn, false); }
}
async function sauvegarde(btn) {
  busy(btn, true);
  try {
    await loadAll();
    await loadJSZip();
    const zip = new JSZip(); const d = today(); const root = 'Sauvegarde registres ' + d;
    const tables = { sites: S.sites, rubriques: S.rub, controles: S.ctl, observations: S.obs, passages_signes: S.visites, pieces_jointes: S.pieces, equipements: S.eq.map((e) => ({ ...e, site: siteOf(e.site_id)?.nom, etat: eqStatut(e).l })), equipements_controles: S.eqCtlAll.map((c) => { const e = S.eq.find((x) => x.id === c.equipement_id); return { ...c, code: e?.code, categorie: e?.categorie, par: nameOf(c.cree_par) }; }),
      prescriptions_commission: (S.pres || []).map((x) => ({ ...x, site: siteOf(x.site_id)?.nom })),
      personnel: (S.pers || []).map((x) => ({ ...x, site: siteOf(x.site_id)?.nom })),
      attestations: (S.att || []).map((a) => ({ ...a, site: siteOf(a.site_id)?.nom })),
      formations: (S.forms || []).map((f) => ({ ...f, formation: forLabel(f), agent: S.pers.find((a) => a.id === f.personne_id)?.nom, site: siteOf(f.site_id)?.nom })),
      exercices_evacuation: (S.ex || []).map((x) => ({ ...x, site: siteOf(x.site_id)?.nom, problemes: exProblemes(x).map((k) => exPointLabel(k)).join(' ; '), actions: (x.actions || []).map((a) => a.texte + (a.qui ? ' (' + a.qui + ')' : '') + (a.fait ? ' [fait]' : '')).join(' ; ') })),
      acces: Object.values(S.people).filter((p) => (p.sites || []).length).map((p) => ({ personne: p.full_name, sites: (p.sites || []).join(', ') })) };
    zip.file(root + '/LISEZMOI.txt', `Sauvegarde des registres de sécurité – Secteur Est\r\nFaite le ${fr(d)} par ${S.me.full_name}.\r\n\r\n- tableaux/ : un fichier .csv par table, à ouvrir avec Excel.\r\n- sauvegarde-complete.json : toutes les données, pour une restauration.\r\n- fichiers/ : pièces jointes, signatures et photos des équipements, rangées par site.\r\n`);
    zip.file(root + '/sauvegarde-complete.json', JSON.stringify({ application: 'registres-securite', version: 2, date: new Date().toISOString(), par: S.me.full_name, ...tables }, null, 1));
    for (const [k, v] of Object.entries(tables)) zip.file(root + '/tableaux/' + k + '.csv', tableCsv(v));
    try { zip.file(root + '/Registres ' + d + '.xlsx', await classeurExcel()); } catch (_) {}
    const files = [...S.pieces.map((p) => p.chemin), ...S.visites.map((v) => v.signature), ...S.eq.map((e) => e.photo).filter(Boolean), ...S.eqCtlAll.map((c) => c.photo).filter(Boolean), ...(S.ex || []).flatMap((x) => [...(x.photos || []), x.signature]).filter(Boolean), ...(S.pres || []).map((x) => x.preuve).filter(Boolean), ...(S.forms || []).map((f) => f.preuve).filter(Boolean), ...(S.att || []).map((a) => a.signature)];
    try { const jr = []; for (const z of S.sites) jr.push(...(await chargerJournal(z.id)).map((e) => ({ date: e.le, site: z.nom, par: jQui(e), action: e.action, element: J_TABLES[e.table_nom] || e.table_nom, libelle: e.libelle, detail: jDetail(e) })));
      zip.file(root + '/tableaux/journal_modifications.csv', tableCsv(jr)); } catch (_) {}
    const fails = [];
    for (let i = 0; i < files.length; i++) {
      toast(`Sauvegarde : fichier ${i + 1} sur ${files.length}…`);
      try { zip.file(root + '/fichiers/' + files[i], await fetchStored(files[i])); } catch (e) { fails.push(files[i]); }
    }
    if (fails.length) zip.file(root + '/FICHIERS MANQUANTS.txt', fails.join('\r\n'));
    toast('Création du fichier zip…');
    saveBlob(await zip.generateAsync({ type: 'blob' }), cleanName(root) + '.zip');
    await noterSauvegarde();
    toast(fails.length ? `Sauvegarde téléchargée, sauf ${fails.length} fichier(s) introuvable(s).` : 'Sauvegarde téléchargée', !!fails.length);
    render();
  } catch (e) { toast(errMsg(e), true); } finally { busy(btn, false); }
}


const ROLE = { secteur: 'Responsable de secteur', responsable: 'Responsable d\'installation', agent: 'Agent d\'entretien' };
function renderAcces() {
  const people = Object.values(S.people).filter((p) => p.active).sort((a, b) => (a.role === 'secteur' ? -1 : 0) - (b.role === 'secteur' ? -1 : 0) || a.full_name.localeCompare(b.full_name));
  const stockSite = (n) => ({ 1: 'Mandela', 2: 'Aar' }[n] || '');
  main.innerHTML = `
    <div class="sectitle"><h2>Accès aux registres</h2></div>
    <div class="notice">Seules les personnes cochées ici entrent dans l'application, et seulement sur les sites cochés. Elles se connectent avec leur compte Stock Entretien. Une personne sans compte le crée d'abord dans Stock Entretien, puis vous validez son compte là-bas avant de cocher ses sites ici.</div>
    <div class="paper">${people.map((p) => p.role === 'secteur'
      ? `<div class="person"><div><b>${esc(p.full_name)}</b>${p.id === S.me.id ? ' (vous)' : ''}<div class="small muted">${ROLE.secteur} · administrateur, accès à tous les registres</div></div><span class="pill p-ok">Tous les sites</span></div>`
      : `<div class="person" data-person="${p.id}"><div style="min-width:0"><b>${esc(p.full_name)}</b><div class="small muted">${esc(ROLE[p.role] || '')}${stockSite(p.stock_site) ? ' · ' + stockSite(p.stock_site) + ' dans Stock Entretien' : ''}</div>
          <div class="checks">${S.sites.map((s) => `<label><input type="checkbox" value="${s.id}" ${(p.sites || []).includes(s.id) ? 'checked' : ''}>${esc(s.court)}</label>`).join('')}</div></div>
          <button type="button" data-save="${p.id}">Enregistrer</button></div>`).join('') || '<div class="empty">Aucun compte actif.</div>'}</div>`;
  $$('[data-save]').forEach((b) => { b.onclick = async () => {
    const id = b.dataset.save; const row = $(`[data-person="${id}"]`);
    const sites = $$('input:checked', row).map((i) => i.value);
    busy(b, true);
    const { error } = sites.length ? await S.sb.from('reg_acces').upsert({ user_id: id, sites }) : await S.sb.from('reg_acces').delete().eq('user_id', id);
    busy(b, false);
    if (error) return toast(errMsg(error), true);
    S.people[id].sites = sites; toast(sites.length ? 'Accès enregistré' : 'Accès retiré');
  }; });
}

function renderLogin() {
  authShell(`<form class="paper" id="lf" novalidate>
      <label for="l-email">Adresse e-mail<input type="email" id="l-email" autocomplete="email" inputmode="email" autocapitalize="none" required></label>
      <label for="l-pw">Mot de passe<input type="password" id="l-pw" autocomplete="current-password" required></label>
      <button type="submit" class="primary" id="l-go">Se connecter</button>
      <p class="small muted" style="margin:0">Utilisez le même compte que pour Stock Entretien. Pas encore de compte ou mot de passe oublié : <a href="${esc(CFG.stockUrl)}">ouvrir Stock Entretien</a>.</p>
    </form>`);
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), pw = $('#l-pw').value;
    if (!/^\S+@\S+\.\S+$/.test(email) || !pw) return toast('Saisissez votre adresse e-mail et votre mot de passe.', true);
    busy($('#l-go'), true);
    const { error } = await S.sb.auth.signInWithPassword({ email, password: pw });
    busy($('#l-go'), false);
    if (error) return toast(errMsg(error), true);
    afterLogin();
  };
}
function renderNoAccess(title, text) {
  authShell(`<div class="paper"><h3>${title}</h3><p style="margin:0">${text}</p>
    <button type="button" class="primary" id="na-retry">Vérifier à nouveau</button><button type="button" id="na-out">Se déconnecter</button></div>`);
  $('#na-retry').onclick = () => afterLogin();
  $('#na-out').onclick = async () => { await S.sb.auth.signOut(); renderLogin(); };
}
async function afterLogin(uidSession) {
  let user = null, ue = null;
  try { const r = await S.sb.auth.getUser(); user = r.data && r.data.user; ue = r.error; } catch (e) { ue = e; }
  if (!user) { if (estReseau(ue) && await demarrerHorsLigne(uidSession)) return; return renderLogin(); }
  main.innerHTML = '<div class="loading">Chargement des registres…</div>';
  if (navigator.onLine === false && await demarrerHorsLigne(user.id)) return;
  const [prof, mine, adm] = await Promise.all([
    S.sb.from('profiles').select('id, full_name, role, active').eq('id', user.id).maybeSingle(),
    S.sb.rpc('reg_mes_sites'), S.sb.rpc('reg_is_admin')]);
  if (mine.error && /reg_mes_sites|function/i.test(mine.error.message || '')) return renderNoAccess('Base à préparer', 'La base de données des registres n\'est pas encore installée. Exécutez le script SQL fourni dans Supabase.');
  if ((prof.error || mine.error) && estReseau(prof.error || mine.error) && await demarrerHorsLigne(user.id)) return;
  if (prof.error || mine.error) return renderNoAccess('Connexion impossible', esc(errMsg(prof.error || mine.error)));
  const me = prof.data;
  if (!me || !me.active) return renderNoAccess('Compte en attente', 'Votre compte Stock Entretien n\'est pas encore validé par le responsable de secteur.');
  S.me = me; S.admin = !!adm.data; S.mesSites = mine.data || [];
  if (!S.mesSites.length) { S.me = null; return renderNoAccess('Accès non autorisé', 'Votre compte n\'a pas encore accès aux registres de sécurité. Demandez au responsable de secteur de vous l\'ouvrir.'); }
  $('#who-name').textContent = me.full_name + (S.admin ? ' · administrateur' : '');
  $('#band').hidden = false; $('#loupe').hidden = false;
  try { await loadAll(); } catch (e) { if (estReseau(e) && await demarrerHorsLigne(user.id)) return; return renderNoAccess('Chargement impossible', esc(errMsg(e))); }
  render(); majBandeau();
  notifsDemarrer();
  viderAttente();
}

const VAPID_PUBLIC = 'BDKiGJw4nJf_uggAQqjKMomwqeGPiarsG86ghCeuAMkPOf4pwI-gR3Ikh11-3BWFlw25-TkIpS3lRuvMLvKu8Iw';
S.notifs = []; S.notifOK = false; S.pushEtat = '';

async function loadNotifs() {
  if (!S.me || !S.sb) return;
  const { data, error } = await S.sb.from('reg_notifs').select('*').order('created_at', { ascending: false }).limit(80);
  if (error) { S.notifOK = false; majBulle(); return; }
  S.notifOK = true; S.notifs = data || []; majBulle(); notifVue();

}
function notifsDemarrer() {
  loadNotifs().then(() => pushEtat()).then((e) => { S.pushEtat = e; if (route().v === 'sommaire') pushCarte(); }).catch(() => {});
  clearInterval(notifTimer);
  notifTimer = setInterval(() => { if (document.visibilityState === 'visible') loadNotifs(); }, 60000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) loadNotifs(); });
async function marquerLu(ids) {
  ids = ids.filter((id) => S.notifs.some((n) => n.id === id && !n.lu)); if (!ids.length) return;
  S.notifs.forEach((n) => { if (ids.includes(n.id)) n.lu = true; }); majBulle();
  await S.sb.from('reg_notifs').update({ lu: true }).in('id', ids);
}
function notifVue() { // ouvrir la page d'une alerte la marque comme lue
  if (!S.notifs.length) return; const h = location.hash;
  const ids = S.notifs.filter((n) => !n.lu && n.lien && n.lien === h).map((n) => n.id);
  if (ids.length) marquerLu(ids);
}
function depuis(t) {
  const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return 'il y a ' + m + ' min';
  const h = Math.round(m / 60); if (h < 24) return 'il y a ' + h + ' h';
  const d = new Date(t); return 'le ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' à ' + String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
}
function pushHTML() {

  if (e === 'ios-installer') return '<div class="npush">Sur iPhone, ajoutez d\'abord l\'application à l\'écran d\'accueil (Partager › Sur l\'écran d\'accueil), puis ouvrez-la depuis son icône.</div>';

}
