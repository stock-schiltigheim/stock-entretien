/* notifications du téléphone */
const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const installee = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64u(s) { const p = '='.repeat((4 - (s.length % 4)) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); }
async function pushEtat() {
  if (!S.notifOK) return '';
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return estIOS && !installee() ? 'ios-installer' : 'non-supporte';
  if (Notification.permission === 'denied') return 'refuse';
  try { const reg = swReg || (await navigator.serviceWorker.ready); const sub = await reg.pushManager.getSubscription(); return sub && Notification.permission === 'granted' ? 'actif' : 'inactif'; } catch (_) { return 'inactif'; }
}
async function pushActiver() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications refusées. Autorisez-les dans les réglages du téléphone, puis réessayez.' : 'Notifications non autorisées.');
  const reg = swReg || (await navigator.serviceWorker.ready);
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
  const j = sub.toJSON();
  const { error } = await S.sb.from('reg_push').upsert({ endpoint: j.endpoint, user_id: S.me.id, abonnement: j }, { onConflict: 'endpoint' });
  if (error) throw error;
}
async function pushArreter() {
  const reg = swReg || (await navigator.serviceWorker.ready); const sub = await reg.pushManager.getSubscription();
  if (sub) { await S.sb.from('reg_push').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
}
function brancherPush(root) {
  $$('[data-pushon]', root).forEach((b) => { b.onclick = async () => { busy(b, true); try { await pushActiver(); toast('Notifications activées sur ce téléphone'); } catch (e) { toast(errMsg(e), true); } busy(b, false); S.pushEtat = await pushEtat(); dessinerPanneau(); pushCarte(); }; });
  $$('[data-pushoff]', root).forEach((b) => { b.onclick = async () => { try { await pushArreter(); toast('Notifications arrêtées sur ce téléphone'); } catch (e) { toast(errMsg(e), true); } S.pushEtat = await pushEtat(); dessinerPanneau(); pushCarte(); }; });
}
function pushCarte() {
  const old = $('#pushcard'); if (old) old.remove();
  if (!['sommaire', 'accueil'].includes(route().v) || S.pushEtat !== 'inactif' || !main.firstElementChild) return;
  let masque = false; try { masque = localStorage.getItem('reg.pushNon') === '1'; } catch (_) {}
  if (masque) return;
  const c = document.createElement('section'); c.className = 'paper box no-print'; c.id = 'pushcard';
  c.innerHTML = '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span style="font-size:1.8rem" aria-hidden="true">🔔</span><span style="flex:1;min-width:200px"><b>Activez les notifications</b><br><span class="small muted">Soyez prévenu dès qu\'un responsable saisit un contrôle ou signale un défaut, avec une bulle rouge sur l\'icône.</span></span><span style="display:flex;gap:8px"><button type="button" class="link" id="pc-non">Plus tard</button><button type="button" class="primary" data-pushon="1">Activer</button></span></div>';
  main.insertBefore(c, main.firstElementChild);
  $('#pc-non').onclick = () => { try { localStorage.setItem('reg.pushNon', '1'); } catch (_) {} c.remove(); };
  brancherPush(c);
}

async function boot() {
  if (!window.supabase) { authShell('<div class="notice bad">Impossible de charger l\'application. Vérifiez la connexion Internet, puis rechargez la page. (Hors ligne, l\'application ne s\'ouvre que si elle a déjà été ouverte une fois avec du réseau sur cet appareil.)</div>'); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const mp = location.hash.match(/^#\/passage\/([A-Za-z0-9]{20,64})/);
  if (mp) return renderPassage(mp[1]);
  let session = null; try { session = (await S.sb.auth.getSession()).data.session; } catch (_) {}
  if (!session) { if (navigator.onLine === false && await demarrerHorsLigne()) return; return renderLogin(); }
  afterLogin(session.user && session.user.id);
}
boot();
})();
</script>
