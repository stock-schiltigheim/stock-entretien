<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Stock Entretien</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3F8F'/%3E%3Cpath d='M22 18h20v6l-4 4v20a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V28l-4-4z' fill='%23F4C430'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Stock Entretien — signalétique de réserve : bleu cobalt, jaune sécurité.
   Mobile d'abord, gros boutons, chiffres en colonnes. */
:root {
  --bg: #EEF1F7;
  --surface: #FFFFFF;
  --surface-2: #F6F8FC;
  --ink: #141B2D;
  --muted: #586179;
  --line: #D5DBE8;
  --accent: #1F3F8F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9F7;
  --signal: #F4C430;
  --signal-ink: #1E1A06;
  --ok: #217A4B;
  --ok-soft: #E1F2E8;
  --warn: #A55E00;
  --warn-soft: #FBEFD9;
  --danger: #B42318;
  --danger-soft: #FCE8E6;
  --shadow: 0 1px 2px rgba(20, 27, 45, .06), 0 4px 16px rgba(20, 27, 45, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  --tabs-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1320;
    --surface: #161D2E;
    --surface-2: #1C2438;
    --ink: #E9EDF6;
    --muted: #9AA4BD;
    --line: #2A3450;
    --accent: #8EA9FF;
    --accent-ink: #0E1320;
    --accent-soft: #22305A;
    --signal: #F4C430;
    --signal-ink: #1E1A06;
    --ok: #5BCB8E;
    --ok-soft: #173426;
    --warn: #F2B04A;
    --warn-soft: #3A2A10;
    --danger: #FF7A6E;
    --danger-soft: #3D1A17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
p { margin: 0; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

/* ---------- Barre du haut ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--accent); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--accent); color: var(--accent-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { .topbar, body::before { background: #142453; } .topbar { color: #fff; } }
.topbar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--signal); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 6px 9px 5px; background: #1F3F8F; border-radius: 2px 2px 3px 3px; }
.brand-text { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .brand-text { font-size: 18px; } .site-switch button { padding: 8px 8px; font-size: 14px; } }
.site-switch { display: flex; gap: 4px; background: rgba(255,255,255,.14); padding: 3px; border-radius: 10px; }
.site-switch button { border: 0; background: transparent; color: #fff; font: 600 15px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.site-switch button[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); }
.site-label { font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.14); padding: 8px 10px; border-radius: 8px; white-space: nowrap; }

/* ---------- Contenu ---------- */
.main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tabs-h) + 32px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
  outline: none;
}
.loading { padding: 48px 0; text-align: center; color: var(--muted); }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 4px 0; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 700 16px/1.1 var(--f-body); text-decoration: none; cursor: pointer;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.signal { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn.block { width: 100%; }
.btn svg { width: 22px; height: 22px; flex: none; }

.big-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.big-action {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 18px;
  min-height: 112px; padding: 14px; border-radius: var(--r); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow);
  font: 700 18px/1.15 var(--f-body); cursor: pointer; text-align: left;
}
.big-action svg { width: 30px; height: 30px; }
.big-action small { display: block; font: 400 14px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.big-action.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.big-action.primary small { color: rgba(30, 26, 6, .75); }
.big-action.wide { grid-column: 1 / -1; min-height: 88px; flex-direction: row; align-items: center; justify-content: flex-start; }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-weight: 700; font-size: 15px; }
.field .hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=search], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 400 17px/1.3 var(--f-body);
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search { position: relative; }
.search input { padding-left: 42px; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 700 14px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; min-height: 44px; font: 700 16px/1 var(--f-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button[data-kind="sortie"][aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); }
.seg button[data-kind="entree"][aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); }

.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: stretch; }
.stepper button { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; font: 700 26px/1 var(--f-body); cursor: pointer; min-height: 56px; }
.stepper input { text-align: center; font: 700 26px/1 var(--f-body); font-variant-numeric: tabular-nums; min-height: 56px; }
.mini-stepper { display: inline-grid; grid-template-columns: 40px 52px 40px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
.mini-stepper button { border: 0; background: var(--surface-2); color: var(--ink); height: 40px; font: 700 20px/1 var(--f-body); cursor: pointer; }
.mini-stepper input { border: 0; min-height: 40px; height: 40px; padding: 0; text-align: center; font: 700 17px/1 var(--f-body); font-variant-numeric: tabular-nums; border-radius: 0; box-shadow: none; }
.mini-stepper.on { border-color: var(--accent); }

/* ---------- Listes ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 64px; background: var(--surface); width: 100%; text-align: left; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
button.item, a.item { cursor: pointer; }
.item .main-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .title { font-weight: 700; overflow-wrap: anywhere; }
.item .sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.item .qty { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .qty .n { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.group-label { padding: 10px 14px 6px; background: var(--surface-2); border-top: 1px solid var(--line); font: 600 14px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group-label:first-child { border-top: 0; }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--line); flex: none; }
.stripe.ok { background: var(--ok); } .stripe.vide { background: var(--line); } .stripe.bas { background: var(--warn); } .stripe.rupture { background: var(--danger); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font: 700 12.5px/1.3 var(--f-body); white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bas, .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.rupture, .pill.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
.kpi .n { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); line-height: 1.2; }
.kpi.alert .n { color: var(--danger); }
.kpi.attn { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }

/* ---------- Fiche produit ---------- */
.stock-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: end; }
.stock-hero .big { font: 700 64px/0.9 var(--f-display); font-variant-numeric: tabular-nums; }
.stock-hero .unit { color: var(--muted); font-size: 15px; }
.meter { grid-column: 1 / -1; height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--ok); border-radius: 8px; }
.meter.bas span { background: var(--warn); } .meter.rupture span { background: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 10px; padding: 10px; }
.fact .v { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.fact .k { font-size: 12.5px; color: var(--muted); }

.signal-band { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; font: 700 20px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.signal-band.danger { background: #B42318; color: #fff; }
.signal-band.attention { background: var(--signal); color: var(--signal-ink); }
.pictos { display: flex; flex-wrap: wrap; gap: 10px; }
.picto { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; text-align: center; font-size: 12.5px; line-height: 1.2; }
.picto svg { width: 64px; height: 64px; }
.ppe { display: flex; flex-wrap: wrap; gap: 8px; }
.ppe span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #1F5FBF; color: #fff; font-weight: 700; font-size: 14px; }
.ppe span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.safety-block { display: flex; flex-direction: column; gap: 4px; }
.safety-block h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.safety-block p { white-space: pre-line; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: 15px; }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.page-thumb { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-weight: 700; }
.page-thumb img { width: 100%; height: 100%; object-fit: cover; }
.page-thumb .del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 18px; cursor: pointer; }
.page-thumb .badge { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 6px; }

/* ---------- Mouvements ---------- */
.mv-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; font: 700 20px/1 var(--f-display); }
.mv-icon.sortie { background: var(--warn-soft); color: var(--warn); }
.mv-icon.entree { background: var(--ok-soft); color: var(--ok); }
.mv-icon.inventaire { background: var(--accent-soft); color: var(--accent); }
.delta { font: 700 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.delta.neg { color: var(--warn); } .delta.pos { color: var(--ok); }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font: 600 13px/1.2 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td input { min-height: 40px; padding: 6px 8px; font-size: 16px; width: 72px; text-align: right; }
@media (max-width: 480px) { th, td { padding: 8px 6px; } td input { width: 58px; } th, th.n { letter-spacing: .03em; white-space: normal; } }

/* ---------- Barre panier ---------- */
.cartbar {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.cartbar .btn { max-width: 728px; margin: 0 auto; display: flex; width: 100%; box-shadow: 0 6px 20px rgba(20, 27, 45, .2); }

/* ---------- Onglets ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 26;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.tabs-inner { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--tabs-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font: 700 12px/1 var(--f-body); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab.scan .scan-dot { width: 48px; height: 48px; margin-top: -18px; border-radius: 14px; background: var(--signal); color: var(--signal-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(20,27,45,.25); }
.tab .badge-n { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--danger); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

/* ---------- Feuille (bottom sheet) ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(10, 14, 25, .5); }
.panel {

const FAMILY_ORDER = ['Sols', 'Sanitaires', 'Surfaces et vitres', 'Désinfection', 'Mains', 'Cuisine et vaisselle', 'Linge', 'Produits spéciaux', 'Insecticides', 'Papier', 'Sacs poubelle', 'Protection', 'Petit matériel', 'Matériel', 'Divers'];

// Interface commune : toast, feuille, onglets
// ---------------------------------------------------------------------
let toastTimer = 0;
function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 5000 : 2800);
}

let sheetCleanup = null;
function openSheet(html, mount) {
  const sheet = $('#sheet');
  $('#sheet-body').innerHTML = html;
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  sheetCleanup = mount ? mount($('#sheet-body')) || null : null;
  const f = $('#sheet-body [autofocus]');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() {
  const sheet = $('#sheet');
  if (sheet.hidden) return;
  sheet.hidden = true;
  document.body.style.overflow = '';
  $('#sheet-body').innerHTML = '';
  if (typeof sheetCleanup === 'function') sheetCleanup();
  sheetCleanup = null;
}
$('#sheet').addEventListener('click', (e) => {
  if (e.target.closest('[data-close-sheet]')) closeSheet();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = label || 'Enregistrement…'; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

function renderChrome() {
  const top = $('#topbar'), tabs = $('#tabs');
  top.hidden = false; tabs.hidden = false;
  const sw = $('#site-switch');
  if (isSecteur()) {
    sw.innerHTML = S.sites.map((s) => `<button type="button" data-site="${s.id}" aria-pressed="${s.id === S.site}">${esc(s.short_name)}</button>`).join('');
    sw.className = 'site-switch';
  } else {
    sw.className = '';
    sw.innerHTML = `<span class="site-label">${esc(siteShort(S.site))}</span>`;
  }
  renderTabs();
}
$('#site-switch').addEventListener('click', (e) => {
  const b = e.target.closest('[data-site]');
  if (!b) return;
  S.site = Number(b.dataset.site);
  S.draftIn = {}; S.draftInRef = '';
  lsSet('stock.site', S.site);
  renderChrome();
  refreshBadges();
  render();
});

async function loadCore() {
  const sb = S.sb;
  const [sites, prods, settings, profs] = await Promise.all([
    sb.from('sites').select('*').order('id'),
    sb.from('products').select('*, stocks(*), safety_sheets(id)').order('code'),
    sb.from('settings').select('*').maybeSingle(),
    sb.from('profiles').select('id, full_name, role, site_id, active'),

  S.sites = sites.data;
  S.settings = settings.data;
  S.profiles = Object.fromEntries(profs.data.map((p) => [p.id, p]));
  setProducts(prods.data);

function setProducts(rows) {
  S.products = rows.map((p) => ({
    ...p,
    stockBy: Object.fromEntries((p.stocks || []).map((s) => [s.site_id, s])),
    sheetCount: (p.safety_sheets || []).length,
  })).sort((a, b) => a.code.localeCompare(b.code));
  S.byCode = Object.fromEntries(S.products.map((p) => [p.code, p]));
  S.byId = Object.fromEntries(S.products.map((p) => [p.id, p]));
}

  if (error) throw error;
  setProducts(data);
}
function applyStock(productId, site, qty) {
  const p = S.byId[productId];
  if (!p) return;
  if (!p.stockBy[site]) p.stockBy[site] = { product_id: productId, site_id: site, quantity: 0, min_quantity: 0, safety_margin: 0, location: '' };
  p.stockBy[site].quantity = Number(qty);
}
async function refreshStocks() {
  const { data, error } = await S.sb.from('stocks').select('*');
  if (error) return;
  for (const s of data) {
    const p = S.byId[s.product_id];
    if (p) p.stockBy[s.site_id] = s;
  }
}

// Récupère toutes les lignes d'une requête (pages de 1 000)
async function fetchAll(build) {
  const out = [];
  for (let from = 0; from < 50000; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function refreshBadges() {
  if (!S.me || !isResp()) return;
  try {
    let q = S.sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'en_attente');
    q = q.eq('site_id', S.site);
    const { count } = await q;
    S.pending = count || 0;
    if (isSecteur()) {
      const r = await S.sb.from('profiles').select('id', { count: 'exact', head: true }).eq('active', false);
      S.pendingUsers = r.count || 0;
    }
    renderTabs();
  } catch { /* hors ligne */ }
}

// Sélecteur de quantité compact, lié à un objet {id: qty}
function bindMiniSteppers(root, store, onChange) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    const wrap = b.closest('.mini-stepper');
    const id = wrap.dataset.id;
    const inp = wrap.querySelector('input');
    let v = parseNum(inp.value);
    if (!Number.isFinite(v)) v = 0;
    v = Math.max(0, round2(v + Number(b.dataset.step)));
    inp.value = v ? fmt(v) : '';
    if (v) store[id] = v; else delete store[id];
    wrap.classList.toggle('on', !!v);
    onChange && onChange();
  });
  root.addEventListener('change', (e) => {
    const inp = e.target.closest('.mini-stepper input');
    if (!inp) return;
    const wrap = inp.closest('.mini-stepper');
    const v = parseNum(inp.value);
    if (Number.isFinite(v) && v > 0) { store[wrap.dataset.id] = round2(v); inp.value = fmt(v); }
    else { delete store[wrap.dataset.id]; inp.value = ''; }
    wrap.classList.toggle('on', !!store[wrap.dataset.id]);
    onChange && onChange();
  });
}
const miniStepper = (id, v) => `<span class="mini-stepper ${v ? 'on' : ''}" data-id="${id}"><button type="button" data-step="-1" aria-label="Moins">−</button><input type="text" inputmode="decimal" value="${v ? fmt(v) : ''}" placeholder="0" aria-label="Quantité"><button type="button" data-step="1" aria-label="Plus">+</button></span>`;

function stepperField(id, value, label) {
  return `<div class="field"><label for="${id}">${esc(label)}</label>
    <div class="stepper" data-stepper="${id}"><button type="button" data-d="-1" aria-label="Moins">−</button><input type="text" inputmode="decimal" id="${id}" value="${fmt(value)}"><button type="button" data-d="1" aria-label="Plus">+</button></div></div>`;
}
function bindStepper(root, id, onChange) {
  const wrap = root.querySelector(`[data-stepper="${id}"]`);
  const inp = wrap.querySelector('input');
  wrap.addEventListener('click', (e) => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    let v = parseNum(inp.value);
    if (!Number.isFinite(v)) v = 0;
    v = Math.max(0, round2(v + Number(b.dataset.d)));
    inp.value = fmt(v);
    onChange && onChange();
  });
  inp.addEventListener('input', () => onChange && onChange());
  inp.addEventListener('focus', () => inp.select());
  return () => parseNum(inp.value);
}

function download(filename, text, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCSV(rows) {
  const cell = (v) => {
    if (typeof v === 'number') return String(v).replace('.', ',');
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
}

function openRequest(r) {
  if (!r) return;

    const p = S.byId[it.product_id];
    const st = p ? Number(stockOf(p, r.site_id).quantity) : 0;
    given[it.id] = Math.min(Number(it.quantity), st);
    return { it, p, st };
  });
  openSheet(`
    <h2 id="sheet-title">Demande de ${esc(personName(r.requested_by))}</h2>
    <p class="muted small">${esc(dfTime.format(new Date(r.created_at)))} · ${esc(siteName(r.site_id))}</p>

      <div class="item">
        <span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit')}</span>

      <button type="button" class="btn danger block" id="rq-refuse-go">Confirmer le refus</button>
    </div>
    <button type="button" class="btn ghost block" id="rq-refuse">Refuser la demande</button>`,
  (root) => {
    bindMiniSteppers(root, given);
    $('#rq-refuse', root).onclick = (e) => { $('#rq-refuse-box', root).hidden = false; e.target.hidden = true; $('#rq-reason', root).focus(); };
    $('#rq-refuse-go', root).onclick = async (e) => {
      busy(e.target, true);
      const { error } = await S.sb.rpc('refuse_request', { p_request: r.id, p_reason: $('#rq-reason', root).value.trim() });

      if (error) return toast(errMsg(error), true);

      const payload = (r.request_items || []).map((it) => ({ item_id: it.id, given: given[it.id] || 0 }));

      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      closeSheet(); toast('Demande validée, stock mis à jour'); refreshBadges(); render();
    };
  });
}

function openCartSheet() {
  const ids = Object.keys(S.cart).filter((id) => S.byId[id]);
  if (!ids.length) return;
  openSheet(`
    <h2 id="sheet-title">Ma demande</h2>

    <button type="button" class="btn primary block" id="cart-go">Envoyer au responsable</button>
    <button type="button" class="btn ghost block" data-close-sheet>Modifier</button>`,
  (root) => {
    $('#cart-go', root).onclick = async (e) => {
      busy(e.target, true, 'Envoi…');
      const items = ids.map((id) => ({ product_id: id, quantity: S.cart[id] }));
      const { error } = await S.sb.rpc('create_request', { p_items: items, p_note: $('#cart-note', root).value.trim() });

      S.cart = {}; saveCart();
      closeSheet(); toast('Demande envoyée');
      go('#/accueil');
    };
  });
}

function codeFromText(t) {
  const s = String(t || '').trim();
  let m = s.match(/#\/p\/([A-Za-z0-9-]+)/);
  if (m) return m[1].toUpperCase();
  m = s.match(/^(?:STOCK:)?([A-Za-z0-9-]{2,20})$/i);
  return m ? m[1].toUpperCase() : null;
}
function openScanned(text) {
  const code = codeFromText(text);
  if (code && S.byCode[code]) { if (navigator.vibrate) navigator.vibrate(60); go(`#/p/${code}`); return true; }
  toast('QR code non reconnu : ce n\'est pas une étiquette de produit.', true);
  return false;
}

async function renderScan(tok) {
  main.innerHTML = `
    <div class="page-head"><h1>Scanner</h1><p class="muted">Visez l'étiquette QR collée sur l'étagère.</p></div>
    <div class="scanner" id="scanner"><video id="scan-video" playsinline muted></video><div class="frame"></div><div class="hint">Recherche d'un QR code…</div></div>
    <div class="notice" id="scan-fallback" hidden></div>
    <div class="grid-2">
      <label class="btn" for="scan-photo">${ICON.camera}Prendre une photo</label>
      <button type="button" class="btn" id="scan-manual">Saisir le code</button>
    </div>
    <input type="file" id="scan-photo" accept="image/*" capture="environment" hidden>
    <p class="small muted">Astuce : l'appareil photo du téléphone lit aussi les étiquettes et ouvre directement la fiche du produit.</p>`;
  $('#scan-photo').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await decodeImageFile(file);
    if (text) openScanned(text); else toast('Aucun QR code lisible sur la photo. Rapprochez-vous et réessayez.', true);
    e.target.value = '';
  };
  $('#scan-manual').onclick = () => pickProduct('Choisir un produit', (p) => go(`#/p/${p.code}`));

  const video = $('#scan-video');
  const fail = (msg) => {
    if (stale(tok)) return;
    $('#scanner').hidden = true;
    const fb = $('#scan-fallback');
    fb.hidden = false;
    fb.textContent = msg;
  };
  if (!navigator.mediaDevices?.getUserMedia) return fail('La caméra en direct n\'est pas disponible sur ce navigateur. Utilisez « Prendre une photo ».');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    if (stale(tok)) { stream.getTracks().forEach((t) => t.stop()); return; }
    S.stream = stream;
    video.srcObject = stream;
    await video.play();
  } catch {
    return fail('Accès à la caméra refusé. Autorisez la caméra pour ce site dans les réglages du navigateur, ou utilisez « Prendre une photo ».');
  }
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let last = 0;
  const loop = (t) => {
    if (stale(tok) || !S.stream) return;
    S.scanRAF = requestAnimationFrame(loop);
    if (t - last < 180 || video.readyState < 2) return;
    last = t;
    const w = 480, h = Math.round((video.videoHeight / video.videoWidth) * w) || 640;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const res = window.jsQR && window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (res && res.data) {
      const code = codeFromText(res.data);
      if (code && S.byCode[code]) { stopCamera(); openScanned(res.data); }
    }
  };
  S.scanRAF = requestAnimationFrame(loop);
}

async function loadImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file); } catch { /* repli */ }
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = reject;
    img.src = url;
  });
}
async function decodeImageFile(file) {
  try {
    const img = await loadImage(file);
    const W = img.width, H = img.height;
    for (const max of [1000, 1600, 700]) {
      const k = Math.min(1, max / Math.max(W, H));
      const w = Math.round(W * k), h = Math.round(H * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) return r.data;
    }
  } catch { /* image illisible */ }
  return null;
}

async function compressImage(file) {
  if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
  try {
    const img = await loadImage(file);
    const k = Math.min(1, 1800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch { return file; }
}
async function uploadSheets(p, files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  toast(`Envoi de ${list.length} fichier${list.length > 1 ? 's' : ''}…`);
  const { data: existing } = await S.sb.from('safety_sheets').select('page').eq('product_id', p.id);
  let page = Math.max(0, ...(existing || []).map((x) => x.page));
  try {
    for (const f of list) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (isPdf && f.size > 15 * 1024 * 1024) throw new Error('PDF trop lourd (15 Mo maximum).');
      const body = isPdf ? f : await compressImage(f);
      const path = `${p.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${isPdf ? 'pdf' : 'jpg'}`;
      const up = await S.sb.storage.from('fiches-securite').upload(path, body, { contentType: isPdf ? 'application/pdf' : 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      page += 1;
      const ins = await S.sb.from('safety_sheets').insert({ product_id: p.id, file_path: path, file_name: f.name || '', page, uploaded_by: S.me.id });
      if (ins.error) throw ins.error;
      p.sheetCount += 1;
    }
    toast('Fiche de sécurité ajoutée');
  } catch (e) {
    toast(errMsg(e), true);
  }
  render();
}

    <div class="field"><label for="mv-note" id="mv-note-l">Note (facultatif)</label><input type="text" id="mv-note" autocomplete="off"></div>
    <button type="button" class="btn primary block" id="mv-go">Enregistrer</button>`,
  (root) => {
    let getQty = () => 0;
    const preview = () => {
      const v = getQty();
      const b = st();
      const after = k === 'entree' ? b + (v || 0) : k === 'sortie' ? b - (v || 0) : (v || 0);
      const el = $('#mv-preview', root);
      if (k === 'sortie' && after < 0) { el.className = 'notice danger'; el.textContent = `Stock insuffisant : il reste ${fmt(b)}.`; }
      else { el.className = 'notice info'; el.innerHTML = `Stock : <strong class="num">${fmt(b)}</strong> → <strong class="num">${fmt(round2(after))}</strong>${k === 'inventaire' ? ` (écart ${after - b > 0 ? '+' : ''}${fmt(round2(after - b))})` : ''}`; }
    };
    const setKind = (nk) => {
      k = nk;
      $$('#mv-kind button', root).forEach((b) => b.setAttribute('aria-pressed', b.dataset.kind === k));
      $('#mv-q-wrap', root).innerHTML = stepperField('mv-q', k === 'inventaire' ? st() : 1, k === 'inventaire' ? 'Quantité comptée en réserve' : 'Quantité');
      getQty = bindStepper(root, 'mv-q', preview);
      $('#mv-ref-wrap', root).hidden = k !== 'entree';
      $('#mv-price-wrap', root).hidden = k !== 'entree';
      $('#mv-note-l', root).textContent = k === 'sortie' ? 'Pour qui ou pour quel endroit ? (facultatif)' : 'Note (facultatif)';
      $('#mv-go', root).textContent = { sortie: 'Enregistrer la sortie', entree: 'Enregistrer l\'entrée', inventaire: 'Enregistrer le comptage' }[k];
      preview();
    };
    $('#mv-kind', root).onclick = (e) => { const b = e.target.closest('[data-kind]'); if (b) setKind(b.dataset.kind); };
    setKind(k);
    $('#mv-go', root).onclick = async (e) => {
      const v = getQty();
      if (!Number.isFinite(v) || v < 0 || (k !== 'inventaire' && v === 0)) return toast('Indiquez une quantité valide.', true);
      const args = {
        p_site: site, p_product: p.id, p_kind: k, p_qty: round2(v),
        p_reference: k === 'entree' ? $('#mv-ref', root).value.trim() : '',
        p_note: $('#mv-note', root).value.trim(),
      };
      if (k === 'entree') {
        const raw = $('#mv-price', root).value.trim();
        if (raw) {
          const pr = parseNum(raw);
          if (!Number.isFinite(pr) || pr < 0) return toast('Prix invalide.', true);
          args.p_unit_price = round2(pr);
        }
      }
      busy(e.target, true);
      const { data, error } = await S.sb.rpc('record_movement', args);
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      applyStock(p.id, site, data.stock_after);
      if (args.p_unit_price != null) p.unit_price = args.p_unit_price;
      closeSheet();
      toast(`${kindLabel[k]} enregistrée · reste ${fmt(data.stock_after)}`);
      render();
    };
  });
}

function openStockSettings(p) {

    <div class="field"><label for="ss-margin">Marge de sécurité pour les commandes</label><input type="text" inputmode="decimal" id="ss-margin" value="${fmt(st.safety_margin)}"><span class="hint">Quantité ajoutée à la proposition de commande.</span></div>
    <div class="field"><label for="ss-loc">Emplacement en réserve</label><input type="text" id="ss-loc" value="${esc(st.location)}" placeholder="Ex. : étagère B, 2e niveau"></div>

      if (!(min >= 0) || !(mar >= 0)) return toast('Valeurs invalides.', true);

      Object.assign(p.stockBy[site] || (p.stockBy[site] = { quantity: 0 }), upd);

async function renderRequests(tok) {
  const [pending, done] = await Promise.all([
    S.sb.from('requests').select('*, request_items(*)').eq('site_id', S.site).eq('status', 'en_attente').order('created_at'),
    S.sb.from('requests').select('*, request_items(*)').eq('site_id', S.site).neq('status', 'en_attente').order('created_at', { ascending: false }).limit(30),
  ]);
  if (pending.error) throw pending.error;
  if (done.error) throw done.error;
  await refreshStocks();
  if (stale(tok)) return;
  S.pending = pending.data.length; renderTabs();
  const stLabel = { validee: ['ok', 'Remise'], refusee: ['danger', 'Refusée'], annulee: ['', 'Annulée'] };
  main.innerHTML = `
    ${backLink('#/accueil', 'Accueil')}

    <section class="section"><h2>En attente</h2>
      ${pending.data.length ? `<div class="list">${pending.data.map(requestItem).join('')}</div>` : '<div class="empty">Aucune demande en attente.</div>'}
    </section>
    <section class="section"><h2>Traitées récemment</h2>
      ${done.data.length ? `<div class="list">${done.data.map((r) => {
        const [cls, lab] = stLabel[r.status];

        return `<div class="item"><span class="main-txt"><span class="title">${esc(personName(r.requested_by))}</span><span class="sub">${esc(items)}</span>
          <span class="sub">${esc(dfTime.format(new Date(r.created_at)))}${r.handled_by ? ' · traitée par ' + esc(personName(r.handled_by)) : ''}${r.refuse_reason ? ' · ' + esc(r.refuse_reason) : ''}</span></span>

async function renderDelivery() {
  if (!canManage()) { main.innerHTML = '<div class="empty">Seul le responsable de ce site peut enregistrer une livraison.</div>'; return; }
  const draft = S.draftIn;
  let q = '';
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}
    <div class="page-head"><h1>Entrée de stock</h1><p class="muted">Livraison Adelya · ${esc(siteName(S.site))}. Saisissez les quantités reçues, puis enregistrez.</p></div>
    <div class="field"><label for="in-ref">N° de bon de livraison</label><input type="text" id="in-ref" value="${esc(S.draftInRef)}" autocomplete="off" placeholder="Facultatif"></div>
    ${searchBox('in-q', '', 'Rechercher un produit')}
    <div id="in-list"></div>
    <div class="cartbar" id="in-bar" hidden><button type="button" class="btn primary" id="in-go"></button></div>`;
  const draw = () => {
    const list = activeProducts().filter((p) => matches(p, q));
    $('#in-list').innerHTML = `<div class="list">${groupByFamily(list).map(([fam, ps]) => `<div class="group-label">${esc(fam)}</div>${ps.map((p) => `
      <div class="item"><span class="main-txt"><span class="title">${esc(p.name)}</span><span class="sub">${esc(p.packaging)} · en stock ${fmt(stockOf(p).quantity)}</span></span>${miniStepper(p.id, draft[p.id])}</div>`).join('')}`).join('')}</div>`;
  };
  const bar = () => {
    const n = Object.keys(draft).length;
    $('#in-bar').hidden = !n;
    $('#in-go').textContent = `Enregistrer la livraison · ${n} ligne${n > 1 ? 's' : ''}`;
  };
  draw(); bar();
  bindMiniSteppers($('#in-list'), draft, bar);
  $('#in-q').oninput = (e) => { q = e.target.value; draw(); };
  $('#in-ref').oninput = (e) => { S.draftInRef = e.target.value; };
  $('#in-go').onclick = () => {
    const ids = Object.keys(draft).filter((id) => S.byId[id]);
    const prices = {};
    for (const id of ids) if (S.byId[id].unit_price != null) prices[id] = Number(S.byId[id].unit_price);
    openSheet(`<h2 id="sheet-title">Confirmer la livraison</h2>
      <p class="muted small">${esc(siteName(S.site))}${S.draftInRef ? ' · BL ' + esc(S.draftInRef) : ''}</p>
      <p class="small muted">Indiquez le prix unitaire HT de la facture. Il est prérempli avec le dernier prix connu.</p>
      <div class="list">${ids.map((id) => `<div class="item"><span class="main-txt"><span class="title">${esc(S.byId[id].name)}</span><span class="sub">+${fmt(draft[id])} · ${esc(S.byId[id].packaging)}</span><span class="sub" data-line="${id}"></span></span>
        <span class="qty"><input type="text" inputmode="decimal" class="price-in" data-price="${id}" value="${prices[id] != null ? fmt(prices[id]) : ''}" placeholder="€ HT" aria-label="Prix unitaire HT de ${esc(S.byId[id].name)}"></span></div>`).join('')}</div>
      <div class="notice info" id="in-total"></div>
      <button type="button" class="btn primary block" id="in-ok">Enregistrer l'entrée</button>
      <button type="button" class="btn ghost block" data-close-sheet>Modifier</button>`,
    (root) => {
      const total = () => {
        let t = 0, missing = 0;
        for (const id of ids) {
          const el = $(`[data-line="${id}"]`, root);
          if (prices[id] != null) { const a = prices[id] * draft[id]; t += a; el.textContent = `= ${money(a)} HT`; } else { missing += 1; el.textContent = 'Prix non renseigné'; }
        }
        $('#in-total', root).innerHTML = `Total de la livraison : <strong>${money(t)} HT</strong>${missing ? ` · ${missing} ligne${missing > 1 ? 's' : ''} sans prix` : ''}`;
      };
      root.addEventListener('input', (e) => {
        const inp = e.target.closest('[data-price]');
        if (!inp) return;
        const v = parseNum(inp.value);
        if (inp.value.trim() !== '' && Number.isFinite(v) && v >= 0) prices[inp.dataset.price] = round2(v); else delete prices[inp.dataset.price];
        total();
      });
      total();
      $('#in-ok', root).onclick = async (e) => {
        busy(e.target, true);
        const lines = ids.map((id) => (prices[id] != null ? { product_id: id, quantity: draft[id], unit_price: prices[id] } : { product_id: id, quantity: draft[id] }));
        const { error } = await S.sb.rpc('record_movements', { p_site: S.site, p_kind: 'entree', p_lines: lines, p_reference: S.draftInRef.trim(), p_note: 'Livraison' });
        busy(e.target, false);
        if (error) return toast(errMsg(error), true);
        for (const id of ids) if (prices[id] != null) S.byId[id].unit_price = prices[id];
        for (const k of Object.keys(draft)) delete draft[k];
        S.draftInRef = '';
        await refreshStocks();
        closeSheet(); toast(`Livraison enregistrée · ${lines.length} produit${lines.length > 1 ? 's' : ''}`);
        go('#/accueil');
      };
    });
  };
}

  let fam = 'Tout';
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}

    <p class="muted">Comptez ce qui est réellement en réserve et saisissez le chiffre. Laissez vide ce que vous n'avez pas compté. Votre saisie est gardée sur ce téléphone jusqu'à la validation.</p></div>
    ${famChips('inv-fam', fam)}
    <div class="table-wrap"><table><thead><tr><th>Produit</th><th class="n">Stock</th><th class="n">Compté</th><th class="n">Écart</th></tr></thead><tbody id="inv-body"></tbody></table></div>

      const c = counts[p.id];
      const d = c != null ? round2(c - th) : null;
      return `<tr><td><strong>${esc(p.name)}</strong><br><span class="small muted">${esc(p.packaging)}</span></td>
        <td class="n">${fmt(th)}</td>
        <td class="n"><input type="text" inputmode="decimal" data-inv="${p.id}" value="${c != null ? fmt(c) : ''}" aria-label="Quantité comptée pour ${esc(p.name)}"></td>
        <td class="n" data-gap="${p.id}">${d == null ? '' : `<span class="delta ${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}">${d > 0 ? '+' : ''}${fmt(d)}</span>`}</td></tr>`;
    }).join('')}`).join('');
  };
  const bar = () => {
    const n = Object.keys(counts).length;
    $('#inv-bar').hidden = !n;
    $('#inv-go').textContent = `Valider l'inventaire · ${n} produit${n > 1 ? 's' : ''} compté${n > 1 ? 's' : ''}`;
  };
  draw(); bar();
  $('#inv-body').addEventListener('change', (e) => {
    const inp = e.target.closest('[data-inv]');
    if (!inp) return;
    const id = inp.dataset.inv;
    const v = parseNum(inp.value);
    if (inp.value.trim() === '' || !Number.isFinite(v) || v < 0) { delete counts[id]; inp.value = ''; }
    else { counts[id] = round2(v); inp.value = fmt(v); }
    lsSet(key, counts);
    const th = Number(stockOf(S.byId[id]).quantity);
    const cell = $(`[data-gap="${id}"]`);
    const d = counts[id] != null ? round2(counts[id] - th) : null;
    cell.innerHTML = d == null ? '' : `<span class="delta ${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}">${d > 0 ? '+' : ''}${fmt(d)}</span>`;
    bar();
  });
  $('#inv-fam').onclick = (e) => {
    const b = e.target.closest('[data-fam]');
    if (!b) return;
    fam = b.dataset.fam;
    $$('#inv-fam .chip-btn').forEach((x) => x.setAttribute('aria-pressed', x === b));
    draw();
  };
  $('#inv-go').onclick = () => {
    const ids = Object.keys(counts).filter((id) => S.byId[id]);
    const gaps = ids.map((id) => ({ id, d: round2(counts[id] - Number(stockOf(S.byId[id]).quantity)) }));
    const withGap = gaps.filter((g) => g.d !== 0);
    openSheet(`<h2 id="sheet-title">Valider l'inventaire</h2>
      <p>${ids.length} produit${ids.length > 1 ? 's' : ''} compté${ids.length > 1 ? 's' : ''}, dont <strong>${withGap.length}</strong> avec un écart.</p>
      ${withGap.length ? `<div class="list">${withGap.map((g) => `<div class="item"><span class="main-txt"><span class="title">${esc(S.byId[g.id].name)}</span><span class="sub">théorique ${fmt(stockOf(S.byId[g.id]).quantity)} · compté ${fmt(counts[g.id])}</span></span><span class="qty"><span class="delta ${g.d < 0 ? 'neg' : 'pos'}">${g.d > 0 ? '+' : ''}${fmt(g.d)}</span></span></div>`).join('')}</div>` : ''}
      <p class="small muted">Le stock de chaque produit compté sera remplacé par la quantité comptée. Les écarts restent visibles dans l'historique.</p>
      <button type="button" class="btn primary block" id="inv-ok">Valider</button>
      <button type="button" class="btn ghost block" data-close-sheet>Continuer à compter</button>`,
    (root) => {
      $('#inv-ok', root).onclick = async (e) => {
        busy(e.target, true);
        const lines = ids.map((id) => ({ product_id: id, quantity: counts[id] }));
        const { error } = await S.sb.rpc('record_movements', { p_site: S.site, p_kind: 'inventaire', p_lines: lines, p_reference: '', p_note: 'Inventaire' });
        busy(e.target, false);
        if (error) return toast(errMsg(error), true);
        lsDel(key);
        await refreshStocks();
        closeSheet(); toast('Inventaire enregistré');
        go('#/stock');
      };
    });
  };
}

async function fetchMovements(site, fromDate, toDate) {
  return fetchAll(() => {
    let q = S.sb.from('movements').select('*').order('created_at', { ascending: false });
    if (site) q = q.eq('site_id', site);
    if (fromDate) q = q.gte('created_at', fromDate.toISOString());
    if (toDate) q = q.lt('created_at', toDate.toISOString());
    return q;
  });
}

  let data = [];
  const filtered = () => data.filter((m) => (f.histKind === 'tout' || m.kind === f.histKind) && (!f.histQ || (() => {
    const p = S.byId[m.product_id];
    const hay = `${p?.name || ''} ${p?.code || ''} ${personName(m.user_id)} ${m.note} ${m.reference}`.toLowerCase();
    return f.histQ.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  })()));
  const draw = () => {
    const list = filtered();
    const outs = list.filter((m) => m.kind === 'sortie').length, ins = list.filter((m) => m.kind === 'entree').length;
    const spent = list.reduce((a, m) => a + lineAmount(m), 0);
    $('#h-sum').textContent = `${f.histYear ? `Année ${f.histYear} · ` : ''}${list.length} mouvement${list.length > 1 ? 's' : ''} · ${outs} sortie${outs > 1 ? 's' : ''} · ${ins} entrée${ins > 1 ? 's' : ''}${spent ? ` · achats ${money(spent)} HT` : ''}`;
    const byDay = new Map();
    for (const m of list.slice(0, 400)) {
      const k = cap(dfDay.format(new Date(m.created_at)));
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(m);
    }
    $('#h-list').innerHTML = list.length ? `<div class="list">${[...byDay.entries()].map(([d, ms]) => `<div class="group-label">${esc(d)}</div>${ms.map((m) => movementItem(m)).join('')}`).join('')}</div>${list.length > 400 ? '<p class="small muted">Les 400 premiers sont affichés. L\'export contient tout.</p>' : ''}`
      : '<div class="empty">Aucun mouvement sur cette période.</div>';
  };
  const load = async () => {
    $('#h-sum').textContent = 'Chargement…';
    const [since, until] = f.histYear ? yearBounds(f.histYear) : [new Date(Date.now() - f.histPeriod * DAY), null];
    const rows = await fetchMovements(S.site, since, until);
    if (stale(tok)) return;
    data = rows;
    draw();
  };
  $('#h-period').onclick = (e) => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    f.histPeriod = Number(b.dataset.d);
    f.histYear = null;
    $('#h-year').value = '';
    $$('#h-period button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    load().catch((err) => toast(errMsg(err), true));
  };
  $('#h-kind').onclick = (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    f.histKind = b.dataset.k;
    $$('#h-kind .chip-btn').forEach((x) => x.setAttribute('aria-pressed', x === b));
    draw();
  };
  $('#h-q').oninput = (e) => { f.histQ = e.target.value; draw(); };
  $('#h-year').onchange = (e) => {
    f.histYear = e.target.value ? Number(e.target.value) : null;
    $$('#h-period button').forEach((x) => x.setAttribute('aria-pressed', !f.histYear && Number(x.dataset.d) === f.histPeriod));
    load().catch((err) => toast(errMsg(err), true));
  };
  $('#h-csv').onclick = () => {
    const list = filtered();
    if (!list.length) return toast('Rien à exporter.', true);
    download(`mouvements-${siteShort(S.site).toLowerCase()}-${f.histYear || isoDate(new Date())}.csv`, movementsCSV(list));
  };
  await load();
}

const dbUpToDate = () => !!S.settings && Object.prototype.hasOwnProperty.call(S.settings, 'last_backup');
function backupAgeDays() {
  if (!S.settings || !S.settings.last_backup) return null;
  return Math.floor((Date.now() - new Date(S.settings.last_backup)) / DAY);
}
function backupLabel() {
  if (!dbUpToDate()) return 'Mise à jour de la base nécessaire';
  const d = backupAgeDays();
  if (d == null) return 'Aucune sauvegarde pour l\'instant';
  return d === 0 ? 'Dernière sauvegarde aujourd\'hui' : `Dernière sauvegarde il y a ${d} jour${d > 1 ? 's' : ''}`;
}
function homeSecteurNotices() {
  if (!dbUpToDate()) return `<div class="notice danger" style="display:block">La base de données doit être mise à jour pour le budget et la sauvegarde : lancez le script « 3-budget-sauvegarde » dans Supabase.</div>`;
  const d = backupAgeDays();
  if (d == null || d >= 30) return `<a class="notice" href="#/sauvegarde" style="text-decoration:none">${ICON.save.replace('<svg', '<svg width="22" height="22"')}<span>${d == null ? 'Aucune sauvegarde de la base pour l\'instant.' : `Dernière sauvegarde il y a ${d} jours.`} Touchez ici pour en faire une.</span></a>`;
  return '';
}
async function fetchEntries(site, from, to) {
  return fetchAll(() => {
    let q = S.sb.from('movements').select('*').eq('kind', 'entree').order('created_at');
    if (site) q = q.eq('site_id', site);
    if (from) q = q.gte('created_at', from.toISOString());
    if (to) q = q.lt('created_at', to.toISOString());
    return q;
  });
}
async function drawHomeBudget(site, tok) {
  if (!dbUpToDate()) return;
  try {
    const y = new Date().getFullYear();
    const [from, to] = yearBounds(y);
    const [b, entries] = await Promise.all([
      S.sb.from('budgets').select('*').eq('site_id', site).eq('year', y).maybeSingle(),
      fetchEntries(site, from, to),
    ]);
    if (stale(tok)) return;
    const box = $('#home-budget');
    if (!box) return;
    const budget = b.data ? Number(b.data.amount) : 0;
    const spent = entries.reduce((a, m) => a + lineAmount(m), 0);
    const pct = budget ? spent / budget * 100 : 0;
    const cls = pct >= 100 ? 'rupture' : pct >= 90 ? 'bas' : '';
    box.innerHTML = `<a class="card stack" href="#/budget" style="text-decoration:none;color:inherit">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Budget ${y} · ${esc(siteShort(site))}</span>${budget ? `<span class="pill ${cls ? (pct >= 100 ? 'danger' : 'warn') : 'ok'}">${fmt(Math.round(pct))} %</span>` : '<span class="pill">À définir</span>'}</div>
      <div class="row" style="align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font:700 30px/1 var(--f-display)" class="num">${money(spent)}</span><span class="muted small">${budget ? `dépensés sur ${money(budget)} HT` : 'dépensés HT · aucun budget fixé'}</span></div>
      ${budget ? `<div class="meter ${cls}"><span style="width:${Math.min(100, Math.max(2, pct))}%"></span></div>` : ''}
    </a>`;
  } catch { /* budget indisponible */ }
}

function budgetChart(monthly, budget) {
  const W = 340, H = 210, L = 44, R = 10, T = 14, B = 26;
  const cum = []; let c = 0;
  for (const v of monthly) { c += v; cum.push(c); }
  const max = Math.max(budget || 0, c, ...monthly, 1) * 1.08;
  const x = (i) => L + (i + 0.5) * ((W - L - R) / 12);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - R) / 12 * 0.56;
  const step = (() => { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; })();
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  const months = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const short = (v) => (v >= 1000 ? `${fmt(round2(v / 1000))} k` : fmt(Math.round(v)));
  const line = cum.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dépenses mensuelles et cumul face au budget" style="display:block;max-width:100%">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${short(v)}</text>`).join('')}
    ${monthly.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y(0) - y(v)).toFixed(1)}" rx="2" fill="var(--accent)" fill-opacity="0.35"/><text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${months[i]}</text>`).join('')}
    ${budget ? `<line x1="${L}" x2="${W - R}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(budget) - 5}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--danger)">Budget ${short(budget)} €</text>` : ''}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round"/>
    ${cum.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="var(--accent)"/>`).join('')}
  </svg>`;
}

async function renderBudget(tok) {
  if (!dbUpToDate()) {
    main.innerHTML = `${backLink('#/plus', 'Plus')}<div class="page-head"><h1>Budget</h1></div><div class="notice danger" style="display:block">La base de données doit d'abord être mise à jour : lancez le script « 3-budget-sauvegarde » dans Supabase, puis rechargez l'application.</div>`;
    return;
  }
  const years = yearsList(1);
  const year = S.budgetYear && years.includes(S.budgetYear) ? S.budgetYear : new Date().getFullYear();
  const site = S.site;
  const [from, to] = yearBounds(year);
  const [prevFrom, prevTo] = yearBounds(year - 1);
  const [bud, entriesAll, prevAll] = await Promise.all([
    S.sb.from('budgets').select('*').eq('year', year),
    fetchEntries(null, from, to),
    fetchEntries(null, prevFrom, prevTo),
  ]);
  if (bud.error) throw bud.error;
  if (stale(tok)) return;
  const budgetOf = (s) => Number((bud.data.find((b) => b.site_id === s) || {}).amount || 0);
  const entries = entriesAll.filter((m) => m.site_id === site);
  const spentOf = (list, s) => list.filter((m) => m.site_id === s).reduce((a, m) => a + lineAmount(m), 0);
  const spent = spentOf(entriesAll, site);
  const budget = budgetOf(site);
  const prevSpent = spentOf(prevAll, site);
  const monthly = Array(12).fill(0);
  for (const m of entries) monthly[new Date(m.created_at).getMonth()] += lineAmount(m);
  const now = new Date();
  const elapsed = year === now.getFullYear() ? (now - from) / (to - from) : year < now.getFullYear() ? 1 : 0;
  const projection = elapsed > 0.08 && elapsed < 1 ? spent / elapsed : null;
  const pct = budget ? spent / budget * 100 : 0;
  const cls = pct >= 100 ? 'rupture' : pct >= 90 ? 'bas' : '';
  const byFam = {}, byProd = {};
  for (const m of entries) {
    const p = S.byId[m.product_id];
    const a = lineAmount(m);
    if (!a) continue;
    const fam = p ? p.family : 'Autre';
    byFam[fam] = (byFam[fam] || 0) + a;
    byProd[m.product_id] = (byProd[m.product_id] || 0) + a;
  }
  const famRows = Object.entries(byFam).sort((a, b) => b[1] - a[1]);
  const prodRows = Object.entries(byProd).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const noPrice = entries.filter((m) => m.unit_price == null).reverse();

  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}
    <div class="page-head"><div class="row"><h1>Budget · ${esc(siteShort(site))}</h1>
      <select id="bu-year" aria-label="Année" style="width:auto;min-height:40px">${years.map((y) => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
      <p class="muted">Achats HT enregistrés à la livraison, du 1er janvier au 31 décembre ${year}. Changez de site avec les boutons en haut.</p></div>

    <div class="card stack">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Dépensé en ${year}</span>${budget ? `<span class="pill ${pct >= 100 ? 'danger' : pct >= 90 ? 'warn' : 'ok'}">${fmt(Math.round(pct))} % du budget</span>` : ''}</div>
      <div style="font:700 44px/1 var(--f-display)" class="num">${money(spent)}</div>
      ${budget ? `<div class="meter ${cls}"><span style="width:${Math.min(100, Math.max(2, pct))}%"></span></div>` : ''}
      <div class="facts">
        <div class="fact"><div class="v">${budget ? money(budget) : '—'}</div><div class="k">Budget ${year}</div></div>
        <div class="fact"><div class="v" style="${budget && budget - spent < 0 ? 'color:var(--danger)' : ''}">${budget ? money(budget - spent) : '—'}</div><div class="k">Reste disponible</div></div>
        <div class="fact"><div class="v">${projection ? money(projection) : '—'}</div><div class="k">Projection fin d'année</div></div>
      </div>
      <p class="small muted">En ${year - 1} : ${money(prevSpent)} HT${prevSpent && spent ? ` · ${spent >= prevSpent ? '+' : ''}${fmt(Math.round((spent - prevSpent) / prevSpent * 100))} %` : ''}</p>
      <div class="row" style="gap:8px;align-items:flex-end">
        <div class="field grow"><label for="bu-amount">Budget ${year} pour ${esc(siteShort(site))} (€ HT)</label><input type="text" inputmode="decimal" id="bu-amount" value="${budget ? fmt(budget) : ''}" placeholder="Ex. : 8 000"></div>
        <button type="button" class="btn" id="bu-save">Enregistrer</button>
      </div>
    </div>

    <section class="section"><h2>Mois par mois</h2>
      <div class="card">${budgetChart(monthly, budget)}
        <p class="small muted" style="margin-top:6px">Barres : achats du mois. Courbe : cumul depuis le 1er janvier.${budget ? ' Pointillés : budget annuel.' : ''}</p></div>
    </section>

    ${noPrice.length ? `<section class="section" id="bu-noprice"><h2>Livraisons sans prix</h2>
      <p class="small muted">${noPrice.length > 1 ? `${noPrice.length} livraisons ne sont pas comptées` : '1 livraison n\'est pas comptée'} dans le budget. Saisissez le prix unitaire HT, puis « OK ».</p>
      <div class="list">${noPrice.slice(0, 30).map((m) => { const p = S.byId[m.product_id]; return `<div class="item"><span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit')}</span><span class="sub">${esc(dfShort.format(new Date(m.created_at)))} · +${fmt(m.quantity)} · ${esc(p ? p.packaging : '')}</span></span>
        <span class="qty" style="flex-direction:row;align-items:center;gap:6px"><input type="text" inputmode="decimal" class="price-in" data-mvp="${m.id}" value="${p && p.unit_price != null ? fmt(p.unit_price) : ''}" placeholder="€ HT"><button type="button" class="btn small" data-mvok="${m.id}">OK</button></span></div>`; }).join('')}</div>
    </section>` : ''}

    <section class="section"><h2>Par famille</h2>
      ${famRows.length ? `<div class="table-wrap"><table><thead><tr><th>Famille</th><th class="n">Montant HT</th><th class="n">Part</th></tr></thead><tbody>
        ${famRows.map(([f, a]) => `<tr><td>${esc(f)}</td><td class="n">${money(a)}</td><td class="n">${fmt(Math.round(a / spent * 100))} %</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Aucun achat avec prix sur cette année.</div>'}
    </section>

    ${prodRows.length ? `<section class="section"><h2>Les 10 plus gros postes</h2><div class="list">${prodRows.map(([id, a]) => { const p = S.byId[id]; return `<a class="item" href="#/p/${esc(p ? p.code : '')}"><span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit')}</span><span class="sub">${esc(p ? p.family : '')}</span></span><span class="qty"><span class="n" style="font-size:20px">${money(a)}</span></span></a>`; }).join('')}</div></section>` : ''}

    <section class="section"><h2>Les deux sites</h2>
      <div class="table-wrap"><table><thead><tr><th>Site</th><th class="n">Budget</th><th class="n">Dépensé</th><th class="n">Reste</th></tr></thead><tbody>
        ${S.sites.map((s) => { const bb = budgetOf(s.id), sp = spentOf(entriesAll, s.id); return `<tr><td>${esc(s.short_name)}</td><td class="n">${bb ? money(bb) : '—'}</td><td class="n">${money(sp)}</td><td class="n">${bb ? money(bb - sp) : '—'}</td></tr>`; }).join('')}
        <tr><td><strong>Secteur</strong></td><td class="n"><strong>${money(S.sites.reduce((a, s) => a + budgetOf(s.id), 0))}</strong></td><td class="n"><strong>${money(entriesAll.reduce((a, m) => a + lineAmount(m), 0))}</strong></td><td class="n"><strong>${money(S.sites.reduce((a, s) => a + budgetOf(s.id) - spentOf(entriesAll, s.id), 0))}</strong></td></tr>
      </tbody></table></div>
      <button type="button" class="btn" id="bu-csv">${ICON.download}Exporter les achats ${year}</button>
    </section>`;

  $('#bu-year').onchange = (e) => { S.budgetYear = Number(e.target.value); render(); };
  $('#bu-save').onclick = async (e) => {
    const raw = $('#bu-amount').value.trim();
    const v = raw ? parseNum(raw) : 0;
    if (!Number.isFinite(v) || v < 0) return toast('Montant invalide.', true);
    busy(e.target, true);
    const { error } = await S.sb.from('budgets').upsert({ site_id: site, year, amount: round2(v), updated_at: new Date().toISOString() }, { onConflict: 'site_id,year' });
    busy(e.target, false);
    if (error) return toast(errMsg(error), true);
    toast('Budget enregistré');
    render();
  };
  const np = $('#bu-noprice');
  if (np) np.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-mvok]');
    if (!b) return;
    const inp = $(`[data-mvp="${b.dataset.mvok}"]`);
    const v = parseNum(inp.value);
    if (!Number.isFinite(v) || v < 0) return toast('Prix invalide.', true);
    busy(b, true, '…');
    const { error } = await S.sb.rpc('set_movement_price', { p_movement: b.dataset.mvok, p_unit_price: round2(v) });
    if (error) { busy(b, false); return toast(errMsg(error), true); }
    toast('Prix enregistré');
    render();
  });
  $('#bu-csv').onclick = () => {
    const rows = [['Date', 'Site', 'Code', 'Famille', 'Produit', 'Conditionnement', 'Quantité', 'Prix unitaire HT', 'Montant HT', 'Bon de livraison']];
    for (const m of entriesAll) {
      const p = S.byId[m.product_id] || {};
      rows.push([dfShort.format(new Date(m.created_at)), siteShort(m.site_id), p.code || '', p.family || '', p.name || '', p.packaging || '', Number(m.quantity),
        m.unit_price != null ? Number(m.unit_price) : '', m.unit_price != null ? round2(lineAmount(m)) : '', m.reference]);
    }
    download(`achats-secteur-${year}.csv`, toCSV(rows));
  };

async function collectBackup() {
  const all = (t, col) => fetchAll(() => S.sb.from(t).select('*').order(col));
  const [products, stocks, movements, requests, items, budgets, sheets, profiles, settings] = await Promise.all([
    all('products', 'code'), all('stocks', 'product_id'), all('movements', 'created_at'), all('requests', 'created_at'),
    all('request_items', 'id'), all('budgets', 'year'), all('safety_sheets', 'created_at'), all('profiles', 'created_at'),
    S.sb.from('settings').select('*').maybeSingle(),
  ]);
  return {
    app: 'stock-entretien', version: 1, created_at: new Date().toISOString(), by: S.me.full_name,
    sites: S.sites, settings: settings.data || null,
    products, stocks, movements, requests, request_items: items, budgets, safety_sheets: sheets,
    profiles: profiles.map((p) => ({ id: p.id, full_name: p.full_name, role: p.role, site_id: p.site_id })),
  };
}
async function markBackup() {
  const at = new Date().toISOString();
  const { error } = await S.sb.from('settings').update({ last_backup: at }).eq('id', 1);
  if (!error && S.settings) S.settings.last_backup = at;
}

function appBaseUrl() { return location.href.split('#')[0].split('?')[0].replace(/index\.html$/, ''); }
function qrSvg(text) {
  const qr = window.qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

async function computeOrder(site, nextOrder, followingOrder) {
  const since = new Date(Date.now() - 180 * DAY);
  const mv = await fetchMovements(site, since);
  const first = await S.sb.from('movements').select('created_at').eq('site_id', site).order('created_at').limit(1);
  const start = first.data && first.data[0] ? new Date(Math.max(since.getTime(), new Date(first.data[0].created_at).getTime())) : null;
  const days = start ? Math.max(14, (Date.now() - start) / DAY) : 0;
  const months = Math.max(0, (followingOrder - new Date()) / DAY / 30.44);
  const out = {};
  for (const m of mv) if (m.kind === 'sortie') out[m.product_id] = (out[m.product_id] || 0) + Number(m.quantity);
  const lines = activeProducts().map((p) => {
    const st = stockOf(p, site);
    const monthly = days ? (out[p.id] || 0) / days * 30.44 : 0;
    const need = monthly * months + Number(st.safety_margin) - Number(st.quantity);
    return { p, monthly, stock: Number(st.quantity), margin: Number(st.safety_margin), proposed: Math.max(0, Math.ceil(need - 1e-9)) };
  });
  return { lines, days, start, months };
}

function drawCatalog() {
  const box = $('#pa-cat');
  if (!box) return;
  const miss = missingCatalog();
  if (!miss.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="card stack">
    <h2>Catalogue Adelya complet</h2>
    <p class="muted small">${miss.length} produit${miss.length > 1 ? 's' : ''} du bordereau de prix (BPU lot 1) ne ${miss.length > 1 ? 'sont' : 'est'} pas encore dans la liste. Ajoutez-les en une fois, puis archivez ceux qui ne servent pas.</p>
    <button type="button" class="btn primary block" id="pa-cat-go">${ICON.plus}Ajouter les ${miss.length} produits</button>
  </div>`;
  $('#pa-cat-go').onclick = async (e) => {
    const btn = e.currentTarget;
    busy(btn, true, 'Ajout en cours…');
    try {
      const rows = missingCatalog().map(([code, family, name, packaging, bpu_line, chemical]) => ({ code, family, name, packaging, bpu_line, chemical }));
      for (let i = 0; i < rows.length; i += 50) {
        const { error } = await S.sb.from('products').upsert(rows.slice(i, i + 50), { onConflict: 'code', ignoreDuplicates: true });
        if (error) throw error;
      }
      await reloadProducts();
      toast(`${rows.length} produits ajoutés`);
      render();
    } catch (err) {
      busy(btn, false);
      toast(errMsg(err), true);
    }
  };
}

function nextCode(family) {
  const prefix = (family || 'DIV').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'DIV';
  const existing = S.products.find((p) => p.family === family);
  const pre = existing ? existing.code.split('-')[0] : prefix;
  let n = 1;
  while (S.byCode[`${pre}-${String(n).padStart(2, '0')}`]) n++;
  return `${pre}-${String(n).padStart(2, '0')}`;
}
