function renderAuth(mode = 'login') {
  if (mode === 'recovery') {
    authShell(`<form class="card stack" id="rc-f" novalidate><h2>Nouveau mot de passe</h2>
      <div class="field"><label for="rc-pw">Mot de passe (8 caractères minimum)</label><input type="password" id="rc-pw" autocomplete="new-password"></div>
      <button type="submit" class="btn primary">Enregistrer</button></form>`);
    $('#rc-f').onsubmit = async (e) => {
      e.preventDefault();
      const pw = $('#rc-pw').value;
      if (pw.length < 8) return toast('8 caractères minimum.', true);
      const { error } = await S.sb.auth.updateUser({ password: pw });
      if (error) return toast(errMsg(error), true);
      toast('Mot de passe enregistré');
      afterLogin();
    };
    return;
  }
  const signup = mode === 'signup';
  authShell(`
    <div class="seg" id="au-mode"><button type="button" data-m="login" aria-pressed="${!signup}">Se connecter</button><button type="button" data-m="signup" aria-pressed="${signup}">Créer mon compte</button></div>
    <form class="stack" id="au-f" novalidate>
      ${signup ? '<div class="field"><label for="au-name">Prénom et nom</label><input type="text" id="au-name" autocomplete="name" required></div>' : ''}
      <div class="field"><label for="au-email">Adresse e-mail</label><input type="email" id="au-email" autocomplete="email" inputmode="email" autocapitalize="none" required></div>
      <div class="field"><label for="au-pw">Mot de passe${signup ? ' (8 caractères minimum)' : ''}</label><input type="password" id="au-pw" autocomplete="${signup ? 'new-password' : 'current-password'}" required></div>
      <button type="submit" class="btn primary block" id="au-go">${signup ? 'Créer mon compte' : 'Se connecter'}</button>
      ${signup ? '<p class="small muted">Votre accès sera activé par le responsable de secteur.</p>' : '<button type="button" class="btn ghost block" id="au-forgot">Mot de passe oublié</button>'}
    </form>`);
  $('#au-mode').onclick = (e) => { const b = e.target.closest('[data-m]'); if (b) renderAuth(b.dataset.m); };
  const forgot = $('#au-forgot');
  if (forgot) forgot.onclick = async () => {
    const email = $('#au-email').value.trim();
    if (!email) return toast('Saisissez d\'abord votre adresse e-mail.', true);
    const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: appBaseUrl() });
    if (error) return toast(errMsg(error), true);
    toast('Un lien pour changer le mot de passe a été envoyé par e-mail.');
  };
  $('#au-f').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#au-email').value.trim(), pw = $('#au-pw').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Adresse e-mail invalide.', true);
    const btn = $('#au-go');
    if (signup) {
      const name = $('#au-name').value.trim();
      if (!name) return toast('Indiquez votre prénom et votre nom.', true);
      if (pw.length < 8) return toast('Le mot de passe doit contenir au moins 8 caractères.', true);
      busy(btn, true, 'Création…');
      const { data, error } = await S.sb.auth.signUp({ email, password: pw, options: { data: { full_name: name }, emailRedirectTo: appBaseUrl() } });
      busy(btn, false);
      if (error) return toast(errMsg(error), true);
      if (!data.session) {
        authShell('<div class="card stack"><h2>Compte créé</h2><p>Confirmez votre adresse avec le lien reçu par e-mail, puis connectez-vous.</p><button type="button" class="btn primary" id="au-back">Se connecter</button></div>');
        $('#au-back').onclick = () => renderAuth('login');
        return;
      }
      return afterLogin();
    }
    busy(btn, true, 'Connexion…');
    const { error } = await S.sb.auth.signInWithPassword({ email, password: pw });
    busy(btn, false);
    if (error) return toast(errMsg(error), true);
    afterLogin();
  };
}

function renderWaiting(kind) {
  const msg = {
    pending: ['Compte en attente', 'Votre compte est créé. Le responsable de secteur doit maintenant valider votre accès et vous attribuer un site. Revenez ici ensuite.'],
    nosite: ['Site à attribuer', 'Votre accès est validé, mais aucun site ne vous est encore attribué. Prévenez le responsable de secteur.'],
    removed: ['Accès refusé', 'Ce compte n\'a pas accès à l\'application. Rapprochez-vous du responsable de secteur.'],
  }[kind];
  authShell(`<div class="card stack"><h2>${msg[0]}</h2><p>${msg[1]}</p>
    <button type="button" class="btn primary" id="w-retry">Vérifier à nouveau</button>
    <button type="button" class="btn ghost" id="w-out">Se déconnecter</button></div>`);
  $('#w-retry').onclick = () => afterLogin();
  $('#w-out').onclick = async () => { await S.sb.auth.signOut(); renderAuth(); };
}

let pollTimer = 0;
async function afterLogin() {
  const { data: { user } } = await S.sb.auth.getUser();
  if (!user) return renderAuth();
  const { data: me, error } = await S.sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) { authShell(`<div class="notice danger">${esc(errMsg(error))}</div>`); return; }
  if (!me) return renderWaiting('removed');
  if (!me.active) return renderWaiting('pending');
  if (me.role !== 'secteur' && !me.site_id) return renderWaiting('nosite');
  S.me = me;
  main.innerHTML = '<div class="loading">Chargement…</div>';
  try {
    await loadCore();
  } catch (e) {
    authShell(`<div class="notice danger">${esc(errMsg(e))}</div><button type="button" class="btn" onclick="location.reload()">Réessayer</button>`);
    return;
  }
  S.site = me.role === 'secteur' ? (S.sites.some((s) => s.id === lsGet('stock.site', 1)) ? lsGet('stock.site', 1) : S.sites[0]?.id) : me.site_id;
  renderChrome();
  if (!location.hash || location.hash === '#' || location.hash === '#/') location.replace('#/accueil');
  render();
  refreshBadges();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') refreshBadges(); }, 45000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) refreshBadges(); });

// ---------------------------------------------------------------------
// Démarrage
// ---------------------------------------------------------------------
async function boot() {
  if (!CFG.supabaseUrl || /COLLER/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || /COLLER/.test(CFG.supabaseAnonKey)) return renderConfigMissing();
  if (!window.supabase) { authShell('<div class="notice danger">Impossible de charger l\'application. Vérifiez la connexion Internet, puis rechargez la page.</div>'); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let recovering = /type=recovery/.test(location.hash);
  S.sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; renderAuth('recovery'); }
  });
  const { data: { session } } = await S.sb.auth.getSession();
  if (recovering) return renderAuth('recovery');
  if (!session) return renderAuth();
  afterLogin();
}
boot();
})();

</script>
