<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande de produits</title>
<meta name="description" content="Demande de produits d'entretien – Secteur Est, Ville de Schiltigheim.">
<meta name="theme-color" content="#e83447">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sch:#e83447;--sch-dk:#c8102e;--fg:#2b2a2a;--muted:#6b6566;--line:#ece4e5;--bg:#f6f2f2;--surface:#fff;--ok:#0a8a4c;
  --display:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#f2eded;--muted:#b9b0b1;--line:#3a3436;--bg:#1a1718;--surface:#242021}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:110px}
.top{background:#fff;border-bottom:4px solid var(--sch);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lg{display:flex;flex-direction:column;gap:2px}.lg img{height:38px;width:auto}.lg span{font:800 .64rem/1 var(--display);letter-spacing:.14em;color:var(--sch)}
.top h1{margin:0;padding-left:12px;border-left:2px solid #ece4e5;font:800 1.15rem/1.1 var(--display);color:#2b2a2a}
.top h1 small{display:block;font:600 .85rem var(--body);color:#6b6566}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
label.t{display:block;font:800 1.05rem var(--display);margin-bottom:6px}
select,input[type=search],textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--sch)}
.hint{display:block;color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 13px;font:700 .9rem var(--body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--sch);border-color:var(--sch);color:#fff}
.fam{font:800 .95rem var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 4px 8px}
.p{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.p.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.ph{flex:none;width:48px;height:48px;border-radius:10px;background:#f1eaea center/cover no-repeat;display:grid;place-items:center;font:800 1.1rem var(--display);color:#b9aeb0}
.p .tx{flex:1;min-width:0}.p .tx b{display:block;overflow-wrap:anywhere}.p .tx small{color:var(--muted)}
.st{flex:none;display:flex;align-items:center;gap:4px}
.st button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:800 1.4rem/1 var(--display);cursor:pointer}
.st button.plus{background:var(--sch);border-color:var(--sch);color:#fff}
.st span{min-width:30px;text-align:center;font:800 1.25rem var(--display)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:6;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar-in{max-width:720px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--sch);color:#fff;font:800 1.15rem var(--display);letter-spacing:.02em;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}.btn.ghost{background:transparent;color:var(--sch-dk);border:2px solid var(--line);margin-top:10px}
.msg{padding:14px 16px;border-radius:14px;margin-bottom:14px}.msg.ko{background:#fde7ea;color:#9c1328}.msg.ok{background:#e7f6ee;color:#1d6b43}
.done{text-align:center;padding:30px 10px}.done .big{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:52px}
.done h2{font:800 1.6rem var(--display);margin:0 0 8px}
.rev{list-style:none;margin:0 0 12px;padding:0}.rev li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:24px}
</style>
</head>

  <h1>Demande de produits<small id="sitename">&nbsp;</small></h1></div></header>
<main id="app"><div class="empty">Chargement…</div></main>
<div class="bar" id="bar" hidden><div class="bar-in"><button type="button" class="btn" id="go" disabled>Choisissez des produits</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
const URL_SB = 'https://emjvcirqslewqpyxjqbs.supabase.co';
const KEY = 'sb_publishable_Yy7vh7RkxNZum9gbGuzBGQ_z6wr7ndW';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const qs = new URLSearchParams(location.search);
const site = Number(qs.get('site')), key = qs.get('k') || '';
const app = $('#app'), bar = $('#bar'), go = $('#go');
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* rien */ } } };
const err = (t) => { app.innerHTML = `<div class="msg ko"><strong>${esc(t)}</strong></div>`; bar.hidden = true; };
if (!site || !key) return err('QR code incomplet. Scannez l\'affiche du local de rangement.');
if (!window.supabase) return err('Pas de réseau. Réessayez quand le téléphone capte.');
const sb = window.supabase.createClient(URL_SB, KEY, { auth: { persistSession: false, autoRefreshToken: false } });
let C = null, qty = {}, fam = 'Tout', q = '';
const LS_NOM = `cmd.agent.${site}`;
const photo = (p) => (p.photo ? `${URL_SB}/storage/v1/object/public/photos-produits/${p.photo.split('/').map(encodeURIComponent).join('/')}` : '');

async function load() {
  const { data, error } = await sb.rpc('qr_catalogue', { p_site: site, p_key: key });
  if (error) return err(/fetch|network/i.test(error.message) ? 'Pas de réseau. Réessayez quand le téléphone capte.' : error.message);
  C = data;
  $('#sitename').textContent = C.site;
  document.title = `Demande de produits · ${C.site}`;
  draw();
}
function list() {
  const nq = norm(q);
  return C.produits.filter((p) => (fam === 'Tout' || p.famille === fam) && (!nq || norm(`${p.nom} ${p.cond} ${p.famille}`).includes(nq)));
}
function row(p) {
  const n = qty[p.id] || 0, ph = photo(p);
  return `<div class="p ${n ? 'on' : ''}" data-row="${p.id}"><span class="ph" ${ph ? `style="background-image:url('${esc(ph)}')"` : ''}>${ph ? '' : esc((p.nom || '?')[0])}</span>
    <span class="tx"><b>${esc(p.nom)}</b><small>${esc(p.cond || '')}</small></span>
    <span class="st">${n ? `<button type="button" data-m="${p.id}" aria-label="Retirer un ${esc(p.nom)}">−</button><span>${n}</span>` : ''}<button type="button" class="plus" data-p="${p.id}" aria-label="Ajouter un ${esc(p.nom)}">+</button></span></div>`;
}
function drawList() {
  const ps = list();
  const groups = {};
  ps.forEach((p) => (groups[p.famille] = groups[p.famille] || []).push(p));
  $('#list').innerHTML = ps.length ? Object.entries(groups).map(([f, xs]) => `<div class="fam">${esc(f)}</div>${xs.map(row).join('')}`).join('') : '<div class="empty">Aucun produit trouvé.</div>';
  updBar();
}
function updBar() {
  const n = Object.values(qty).filter(Boolean).length;
  const ag = $('#agent') && $('#agent').value;
  go.disabled = !n || !ag;
  go.textContent = !ag ? 'Choisissez votre nom en haut' : n ? `Envoyer la demande · ${n} produit${n > 1 ? 's' : ''}` : 'Cochez des produits';
}
function draw() {
  if (!C.agents.length) return err('La liste des agents de ce site est vide. Prévenez votre responsable d\'installation.');
  const fams = [...new Set(C.produits.map((p) => p.famille))];
  const saved = ls.get(LS_NOM);
  app.innerHTML = `<div class="card"><label class="t" for="agent">Votre nom</label>
      <select id="agent"><option value="">— Choisissez votre nom et prénom —</option>${C.agents.map((a) => `<option value="${a.id}" ${a.id === saved ? 'selected' : ''}>${esc(a.nom)}</option>`).join('')}</select>
      <span class="hint">Pas dans la liste ? Prévenez votre responsable d'installation.</span></div>
    <input type="search" id="q" placeholder="Chercher un produit…" aria-label="Chercher un produit">
    <div class="chips" id="fams">${['Tout', ...fams].map((f) => `<button type="button" class="chip" data-f="${esc(f)}" aria-pressed="${f === fam}">${esc(f)}</button>`).join('')}</div>
    <div id="list"></div>`;
  bar.hidden = false;
  drawList();
  $('#agent').onchange = (e) => { ls.set(LS_NOM, e.target.value); updBar(); };
  $('#q').oninput = (e) => { q = e.target.value; drawList(); };
  $('#fams').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; fam = b.dataset.f; document.querySelectorAll('#fams .chip').forEach((x) => x.setAttribute('aria-pressed', x === b)); drawList(); };
  $('#list').onclick = (e) => {
    const plus = e.target.closest('[data-p]'), moins = e.target.closest('[data-m]');
    const id = plus ? plus.dataset.p : moins ? moins.dataset.m : null;
    if (!id) return;
    qty[id] = Math.max(0, Math.min(99, (qty[id] || 0) + (plus ? 1 : -1)));
    if (!qty[id]) delete qty[id];
    const p = C.produits.find((x) => x.id === id);
    $(`[data-row="${id}"]`).outerHTML = row(p);
    updBar();
  };
  go.onclick = review;
}
function review() {
  const ag = C.agents.find((a) => a.id === $('#agent').value);
  const items = Object.entries(qty).filter(([, n]) => n > 0);
  const scrollY = window.scrollY;
  const back = app.innerHTML;
  app.innerHTML = `<div class="card"><label class="t">Vérifiez votre demande</label>
      <p style="margin:0 0 10px">De : <strong>${esc(ag.nom)}</strong> · ${esc(C.site)}</p>
      <ul class="rev">${items.map(([id, n]) => { const p = C.produits.find((x) => x.id === id); return `<li><span>${esc(p.nom)}<br><small style="color:var(--muted)">${esc(p.cond || '')}</small></span><strong>× ${n}</strong></li>`; }).join('')}</ul>
      <label class="t" for="note">Un mot pour le responsable (facultatif)</label>
      <textarea id="note" rows="3" maxlength="300" placeholder="Ex. : pour le gymnase, avant vendredi"></textarea></div>
    <div id="rmsg"></div>`;
  go.disabled = false; go.textContent = 'Envoyer';
  bar.querySelector('.bar-in').insertAdjacentHTML('beforeend', '<button type="button" class="btn ghost" id="back">Modifier</button>');
  window.scrollTo(0, 0);
  const restore = () => { $('#back') && $('#back').remove(); draw(); window.scrollTo(0, scrollY); };
  $('#back').onclick = restore;
  go.onclick = async () => {
    go.disabled = true; go.textContent = 'Envoi…';
    const { error } = await sb.rpc('qr_demande', { p_site: site, p_key: key, p_agent: ag.id, p_nom: '', p_items: items.map(([product_id, quantity]) => ({ product_id, quantity })), p_note: $('#note').value.trim() });
    if (error) { $('#rmsg').innerHTML = `<div class="msg ko">${esc(/fetch|network/i.test(error.message) ? 'Pas de réseau : la demande n\'est pas partie. Réessayez quand le téléphone capte.' : error.message)}</div>`; go.disabled = false; go.textContent = 'Réessayer'; return; }
    $('#back') && $('#back').remove();
    bar.hidden = true; qty = {};
    app.innerHTML = `<div class="done"><div class="big">✓</div><h2>Demande envoyée</h2><p>Merci, ${esc(ag.nom)} ! Votre responsable d'installation a reçu la demande. Il va la préparer et vous la remettre.</p>
      <button type="button" class="btn" id="again" style="margin-top:20px">Faire une autre demande</button></div>`;
    $('#again').onclick = () => draw();
  };
}
load().catch((e) => err('Impossible de charger la liste. ' + (e && e.message ? e.message : '')));
})();
