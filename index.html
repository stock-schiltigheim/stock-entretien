function codeFromText(t) {
  const s = String(t || '').trim();
  let m = s.match(/#\/p\/([A-Za-z0-9-]+)/);
  if (m) return m[1].toUpperCase();
  m = s.match(/^(?:STOCK:)?([A-Za-z0-9-]{2,20})$/i);
  return m ? m[1].toUpperCase() : null;
}
function openScanned(text) {
  const code = codeFromText(text);
  if (code && S.byCode[code]) { if (navigator.vibrate) navigator.vibrate(60); go(`#/p/${code}`); return true; }
  toast('QR code non reconnu : ce n\'est pas une étiquette de produit.', true);
  return false;
}

// Mode du scanner : « trouver » (ouvre la fiche) ou « sortie » (chaque scan = 1 produit en moins)
const scanMode = () => (lsGet('stock.scanmode') === 'sortie' ? 'sortie' : 'trouver');
function scanBeep(ok) {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const c = S.audio || (S.audio = new A()); const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = ok ? 1320 : 260; g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (ok ? 0.14 : 0.35));
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.4);
  } catch { /* pas de son */ }
}

async function renderScan(tok) {
  const mode = scanMode(), agent = role() === 'agent';
  const site = S.site;
  const lastAgent = lsGet(`stock.agent.${site}`) || '';
  const agentSel = !agent && S.agentsReady ? `<div class="qs-who"><div class="field"><label for="qs-agent">Remis à qui ?</label>
      <select id="qs-agent"><option value="">Choisir…</option><option value="__team" ${lastAgent === '__team' ? 'selected' : ''}>👥 ${TEAM_NAME}</option>${siteAgents(site).filter((a) => !isTeam(a)).map((a) => `<option value="${a.id}" ${lastAgent === a.id ? 'selected' : ''}>${esc(a.full_name)}</option>`).join('')}</select></div></div>` : '';
  main.innerHTML = `
    <div class="page-head"><h1>Scanner</h1></div>
    <div class="scan-mode" role="group" aria-label="Mode du scanner">
      <button type="button" data-mode="trouver" aria-pressed="${mode === 'trouver'}">Trouver un produit<small>ouvre sa fiche</small></button>
      <button type="button" class="out" data-mode="sortie" aria-pressed="${mode === 'sortie'}">${agent ? 'Je prends' : 'Sortie rapide'}<small>${agent ? '1 scan = 1 dans ma demande' : '1 scan = 1 produit en moins'}</small></button>
    </div>
    ${mode === 'sortie' ? `${agentSel}<p class="muted small" style="margin:-2px 0 8px">Scannez, éloignez le téléphone, rescannez : ${agent ? '+1 à chaque fois.' : '−1 à chaque fois.'}</p>` : '<p class="muted" style="margin:-4px 0 10px">Visez l\'étiquette QR collée sur l\'étagère : la fiche du produit s\'ouvre.</p>'}
    <div class="scanner ${mode === 'sortie' ? 'quick' : ''}" id="scanner"><video id="scan-video" playsinline muted></video><div class="frame"></div><div class="scan-flash" id="scan-flash"><div class="bubble"></div></div><div class="hint" id="scan-hint">Recherche d'un QR code…</div></div>
    <div class="notice" id="scan-fallback" hidden></div>
    ${mode === 'sortie' ? `<div id="qs-zone" hidden><div class="section-head"><h2>${agent ? 'Ajouté à ma demande' : 'Sorties de ce passage'}</h2></div><div class="list qs-list" id="qs-list"></div>
      ${agent ? '<a class="btn primary block" href="#/demander" style="margin-top:12px">Voir et envoyer ma demande</a>' : '<button type="button" class="btn primary block" id="qs-done" style="margin-top:12px">Terminé</button>'}</div>` : ''}
    <div class="grid-2" style="margin-top:12px">
      <label class="btn" for="scan-photo">${ICON.camera}Prendre une photo</label>
      <button type="button" class="btn" id="scan-manual">Saisir le code</button>
    </div>
    <input type="file" id="scan-photo" accept="image/*" capture="environment" hidden>`;
  main.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { if (S.quickFlush) S.quickFlush(); lsSet('stock.scanmode', b.dataset.mode); stopCamera(); renderScan(++S.tok); }; });

  // --- Sortie rapide : on regroupe les scans d'un même produit et on enregistre 3 s après le dernier
  const pend = {}; const done = {}; // productId -> quantité
  const timers = {};
  const qsSel = $('#qs-agent');
  if (qsSel) qsSel.onchange = () => lsSet(`stock.agent.${site}`, qsSel.value);
  const drawList = () => {
    const z = $('#qs-zone'); if (!z) return;
    const ids = [...new Set([...Object.keys(done), ...Object.keys(pend)])];
    z.hidden = !ids.length;
    $('#qs-list').innerHTML = ids.map((id) => { const p = S.byId[id]; const n = (done[id] || 0) + (pend[id] || 0);
      return `<div class="item">${prodThumb(p, 40)}<span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${agent ? 'dans ma demande' : `reste ${fmt(stockOf(p, site).quantity)} en stock`}</span></span>
        <span class="qty"><span class="n">${agent ? '+' : '−'}${fmt(n)}</span><span class="state">${pend[id] ? 'envoi…' : agent ? '' : 'enregistré'}</span></span>
        ${pend[id] || agent ? `<button type="button" class="qs-undo" data-undo="${id}" aria-label="Annuler un ${esc(p.name)}">↶</button>` : ''}</div>`; }).join('');
  };
  const send = async (id) => {
    clearTimeout(timers[id]); delete timers[id];
    const q = pend[id]; if (!q) return; delete pend[id];
    const p = S.byId[id];
    const args = { p_site: site, p_product: id, p_kind: 'sortie', p_qty: q, p_reference: '', p_note: 'Sortie rapide (scan)' };
    if (S.agentsReady) {
      const ag = (qsSel && qsSel.value) || lastAgent || '__team';
      try { args.p_agent = ag === '__team' ? await teamAgentId(site) : ag; } catch { args.p_agent = undefined; }
    }
    const r = await rpcOrQueue('record_movement', args, `Sortie · ${fmt(q)} × ${p.name}`);
    if (r.error) { toast(`${p.name} : ${errMsg(r.error)}`, true); applyStock(id, site, round2(Number(stockOf(p, site).quantity) + q)); drawList(); return; }
    if (r.data && r.data.stock_after != null) applyStock(id, site, r.data.stock_after);
    done[id] = (done[id] || 0) + q; saveSnapshot(); drawList();
  };
  S.quickFlush = () => { Object.keys(pend).forEach((id) => send(id)); S.quickFlush = null; };
  const qsDone = $('#qs-done'); if (qsDone) qsDone.onclick = () => { if (S.quickFlush) S.quickFlush(); const n = Object.values(done).reduce((a, b) => a + b, 0); toast(`Sorties enregistrées`); go('#/stock'); };
  const qz = $('#qs-zone');
  if (qz) qz.onclick = (e) => {
    const b = e.target.closest('[data-undo]'); if (!b) return; const id = b.dataset.undo, p = S.byId[id];
    if (agent) { S.cart[id] = round2((S.cart[id] || 0) - 1); if (S.cart[id] <= 0) delete S.cart[id]; saveCart(); renderTabs(); done[id] = (done[id] || 0) - 1; if (done[id] <= 0) delete done[id]; drawList(); return; }
    if (!pend[id]) return;
    pend[id] -= 1; applyStock(id, site, round2(Number(stockOf(p, site).quantity) + 1));
    if (pend[id] <= 0) { delete pend[id]; clearTimeout(timers[id]); }
    drawList();
  };
  let flashT = 0;
  const flash = (ok, big, name, sub) => {
    const f = $('#scan-flash'); if (!f) return;
    f.querySelector('.bubble').innerHTML = `<span class="big">${esc(big)}</span><span class="nm">${esc(name)}</span>${sub ? `<span class="st">${esc(sub)}</span>` : ''}`;
    f.classList.toggle('ko', !ok); f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('on'), ok ? 900 : 1600);
  };
  const hitQuick = (code) => {
    const p = S.byCode[code]; if (!p) return;
    if (agent) {
      S.cart[p.id] = round2((S.cart[p.id] || 0) + 1); saveCart(); renderTabs();
      done[p.id] = (done[p.id] || 0) + 1;
      if (navigator.vibrate) navigator.vibrate(70); scanBeep(true);
      flash(true, `+${fmt(done[p.id])}`, p.name, 'dans ma demande'); drawList(); return;
    }
    if (S.agentsReady && qsSel && !qsSel.value) { scanBeep(false); flash(false, '?', 'Choisissez d\'abord à qui c\'est remis', 'au-dessus de la caméra'); qsSel.focus(); return; }
    const left = Number(stockOf(p, site).quantity);
    if (left < 1) { if (navigator.vibrate) navigator.vibrate([90, 60, 90]); scanBeep(false); flash(false, '0', p.name, 'Stock épuisé : rien à retirer'); return; }
    pend[p.id] = (pend[p.id] || 0) + 1;
    applyStock(p.id, site, round2(left - 1));
    clearTimeout(timers[p.id]); timers[p.id] = setTimeout(() => send(p.id), 3000);
    if (navigator.vibrate) navigator.vibrate(70); scanBeep(true);
    flash(true, `−${fmt((done[p.id] || 0) + pend[p.id])}`, p.name, `reste ${fmt(left - 1)}`); drawList();
  };
  // Un même QR ne compte à nouveau qu'après avoir quitté l'image (on éloigne le téléphone)
  let seen = null, seenAt = 0, lastHit = 0;
  const onCode = (text) => {
    const code = codeFromText(text);
    if (!code || !S.byCode[code]) return;
    if (mode === 'trouver') { stopCamera(); openScanned(text); return; }
    const now = Date.now();
    if (code === seen && now - seenAt < 700) { seenAt = now; return; } // toujours devant la caméra
    if (now - lastHit < 600) { seen = code; seenAt = now; return; }
    seen = code; seenAt = now; lastHit = now;
    hitQuick(code);
  };
  S.quickHit = onCode; // pour les essais

  $('#scan-photo').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await decodeImageFile(file);
    if (!text) toast('Aucun QR code lisible sur la photo. Rapprochez-vous et réessayez.', true);
    else if (mode === 'sortie') { seen = null; onCode(text); } else openScanned(text);
    e.target.value = '';
  };
  $('#scan-manual').onclick = () => pickProduct('Choisir un produit', (p) => (mode === 'sortie' ? hitQuick(p.code) : go(`#/p/${p.code}`)));

  const video = $('#scan-video');
  const fail = (msg) => {
    if (stale(tok)) return;
    $('#scanner').hidden = true;
    const fb = $('#scan-fallback');
    fb.hidden = false;
    fb.textContent = msg;
  };
  if (!navigator.mediaDevices?.getUserMedia) return fail('La caméra en direct n\'est pas disponible sur ce navigateur. Utilisez « Prendre une photo ».');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    if (stale(tok)) { stream.getTracks().forEach((t) => t.stop()); return; }
    S.stream = stream;
    video.srcObject = stream;
    await video.play();
  } catch {
    return fail('Accès à la caméra refusé. Autorisez la caméra pour ce site dans les réglages du navigateur, ou utilisez « Prendre une photo ».');
  }
  if (mode === 'sortie') $('#scan-hint').textContent = agent ? 'Scannez : +1 dans ma demande' : 'Scannez : 1 produit en moins';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let last = 0;
  const loop = (t) => {
    if (stale(tok) || !S.stream) return;
    S.scanRAF = requestAnimationFrame(loop);
    if (t - last < 150 || video.readyState < 2) return;
    last = t;
    const w = 480, h = Math.round((video.videoHeight / video.videoWidth) * w) || 640;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const res = window.jsQR && window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (res && res.data) onCode(res.data);
  };
  S.scanRAF = requestAnimationFrame(loop);
}

async function loadImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file); } catch { /* repli */ }
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = reject;
    img.src = url;
  });
}
async function decodeImageFile(file) {
  try {
    const img = await loadImage(file);
    const W = img.width, H = img.height;
    for (const max of [1000, 1600, 700]) {
      const k = Math.min(1, max / Math.max(W, H));
      const w = Math.round(W * k), h = Math.round(H * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) return r.data;
    }
  } catch { /* image illisible */ }
  return null;
}

// Feuille de choix d'un produit (recherche)
function pickProduct(title, onPick) {
  openSheet(`
    <h2 id="sheet-title">${esc(title)}</h2>
    ${searchBox('pick-q', '', 'Nom, code ou famille')}
    <div id="pick-list" class="list"></div>`,
  (root) => {
    const q = $('#pick-q', root);
    const draw = () => {
      let list = scopedProducts().filter((p) => matches(p, q.value));
      if (!list.length && q.value) list = activeProducts().filter((p) => matches(p, q.value));
      list = list.slice(0, 60);
      $('#pick-list', root).innerHTML = list.map((p) => `<button type="button" class="item" data-pick="${p.id}">${prodThumb(p, 40)}
        <span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.code)} · ${esc(p.packaging)}</span>${brandChips(p, true)}</span>
        <span class="qty"><span class="n">${fmt(stockOf(p).quantity)}</span></span></button>`).join('') || '<div class="empty">Aucun produit.</div>';
    };
    draw();
    q.oninput = draw;
    $('#pick-list', root).onclick = (e) => {
      const b = e.target.closest('[data-pick]');
      if (!b) return;
      const p = S.byId[b.dataset.pick];
      closeSheet();
      onPick(p);
    };
    setTimeout(() => q.focus(), 80);
  });
}

const CHEM_FAMS = ['Autolaveuse', 'Cuisine', 'Désinfection et désodorisation', 'Hygiène des mains', 'Linge', 'Sanitaires', 'Sols', 'Surfaces et vitres', 'Technique et maintenance'];
const SAFE_HAZ = {
  GHS05: 'Provoque des brûlures de la peau et des lésions graves des yeux.',
  GHS07: 'Provoque une irritation de la peau et des yeux.',
  GHS02: 'Liquide et vapeurs inflammables : tenir loin de la chaleur et des flammes.',
  GHS06: 'Toxique en cas d\'ingestion, de contact avec la peau ou d\'inhalation.',
  GHS08: 'Peut nuire à la santé en cas d\'exposition répétée.',
  GHS09: 'Toxique pour les poissons et la nature : ne pas jeter à l\'égout ni dehors.',
  GHS03: 'Peut provoquer ou aggraver un incendie.',
  GHS04: 'Gaz sous pression : peut éclater sous l\'effet de la chaleur.',
  GHS01: 'Risque d\'explosion.',
};
const SAFE_HAZ_MORE = ['Provoque une sévère irritation des yeux.', 'Peut provoquer une allergie de la peau.', 'Nocif en cas d\'ingestion.', 'Vapeurs irritantes : utiliser dans un local aéré.', 'Ne pas utiliser sur une peau abîmée.'];
const SAFE_INC = ['Eau de Javel', 'Produits acides (détartrants)', 'Produits chlorés', 'Ammoniaque', 'Tout autre produit'];
const SAFE_STO = ['Dans son emballage d\'origine bien fermé', 'À l\'abri du gel', 'Loin de la chaleur et du soleil', 'Hors de portée du public et des enfants', 'Loin des aliments et boissons', 'Dans un bac de rétention, pas au sol', 'Local aéré'];
const SAFE_SPILL = ['Absorber avec de la sciure ou un absorbant', 'Ne pas rejeter à l\'égout', 'Rincer la zone à grande eau', 'Jeter l\'emballage vide en déchetterie'];
function safeFirstAid(pics) {
  const c = pics.includes('GHS05'), t = pics.includes('GHS06');
  return [
    `Yeux : rincer à l'eau claire pendant 15 minutes, paupières bien ouvertes, enlever les lentilles.${c ? ' Appeler tout de suite un médecin.' : ' Voir un médecin si ça pique encore.'}`,
    `Peau : enlever les vêtements touchés et rincer la peau à l'eau${c ? ' pendant 15 minutes' : ''}.`,
    `Avalé : rincer la bouche, NE PAS faire vomir, appeler le centre antipoison${c || t ? ' immédiatement' : ''}.`,
    'Respiré : sortir à l\'air frais et se reposer.',
    'En cas de doute : centre antipoison 01 45 42 59 59 (ORFILA) ou le 15.',
  ].join('\n');
}
function openSafetyWizard(p) {
  const pics = new Set(p.pictograms || []), ppe = new Set(p.ppe || []);
  const chipRow = (id, list) => `<div class="chips safe-chips" data-target="${id}">${list.map((x) => `<button type="button" class="chip-btn" data-add="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>`;
  openSheet(`<h2 id="sheet-title">Fiche sécurité · ${esc(p.name)}</h2>
    <p class="small muted">Recopiez ce qui est écrit sur l'étiquette du bidon. Touchez les pastilles pour remplir plus vite, puis corrigez si besoin.</p>
    <div class="field"><span class="label">1 · Les losanges rouges sur l'étiquette</span><div class="safe-pics">${Object.keys(PICTOS).map((c) => `<button type="button" class="safe-pic" data-pic="${c}" aria-pressed="${pics.has(c)}">${picto(c)}<span>${esc(PICTOS[c].label)}</span></button>`).join('')}</div>
      <span class="hint">Aucun losange ? Ne cochez rien : le produit n'est pas classé dangereux.</span></div>
    <div class="field"><label for="sw-signal">2 · Mot écrit à côté des losanges</label><select id="sw-signal">
      <option value="" ${!p.signal_word ? 'selected' : ''}>Aucun</option><option ${p.signal_word === 'Attention' ? 'selected' : ''}>Attention</option><option ${p.signal_word === 'Danger' ? 'selected' : ''}>Danger</option></select></div>
    <div class="field"><label for="sw-haz">3 · Les dangers</label>${chipRow('sw-haz', SAFE_HAZ_MORE)}<textarea id="sw-haz" rows="3" placeholder="Ex. : provoque une sévère irritation des yeux">${esc(p.hazards || '')}</textarea></div>
    <div class="field"><span class="label">4 · Protections à porter</span><div class="checkgrid">${PPE.map((x) => `<label><input type="checkbox" name="sw-ppe" value="${esc(x)}" ${ppe.has(x) ? 'checked' : ''}>${esc(x)}</label>`).join('')}</div></div>
    <div class="field"><label for="sw-inc">5 · Ne jamais mélanger avec</label>${chipRow('sw-inc', SAFE_INC)}<textarea id="sw-inc" rows="2">${esc(p.incompat || '')}</textarea></div>
    <div class="field"><label for="sw-aid">6 · Premiers secours</label><button type="button" class="btn ghost small" id="sw-aid-auto">Remplir avec les gestes habituels</button><textarea id="sw-aid" rows="6">${esc(p.first_aid || '')}</textarea><span class="hint">Vérifiez avec l'étiquette (phrases qui commencent par « EN CAS DE… »).</span></div>
    <div class="field"><label for="sw-sto">7 · Rangement</label>${chipRow('sw-sto', SAFE_STO)}<textarea id="sw-sto" rows="2">${esc(p.storage || '')}</textarea></div>
    ${noticeReady() ? `<div class="field"><label for="sw-use">8 · Utilisation et dilution</label><textarea id="sw-use" rows="2" placeholder="Ex. : 20 ml dans 5 L d'eau froide">${esc(p.usage || '')}</textarea></div>
    <div class="field"><label for="sw-spill">9 · Si ça se renverse</label>${chipRow('sw-spill', SAFE_SPILL)}<textarea id="sw-spill" rows="2">${esc(p.spill || '')}</textarea></div>` : ''}
    <button type="button" class="btn primary block" id="sw-ok">Enregistrer la fiche sécurité</button>
    <button type="button" class="btn ghost block" data-close-sheet>Annuler</button>`, (root) => {
    const ta = (id) => $(`#${id}`, root);
    const addLine = (id, txt) => { const t = ta(id); if (!t) return; const lines = t.value.split(/\n/).map((x) => x.trim()).filter(Boolean); if (!lines.includes(txt)) lines.push(txt); t.value = lines.join(id === 'sw-inc' ? ', ' : '\n').replace(/\n/g, id === 'sw-inc' ? ', ' : '\n'); };
    root.querySelectorAll('.safe-chips').forEach((row) => { row.onclick = (e) => { const b = e.target.closest('[data-add]'); if (!b) return; if (row.dataset.target === 'sw-inc') { const t = ta('sw-inc'); const items = t.value.split(',').map((x) => x.trim()).filter(Boolean); if (!items.includes(b.dataset.add)) items.push(b.dataset.add); t.value = items.join(', '); } else addLine(row.dataset.target, b.dataset.add); b.setAttribute('aria-pressed', 'true'); }; });
    root.querySelectorAll('[data-pic]').forEach((b) => { b.onclick = () => {
      const c = b.dataset.pic, on = !pics.has(c);
      if (on) pics.add(c); else pics.delete(c);
      b.setAttribute('aria-pressed', on);
      if (on) {
        if (SAFE_HAZ[c]) addLine('sw-haz', SAFE_HAZ[c]);
        const sig = ta('sw-signal'); if (['GHS05', 'GHS06', 'GHS08', 'GHS01'].includes(c)) sig.value = 'Danger'; else if (!sig.value) sig.value = 'Attention';
        const tick = (x) => { const i = root.querySelector(`input[name="sw-ppe"][value="${x}"]`); if (i) i.checked = true; };
        if (['GHS05', 'GHS07', 'GHS06', 'GHS08'].includes(c)) tick('Gants');
        if (['GHS05', 'GHS06'].includes(c)) tick('Lunettes');
        if (['GHS02', 'GHS04', 'GHS06'].includes(c)) tick('Aérer le local');
        if (c === 'GHS09') addLine('sw-spill', 'Ne pas rejeter à l\'égout');
      }
    }; });
    $('#sw-aid-auto', root).onclick = () => { ta('sw-aid').value = safeFirstAid([...pics]); };
    $('#sw-ok', root).onclick = async (e) => {
      const row = {
        signal_word: ta('sw-signal').value || null, pictograms: [...pics],
        ppe: [...root.querySelectorAll('input[name="sw-ppe"]:checked')].map((i) => i.value),
        hazards: ta('sw-haz').value.trim(), incompat: ta('sw-inc').value.trim(), first_aid: ta('sw-aid').value.trim(), storage: ta('sw-sto').value.trim(),
        chemical: true,
      };
      if (ta('sw-use')) { row.usage = ta('sw-use').value.trim(); row.spill = ta('sw-spill').value.trim(); }
      if (!row.pictograms.length && !row.hazards && !row.first_aid && !row.ppe.length) return toast('Remplissez au moins les losanges, les dangers ou les premiers secours.', true);
      busy(e.target, true);
      const { error } = await S.sb.from('products').update(row).eq('id', p.id);
      if (error) { busy(e.target, false); return toast(errMsg(error), true); }
      Object.assign(p, row); saveSnapshot(); closeSheet(); toast('Fiche sécurité enregistrée'); render();
    };
  });
}

function openFdsLink(p) {

    <button type="button" class="btn primary block" id="fl-ok">Enregistrer</button>

    <button type="button" class="btn ghost block" data-close-sheet>Annuler</button>`, (root) => {
    const save = async (url, date) => {

      const { error } = await S.sb.from('products').update(row).eq('id', p.id);

      Object.assign(p, row); closeSheet(); toast(url ? 'Fiche de sécurité enregistrée' : 'Lien retiré'); render();

  });

async function compressImage(file) {
  if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
  try {
    const img = await loadImage(file);
    const k = Math.min(1, 1800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch { return file; }
}

const KNOWN_BRANDS = ['Ecolab', 'Diversey', 'Taski', 'Kiehl', 'Christeyns', 'Hagleitner', 'Wetrok', 'Tork', 'Essity', 'Orapi', 'Hypred', 'Anios', 'Kärcher', 'Nilfisk', 'Vileda', 'Henkel', 'Reckitt', 'Starwax', 'Saint-Marc', 'Paredes', 'Argos', 'Rubbermaid', 'Adelya'];
function guessBrands(text, known = []) {
  const norm = (x) => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const all = [...new Set([...known, ...KNOWN_BRANDS])];
  const clean = (c) => {
    let v = String(c || '').replace(/\b(S\.?A\.?S\.?U?|S\.?A\.?R\.?L|S\.?N\.?C|S\.?A|GmbH|AG|Ltd|Limited|Inc|S\.?p\.?A|B\.?V|N\.?V|Co|KG|Europe|France|Deutschland|International|Groupe?|Holding)\b\.?/gi, ' ')
      .replace(/[|_*«»"“”]/g, ' ').replace(/[\s,;:.\-–]+$/g, '').replace(/^[\s,;:.\-–]+/g, '').replace(/\s+/g, ' ').trim();
    if (v.length > 40) v = v.split(/[,(]/)[0].trim();
    if (/^[A-ZÀ-Ý0-9 &'\-]+$/.test(v) && v.length > 3) v = v.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
    const k = all.find((b) => new RegExp(`(^|[^a-z])${norm(b).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`).test(norm(v)));
    return k || v;
  };
  const ok = (v) => v && v.length >= 2 && v.length <= 40 && /\p{L}{2}/u.test(v) && !/@|www\.|https?:|t[ée]l[ée]?phone|fax|adresse|rue|avenue|boulevard|cedex|\d{5}/i.test(v);
  const out = [];
  const add = (v) => { v = clean(v); if (ok(v) && !out.some((x) => norm(x) === norm(v))) out.push(v); };
  const lines = String(text || '').split(/\n/).map((l) => l.trim()).filter(Boolean);
  const KEY = /^(?:soci[ée]t[ée]|fournisseur|fabricant|distributeur|raison sociale|entreprise|nom de la soci[ée]t[ée]|company|supplier|manufacturer)\b[^:]{0,30}?[:\-]\s*(.*)$/i;
  lines.forEach((l, i) => {
    const m = l.match(KEY);
    if (m) {
      if (m[1] && m[1].length > 1) add(m[1]);
      else if (lines[i + 1]) add(lines[i + 1]);
    } else if (/fournisseur de la fiche/i.test(l) && lines[i + 1] && !KEY.test(lines[i + 1])) add(lines[i + 1]);
  });
  for (const b of all) if (new RegExp(`(^|[^a-z])${norm(b).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`).test(norm(text))) add(b);
  const GENERIC = /^(gmail|hotmail|outlook|yahoo|orange|wanadoo|free|sfr|laposte|inrs|orfila|anses|centres?-?antipoison|echa)$/i;
  for (const m of String(text || '').matchAll(/[\w.+-]+@([a-z0-9-]+)\.[a-z.]{2,}/gi)) if (!GENERIC.test(m[1])) add(m[1].charAt(0).toUpperCase() + m[1].slice(1));
  // On met d'abord les marques connues
  const isKnown = (v) => all.some((b) => norm(b) === norm(v));
  return out.sort((a, b) => Number(isKnown(b)) - Number(isKnown(a))).slice(0, 6);
}
const OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

// Lecture à voix haute (voix du téléphone, en français)
function speakProduct(p, btn) {
  const syn = window.speechSynthesis;
  if (!syn || typeof SpeechSynthesisUtterance === 'undefined') return toast('La lecture à voix haute n\'est pas disponible sur ce téléphone.', true);
  if (syn.speaking) { syn.cancel(); return; }
  const parts = [`${p.brand ? `${p.brand}, ` : ''}${p.name}.`];
  if (pZones(p).length) parts.push(`À quoi il sert : ${pZones(p).map((z) => ZONES[z].t.replace(',', ' et')).join(', ')}.`);
  const cs = pComps(p);
  if (cs.length) parts.push(`Composition : ${cs.map((c) => `${PTYPES[c].t.toLowerCase()}, ${PTYPES[c].v}`).join(' ')}${POWER[p.power] ? ` Puissance : ${POWER[p.power].toLowerCase()}.` : ''}`);
  const ms = (p.methods || []).filter((m) => METHODS[m]);
  if (ms.length) parts.push(`${ms.map((m) => `${METHODS[m].t}, ${METHODS[m].s}`).join('. Ou ')}.`);
  if (p.dose) parts.push(`Dose : ${p.dose}.`);
  if (Number(p.dose_ml) > 0) parts.push(`Pour un seau de 5 litres : ${doseText(p, 5).replace(/<[^>]+>/g, '')}.`);
  if (p.notice) parts.push(p.notice);
  if (cs.length || p.chemical) parts.push('Je mets mes gants. Jamais avec un autre produit.');
  const u = new SpeechSynthesisUtterance(parts.join(' '));
  u.lang = 'fr-FR'; u.rate = 0.92;
  const fr = (syn.getVoices() || []).find((v) => /^fr/i.test(v.lang));
  if (fr) u.voice = fr;
  if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  syn.speak(u);
}

    const q = $('#bp-q', root), list = $('#bp-list', root);
    const draw = () => {
      const words = norm(q.value).split(/\s+/).filter(Boolean);
      let hit = all.filter((l) => { const t = norm(`${l.bpu_line ?? ''} ${l.code} ${l.name} ${l.family} ${l.adelya_ref || ''} ${kidsOf(l).map((k) => `${k.brand} ${k.name}`).join(' ')}`); return words.every((w) => t.includes(w)); });
      const inName = (l) => words.every((w) => norm(`${l.bpu_line ?? ''} ${l.name}`).includes(w));
      if (words.length) hit = [...hit.filter(inName), ...hit.filter((l) => !inName(l))];
      list.innerHTML = hit.length ? hit.slice(0, 40).map((l) => `<button type="button" class="item${p.rubrique_id === l.id ? ' on' : ''}" data-bp="${l.id}" style="text-align:left;width:100%"><span class="main-txt"><span class="title">${l.bpu_line != null ? `<span class="mono">${l.bpu_line}</span> · ` : ''}${esc(l.name)}</span>
        <span class="sub">${esc(l.family)}${kidsOf(l).length ? ` · ${esc(kidsOf(l).map((k) => k.brand || k.name).filter(Boolean).slice(0, 4).join(', '))}` : ''}</span></span>${p.rubrique_id === l.id ? '<span class="pill ok">Actuelle</span>' : ''}</button>`).join('')
        + (hit.length > 40 ? `<p class="small muted" style="padding:8px">${hit.length - 40} autres lignes : précisez la recherche.</p>` : '')
        : '<div class="empty"><strong>Aucune ligne trouvée.</strong>Essayez un autre mot, ou choisissez « Autre ».</div>';
    };
    draw();
    setTimeout(() => q.focus(), 80);
    q.oninput = draw;
    list.onclick = (e) => { const b = e.target.closest('[data-bp]'); if (!b) return; closeSheet(); onPick(b.dataset.bp); };
    $('#bp-other', root).onclick = () => { closeSheet(); onPick('other'); };
    const nn = $('#bp-none', root); if (nn) nn.onclick = () => { closeSheet(); onPick(''); };
  });
}

// Contrôle BPU : réservé au responsable de secteur, à l'écart des fiches
function renderBpu() {
  if (!isSecteur()) { main.innerHTML = '<div class="empty">Réservé au responsable de secteur.</div>'; return; }
  if (!realReady()) { main.innerHTML = `${backLink('#/plus', 'Plus')}<div class="empty"><strong>Mise à jour nécessaire.</strong>Lancez d'abord le script « 21-produits-reels » dans Supabase.</div>`; return; }
  const f = S.filters; f.bpuQ ||= ''; f.bpuN ||= 15; f.bpuHQ ||= ''; f.bpuOQ ||= ''; f.bpuTab ||= 'todo';
  const lines = () => S.products.filter((p) => p.active && !p.rubrique_id && (p.bpu_line != null || isRub(p))).sort((a, b) => (a.bpu_line ?? 9999) - (b.bpu_line ?? 9999) || String(a.code).localeCompare(String(b.code), 'fr', { numeric: true }));
  const total = (p) => round2(S.sites.reduce((a, s) => a + (isRub(p) ? kidsOf(p).reduce((x, k) => x + Number(stockOf(k, s.id).quantity || 0), 0) : Number(stockOf(p, s.id).quantity || 0)), 0));
  const draw = () => {
    const L = lines();
    const horsAll = activeProducts().filter((p) => !p.rubrique_id && p.bpu_line == null && !p.hors_bpu);
    const hors = horsAll.filter((p) => matches(p, f.bpuHQ));
    const others = activeProducts().filter((p) => !p.rubrique_id && p.hors_bpu);
    const linked = activeProducts().filter((p) => p.rubrique_id || p.bpu_line != null).length;
    const shown = L.filter((p) => !f.bpuQ || matches(p, f.bpuQ) || kidsOf(p).some((k) => matches(k, f.bpuQ)));
    main.innerHTML = `${backLink('#/plus', 'Plus')}
      <div class="page-head"><h1>Contrôle BPU</h1><p class="muted">Réservé au responsable de secteur. Chaque produit réel est rattaché à une ligne du BPU du marché : c'est ici qu'on vérifie qu'on respecte l'appel d'offres. Les agents ne voient jamais le BPU.</p></div>
      <div class="facts"><div class="fact"><div class="v">${L.length}</div><div class="k">Lignes du BPU</div></div><div class="fact"><div class="v">${linked}</div><div class="k">Produits rattachés</div></div><div class="fact"><div class="v" style="color:${horsAll.length ? 'var(--danger)' : 'var(--ok)'}">${horsAll.length}</div><div class="k">À rattacher</div></div><div class="fact"><div class="v">${others.length}</div><div class="k">Autre</div></div></div>
      ${bpuLegend()}
      <div class="chips" id="bpu-tabs" role="tablist">
        <button type="button" class="chip-btn" role="tab" data-t="todo" aria-pressed="${f.bpuTab === 'todo'}">À rattacher (${horsAll.length})</button>
        <button type="button" class="chip-btn" role="tab" data-t="lines" aria-pressed="${f.bpuTab === 'lines'}">Lignes du BPU (${L.length})</button>
        <button type="button" class="chip-btn" role="tab" data-t="other" aria-pressed="${f.bpuTab === 'other'}">Autres : hors BPU (${others.length})</button></div>
      ${f.bpuTab !== 'todo' ? '' : horsAll.length ? `<section class="section"><h2>À rattacher (${horsAll.length})</h2><p class="small muted">Touchez « Rattacher » pour chercher la ligne du BPU. Si elle n'existe pas : « Autres (produit hors BPU) ».</p>
        ${searchBox('bpu-hq', f.bpuHQ, 'Chercher un produit à rattacher…')}
        <div class="stack">${hors.slice(0, f.bpuN).map((p) => `<div class="card stack ${bpuBand(p)}" data-hb="${p.id}"><div><b>${esc(p.name)}</b>${brandHead(p)}<br><span class="small muted">${esc(p.family)} · ${esc(p.packaging || '')}</span></div>
          <button type="button" class="btn primary block" data-hgo="${p.id}">${ICON.search}Rattacher à une ligne du BPU</button></div>`).join('')}
        ${!hors.length ? '<div class="empty">Aucun produit ne correspond.</div>' : ''}
        ${hors.length > f.bpuN ? `<button type="button" class="btn block" id="bpu-more">Voir la suite (${hors.length - f.bpuN} restants)</button>` : ''}</div></section>` : '<div class="notice ok" style="display:block">Tous les produits sont rattachés à une ligne du BPU.</div>'}
      ${f.bpuTab === 'other' ? `<section class="section"><h2>Autres : produits hors BPU (${others.length})</h2>

        <div class="list">${others.filter((p) => matches(p, f.bpuOQ)).map((p) => `<button type="button" class="item ${bpuBand(p)}" data-hgo="${p.id}" style="text-align:left;width:100%"><span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.family)} · ${esc(p.packaging || '')}</span></span><span class="small">Changer</span></button>`).join('') || `<div class="empty">${others.length ? 'Aucun produit ne correspond.' : '<strong>Aucun produit hors BPU.</strong>Dans l\'onglet « À rattacher », le bouton « Rattacher » propose « Autres : produit hors BPU ».'}</div>`}</div></section>` : ''}
      ${f.bpuTab !== 'lines' ? '' : `<section class="section"><h2>Les lignes du BPU</h2>${searchBox('bpu-q', f.bpuQ, 'Rechercher une ligne ou un produit')}
        <div class="list">${shown.map((l) => { const ks = kidsOf(l); return `<a class="item bpu-band bb-bpu" href="#/p/${esc(l.code)}"><span class="main-txt"><span class="title">${l.bpu_line != null ? `<span class="mono">${l.bpu_line}</span> · ` : ''}${esc(l.name)}</span>

    const bm = $('#bpu-more'); if (bm) bm.onclick = () => { f.bpuN += 15; draw(); };

    const oq = $('#bpu-oq'); if (oq) oq.oninput = (e) => { f.bpuOQ = e.target.value; clearTimeout(f.bpuOT); f.bpuOT = setTimeout(() => { draw(); const i = $('#bpu-oq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 300); };
    const bq = $('#bpu-q'); if (bq) bq.oninput = (e) => { f.bpuQ = e.target.value; clearTimeout(f.bpuT); f.bpuT = setTimeout(() => { draw(); const i = $('#bpu-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 300); };
    $$('[data-hgo]').forEach((b) => {
      b.onclick = () => {
        const p = S.byId[b.dataset.hgo];
        openBpuPick(p, async (v) => {
          if (v === 'other' && !horsReady()) return toast('Lancez d\'abord le script « 23-bpu-autre » dans Supabase.', true);
          const row = bpuRow(v);
          const { error } = await S.sb.from('products').update(row).eq('id', p.id);
          if (error) return toast(errMsg(error), true);
          Object.assign(p, row); S._kp = null;
          try { saveSnapshot(); } catch { /* rien */ }
          toast(v === 'other' ? `${p.name} : classé dans Autres (hors BPU)` : v ? `${p.name} : rattaché au BPU` : `${p.name} : rattachement retiré`); draw();
        });
      };
    });
  };
  draw();
}

// Écran du responsable de secteur : vérifier le classement proposé

    main.innerHTML = `${backLink('#/plus', 'Plus')}

        <div class="meter ok"><span style="width:${prods.length ? Math.max(3, done / prods.length * 100) : 0}%"></span></div></div>
      <div class="chips" id="cl-mode"><button type="button" class="chip-btn" data-m="todo" aria-pressed="${f.clMode === 'todo'}">À vérifier</button><button type="button" class="chip-btn" data-m="all" aria-pressed="${f.clMode === 'all'}">Tous</button></div>

// Famille devinée à partir du texte de l'étiquette
const FAM_KEYS = [
  ['Autolaveuse', /autolaveuse|auto-laveuse|monobrosse|anti-?mousse|disque|\bpad\b/],
  ['Cuisine', /vaisselle|lave-?vaisselle|lave-?verres|rin[cç]age|cuisine|four|plonge|inox|alimentaire|graisse cuite/],
  ['Sanitaires', /\bwc\b|sanitaire|d[ée]tartr|calcaire|urinoir|cuvette|douche|canalisation|d[ée]boucheur/],
  ['Hygiène des mains', /savon|mains|hydro-?alcoolique|antiseptique|cr[èe]me lavante/],
  ['Linge', /lessive|linge|textile|assouplissant|d[ée]tachant textile/],
  ['Surfaces et vitres', /vitre|verre|miroir|surface|multi-?usage|d[ée]poussi[ée]rant|mobilier|table/],
  ['Sols', /\bsols?\b|carrelage|parquet|cire|d[ée]capant|moquette|dalles?/],
  ['Désinfection et désodorisation', /d[ée]sinfect|bact[ée]ricide|virucide|d[ée]sodoris|surodorant|parfum/],
  ['Technique et maintenance', /insecticide|d[ée]grippant|lubrifiant|insectes|rampants/],
  ['Papier et essuyage', /papier|essuie|bobine|ouate|mouchoir|toilette/],
  ['Sacs et déchets', /\bsacs?\b|poubelle|d[ée]chets|conteneur/],
  ['Protection', /gants?|masque|charlotte|tablier|surchaussure|nitrile|vinyle|latex/],
  ['Art de la table', /assiette|gobelet|couvert|fourchette|cuill|serviette/],
  ['Accessoires de nettoyage', /[ée]ponge|lavette|frange|serpill|microfibre|gaze/],
];
function guessFamily(text) {
  const t = String(text || '').toLowerCase();
  for (const [f, re] of FAM_KEYS) if (re.test(t)) return f;
  return '';
}
// Produit du catalogue qui ressemble le plus au texte lu
function guessProduct(text) {
  const norm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ');
  const words = new Set(norm(text).split(/\s+/).filter((w) => w.length > 3));
  let best = null, score = 0;
  for (const p of activeProducts()) {
    const pw = norm(p.name).split(/\s+/).filter((w) => w.length > 3);
    if (!pw.length) continue;
    const hit = pw.filter((w) => words.has(w)).length / pw.length;
    if (hit > score) { score = hit; best = p; }
  }
  return score >= 0.6 ? best : null;
}
// Nom probable : les lignes en gros caractères de l'étiquette (sans la marque)
function guessName(text) {
  const brands = [...KNOWN_BRANDS, ...(S.knownBrands || [])].map((b) => b.toLowerCase());
  const lines = String(text || '').split('\n').map((l) => l.replace(/[|_*«»"“”©®™]/g, ' ').replace(/\s+/g, ' ').trim());
  const okLine = (l) => l.length >= 3 && l.length <= 40 && /\p{L}{3}/u.test(l) && !brands.includes(l.toLowerCase())
    && !/www\.|@|t[ée]l|\d{5}|danger|attention|contient|provoque|^\d/i.test(l);
  const caps = (l) => /^[A-ZÀ-Ý0-9 \-'’&]+$/.test(l);
  let best = -1, bestScore = 0;
  lines.forEach((l, i) => {
    if (!okLine(l)) return;
    const sc = (guessFamily(l) ? 3 : 0) + (caps(l) ? 2 : 0) + Math.min(l.length, 30) / 30;
    if (sc > bestScore) { bestScore = sc; best = i; }
  });
  if (best < 0) return '';
  let a = best, z = best;
  if (caps(lines[best])) {
    while (a > 0 && okLine(lines[a - 1]) && caps(lines[a - 1])) a -= 1;
    while (z < lines.length - 1 && okLine(lines[z + 1]) && caps(lines[z + 1])) z += 1;
  }
  const n = lines.slice(a, z + 1).join(' ').slice(0, 60);
  return caps(n) ? n.charAt(0) + n.slice(1).toLowerCase() : n;
}

// Import groupé des fiches de sécurité : la base envoyée par Adelya (ZIP ou PDF) est lue,
// chaque fiche est rangée sur son produit et remplace l'ancienne version de la même marque.
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const JSZIP = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
async function pdfText(file, maxPages = 2) {
  await loadScript(PDFJS);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let out = '';
  for (let i = 1; i <= Math.min(maxPages, doc.numPages); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    let lastY = null;
    for (const it of tc.items) {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      out += (lastY != null && y !== lastY ? '\n' : ' ') + it.str;
      lastY = y;
    }
    out += '\n';
  }
  try { doc.destroy(); } catch { /* rien */ }
  return out;
}
// Nom commercial écrit en rubrique 1 de la fiche
function sheetTradeName(text) {
  const lines = String(text || '').split(/\n/).map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const K = /(?:nom (?:commercial|du produit|de la pr[ée]paration)|identificateur (?:de|du) produit|d[ée]signation (?:commerciale|du produit)|product name|trade name)\s*[:\-]?\s*(.*)$/i;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(K);
    if (m) { let v = (m[1] || '').trim() || lines[i + 1] || ''; const m2 = v.match(K); if (m2) v = (m2[1] || '').trim() || lines[i + 2] || ''; if (v.length > 1 && v.length < 90) return v.replace(/^[:\-\s]+/, ''); }
  }
  return '';
}
async function expandFiles(list, onStep) {
  const out = [];
  for (const f of list) {
    if (/\.zip$/i.test(f.name) || /zip/.test(f.type || '')) {
      onStep && onStep(`Ouverture de ${f.name}…`);
      await loadScript(JSZIP);
      const zip = await window.JSZip.loadAsync(f);
      for (const e of Object.values(zip.files)) {
        if (e.dir || /(^|\/)(__MACOSX|\.)/.test(e.name) || !/\.(pdf|jpe?g|png)$/i.test(e.name)) continue;
        const blob = await e.async('blob');
        const name = e.name.split('/').pop();
        const type = /\.pdf$/i.test(name) ? 'application/pdf' : /\.png$/i.test(name) ? 'image/png' : 'image/jpeg';
        out.push(new File([blob], name, { type }));
      }
    } else out.push(f);
  }
  return out;
}

function fitCrop(img) {
  const m = /#crop=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(img.getAttribute('src') || '');
  if (!m || !img.naturalWidth) return;
  let box = img.parentNode;
  if (!box.classList || !box.classList.contains('cropbox')) {
    const r0 = img.getBoundingClientRect();
    box = document.createElement('span');
    box.className = 'cropbox';
    box.style.width = (r0.width || img.width || 60) + 'px';
    box.style.height = (r0.height || img.height || 60) + 'px';
    img.parentNode.insertBefore(box, img);
    box.appendChild(img);
  }
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const [l, t, w, hh] = m.slice(1).map(Number);

  const cw = nw * w / 100, ch = nh * hh / 100;

const normTxt = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ');
const STOPW = new Set(['pour', 'avec', 'sans', 'des', 'les', 'une', 'par', 'sur', 'aux', 'cm', 'bidon', 'flacon', 'carton', 'litre', 'litres', 'piece', 'lot', 'sachet', 'nettoyant', 'detergent', 'produit']);
const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function allRefs() {
  const out = [];
  for (const p of activeProducts()) for (const r of p.refs || []) if (r.name || r.adelya_ref) out.push({ p, r });
  return out;
}
function matchRefs(text) {
  const T = ' ' + normTxt(text).replace(/[^a-z0-9]+/g, ' ') + ' ';
  const Tc = T.replace(/ /g, '');
  const words = new Set(T.split(' ').filter((w) => w.length >= 3));
  const res = [];
  for (const it of allRefs()) {
    const { r } = it;
    let sc = 0, why = [];
    const ref = normTxt(r.adelya_ref).replace(/[^a-z0-9]/g, '');
    if (ref.length >= 5 && new RegExp(`(^|[^a-z0-9])${escRe(ref)}([^a-z0-9]|$)`).test(T)) { sc += 100; why.push('référence'); }
    const bk = normTxt(r.brand).replace(/[^a-z0-9 ]/g, '').trim();
    if (bk && bk !== 'adelya' && (T.includes(` ${bk} `) || Tc.includes(bk.replace(/ /g, '')))) { sc += 25; why.push('marque'); }
    const toks = [...new Set(normTxt(r.name).split(/[^a-z0-9]+/).filter((w) => w.length >= 3 && !STOPW.has(w)))];
    if (toks.length) {
      const hits = toks.filter((w) => words.has(w) || (w.length >= 5 && Tc.includes(w))).length;
      sc += Math.round(45 * hits / toks.length) + hits * 3;
      if (hits) why.push(`${hits}/${toks.length} mots du nom`);
    }
    const pk = guessPack(text);
    if (sc >= 30 && pk && normTxt(r.packaging).replace(/\s/g, '').includes(normTxt(pk).replace(/\s/g, '').replace(',', '.').replace('.', ','))) { sc += 8; why.push('conditionnement'); }
    if (sc >= 30) res.push({ ...it, sc, why });
  }
  return res.sort((a, b) => b.sc - a.sc).slice(0, 5);
}
function suggestRubrique(text) {
  const words = new Set(normTxt(text).split(/[^a-z0-9]+/).filter((w) => w.length >= 4 && !STOPW.has(w)));
  let best = null, score = 0;
  for (const p of activeProducts()) {
    const pool = [p.name, ...(p.refs || []).map((r) => r.name)].join(' ');
    const toks = [...new Set(normTxt(pool).split(/[^a-z0-9]+/).filter((w) => w.length >= 4 && !STOPW.has(w)))];
    const own = normTxt(p.name).split(/[^a-z0-9]+/).filter((w) => w.length >= 4 && !STOPW.has(w));
    const sc = toks.filter((w) => words.has(w)).length + 2 * own.filter((w) => words.has(w)).length;
    if (sc > score) { score = sc; best = p; }
  }
  return score >= 2 ? best : null;
}
const guessBrand = (text) => {
  const T = normTxt(text);

const guessRef = (text) => { const m = String(text || '').toUpperCase().match(/\b(\d{5}[A-Z]?|\d{2}S\d{4})\b/); return m ? m[1] : ''; };

async function shopSearch(q) {
  S.shopCache = S.shopCache || {};
  if (S.shopCache[q]) return S.shopCache[q];
  const out = [];
  for (let page = 1; page <= 3; page++) {
    const res = await fetch(`${SHOP}/wp-json/wc/store/v1/products?search=${encodeURIComponent(q)}&per_page=100&page=${page}`, { credentials: 'omit' });
    if (!res.ok) break;
    const js = await res.json();
    out.push(...js.map((x) => ({ sku: String(x.sku || '').toUpperCase().replace(/\s+/g, ''), name: x.name || '', url: x.permalink || '',
      images: (x.images || []).map((i) => (/^https?:/.test(i.src) ? i.src : SHOP + i.src)) })));
    if (js.length < 100) break;
  }
  S.shopCache[q] = out;
  return out;
}
const shopHit = (sku) => { for (const k in S.shopCache || {}) { const h = S.shopCache[k].find((x) => x.sku === sku); if (h) return h; } return null; };
function shopQueries(r) {
  const w = normTxt(r.name).split(/[^a-z0-9]+/).filter((x) => x.length >= 3 && !STOPW.has(x) && !/^\d/.test(x));
  return [...new Set([w.slice(0, 2).join(' '), w[0], SHOP_ALIAS[normTxt(r.brand)], w[1]].filter(Boolean))];
}
async function shopLookup(r) {
  const sku = String(r.adelya_ref || '').toUpperCase();
  if (!sku) return null;
  let hit = shopHit(sku);
  for (const q of hit ? [] : shopQueries(r)) { hit = (await shopSearch(q)).find((x) => x.sku === sku) || shopHit(sku); if (hit) break; }
  return hit;
}
async function fetchShopPhotos(refs, onStep) {
  let n = 0, i = 0;
  for (const r of refs) {
    onStep && onStep(++i, refs.length, n);
    const hit = await shopLookup(r);
    if (hit && hit.images.length) {
      const { error } = await S.sb.from('product_refs').update({ images: hit.images }).eq('id', r.id);
      if (!error) { r.images = hit.images; n++; }
    }
  }
  return n;
}

// Regroupe les pages de fiche par marque (la marque sans nom d'abord)
function brandGroups(rows) {
  const g = new Map();
  for (const r of rows) { const b = r.brand || ''; if (!g.has(b)) g.set(b, []); g.get(b).push(r); }
  for (const list of g.values()) list.sort((a, b) => a.page - b.page);
  return [...g.entries()].sort((a, b) => (a[0] === '' ? -1 : b[0] === '' ? 1 : a[0].localeCompare(b[0])));
}
async function uploadSheets(p, files, brand = '', quiet = false, revDate = null) {
  const list = Array.from(files || []);
  if (!list.length) return;
  if (!quiet) toast(`Envoi de ${list.length} fichier${list.length > 1 ? 's' : ''}…`);
  const { data: existing } = await S.sb.from('safety_sheets').select('*').eq('product_id', p.id);
  let page = Math.max(0, ...(existing || []).filter((x) => (x.brand || '') === brand).map((x) => x.page));
  try {
    for (const f of list) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (isPdf && f.size > 15 * 1024 * 1024) throw new Error('PDF trop lourd (15 Mo maximum).');
      const body = isPdf ? f : await compressImage(f);
      const path = `${p.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${isPdf ? 'pdf' : 'jpg'}`;
      const up = await S.sb.storage.from('fiches-securite').upload(path, body, { contentType: isPdf ? 'application/pdf' : 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      page += 1;
      const row = { product_id: p.id, file_path: path, file_name: f.name || '', page, uploaded_by: S.me.id };
      if (brand) row.brand = brand;
      if (revDate && S.sheetDatesReady) row.revision_date = revDate;
      const ins = await S.sb.from('safety_sheets').insert(row);
      if (ins.error) throw ins.error;
      p.sheetCount += 1;
    }
    if (quiet) return;
    toast('Fiche de sécurité ajoutée');
    await loadBrands();
  } catch (e) {
    if (quiet) throw e;
    toast(errMsg(e), true);
  }
  render();
}

      <select id="mv-agent"><option value="">Choisir…</option><option value="__team">👥 ${TEAM_NAME}</option>${siteAgents(site).filter((a) => !isTeam(a)).map((a) => `<option value="${a.id}">${esc(a.full_name)}</option>`).join('')}</select>
      <span class="hint">${siteAgents(site).filter((a) => !isTeam(a)).length ? 'La liste des agents se gère dans Plus › Agents.' : 'Ajoutez vos agents dans Plus › Agents pour les retrouver ici.'}</span></div>
    <div class="field" id="mv-period-wrap" hidden><label for="mv-period">Pour quelle période ?</label>
      <select id="mv-period">${['Cette semaine', 'Ce mois-ci', 'Ce trimestre', 'Jusqu\'à épuisement'].map((x) => `<option>${x}</option>`).join('')}</select></div>
    <div class="field" id="mv-price-wrap"><label for="mv-price">Prix unitaire HT (€)</label><input type="text" inputmode="decimal" id="mv-price" value="${p.unit_price != null ? fmt(p.unit_price) : ''}" placeholder="Ex. : 12,50" autocomplete="off"><span class="hint">Prix d'un « ${esc(p.packaging || 'conditionnement')} » sur la facture Adelya. Sert au suivi du budget.</span></div>
    <div class="field" id="mv-ref-wrap"><label for="mv-ref">N° de bon de livraison (facultatif)</label><input type="text" id="mv-ref" autocomplete="off"></div>
    <div class="field"><label for="mv-note" id="mv-note-l">Note (facultatif)</label><input type="text" id="mv-note" autocomplete="off"></div>
    <button type="button" class="btn primary block" id="mv-go">Enregistrer</button>`,
  (root) => {
    let getQty = () => 0;
    let sure = '';
    const resetSure = () => { if (!sure) return; sure = ''; $('#mv-warn', root).hidden = true; $('#mv-go', root).classList.remove('danger'); $('#mv-go', root).textContent = { sortie: 'Enregistrer la sortie', entree: 'Enregistrer l\'entrée', inventaire: 'Enregistrer le comptage' }[k]; };
    const preview = () => {
      resetSure();
      const v = getQty();
      const b = st();
      const after = k === 'entree' ? b + (v || 0) : k === 'sortie' ? b - (v || 0) : (v || 0);
      const el = $('#mv-preview', root);
      if (k === 'sortie' && after < 0) { el.className = 'notice danger'; el.textContent = `Stock insuffisant : il reste ${fmt(b)}.`; }
      else { el.className = 'notice info'; el.innerHTML = `Stock : <strong class="num">${fmt(b)}</strong> → <strong class="num">${fmt(round2(after))}</strong>${k === 'inventaire' ? ` (écart ${after - b > 0 ? '+' : ''}${fmt(round2(after - b))})` : ''}`; }
    };
    const setKind = (nk) => {
      k = nk;
      $$('#mv-kind button', root).forEach((b) => b.setAttribute('aria-pressed', b.dataset.kind === k));
      $('#mv-q-wrap', root).innerHTML = stepperField('mv-q', k === 'inventaire' ? st() : 1, k === 'inventaire' ? 'Quantité comptée en réserve' : 'Quantité');
      getQty = bindStepper(root, 'mv-q', preview);
      $('#mv-ref-wrap', root).hidden = k !== 'entree';
      $('#mv-price-wrap', root).hidden = k !== 'entree';
      $('#mv-agent-wrap', root).hidden = k !== 'sortie' || !S.agentsReady;
      syncTeam();
      $('#mv-note-l', root).textContent = k === 'sortie' ? 'Pour quel endroit ? (facultatif)' : 'Note (facultatif)';
      $('#mv-go', root).textContent = { sortie: 'Enregistrer la sortie', entree: 'Enregistrer l\'entrée', inventaire: 'Enregistrer le comptage' }[k];
      preview();
    };
    const lastAgent = lsGet(`stock.agent.${site}`, '');
    if (lastAgent === '__team' || (lastAgent && S.agentById && S.agentById[lastAgent] && S.agentById[lastAgent].active && !isTeam(S.agentById[lastAgent]))) $('#mv-agent', root).value = lastAgent;
    const syncTeam = () => { $('#mv-period-wrap', root).hidden = k !== 'sortie' || $('#mv-agent', root).value !== '__team'; };
    $('#mv-agent', root).onchange = syncTeam;
    $('#mv-kind', root).onclick = (e) => { const b = e.target.closest('[data-kind]'); if (b) setKind(b.dataset.kind); };
    setKind(k);
    $('#mv-go', root).onclick = async (e) => {
      const v = getQty();
      if (!Number.isFinite(v) || v < 0 || (k !== 'inventaire' && v === 0)) return toast('Indiquez une quantité valide.', true);
      // Garde-fous : on demande une confirmation avant une saisie inhabituelle
      const b0 = st(), warn = [];
      if (k === 'sortie' && v > b0) warn.push(`Le stock n'indique que <strong>${fmt(b0)}</strong>. Si vous sortez ${fmt(v)}, le stock tombera à 0 : il vaut peut-être mieux faire un <strong>comptage</strong>.`);
      else if (k === 'sortie' && v >= 10 && v > b0 * 0.5) warn.push(`<strong>${fmt(v)}</strong> d'un coup, c'est plus de la moitié du stock. Vérifiez la quantité.`);
      if (k === 'entree' && v >= 50) warn.push(`<strong>${fmt(v)}</strong> à l'entrée, c'est beaucoup. Vérifiez qu'il ne s'agit pas d'un nombre de cartons ou d'un zéro en trop.`);
      if (k === 'inventaire' && Math.abs(v - b0) >= 5 && Math.abs(v - b0) > b0 * 0.5) warn.push(`Grand écart avec le stock : <strong>${fmt(b0)} → ${fmt(v)}</strong>. Recomptez si vous avez un doute.`);
      const last = (() => { try { return JSON.parse(sessionStorage.getItem('stock.lastmv') || 'null'); } catch { return null; } })();
      if (last && last.p === p.id && last.k === k && last.q === round2(v) && last.s === site && Date.now() - last.t < 3 * 60 * 1000) warn.push(`Vous venez déjà d'enregistrer exactement la même ${kindLabel[k].toLowerCase()} il y a moins de 3 minutes. Est-ce bien une deuxième ?`);
      const key = `${k}|${round2(v)}`;
      if (warn.length && sure !== key) {
        sure = key;
        const w = $('#mv-warn', root); w.innerHTML = `<strong>À vérifier</strong><br>${warn.join('<br>')}`; w.hidden = false;
        e.target.classList.add('danger'); e.target.textContent = 'C\'est bien ça, enregistrer';
        w.scrollIntoView({ block: 'nearest' });
        return;
      }
      const args = {
        p_site: site, p_product: p.id, p_kind: k, p_qty: round2(v),
        p_reference: k === 'entree' ? $('#mv-ref', root).value.trim() : '',
        p_note: $('#mv-note', root).value.trim(),
      };
      if (k === 'sortie' && S.agentsReady) {
        const ag = $('#mv-agent', root).value;
        if (!ag) { $('#mv-agent', root).focus(); return toast('Indiquez à qui le produit est remis (un agent ou toute l\'équipe).', true); }
        if (ag === '__team') {
          try { args.p_agent = await teamAgentId(site); } catch (er) { return toast(errMsg(er), true); }
          const per = $('#mv-period', root).value;
          args.p_note = [`Période : ${per.toLowerCase()}`, args.p_note].filter(Boolean).join(' · ');
        } else args.p_agent = ag;
        lsSet(`stock.agent.${site}`, ag);
      }
      if (k === 'entree') {
        const raw = $('#mv-price', root).value.trim();
        if (raw) {
          const pr = parseNum(raw);
          if (!Number.isFinite(pr) || pr < 0) return toast('Prix invalide.', true);
          args.p_unit_price = round2(pr);
        }
      }
      busy(e.target, true);
      const r = await rpcOrQueue('record_movement', args, `${kindLabel[k]} · ${fmt(round2(v))} × ${p.name}${args.p_agent && agentName(args.p_agent) ? ` → ${agentName(args.p_agent)}` : ''}`);
      const { error } = r;
      let data = r.data;
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      if (r.queued) {
        const b0 = st(); data = { stock_after: round2(k === 'entree' ? b0 + v : k === 'sortie' ? b0 - v : v) };
        if (data.stock_after < 0) data.stock_after = 0;
      }
      applyStock(p.id, site, data.stock_after);
      try { sessionStorage.setItem('stock.lastmv', JSON.stringify({ p: p.id, k, q: round2(v), s: site, t: Date.now() })); } catch { /* rien */ }
      saveSnapshot();
      if (r.queued) { try { sessionStorage.setItem('stock.lastmv', JSON.stringify({ p: p.id, k, q: round2(v), s: site, t: Date.now() })); } catch { /* rien */ } if (args.p_unit_price != null) p.unit_price = args.p_unit_price; closeSheet(); toast(`${kindLabel[k]} gardée sur le téléphone · envoi au retour du réseau`); render(); return; }
      if (args.p_unit_price != null) p.unit_price = args.p_unit_price;
      closeSheet();
      toast(`${kindLabel[k]} enregistrée · reste ${fmt(data.stock_after)}`);
      render();
    };
  });
}

function productRow(p, site = S.site) {
  const st = stockOf(p, site);
  let s = status(st);
  if (s === 'rupture' && !Number(st.min_quantity)) s = 'vide';
  return `<a class="item" href="#/p/${esc(p.code)}">
    <span class="stripe ${s}"></span>${prodThumb(p, 52)}
    <span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.packaging)}${st.location ? ' · ' + esc(st.location) : ''}${Number(st.min_quantity) ? ` · seuil ${fmt(st.min_quantity)}` : ''}</span>${brandChips(p, true)}</span>
    ${qtyZones(p)}<span class="qty"><span class="n">${fmt(st.quantity)}</span>${s === 'bas' || s === 'rupture' ? pill(s) : ''}</span>
  </a>`;
}
// Pictogrammes d'usage, en ligne juste avant la quantité : l'autolaveuse toujours en premier.
// Couleurs = celles des familles du stock (Sols en bleu, Autolaveuse en nuit…).
const ZONE_PRIO = ['autolaveuse', 'sols'];
const ZONE_FAM = { sols: 'Sols', autolaveuse: 'Autolaveuse', wc: 'Sanitaires', lavabos: 'Sanitaires', surfaces: 'Surfaces et vitres', vitres: 'Surfaces et vitres', cuisine: 'Cuisine', mains: 'Hygiène des mains', linge: 'Linge' };
const zoneStockBub = (z, size) => { const f = FAM_STYLE[ZONE_FAM[z]]; if (!f) return zoneBub(z, size); const k = COUL[f[0]]; return `<span class="zb" style="--c1:${k[0]};--c2:${k[1]};width:${size}px;height:${size}px">${ZONES[z].i}</span>`; };
function qtyZones(p) {
  const zs = pZones(p).slice().sort((a, b) => {
    const ra = ZONE_PRIO.indexOf(a), rb = ZONE_PRIO.indexOf(b);
    return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb) || Object.keys(ZONES).indexOf(a) - Object.keys(ZONES).indexOf(b);
  });
  if (!zs.length) return '';
  const shown = zs.slice(0, 3);
  return `<span class="qzones" aria-label="Usage : ${esc(zs.map((z) => ZONES[z].t).join(', '))}">${shown.map((z) => `<span title="${esc(ZONES[z].t)}">${zoneStockBub(z, 28)}</span>`).join('')}${zs.length > 3 ? `<span class="more">+${zs.length - 3}</span>` : ''}</span>`;
}

}

async function renderRequests(tok) {
  const [pending, done] = await Promise.all([
    S.sb.from('requests').select('*, request_items(*)').eq('site_id', S.site).eq('status', 'en_attente').order('created_at'),
    S.sb.from('requests').select('*, request_items(*)').eq('site_id', S.site).neq('status', 'en_attente').order('created_at', { ascending: false }).limit(30),
  ]);
  if (pending.error) throw pending.error;

  await refreshStocks();
  if (stale(tok)) return;
  S.pending = pending.data.length; renderTabs();
  const stLabel = { validee: ['ok', 'Remise'], refusee: ['danger', 'Refusée'], annulee: ['', 'Annulée'] };
  main.innerHTML = `

    <section class="section"><h2>En attente</h2>

async function renderDelivery() {
  if (!canManage()) { main.innerHTML = '<div class="empty">Seul le responsable de ce site peut enregistrer une livraison.</div>'; return; }
  const draft = S.draftIn;
  let q = '';
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}
    <div class="page-head"><h1>Entrée de stock</h1><p class="muted">Livraison Adelya · ${esc(siteName(S.site))}. Saisissez les quantités reçues, puis enregistrez.</p></div>
    <div id="in-orders"></div>
    <div class="field"><label for="in-ref">N° de bon de livraison</label><input type="text" id="in-ref" value="${esc(S.draftInRef)}" autocomplete="off" placeholder="Facultatif"></div>
    ${searchBox('in-q', '', 'Rechercher un produit')}
    ${scopeBar()}
    <div id="in-list"></div>
    <div class="cartbar" id="in-bar" hidden><button type="button" class="btn primary" id="in-go"></button></div>`;
  const draw = () => {
    const list = scopedProducts().filter((p) => matches(p, q));
    $('#in-list').innerHTML = `<div class="list">${groupByFamily(list).map(([fam, ps]) => `<div class="group-label">${famLabel(fam)}</div>${ps.map((p) => `
      <div class="item"><span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.packaging)} · en stock ${fmt(stockOf(p).quantity)}</span></span>${miniStepper(p.id, draft[p.id])}</div>`).join('')}`).join('')}</div>`;
  };
  const bar = () => {
    const n = Object.keys(draft).length;
    $('#in-bar').hidden = !n;
    $('#in-go').textContent = `Enregistrer la livraison · ${n} ligne${n > 1 ? 's' : ''}`;
  };
  draw(); bar();
  drawOpenOrdersNotice($('#in-orders'), S.site, S.tok, (n) => `Cette livraison correspond à un bon de commande ? Réceptionnez-la plutôt depuis le bon : les ${n} produit${n > 1 ? 's' : ''} en attente seront suivis.`);
  bindMiniSteppers($('#in-list'), draft, bar);
  $('#in-q').oninput = (e) => { q = e.target.value; draw(); };
  $('#in-ref').oninput = (e) => { S.draftInRef = e.target.value; };
  $('#in-go').onclick = () => {
    const ids = Object.keys(draft).filter((id) => S.byId[id]);
    const prices = {};
    for (const id of ids) if (S.byId[id].unit_price != null) prices[id] = Number(S.byId[id].unit_price);
    openSheet(`<h2 id="sheet-title">Confirmer la livraison</h2>
      <p class="muted small">${esc(siteName(S.site))}${S.draftInRef ? ' · BL ' + esc(S.draftInRef) : ''}</p>
      <p class="small muted">Indiquez le prix unitaire HT de la facture. Il est prérempli avec le dernier prix connu.</p>
      <div class="list">${ids.map((id) => `<div class="item"><span class="main-txt"><span class="title">${esc(S.byId[id].name)}${brandHead(S.byId[id])}</span><span class="sub">+${fmt(draft[id])} · ${esc(S.byId[id].packaging)}</span><span class="sub" data-line="${id}"></span></span>
        <span class="qty"><input type="text" inputmode="decimal" class="price-in" data-price="${id}" value="${prices[id] != null ? fmt(prices[id]) : ''}" placeholder="€ HT" aria-label="Prix unitaire HT de ${esc(S.byId[id].name)}"></span></div>`).join('')}</div>
      <div class="notice info" id="in-total"></div>
      <button type="button" class="btn primary block" id="in-ok">Enregistrer l'entrée</button>
      <button type="button" class="btn ghost block" data-close-sheet>Modifier</button>`,
    (root) => {
      const total = () => {
        let t = 0, missing = 0;
        for (const id of ids) {
          const el = $(`[data-line="${id}"]`, root);
          if (prices[id] != null) { const a = prices[id] * draft[id]; t += a; el.textContent = `= ${money(a)} HT`; } else { missing += 1; el.textContent = 'Prix non renseigné'; }
        }
        $('#in-total', root).innerHTML = `Total de la livraison : <strong>${money(t)} HT</strong>${missing ? ` · ${missing} ligne${missing > 1 ? 's' : ''} sans prix` : ''}`;
      };
      root.addEventListener('input', (e) => {
        const inp = e.target.closest('[data-price]');
        if (!inp) return;
        const v = parseNum(inp.value);
        if (inp.value.trim() !== '' && Number.isFinite(v) && v >= 0) prices[inp.dataset.price] = round2(v); else delete prices[inp.dataset.price];
        total();
      });
      total();
      $('#in-ok', root).onclick = async (e) => {
        busy(e.target, true);
        const lines = ids.map((id) => (prices[id] != null ? { product_id: id, quantity: draft[id], unit_price: prices[id] } : { product_id: id, quantity: draft[id] }));
        const { error, queued } = await rpcOrQueue('record_movements', { p_site: S.site, p_kind: 'entree', p_lines: lines, p_reference: S.draftInRef.trim(), p_note: 'Livraison' }, `Entrée · ${lines.length} produit${lines.length > 1 ? 's' : ''}${S.draftInRef.trim() ? ` · BL ${S.draftInRef.trim()}` : ''}`);
        if (queued) { lines.forEach((l) => applyStock(l.product_id, S.site, Number(stockOf(S.byId[l.product_id]).quantity) + Number(l.quantity))); saveSnapshot(); }
        busy(e.target, false);
        if (error) return toast(errMsg(error), true);
        for (const id of ids) if (prices[id] != null) S.byId[id].unit_price = prices[id];
        for (const k of Object.keys(draft)) delete draft[k];
        S.draftInRef = '';
        await refreshStocks();
        closeSheet(); toast(`Livraison enregistrée · ${lines.length} produit${lines.length > 1 ? 's' : ''}`);

// ---------------------------------------------------------------------
// INVENTAIRE PAR PHOTO D'ÉTAGÈRE : le téléphone lit les étiquettes et
// propose les produits du catalogue ; on coche et on tape les quantités.
// ---------------------------------------------------------------------
const PH_STOP = new Set(['pour', 'avec', 'sans', 'bidon', 'flacon', 'litre', 'litres', 'carton', 'paquet', 'boite', 'sachet', 'rouleau', 'rouleaux', 'unite', 'unites', 'produit', 'produits', 'usage', 'tous', 'toutes', 'type', 'format', 'grand', 'petit', 'blanc', 'blanche']);
const phNorm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const phWords = (x) => phNorm(x).split(' ').filter((w) => w.length >= 4 && !PH_STOP.has(w) && !/^\d+$/.test(w));
// Deux mots « se ressemblent » malgré une lettre mal lue
function phClose(a, b) {
  if (a === b) return true;
  if (a.length >= 5 && b.length >= 5 && (a.startsWith(b.slice(0, 5)) || b.startsWith(a.slice(0, 5)))) return true;
  if (Math.abs(a.length - b.length) > 1 || a.length < 6) return false;
  let d = 0;
  for (let i = 0, j = 0; i < a.length && j < b.length; i++, j++) {
    if (a.at(i) !== b.at(j)) { d += 1; if (d > 1) return false; if (a.length > b.length) j -= 1; else if (b.length > a.length) i -= 1; }
  }
  return true;
}
// Produits du catalogue présents dans le texte lu, du plus sûr au moins sûr
function matchShelf(text, products) {
  const seen = phWords(text);
  const flat = ` ${phNorm(text)} `;
  if (!seen.length) return [];
  const found = (w) => seen.some((s) => phClose(s, w));
  const out = [];
  for (const p of products) {
    let score = 0, why = [];
    const ref = String(p.adelya_ref || '').replace(/\D/g, '');
    if (ref.length >= 4 && flat.includes(ref)) { score = 1; why.push('référence'); }
    for (const al of String(p.aliases || '').split(/[,;\n]/).map((x) => x.trim()).filter(Boolean)) {
      const aw = phWords(al);
      if (aw.length && aw.every(found)) { score = Math.max(score, 0.95); why.push(`« ${al} »`); }
    }
    const nw = [...new Set(phWords(p.name))];
    if (nw.length) {
      const hit = nw.filter(found).length;
      const s = hit / nw.length;
      if (hit >= Math.min(2, nw.length) && s >= (nw.length >= 3 ? 0.6 : 0.5) && s > score) { score = s; why.push('nom'); }
    }
    const br = (p.brands || []).find((b) => phWords(b).length && phWords(b).every(found));
    if (br && score > 0) { score = Math.min(1, score + 0.2); why.push(br); }
    if (score >= 0.5) out.push({ p, score, why: [...new Set(why)].join(', ') });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 30);
}
// Lecture : l'image entière, puis (lecture fine) en quatre morceaux agrandis
async function readShelf(file, fine, onStep) {
  const img = await loadImage(file);
  const w = await ocrWorker((st, pr) => onStep && onStep(st, pr));
  const crop = (sx, sy, sw, sh, max) => {
    const k = Math.min(max / Math.max(sw, sh), 2.2);
    const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.35)'; g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c;
  };
  const W = img.width, H = img.height;
  const parts = fine
    ? [[0, 0, W * 0.55, H * 0.55], [W * 0.45, 0, W * 0.55, H * 0.55], [0, H * 0.45, W * 0.55, H * 0.55], [W * 0.45, H * 0.45, W * 0.55, H * 0.55]]
    : [[0, 0, W, H]];
  let text = '';
  // Texte épars (étiquettes dispersées sur la photo)
  try { await w.setParameters({ tessedit_pageseg_mode: '11' }); } catch { /* version sans réglage */ }
  for (let i = 0; i < parts.length; i++) {
    onStep && onStep(fine ? `Lecture fine ${i + 1} / ${parts.length}` : 'Lecture des étiquettes', 0);
    const [x, y, cw, ch] = parts.at(i);
    const { data } = await w.recognize(crop(x, y, cw, ch, fine ? 1800 : 2200));
    text += '\n' + (data.text || '');
  }
  try { await w.setParameters({ tessedit_pageseg_mode: '3' }); } catch { /* rien */ }
  return text;
}

        : file ? '<div class="notice" style="display:block;margin-top:10px">Aucun produit reconnu sur cette photo. Essayez la lecture fine, rapprochez-vous des étiquettes, ou ajoutez les produits à la main.</div>' : ''}
