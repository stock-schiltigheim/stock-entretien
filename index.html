function renderSelection() {
  const site = S.site;
  main.innerHTML = `${backLink('#/plus', 'Plus')}<div class="page-head"><h1>Produits de ${esc(siteShort(site))}</h1></div>`;
  if (!canManage(site)) { main.insertAdjacentHTML('beforeend', '<div class="empty">Seul le responsable de ce site peut modifier sa liste.</div>'); return; }
  if (!inUseReady()) { main.insertAdjacentHTML('beforeend', '<div class="notice danger" style="display:block">La base de données doit être mise à jour : lancez le script « 6-produits-du-site » dans Supabase, puis rechargez l\'application.</div>'); return; }
  const locked = (p) => { const st = stockOf(p, site); return Number(st.quantity) !== 0 || Number(st.min_quantity) > 0; };
  const chosen = new Set(siteProducts(site).map((p) => p.id));
  let q = '', fam = 'Tout', view = 'tout';
  const fams = [...new Set(activeProducts().map((p) => p.family))].sort((a, b) => famRank(a) - famRank(b) || a.localeCompare(b));
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}
    <div class="page-head"><h1>Produits de ${esc(siteShort(site))}</h1>
      <p class="muted">Cochez les produits utilisés au ${esc(siteName(site))}. Seuls ceux-ci apparaîtront dans le stock, les demandes des agents, les entrées, l'inventaire et les commandes. Le reste du catalogue reste accessible avec « Tout le catalogue ».</p></div>
    ${searchBox('se-q', '', 'Rechercher un produit')}
    <div class="chips" id="se-view"><button type="button" class="chip-btn" data-view="tout" aria-pressed="true">Tout le catalogue</button><button type="button" class="chip-btn" data-view="coches" aria-pressed="false">Cochés seulement</button></div>
    <div class="chips" id="se-fam">${['Tout', ...fams].map((f) => `<button type="button" class="chip-btn" data-fam="${esc(f)}" aria-pressed="${f === 'Tout'}">${esc(f)}</button>`).join('')}</div>
    <div id="se-list"></div>
    <div class="cartbar" id="se-bar"><button type="button" class="btn primary" id="se-save"></button></div>`;
  const bar = () => { $('#se-save').textContent = `Enregistrer · ${chosen.size} produit${chosen.size > 1 ? 's' : ''} pour ${siteShort(site)}`; };
  const draw = () => {
    const list = activeProducts().filter((p) => matches(p, q) && (fam === 'Tout' || p.family === fam) && (view === 'tout' || chosen.has(p.id)));
    const g = new Map();
    for (const p of list) { if (!g.has(p.family)) g.set(p.family, []); g.get(p.family).push(p); }
    const groups = [...g.entries()].sort((a, b) => famRank(a[0]) - famRank(b[0]));
    $('#se-list').innerHTML = list.length ? `<div class="list">${groups.map(([f, ps]) => {
      const all = ps.every((p) => chosen.has(p.id));
      return `<div class="group-label row" style="justify-content:space-between"><span>${esc(f)}</span><button type="button" class="linkish" data-famall="${esc(f)}" data-on="${all ? 0 : 1}">${all ? 'Tout décocher' : 'Tout cocher'}</button></div>
      ${ps.map((p) => `<label class="item" style="cursor:pointer"><input type="checkbox" data-pid="${p.id}" ${chosen.has(p.id) ? 'checked' : ''} ${locked(p) ? 'disabled' : ''} style="width:24px;height:24px;flex:none;accent-color:var(--accent)">
        <span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.packaging)}${locked(p) ? ` · en stock ${fmt(stockOf(p, site).quantity)}, reste dans la liste` : ''}</span></span></label>`).join('')}`;
    }).join('')}</div>` : '<div class="empty">Aucun produit.</div>';
  };
  draw(); bar();
  $('#se-list').addEventListener('change', (e) => {
    const c = e.target.closest('[data-pid]');
    if (!c) return;
    if (c.checked) chosen.add(c.dataset.pid); else chosen.delete(c.dataset.pid);
    bar();
  });
  $('#se-list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-famall]');
    if (!b) return;
    e.preventDefault();
    const on = b.dataset.on === '1';
    for (const p of activeProducts()) if (p.family === b.dataset.famall && matches(p, q) && !locked(p)) { if (on) chosen.add(p.id); else chosen.delete(p.id); }
    draw(); bar();
  });
  $('#se-q').oninput = (e) => { q = e.target.value; draw(); };
  $('#se-view').onclick = (e) => { const b = e.target.closest('[data-view]'); if (!b) return; view = b.dataset.view; $$('#se-view .chip-btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(); };
  $('#se-fam').onclick = (e) => { const b = e.target.closest('[data-fam]'); if (!b) return; fam = b.dataset.fam; $$('#se-fam .chip-btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(); };
  $('#se-save').onclick = async (e) => {
    busy(e.target, true);
    const ids = [...chosen];
    const { error } = await S.sb.rpc('set_site_products', { p_site: site, p_used: ids });
    busy(e.target, false);
    if (error) return toast(errMsg(error), true);
    for (const p of S.products) if (p.stockBy[site]) p.stockBy[site].in_use = chosen.has(p.id);
    S.showAll = false;
    toast(`Liste de ${siteShort(site)} enregistrée · ${siteProducts(site).length} produits`);
    bar();
  };
}

function missingCatalog() {
  return CATALOG.filter(([code]) => !S.byCode[code]);
}
function drawCatalog() {
  const box = $('#pa-cat');
  if (!box) return;
  const miss = missingCatalog();
  if (!miss.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="card stack">
    <h2>Catalogue Adelya complet</h2>
    <p class="muted small">${miss.length} produit${miss.length > 1 ? 's' : ''} du bordereau de prix (BPU lot 1) ne ${miss.length > 1 ? 'sont' : 'est'} pas encore dans la liste. Ajoutez-les en une fois, puis archivez ceux qui ne servent pas.</p>
    <button type="button" class="btn primary block" id="pa-cat-go">${ICON.plus}Ajouter les ${miss.length} produits</button>
  </div>`;
  $('#pa-cat-go').onclick = async (e) => {
    const btn = e.currentTarget;
    busy(btn, true, 'Ajout en cours…');
    try {
      const rows = missingCatalog().map(([code, family, name, packaging, bpu_line, chemical]) => {
        const u = UNIT_MAP[code];
        const r = { code, family, name: (u && u[3]) || name, packaging: u ? u[0] : packaging, bpu_line, chemical };
        if (unitsReady() && u) { r.order_pack = u[1]; r.per_pack = u[2]; }
        return r;
      });
      for (let i = 0; i < rows.length; i += 50) {
        const { error } = await S.sb.from('products').upsert(rows.slice(i, i + 50), { onConflict: 'code', ignoreDuplicates: true });
        if (error) throw error;
      }
      await reloadProducts();
      toast(`${rows.length} produits ajoutés`);
      render();
    } catch (err) {
      busy(btn, false);
      toast(errMsg(err), true);
    }
  };
}

    const list = S.products.filter((p) => (showArchived || p.active) && matches(p, q)).sort((a, b) => key(a).localeCompare(key(b), 'fr', { numeric: true }));
    $('#pa-list').innerHTML = list.length ? `<div class="list">${groupByFamily(list).map(([fam, ps]) => `<div class="group-label">${famLabel(fam)}</div>${ps.map((p) => `
      <a class="item${p.rubrique_id ? ' kid' : ''}${realReady() ? ` ${bpuBand(p)}` : ''}" href="#/produit/${p.id}/modifier"><span class="main-txt"><span class="title">${p.rubrique_id ? '↳ ' : ''}${esc(p.name)}${p.active ? '' : ' (archivé)'}${isRub(p) ? ` <span class="pill">Rubrique · ${kidsOf(p).length} produit${kidsOf(p).length > 1 ? 's' : ''}</span>` : ''}${brandHead(p)}</span>
      <span class="sub"><span class="mono">${esc(p.code)}</span> · ${esc(p.packaging)}${p.bpu_line ? ` · BPU ${p.bpu_line}` : ''}</span></span>
      <span class="qty">${p.chemical ? (p.sheetCount || fdsLinkOf(p) ? '<span class="pill ok">FDS</span>' : '<span class="pill warn">Sans FDS</span>') : ''}</span></a>`).join('')}`).join('')}</div>`
      : '<div class="empty">Aucun produit.</div>';
  };
  draw();
  drawCatalog();
  $('#pa-q').oninput = (e) => { q = e.target.value; draw(); };
  $('#pa-photo').onclick = newProductFromPhoto;
  $('#pa-arch').onchange = (e) => { showArchived = e.target.checked; draw(); };
}

function nextCode(family) {
  const prefix = (family || 'DIV').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'DIV';
  const existing = S.products.find((p) => p.family === family);
  const pre = existing ? existing.code.split('-')[0] : prefix;
  let n = 1;
  while (S.byCode[`${pre}-${String(n).padStart(2, '0')}`]) n++;
  return `${pre}-${String(n).padStart(2, '0')}`;
}

    busy(btn, true);
    const res = isNew ? await S.sb.from('products').insert(row) : await S.sb.from('products').update(row).eq('id', p.id);

    }
    if (isNew) S.newProductDraft = null;
    toast(isNew ? 'Produit créé' : 'Produit enregistré');
    go(`#/p/${code}`);
  };

function openUser(u) {
  const self = u.id === S.me.id;
  openSheet(`
    <h2 id="sheet-title">${esc(u.full_name)}</h2>
    ${self ? '<p class="notice info">Vous ne pouvez pas modifier votre propre rôle.</p>' : ''}

    <div class="field" id="u-site-f"><label for="u-site">Site</label><select id="u-site" ${self ? 'disabled' : ''}>

    ${self ? '' : `<button type="button" class="btn primary block" id="u-go">${u.active ? 'Enregistrer' : 'Valider l\'accès'}</button>
    ${u.active ? '<button type="button" class="btn danger block" id="u-off">Retirer l\'accès</button>' : '<button type="button" class="btn ghost block" id="u-del">Refuser ce compte</button>'}`}`,
  (root) => {
    const roleSel = $('#u-role', root);
    const syncSite = () => { $('#u-site-f', root).hidden = roleSel.value === 'secteur'; };
    syncSite();
    roleSel.onchange = syncSite;
    const save = async (patch, msg, btn) => {
      busy(btn, true);
      const { error } = await S.sb.from('profiles').update(patch).eq('id', u.id);
      busy(btn, false);
      if (error) return toast(errMsg(error), true);
      closeSheet(); toast(msg); render();
    };
    const go2 = $('#u-go', root);
    if (go2) go2.onclick = (e) => save({ role: roleSel.value, site_id: roleSel.value === 'secteur' ? null : Number($('#u-site', root).value), active: true }, u.active ? 'Compte modifié' : 'Accès validé', e.target);
    const off = $('#u-off', root);
    if (off) off.onclick = (e) => save({ active: false }, 'Accès retiré', e.target);
    const del = $('#u-del', root);
    if (del) del.onclick = async (e) => {
      busy(e.target, true);
      const { error } = await S.sb.from('profiles').delete().eq('id', u.id);
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      closeSheet(); toast('Compte refusé'); render();
    };
  });
}

function renderAuth(mode = 'login') {
  if (mode === 'recovery') {
    authShell(`<form class="card stack" id="rc-f" novalidate><h2>Nouveau mot de passe</h2>
      <div class="field"><label for="rc-pw">Mot de passe (8 caractères minimum)</label><input type="password" id="rc-pw" autocomplete="new-password"></div>
      <button type="submit" class="btn primary">Enregistrer</button></form>`);
    $('#rc-f').onsubmit = async (e) => {
      e.preventDefault();
      const pw = $('#rc-pw').value;
      if (pw.length < 8) return toast('8 caractères minimum.', true);
      const { error } = await S.sb.auth.updateUser({ password: pw });
      if (error) return toast(errMsg(error), true);
      toast('Mot de passe enregistré');
      afterLogin();
    };
    return;
  }
  const signup = mode === 'signup';
  authShell(`
    <div class="seg" id="au-mode"><button type="button" data-m="login" aria-pressed="${!signup}">Se connecter</button><button type="button" data-m="signup" aria-pressed="${signup}">Créer mon compte</button></div>
    <form class="stack" id="au-f" novalidate>
      ${signup ? '<div class="field"><label for="au-name">Prénom et nom</label><input type="text" id="au-name" autocomplete="name" required></div>' : ''}
      <div class="field"><label for="au-email">Adresse e-mail</label><input type="email" id="au-email" autocomplete="email" inputmode="email" autocapitalize="none" required></div>
      <div class="field"><label for="au-pw">Mot de passe${signup ? ' (8 caractères minimum)' : ''}</label><input type="password" id="au-pw" autocomplete="${signup ? 'new-password' : 'current-password'}" required></div>
      <button type="submit" class="btn primary block" id="au-go">${signup ? 'Créer mon compte' : 'Se connecter'}</button>
      ${signup ? '<p class="small muted">Votre accès sera activé par le responsable de secteur.</p>' : '<button type="button" class="btn ghost block" id="au-forgot">Mot de passe oublié</button>'}
    </form>`);
  $('#au-mode').onclick = (e) => { const b = e.target.closest('[data-m]'); if (b) renderAuth(b.dataset.m); };
  const forgot = $('#au-forgot');
  if (forgot) forgot.onclick = async () => {
    const email = $('#au-email').value.trim();
    if (!email) return toast('Saisissez d\'abord votre adresse e-mail.', true);
    const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: appBaseUrl() });
    if (error) return toast(errMsg(error), true);
    toast('Un lien pour changer le mot de passe a été envoyé par e-mail.');
  };
  $('#au-f').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#au-email').value.trim(), pw = $('#au-pw').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Adresse e-mail invalide.', true);
    const btn = $('#au-go');
    if (signup) {
      const name = $('#au-name').value.trim();
      if (!name) return toast('Indiquez votre prénom et votre nom.', true);
      if (pw.length < 8) return toast('Le mot de passe doit contenir au moins 8 caractères.', true);
      busy(btn, true, 'Création…');
      const { data, error } = await S.sb.auth.signUp({ email, password: pw, options: { data: { full_name: name }, emailRedirectTo: appBaseUrl() } });
      busy(btn, false);
      if (error) return toast(errMsg(error), true);
      if (!data.session) {
        authShell('<div class="card stack"><h2>Compte créé</h2><p>Confirmez votre adresse avec le lien reçu par e-mail, puis connectez-vous.</p><button type="button" class="btn primary" id="au-back">Se connecter</button></div>');
        $('#au-back').onclick = () => renderAuth('login');
        return;
      }
      return afterLogin();
    }
    busy(btn, true, 'Connexion…');
    const { error } = await S.sb.auth.signInWithPassword({ email, password: pw });
    busy(btn, false);
    if (error) return toast(errMsg(error), true);
    afterLogin();
  };
}

function renderWaiting(kind) {
  const msg = {
    pending: ['Compte en attente', 'Votre compte est créé. Le responsable de secteur doit maintenant valider votre accès et vous attribuer un site. Revenez ici ensuite.'],
    nosite: ['Site à attribuer', 'Votre accès est validé, mais aucun site ne vous est encore attribué. Prévenez le responsable de secteur.'],
    removed: ['Accès refusé', 'Ce compte n\'a pas accès à l\'application. Rapprochez-vous du responsable de secteur.'],
  }[kind];
  authShell(`<div class="card stack"><h2>${msg[0]}</h2><p>${msg[1]}</p>
    <button type="button" class="btn primary" id="w-retry">Vérifier à nouveau</button>
    <button type="button" class="btn ghost" id="w-out">Se déconnecter</button></div>`);
  $('#w-retry').onclick = () => afterLogin();
  $('#w-out').onclick = async () => { await S.sb.auth.signOut(); renderAuth(); };
}

let pollTimer = 0;
async function afterLogin() {
  let user = null, uerr = null;
  try { const r = await S.sb.auth.getUser(); user = r.data.user; uerr = r.error; } catch (e) { uerr = e; }
  if (!user && uerr && isNetErr(uerr)) return startOffline();
  if (!user) return renderAuth();
  const { data: me, error } = await S.sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error && isNetErr(error)) return startOffline(user.id);
  if (error) { authShell(`<div class="notice danger">${esc(errMsg(error))}</div>`); return; }
  if (!me) return renderWaiting('removed');
  if (!me.active) return renderWaiting('pending');
  if (me.role !== 'secteur' && !me.site_id) return renderWaiting('nosite');
  S.me = me;
  main.innerHTML = '<div class="loading">Chargement…</div>';
  try {
    await loadCore();
    S.offline = false;
    saveSnapshot();
  } catch (e) {
    if (isNetErr(e)) return startOffline(me.id);
    authShell(`<div class="notice danger">${esc(errMsg(e))}</div><button type="button" class="btn" onclick="location.reload()">Réessayer</button>`);
    return;
  }
  S.site = me.role === 'secteur' ? (S.sites.some((s) => s.id === lsGet('stock.site', 1)) ? lsGet('stock.site', 1) : S.sites[0]?.id) : me.site_id;
  renderChrome();
  if (!location.hash || location.hash === '#' || location.hash === '#/') location.replace('#/accueil');
  render();
  refreshBadges();
  notifsDemarrer();
  netbar();
  flushOutbox();
  fdsAutoSync();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') refreshBadges(); }, 45000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) refreshBadges(); });

const VAPID_PUBLIC = 'BBhi8vXWSRnYk61o8tS7qyLC2gsmY13BZZ4MZIw0sH3d6WJKIi0sIH_n0SZFGKbCZ6A4wDIqhS0iQOFLJRNNUcU';

const nonLues = () => S.notifs.filter((n) => !n.lu).length;
function majBulle() {
  const n = nonLues(); const b = $('#bell-n'); const bell = $('#bell');

  if (b) { b.hidden = !n; b.textContent = n > 99 ? '99+' : String(n); }

async function loadNotifs() {
  if (!S.me || !S.sb || !isResp()) return;
  const { data, error } = await S.sb.from('se_notifs').select('*').order('created_at', { ascending: false }).limit(80);

}
function notifsDemarrer() {
  loadNotifs().then(() => pushEtat()).then((e) => { S.pushEtat = e; if ($('#npanel')) dessinerPanneau(); }).catch(() => {});
  clearInterval(notifTimer);
  notifTimer = setInterval(() => { if (document.visibilityState === 'visible') loadNotifs(); }, 45000);

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) loadNotifs(); });
async function marquerLu(ids) {
  ids = ids.filter((id) => S.notifs.some((n) => n.id === id && !n.lu));
  if (!ids.length) return;
  S.notifs.forEach((n) => { if (ids.includes(n.id)) n.lu = true; });
  majBulle();
  await S.sb.from('se_notifs').update({ lu: true }).in('id', ids);
}
// Ouvrir l'historique marque les alertes de mouvements comme lues
function notifVue() {
  if (!S.notifs.length) return;
  const h = '#/' + (route()[0] || '');
  const ids = S.notifs.filter((n) => !n.lu && n.lien && n.lien === h).map((n) => n.id);
  if (ids.length) marquerLu(ids);
}
function depuis(t) {
  const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 1) return 'à l\'instant';
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return dfTime.format(new Date(t));
}
function pushHTML() {
  const e = S.pushEtat;
  if (e === 'actif') return '<div class="npush">✔ Les alertes arrivent aussi sur ce téléphone. <button type="button" class="linkish" data-pushoff="1">Arrêter</button></div>';
  if (e === 'inactif') return '<div class="npush"><span style="flex:1;min-width:170px"><strong>Recevoir les alertes sur ce téléphone</strong>, même application fermée.</span><button type="button" class="btn primary small" data-pushon="1">Activer</button></div>';
  if (e === 'refuse') return '<div class="npush">Les notifications sont bloquées pour cette application. Autorisez-les dans les réglages du téléphone (Applications › Stocks › Notifications).</div>';
  if (e === 'ios-installer') return '<div class="npush">Sur iPhone, ajoutez d\'abord l\'application à l\'écran d\'accueil (Partager › Sur l\'écran d\'accueil), puis ouvrez-la depuis son icône.</div>';
  return '';
}
function dessinerPanneau() {
  const p = $('#npanel'); if (!p) return;
  const nl = nonLues();
  p.innerHTML = `<div class="nh"><h3>Alertes${nl ? ` · ${nl} non lue${nl > 1 ? 's' : ''}` : ''}</h3><span class="row" style="gap:12px">${nl ? '<button type="button" class="linkish" id="n-all">Tout marquer comme lu</button>' : ''}<button type="button" class="linkish" id="n-x" aria-label="Fermer">✕</button></span></div>
    ${pushHTML()}
    <div class="nlist">${S.notifs.length ? S.notifs.map((n) => `<button type="button" class="nitem ${n.lu ? '' : 'new'} k-${esc(n.kind || '')}" data-nid="${n.id}"><span class="nd"></span><span class="nb"><strong>${esc(n.titre)}</strong><span class="nt">${esc(n.corps)}</span><span class="nw">${esc(depuis(n.created_at))}</span></span></button>`).join('')
      : '<div class="empty" style="margin:12px">Aucune alerte pour l\'instant. Chaque entrée ou sortie de matériel apparaîtra ici.</div>'}</div>`;
  $('#n-x', p).onclick = fermerPanneau;

  $$('[data-nid]', p).forEach((b) => {
    b.onclick = () => {
      const n = S.notifs.find((x) => x.id === b.dataset.nid);
      fermerPanneau(); marquerLu([n.id]);
      if (n.site_id && isSecteur() && n.site_id !== S.site) { S.site = n.site_id; lsSet('stock.site', S.site); renderChrome(); }
      if (n.lien) go(n.lien);
    };
  });
  $$('[data-pushon]', p).forEach((b) => { b.onclick = async () => { busy(b, true, 'Activation…'); try { await pushActiver(); toast('Alertes activées sur ce téléphone'); } catch (e) { toast(errMsg(e), true); } busy(b, false); S.pushEtat = await pushEtat(); dessinerPanneau(); }; });
  $$('[data-pushoff]', p).forEach((b) => { b.onclick = async () => { try { await pushArreter(); toast('Alertes arrêtées sur ce téléphone'); } catch (e) { toast(errMsg(e), true); } S.pushEtat = await pushEtat(); dessinerPanneau(); }; });
}
function fermerPanneau() { const p = $('#npanel'); if (p) p.remove(); document.removeEventListener('click', clicDehors, true); }
function clicDehors(ev) { const p = $('#npanel'); if (p && !p.contains(ev.target) && !$('#bell').contains(ev.target)) fermerPanneau(); }
$('#bell').onclick = () => {
  if ($('#npanel')) return fermerPanneau();
  const p = document.createElement('div');
  p.className = 'npanel'; p.id = 'npanel'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Alertes');
  document.body.appendChild(p); dessinerPanneau(); loadNotifs();
  pushEtat().then((e) => { S.pushEtat = e; dessinerPanneau(); });
  setTimeout(() => document.addEventListener('click', clicDehors, true), 0);
};
window.addEventListener('hashchange', fermerPanneau);

const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const installee = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64u(t) { const pad = '='.repeat((4 - (t.length % 4)) % 4); const b = atob((t + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); }
async function pushEtat() {
  if (!S.notifOK) return '';
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return estIOS && !installee() ? 'ios-installer' : '';
  if (Notification.permission === 'denied') return 'refuse';
  try { const reg = swReg || (await navigator.serviceWorker.ready); const sub = await reg.pushManager.getSubscription(); return sub && Notification.permission === 'granted' ? 'actif' : 'inactif'; } catch { return 'inactif'; }
}
async function pushActiver() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications refusées. Autorisez-les dans les réglages du téléphone, puis réessayez.' : 'Notifications non autorisées.');
  const reg = swReg || (await navigator.serviceWorker.ready);
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
  const j = sub.toJSON();
  const { error } = await S.sb.from('se_push').upsert({ endpoint: j.endpoint, user_id: S.me.id, abonnement: j }, { onConflict: 'endpoint' });
  if (error) throw error;
}
async function pushArreter() {
  const reg = swReg || (await navigator.serviceWorker.ready);
  const sub = await reg.pushManager.getSubscription();
  if (sub) { await S.sb.from('se_push').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
}

// MODE HORS CONNEXION
// • l'application et les données (produits, stock, consignes) sont gardées sur le téléphone
// • les sorties, entrées, comptages et demandes saisis sans réseau sont mis en attente
//   puis envoyés tout seuls au retour du réseau

const SNAP = 'stock.snap.v1', OUTBOX = 'stock.outbox', FDS_IDX = 'stock.fdsIndex', FDS_ON = 'stock.fdsOffline', FDS_CACHE = 'stock-fds-v1';
const isNetErr = (e) => !navigator.onLine || /fetch|network|load failed|timed? ?out|AuthRetryable/i.test(String((e && (e.message || e.name)) || e || ''));
const isOffline = () => !!S.offline || !navigator.onLine;
let snapTimer = 0;
function saveSnapshot() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    if (!S.me || !S.products) return;
    const products = S.products.map(({ safety_sheets: _s, stocks: _t, ...p }) => p);
    lsSet(SNAP, { at: new Date().toISOString(), me: S.me, sites: S.sites, settings: S.settings, profiles: S.profiles, agents: S.agents, products,
      flags: { ordersReady: S.ordersReady, brandsReady: S.brandsReady, sheetDatesReady: S.sheetDatesReady, agentsReady: S.agentsReady } });
  }, 400);
}
function restoreSnapshot(userId) {
  const s = lsGet(SNAP, null);
  if (!s || !s.me || (userId && s.me.id !== userId)) return false;
  S.me = s.me; S.sites = s.sites; S.settings = s.settings; S.profiles = s.profiles || {};
  S.agents = s.agents || []; S.agentById = Object.fromEntries(S.agents.map((a) => [a.id, a]));
  Object.assign(S, s.flags || {});
  S.products = s.products; S.byCode = Object.fromEntries(S.products.map((p) => [p.code, p])); S.byId = Object.fromEntries(S.products.map((p) => [p.id, p]));
  S.knownBrands = [...new Set(S.products.flatMap((p) => p.brands || []))].sort();
  S.snapAt = s.at;
  return true;
}
// Identité gardée par Supabase sur le téléphone (même si le jeton a expiré)
function storedUserId() {
  try {
    const ref = new URL(CFG.supabaseUrl).hostname.split('.')[0];
    const raw = JSON.parse(localStorage.getItem(`sb-${ref}-auth-token`) || 'null');
    return (raw && (raw.user?.id || raw.currentSession?.user?.id)) || null;
  } catch { return null; }
}
function startOffline(userId) {
  if (!restoreSnapshot(userId || storedUserId())) {
    authShell(`<div class="card stack"><h2>Pas de réseau</h2><p>Les données ne sont pas encore enregistrées sur ce téléphone. Ouvrez l'application une première fois avec du réseau : ensuite, elle marchera aussi sans réseau.</p><button type="button" class="btn primary" onclick="location.reload()">Réessayer</button></div>`);
    return;
  }
  S.offline = true;
  S.site = S.me.role === 'secteur' ? (S.sites.some((s) => s.id === lsGet('stock.site', 1)) ? lsGet('stock.site', 1) : S.sites[0]?.id) : S.me.site_id;
  renderChrome();
  if (!location.hash || location.hash === '#' || location.hash === '#/') location.replace('#/accueil');
  render();
  netbar();
}

// File d'attente des opérations saisies sans réseau
const outbox = () => lsGet(OUTBOX, []);
const saveOutbox = (l) => { lsSet(OUTBOX, l); netbar(); };
const stampNote = (note) => [note, `saisi hors connexion le ${dfShort.format(new Date())} à ${dfHour.format(new Date())}`].filter(Boolean).join(' · ');
async function rpcOrQueue(name, args, label) {
  if (!isOffline()) {
    const r = await S.sb.rpc(name, args);
    if (!r.error || !isNetErr(r.error)) return r;
  }
  const a = { ...args, p_note: stampNote(args.p_note || '') };
  saveOutbox([...outbox(), { id: Math.random().toString(36).slice(2), name, args: a, label, at: new Date().toISOString(), site: args.p_site ?? S.site, err: null }]);
  return { data: null, error: null, queued: true };
}
let syncing = false;
async function flushOutbox() {
  if (syncing || !navigator.onLine || !S.sb) return;
  let list = outbox().filter((x) => !x.err);
  if (!list.length) return;
  syncing = true; netbar();
  let sent = 0;
  try {
    await S.sb.auth.getSession(); // renouvelle la connexion si besoin
    for (const it of list) {
      const r = await S.sb.rpc(it.name, it.args);
      const cur = outbox();
      if (r.error && isNetErr(r.error)) break;
      if (r.error) { const x = cur.find((y) => y.id === it.id); if (x) x.err = errMsg(r.error); saveOutbox(cur); continue; }
      saveOutbox(cur.filter((y) => y.id !== it.id)); sent += 1;
    }
  } finally { syncing = false; netbar(); }
  if (sent) {
    toast(`${sent} opération${sent > 1 ? 's' : ''} saisie${sent > 1 ? 's' : ''} hors connexion envoyée${sent > 1 ? 's' : ''}`);
    await refreshStocks(); saveSnapshot();
    if (!$('#sheet') || $('#sheet').hidden) render();
  }
}
async function backOnline() {
  if (!S.me) return;
  await flushOutbox();
  if (S.offline) {
    try { await loadCore(); S.offline = false; saveSnapshot(); toast('Réseau revenu : données à jour'); } catch { return; }
    if (!$('#sheet') || $('#sheet').hidden) render();
    refreshBadges();
  }
  netbar();
  fdsAutoSync();
}
window.addEventListener('online', () => setTimeout(backOnline, 800));
window.addEventListener('offline', () => { netbar(); if (S.me && (route()[0] || 'accueil') === 'accueil' && (!$('#sheet') || $('#sheet').hidden)) render(); });
setInterval(() => { if (navigator.onLine && outbox().some((x) => !x.err)) flushOutbox(); }, 30000);

// Bandeau d'état sous l'en-tête
function netbar() {
  let el = $('#netbar');
  if (!el) { const top = $('#topbar'); if (!top) return; top.insertAdjacentHTML('afterend', '<div id="netbar" class="netbar" hidden></div>'); el = $('#netbar'); }
  if (!S.me) { el.hidden = true; return; }
  const l = outbox(), wait = l.filter((x) => !x.err).length, ko = l.filter((x) => x.err).length;
  const off = isOffline();
  if (!off && !wait && !ko) { el.hidden = true; return; }
  el.hidden = false;
  el.className = `netbar ${ko ? 'ko' : off ? 'off' : 'sync'}`;
  el.innerHTML = `<button type="button" id="netbar-b">${off ? '⚠︎ Hors connexion' : syncing ? '⟳ Envoi en cours…' : wait ? '⟳ Réseau revenu' : ''}${wait ? ` · ${wait} en attente d'envoi` : off ? ' · vos saisies sont gardées sur le téléphone' : ''}${ko ? ` · ${ko} refusée${ko > 1 ? 's' : ''}` : ''}</button>`;
  $('#netbar-b').onclick = openOutbox;
}
function openOutbox() {
  const l = outbox();
  openSheet(`<h2 id="sheet-title">${isOffline() ? 'Hors connexion' : 'Saisies hors connexion'}</h2>
    <p class="small muted">${isOffline() ? `Les données affichées datent du ${S.snapAt ? esc(dfTime.format(new Date(S.snapAt))) : 'dernier passage avec réseau'}. Les sorties, entrées, comptages et demandes sont gardés sur le téléphone et partent tout seuls dès que le réseau revient.` : 'Ces opérations ont été saisies sans réseau.'}</p>
    ${l.length ? `<div class="list">${l.map((x) => `<div class="item"><span class="main-txt"><span class="title">${esc(x.label)}</span><span class="sub">${esc(dfTime.format(new Date(x.at)))}${x.err ? '' : ' · en attente'}</span>${x.err ? `<span class="sub" style="color:var(--danger);font-weight:700">Refusé : ${esc(x.err)}</span>` : ''}</span>

    ${!isOffline() && l.some((x) => !x.err) ? '<button type="button" class="btn primary block" id="ob-send">Envoyer maintenant</button>' : ''}
    <button type="button" class="btn ghost block" data-close-sheet>Fermer</button>`, (root) => {

  });
}

// Fiches de sécurité gardées sur le téléphone
const fdsKey = (path) => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}__fds/${encodeURIComponent(path)}`;
async function fdsOfflineUrls(paths) {
  const out = {};
  if (!('caches' in window)) return out;
  try {
    const c = await caches.open(FDS_CACHE);
    for (const p of paths) { const r = await c.match(fdsKey(p)); if (r) out[p] = URL.createObjectURL(await r.blob()); }
  } catch { /* rien */ }
  return out;
}
let fdsSyncing = false;
async function syncFdsOffline(onStep) {
  if (fdsSyncing || isOffline() || !('caches' in window)) return null;
  fdsSyncing = true;
  try {
    const want = new Set((siteHasList() ? siteProducts() : activeProducts()).map((p) => p.id));
    const rows = (await fetchAll(() => S.sb.from('safety_sheets').select('*').order('product_id'))).filter((r) => want.has(r.product_id));
    const c = await caches.open(FDS_CACHE);
    const have = new Set((await c.keys()).map((k) => k.url));
    const todo = rows.filter((r) => !have.has(fdsKey(r.file_path)));
    let done = 0;
    for (let i = 0; i < todo.length; i += 20) {
      const part = todo.slice(i, i + 20);
      const { data } = await S.sb.storage.from('fiches-securite').createSignedUrls(part.map((r) => r.file_path), 600);
      for (const d of data || []) {
        if (!d.signedUrl) continue;
        try { const res = await fetch(d.signedUrl); if (res.ok) await c.put(fdsKey(d.path), new Response(await res.blob(), { headers: { 'Content-Type': res.headers.get('Content-Type') || '' } })); } catch { /* suivante */ }
        done += 1; onStep && onStep(done, todo.length);
      }
    }
    // On retire les fiches remplacées ou supprimées
    const keep = new Set(rows.map((r) => fdsKey(r.file_path)));
    for (const k of await c.keys()) if (!keep.has(k.url)) await c.delete(k);
    const idx = {};
    for (const r of rows) (idx[r.product_id] = idx[r.product_id] || []).push({ id: r.id, file_path: r.file_path, brand: r.brand || '', page: r.page, revision_date: r.revision_date || null, product_id: r.product_id });
    lsSet(FDS_IDX, { at: new Date().toISOString(), n: rows.length, idx });
    return rows.length;
  } finally { fdsSyncing = false; }
}
function fdsAutoSync() { if (lsGet(FDS_ON, false) && !isOffline()) setTimeout(() => syncFdsOffline().catch(() => {}), 4000); }

// Démarrage
// ---------------------------------------------------------------------
async function boot() {
  if (!CFG.supabaseUrl || /COLLER/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || /COLLER/.test(CFG.supabaseAnonKey)) return renderConfigMissing();
  if (!window.supabase) { authShell('<div class="notice danger">Impossible de charger l\'application. Vérifiez la connexion Internet, puis rechargez la page.</div>'); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let recovering = /type=recovery/.test(location.hash);
  S.sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; renderAuth('recovery'); }
  });
  let session = null;
  try { session = (await S.sb.auth.getSession()).data.session; } catch { /* hors connexion */ }
  if (recovering) return renderAuth('recovery');
  if (!session) { if (!navigator.onLine && storedUserId()) return startOffline(); return renderAuth(); }
  afterLogin();
}
boot();
})();

<script>
/* Tactile : sur le plateau, le doigt choisit le rond le plus proche (même s'il tourne ou s'il est incliné en 3D) */
(function () {
  let down = null, fired = 0, firedIn = null;
  const nearest = (o, x, y) => {
    let best = null, bd = Infinity;
    for (const b of o.querySelectorAll('.bul')) { const l = b.querySelector('b'); if (!l) continue; const r = l.getBoundingClientRect(); if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) return b; } // sur l'étiquette
    o.querySelectorAll('.bul').forEach((b) => {
      const r = (b.querySelector('.rond') || b).getBoundingClientRect();
      const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)) / (r.width / 2);
      if (d < bd) { bd = d; best = b; }
    });
    return bd <= 1.6 ? best : null; // jusqu'à 60 % plus loin que le bord du rond
  };
  const clear = () => document.querySelectorAll('.taped').forEach((x) => x.classList.remove('taped'));
  document.addEventListener('pointerdown', (e) => {
    down = null;
    if (e.button > 0) return;
    const btn = e.target.closest && e.target.closest('.btn, .tab, a.card, button.card, .tile, .apps-big a, .item');
    if (btn) btn.classList.add('taped');
    const o = [...document.querySelectorAll('.orbite')].find((x) => { const r = x.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; });
    if (!o) return;
    const b = nearest(o, e.clientX, e.clientY);
    if (!b) return;
    o.classList.add('pause'); b.classList.add('taped');
    down = { b, o, x: e.clientX, y: e.clientY, t: Date.now() };
  }, { passive: true, capture: true });
  document.addEventListener('pointercancel', () => { down = null; clear(); }, true);
  document.addEventListener('pointerup', (e) => {
    const d = down; down = null; setTimeout(clear, 150);
    if (!d) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 16 || Date.now() - d.t > 900) return; // c'était un glissement
    fired = Date.now(); firedIn = d.o;
    d.b.click();
  }, true);
  // le « click » du navigateur qui suit est ignoré : le rond a déjà été ouvert
  document.addEventListener('click', (e) => {
    if (!e.isTrusted || !firedIn || Date.now() - fired > 800) return;
    const r = firedIn.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
