  if (stale(tok)) return;
  let fam = 'Tout', q = '', onlyTodo = false;
  const list = () => scopedProducts(site);
  main.innerHTML = `${head}
    <div class="inv-prog card"><div class="row"><strong id="ct-prog"></strong><button type="button" class="btn small ghost" id="ct-refresh">Actualiser</button></div>
      <div class="ct-track"><span id="ct-bar"></span></div>
      <p class="small muted">Lancé le ${esc(dfTime.format(new Date(session.created_at)))} par ${esc(personName(session.created_by))}. Comptez ce qui est réellement dans les locaux de rangement (pas ce qui est déjà chez les agents), sans regarder le stock de l'application.</p>
      ${manage && 'agents_ok' in session ? `<label class="row small" style="gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="ct-agents" ${session.agents_ok ? 'checked' : ''} style="width:20px;height:20px;accent-color:#c8102e"> <span>Ouvert aux agents du site</span></label>` : ''}</div>
    <button type="button" class="btn primary block" id="ct-photo">${ICON.camera || ICON.scan}Compter une étagère en photo</button>
    ${manage ? scopeBar() : ''}
    ${searchBox('ct-q', '', 'Chercher un produit')}
    <div class="chips" id="ct-todo"><button type="button" class="chip-btn" data-todo="0" aria-pressed="true">Tous</button><button type="button" class="chip-btn" data-todo="1" aria-pressed="false">Pas encore comptés</button></div>
    ${famChips('ct-fam', fam)}
    <div class="list" id="ct-list"></div>
    ${manage ? `<div class="cartbar" id="ct-barre"><button type="button" class="btn primary" id="ct-review">Voir les écarts et valider</button></div>
      <button type="button" class="btn ghost block" id="ct-cancel" style="margin-top:18px">Annuler cet inventaire</button>` : ''}`;
  const norm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const prog = () => {
    const ids = new Set(list().map((p) => p.id));
    const n = Object.keys(counts).filter((id) => ids.has(id)).length;
    $('#ct-prog').textContent = `${n} / ${ids.size} produits comptés`;
    $('#ct-bar').style.width = `${ids.size ? Math.round(100 * n / ids.size) : 0}%`;
  };
  const row = (p) => {
    const c = counts[p.id];
    return `<div class="item ct-item${c ? ' done' : ''}" data-row="${p.id}">${prodThumb(p, 44)}
      <span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span><span class="sub">${esc(p.packaging || '')}${(p.brands || []).length ? ' · ' + esc(p.brands.join(', ')) : ''}</span>
      <span class="sub ct-by">${c ? `✔ compté par ${esc(whoCounted(c.counted_by))} à ${esc(dfHour.format(new Date(c.counted_at)))}` : ''}</span></span>
      <input type="text" inputmode="decimal" class="ct-in" data-cnt="${p.id}" value="${c ? fmt(c.counted) : ''}" placeholder="—" aria-label="Quantité comptée pour ${esc(p.name)}"></div>`;
  };
  const draw = () => {
    const nq = norm(q);
    const ps = list().filter((p) => (fam === 'Tout' || p.family === fam) && (!onlyTodo || !counts[p.id])
      && (!nq || norm(`${p.name} ${p.code} ${refText(p)}`).includes(nq)));
    $('#ct-list').innerHTML = ps.length ? groupByFamily(ps).map(([f, xs]) => `<h3 class="fam-h">${esc(f)}</h3>${xs.map(row).join('')}`).join('')
      : `<div class="empty">${onlyTodo ? '<strong>Tout est compté 👍</strong>' : 'Aucun produit.'}</div>`;
    prog();
  };
  draw();
  $('#ct-list').addEventListener('change', async (e) => {
    const inp = e.target.closest('[data-cnt]');
    if (!inp) return;
    const id = inp.dataset.cnt;
    const v = parseNum(inp.value);
    const empty = inp.value.trim() === '';
    if (!empty && (!Number.isFinite(v) || v < 0)) { toast('Quantité invalide', true); inp.value = counts[id] ? fmt(counts[id].counted) : ''; return; }
    const qty = empty ? null : round2(v);
    inp.disabled = true;
    const { error } = await S.sb.rpc('inv_compter', { p_session: session.id, p_product: id, p_qty: qty });
    inp.disabled = false;
    if (error) { toast(errMsg(error), true); return; }
    if (qty == null) delete counts[id];
    else counts[id] = { product_id: id, counted: qty, counted_by: S.me.id, counted_at: new Date().toISOString() };
    const r = inp.closest('[data-row]');
    r.classList.toggle('done', qty != null);
    $('.ct-by', r).textContent = qty != null ? `✔ compté par vous à ${dfHour.format(new Date())}` : '';
    inp.value = qty != null ? fmt(qty) : '';
    prog();
  });
  $('#ct-photo').onclick = () => openShelfPhoto({
    products: activeProducts(), counts, canPlace: manage,
    onSave: async (p, qty, place, add) => {
      const total = add && counts[p.id] ? round2(Number(counts[p.id].counted) + qty) : qty;
      const { error } = await S.sb.rpc('inv_compter', { p_session: session.id, p_product: p.id, p_qty: total });
      if (error) throw error;
      counts[p.id] = { product_id: p.id, counted: total, counted_by: S.me.id, counted_at: new Date().toISOString() };
      if (manage && place) {
        const { error: e2 } = await S.sb.from('stocks').update({ location: place }).eq('site_id', site).eq('product_id', p.id);
        if (!e2 && p.stockBy && p.stockBy[site]) p.stockBy[site].location = place;
      }
      draw();
    },
  });
  const ag = $('#ct-agents');
  if (ag) ag.onchange = async () => {
    const { error } = await S.sb.rpc('inv_agents', { p_session: session.id, p_ok: ag.checked });
    if (error) { ag.checked = !ag.checked; return toast(errMsg(error), true); }
    toast(ag.checked ? 'Les agents du site peuvent compter' : 'Inventaire réservé aux responsables');
  };
  // Entrée = produit suivant
  $('#ct-list').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !e.target.matches('[data-cnt]')) return;
    e.preventDefault();
    const all = $$('[data-cnt]', main);
    const nx = all[all.indexOf(e.target) + 1];
    e.target.blur();
    if (nx) nx.focus();
  });
  $('#ct-q').oninput = (e) => { q = e.target.value; draw(); };
  $('#ct-fam').onclick = (e) => {
    const b = e.target.closest('[data-fam]'); if (!b) return;
    fam = b.dataset.fam; $$('#ct-fam .chip-btn').forEach((x) => x.setAttribute('aria-pressed', x === b)); draw();
  };
  $('#ct-todo').onclick = (e) => {
    const b = e.target.closest('[data-todo]'); if (!b) return;
    onlyTodo = b.dataset.todo === '1'; $$('#ct-todo .chip-btn').forEach((x) => x.setAttribute('aria-pressed', x === b)); draw();
  };
  const refresh = async () => {
    try { await loadCounts(); } catch { return; }
    if (stale(tok)) return;
    const st = await fetchOpenInv(site);
    if (stale(tok)) return;
    if (!st.session || st.session.id !== session.id) { toast('L\'inventaire a été clôturé par le responsable'); render(); return; }
    if (document.activeElement && document.activeElement.matches('[data-cnt]')) { prog(); return; }
    draw();
  };
  $('#ct-refresh').onclick = refresh;
  // Les chiffres des collègues arrivent tout seuls toutes les 20 secondes
  const timer = setInterval(() => { if (stale(tok)) clearInterval(timer); else refresh(); }, 20000);
  if (!manage) return;
  $('#ct-cancel').onclick = () => openSheet(`<h2 id="sheet-title">Annuler l'inventaire ?</h2>
      <p>Les ${Object.keys(counts).length} comptages déjà saisis seront abandonnés. Le stock ne change pas.</p>
      <button type="button" class="btn danger block" id="ct-cancel-ok">Oui, annuler l'inventaire</button>
      <button type="button" class="btn ghost block" data-close-sheet>Non, continuer</button>`, (root) => {
    $('#ct-cancel-ok', root).onclick = async (e) => {
      busy(e.target, true);
      const { error } = await S.sb.rpc('inv_annuler', { p_session: session.id });
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      closeSheet(); toast('Inventaire annulé'); go('#/inventaire');
    };
  });
  $('#ct-review').onclick = async () => {
    await loadCounts(); await refreshStocks();
    if (stale(tok)) return;
    draw();
    const ids = Object.keys(counts).filter((id) => S.byId[id]);
    if (!ids.length) return toast('Aucun produit compté pour l\'instant.', true);
    const lines = ids.map((id) => {
      const p = S.byId[id];
      const th = Number(stockOf(p, site).quantity);
      return { id, p, th, c: Number(counts[id].counted), d: round2(Number(counts[id].counted) - th) };
    }).sort((a, b) => Math.abs(b.d) - Math.abs(a.d) || a.p.name.localeCompare(b.p.name));
    const sel = new Set(ids);
    const nGap = lines.filter((l) => l.d !== 0).length;
    const notCounted = list().filter((p) => !counts[p.id]).length;
    openSheet(`<h2 id="sheet-title">Écarts de l'inventaire</h2>
      <p>${ids.length} produit${ids.length > 1 ? 's' : ''} compté${ids.length > 1 ? 's' : ''}, dont <strong>${nGap}</strong> avec un écart.${notCounted ? ` ${notCounted} produit${notCounted > 1 ? 's' : ''} non compté${notCounted > 1 ? 's' : ''} ne ${notCounted > 1 ? 'changeront' : 'changera'} pas.` : ''}</p>
      <p class="small muted">Décochez un produit pour garder son stock actuel (par exemple pour le recompter).</p>
      <div class="list">${lines.map((l) => `<label class="item ct-rev">
        <input type="checkbox" data-sel="${l.id}" checked>
        <span class="main-txt"><span class="title">${esc(l.p.name)}${brandHead(l.p)}</span><span class="sub">${esc(l.p.packaging || '')}</span><span class="sub">appli ${fmt(l.th)} · compté ${fmt(l.c)} · par ${esc(whoCounted(counts[l.id].counted_by))}</span></span>
        <span class="qty">${l.d === 0 ? '<span class="pill ok">=</span>' : `<span class="delta ${l.d < 0 ? 'neg' : 'pos'}">${l.d > 0 ? '+' : ''}${fmt(l.d)}</span>`}</span></label>`).join('')}</div>
      <p class="small muted">Le stock des produits cochés prend la quantité comptée. Les écarts restent visibles dans l'historique (« Inventaire en équipe »).</p>
      <button type="button" class="btn primary block" id="ct-ok"></button>
      <button type="button" class="btn ghost block" data-close-sheet>Continuer à compter</button>`, (root) => {
      const lab = () => { $('#ct-ok', root).textContent = `Valider ${sel.size} produit${sel.size > 1 ? 's' : ''} et clôturer`; $('#ct-ok', root).disabled = !sel.size; };
      lab();
      root.addEventListener('change', (e) => {
        const c = e.target.closest('[data-sel]'); if (!c) return;
        if (c.checked) sel.add(c.dataset.sel); else sel.delete(c.dataset.sel);
        lab();
      });
      $('#ct-ok', root).onclick = async (e) => {
        busy(e.target, true);
        const { data, error } = await S.sb.rpc('inv_valider', { p_session: session.id, p_products: [...sel] });
        busy(e.target, false);
        if (error) return toast(errMsg(error), true);
        clearInterval(timer);
        await refreshStocks();
        closeSheet(); toast(`Inventaire validé : ${data ?? sel.size} produit${(data ?? sel.size) > 1 ? 's' : ''} mis à jour`);
        go('#/stock');
      };
    });
  };
}

async function fetchMovements(site, fromDate, toDate) {
  return fetchAll(() => {
    let q = S.sb.from('movements').select('*').order('created_at', { ascending: false });
    if (site) q = q.eq('site_id', site);
    if (fromDate) q = q.gte('created_at', fromDate.toISOString());
    if (toDate) q = q.lt('created_at', toDate.toISOString());
    return q;
  });
}
function movementsCSV(list) {
  return toCSV([
    ['Date', 'Heure', 'Site', 'Code', 'Produit', 'Conditionnement', 'Type', 'Quantité saisie', 'Variation', 'Stock avant', 'Stock après', 'Prix unitaire HT', 'Montant HT', 'Agent', 'Saisi par', 'Bon de livraison', 'Note'],
    ...list.map((m) => {
      const p = S.byId[m.product_id] || {};
      const d = new Date(m.created_at);
      return [dfShort.format(d), dfHour.format(d), siteShort(m.site_id), p.code || '', p.name || '', p.packaging || '', kindLabel[m.kind],
        Number(m.quantity), Number(m.delta), Number(m.stock_before), Number(m.stock_after),
        m.unit_price != null ? Number(m.unit_price) : '', m.kind === 'entree' && m.unit_price != null ? round2(lineAmount(m)) : '',
        agentName(m.agent_id), personName(m.user_id), m.reference, m.note];
    }),
  ]);
}

async function renderHistory(tok) {
  const f = S.filters;
  main.innerHTML = `
    <div class="page-head"><div class="row"><h1>Historique · ${esc(siteShort(S.site))}</h1><button type="button" class="btn small" id="h-csv">${ICON.download}Exporter</button></div></div>
    <div class="seg" id="h-period">${[[7, '7 jours'], [30, '30 jours'], [90, '3 mois']].map(([d, l]) => `<button type="button" data-d="${d}" aria-pressed="${!f.histYear && f.histPeriod === d}">${l}</button>`).join('')}</div>
    <div class="field"><label for="h-year">Ou une année civile (1er janvier – 31 décembre)</label><select id="h-year"><option value="">Choisir une année…</option>${yearsList().map((y) => `<option value="${y}" ${f.histYear === y ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
    <div class="chips" id="h-kind">${[['tout', 'Tout'], ['sortie', 'Sorties'], ['entree', 'Entrées'], ['inventaire', 'Inventaires']].map(([k, l]) => `<button type="button" class="chip-btn" data-k="${k}" aria-pressed="${f.histKind === k}">${l}</button>`).join('')}</div>
    ${searchBox('h-q', f.histQ, 'Filtrer par produit ou personne')}
    <p class="small muted" id="h-sum">Chargement…</p>
    <div id="h-list"></div>`;
  let data = [];
  const filtered = () => data.filter((m) => (f.histKind === 'tout' || m.kind === f.histKind) && (!f.histQ || (() => {
    const p = S.byId[m.product_id];
    const hay = `${p?.name || ''} ${p?.code || ''} ${personName(m.user_id)} ${m.note} ${m.reference}`.toLowerCase();
    return f.histQ.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  })()));
  const draw = () => {
    const list = filtered();
    const outs = list.filter((m) => m.kind === 'sortie').length, ins = list.filter((m) => m.kind === 'entree').length;
    const spent = list.reduce((a, m) => a + lineAmount(m), 0);
    $('#h-sum').textContent = `${f.histYear ? `Année ${f.histYear} · ` : ''}${list.length} mouvement${list.length > 1 ? 's' : ''} · ${outs} sortie${outs > 1 ? 's' : ''} · ${ins} entrée${ins > 1 ? 's' : ''}${spent ? ` · achats ${money(spent)} HT` : ''}`;
    const byDay = new Map();
    for (const m of list.slice(0, 400)) {
      const k = cap(dfDay.format(new Date(m.created_at)));
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(m);
    }
    $('#h-list').innerHTML = list.length ? `<div class="list">${[...byDay.entries()].map(([d, ms]) => `<div class="group-label">${esc(d)}</div>${ms.map((m) => movementItem(m)).join('')}`).join('')}</div>${list.length > 400 ? '<p class="small muted">Les 400 premiers sont affichés. L\'export contient tout.</p>' : ''}`
      : '<div class="empty">Aucun mouvement sur cette période.</div>';
  };
  const load = async () => {
    $('#h-sum').textContent = 'Chargement…';
    const [since, until] = f.histYear ? yearBounds(f.histYear) : [new Date(Date.now() - f.histPeriod * DAY), null];
    const rows = await fetchMovements(S.site, since, until);
    if (stale(tok)) return;
    data = rows;
    draw();
  };
  $('#h-period').onclick = (e) => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    f.histPeriod = Number(b.dataset.d);
    f.histYear = null;
    $('#h-year').value = '';
    $$('#h-period button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    load().catch((err) => toast(errMsg(err), true));
  };
  $('#h-kind').onclick = (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    f.histKind = b.dataset.k;
    $$('#h-kind .chip-btn').forEach((x) => x.setAttribute('aria-pressed', x === b));
    draw();
  };
  $('#h-q').oninput = (e) => { f.histQ = e.target.value; draw(); };
  $('#h-year').onchange = (e) => {
    f.histYear = e.target.value ? Number(e.target.value) : null;
    $$('#h-period button').forEach((x) => x.setAttribute('aria-pressed', !f.histYear && Number(x.dataset.d) === f.histPeriod));
    load().catch((err) => toast(errMsg(err), true));
  };
  $('#h-csv').onclick = () => {
    const list = filtered();
    if (!list.length) return toast('Rien à exporter.', true);
    download(`mouvements-${siteShort(S.site).toLowerCase()}-${f.histYear || isoDate(new Date())}.csv`, movementsCSV(list));
  };
  await load();
}

async function renderSheets() {
  let q = '';
  let f = route()[1] || S.filters.fds || 'tout';
  const chem = scopedProducts().filter((p) => p.chemical || p.signal_word || (p.pictograms || []).length || p.sheetCount);
  const linkFds = (p) => !!fdsLinkOf(p) || (p.refs || []).some((r) => r.fds_url);
  const missing = chem.filter((p) => !p.sheetCount && !linkFds(p)).length;
  const nOld = chem.filter((p) => fdsState(p) === 'old').length;
  const nNoDate = chem.filter((p) => fdsState(p) === 'nodate').length;
  const FILT = { tout: () => true, old: (p) => fdsState(p) === 'old', nodate: (p) => fdsState(p) === 'nodate', none: (p) => !p.sheetCount && !linkFds(p) };
  main.innerHTML = `
    ${isResp() ? backLink('#/plus', 'Plus') : ''}
    <div class="page-head"><h1>Fiches de sécurité</h1><p class="muted">${chem.length} produits chimiques${missing ? ` · ${missing} fiche${missing > 1 ? 's' : ''} encore à ajouter` : ''}</p></div>
    ${isSecteur() ? `<a class="btn block" href="#/fiches-import">${ICON.file}Importer la base de fiches Adelya (ZIP ou PDF)</a>` : ''}
    ${S.sheetDatesReady && nOld ? `<div class="notice danger" style="display:block"><strong>${nOld} fiche${nOld > 1 ? 's' : ''} de plus de ${FDS_MAX_YEARS} ans.</strong> Demandez la version à jour à Adelya ou cherchez-la sur Quick-FDS.</div>` : ''}
    ${'caches' in window ? '<div class="card stack" id="fds-off"></div>' : ''}
    ${searchBox('sh-q', '', 'Rechercher un produit')}
    ${scopeBar()}
    ${S.sheetDatesReady && isResp() ? `<div class="chips" id="sh-f">${[['tout', 'Toutes', chem.length], ['old', 'À renouveler', nOld], ['nodate', 'Date inconnue', nNoDate], ['none', 'Sans fiche', missing]].map(([k, l, n]) => `<button type="button" class="chip-btn" data-f="${k}" aria-pressed="${k === f}">${l} · ${n}</button>`).join('')}</div>` : ''}
    <div id="sh-list"></div>`;
  const draw = () => {
    const list = chem.filter((p) => matches(p, q) && (FILT[f] || FILT.tout)(p));
    $('#sh-list').innerHTML = list.length ? `<div class="list">${list.map((p) => `
      <a class="item" href="#/p/${esc(p.code)}">
        <span class="main-txt"><span class="title">${esc(p.name)}${brandHead(p)}</span>
          <span class="sub">${esc(p.packaging)}</span>
          ${brandChips(p)}
          ${(p.pictograms || []).length ? `<span class="row" style="gap:4px;margin-top:4px">${p.pictograms.map((c) => picto(c, 28)).join('')}</span>` : ''}</span>
        <span class="qty">${p.signal_word ? `<span class="pill ${p.signal_word === 'Danger' ? 'danger' : 'warn'}">${esc(p.signal_word)}</span>` : ''}
          ${!p.sheetCount ? (linkFds(p) ? `<span class="pill ok">${fdsLinkOf(p) ? 'Fiche en lien' : `${(p.refs || []).filter((r) => r.fds_url).length} fiche${(p.refs || []).filter((r) => r.fds_url).length > 1 ? 's' : ''} en lien`}</span>` : '<span class="pill">Sans fiche</span>') : fdsState(p) === 'old' ? '<span class="pill danger">À renouveler</span>' : `<span class="pill ok">${(p.brands || []).length > 1 ? `${p.brands.length} marques` : 'Fiche'}</span>`}
          ${S.sheetDatesReady && p.sheetCount && isResp() ? `<span class="sub small">${(p.sheetInfo || []).map((x) => (x.date ? frDate(x.date) : 'date ?')).join(' · ')}</span>` : ''}</span>
      </a>`).join('')}</div>` : '<div class="empty">Aucun produit ne correspond.</div>';
  };
  draw();
  $('#sh-q').oninput = (e) => { q = e.target.value; draw(); };
  const drawOff = (msg) => {
    const box = $('#fds-off'); if (!box) return;
    const on = lsGet(FDS_ON, false), ix = lsGet(FDS_IDX, null);
    box.innerHTML = `<div class="row" style="gap:10px;align-items:flex-start">${ICON.shield.replace('<svg', '<svg width="24" height="24" style="flex:none;color:var(--sch,#c8102e)"')}<div style="flex:1"><strong>Fiches lisibles sans réseau</strong>
      <p class="small muted" style="margin:2px 0 0">${msg ? esc(msg) : on && ix ? `✔ ${ix.n} fiche${ix.n > 1 ? 's' : ''} gardée${ix.n > 1 ? 's' : ''} sur ce téléphone · mises à jour le ${esc(dfTime.format(new Date(ix.at)))}. Les nouvelles fiches s'ajoutent toutes seules.` : 'Pour consulter les fiches dans un local sans réseau (sous-sol, réserve), gardez-les sur ce téléphone.'}</p></div></div>
      ${on ? `<div class="grid-2"><button type="button" class="btn small" id="fo-upd">Mettre à jour</button><button type="button" class="btn small ghost" id="fo-off">Ne plus les garder</button></div>` : '<button type="button" class="btn block" id="fo-on">Garder les fiches sur ce téléphone</button>'}`;
    const run = async () => {
      if (isOffline()) return toast('Il faut du réseau pour télécharger les fiches.', true);
      lsSet(FDS_ON, true);
      drawOff('Téléchargement…');
      try { await syncFdsOffline((d, n) => drawOff(`Téléchargement… ${d} / ${n}`)); drawOff(); toast('Fiches gardées sur ce téléphone'); } catch (e) { drawOff(); toast(errMsg(e), true); }
    };
    const b1 = $('#fo-on'), b2 = $('#fo-upd'), b3 = $('#fo-off');
    if (b1) b1.onclick = run;

async function renderThresholds(tok) {
  const site = S.site;
  if (!canManage(site)) { main.innerHTML = '<div class="empty">Seul le responsable de ce site peut régler les seuils.</div>'; return; }
  const f = S.filters;
  f.thMonths ||= 1;
  main.innerHTML = `${backLink('#/plus', 'Plus')}<div class="page-head"><h1>Seuils automatiques</h1></div><div class="loading">Calcul de la consommation…</div>`;
  const now = new Date();
  const from = new Date(now.getTime() - 180 * DAY);
  const [outs, all] = await Promise.all([
    fetchOuts(site, from, now),
    fetchAll(() => S.sb.from('movements').select('product_id, created_at').eq('site_id', site).gte('created_at', from.toISOString()).order('created_at')),
  ]);
  if (stale(tok)) return;
  // Date du premier mouvement de chaque produit sur la période (pour ne pas sous-estimer un produit récent)
  const first = {};
  for (const m of all) if (!first[m.product_id]) first[m.product_id] = new Date(m.created_at);
  const qty = {};
  for (const m of outs) qty[m.product_id] = (qty[m.product_id] || 0) + Number(m.quantity);
  const rows = siteProducts(site).map((p) => {
    const st = stockOf(p, site);
    const days = Math.min(180, Math.max(30, (now - (first[p.id] || from)) / DAY));
    const monthly = (qty[p.id] || 0) / days * 30.44;
    const proposed = monthly ? Math.max(1, Math.ceil(monthly * f.thMonths - 1e-9)) : null;
    return { p, st, monthly, cur: Number(st.min_quantity), proposed };
  });
  const withConso = rows.filter((r) => r.proposed != null);
  const changes = withConso.filter((r) => r.proposed !== r.cur);
  const keep = new Set(changes.map((r) => r.p.id));
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}
    <div class="page-head"><h1>Seuils automatiques</h1>
      <p class="muted">${esc(siteName(site))}. L'application calcule la consommation moyenne de chaque produit sur les 6 derniers mois et propose un seuil d'alerte qui couvre la durée choisie. Vous cochez ce que vous acceptez.</p></div>
    <div class="field"><label>Le seuil doit couvrir</label>
      <div class="chips" id="th-m">${[[0.5, '2 semaines'], [1, '1 mois'], [2, '2 mois'], [3, '3 mois']].map(([v, l]) => `<button type="button" class="chip-btn" data-m="${v}" aria-pressed="${v === f.thMonths}">${l}</button>`).join('')}</div>
      <span class="hint">Avec 2 commandes par an, « 1 mois » laisse le temps de faire un complément avant la rupture.</span></div>
    <div class="notice info" style="display:block">${withConso.length} produit${withConso.length > 1 ? 's' : ''} avec des sorties ces 6 derniers mois · <strong>${changes.length} seuil${changes.length > 1 ? 's' : ''} à ajuster</strong>${rows.length - withConso.length ? ` · ${rows.length - withConso.length} sans sortie (seuil inchangé)` : ''}</div>
    ${changes.length ? `<div class="row" style="gap:12px;margin-bottom:6px"><button type="button" class="linkish" id="th-all">Tout cocher</button><button type="button" class="linkish" id="th-none">Tout décocher</button></div>
    <div class="list">${changes.sort((a, b) => famRank(a.p.family) - famRank(b.p.family) || a.p.name.localeCompare(b.p.name)).map((r) => `
      <label class="item" style="cursor:pointer"><input type="checkbox" data-th="${r.p.id}" checked style="width:24px;height:24px;flex:none;accent-color:var(--sch)">${prodThumb(r.p, 40)}
        <span class="main-txt"><span class="title">${esc(r.p.name)}${brandHead(r.p)}</span><span class="sub">≈ ${fmt(round2(r.monthly))} ${esc(r.p.packaging)} par mois · en stock ${fmt(r.st.quantity)}</span></span>
        <span class="qty"><span class="sub small">${r.cur ? `seuil ${fmt(r.cur)}` : 'sans seuil'}</span><span class="n" style="font-size:22px">→ ${fmt(r.proposed)}</span></span></label>`).join('')}</div>
    <button type="button" class="btn primary block" id="th-go">Appliquer les seuils cochés</button>` : '<div class="empty"><strong>Tous les seuils sont déjà bons.</strong>Revenez dans quelques semaines, quand il y aura plus de sorties.</div>'}`;
  $('#th-m').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; f.thMonths = Number(b.dataset.m); render(); };
  $$('[data-th]', main).forEach((c) => { c.onchange = () => { if (c.checked) keep.add(c.dataset.th); else keep.delete(c.dataset.th); $('#th-go').textContent = `Appliquer les seuils cochés (${keep.size})`; }; });
  const all2 = (v) => { $$('[data-th]', main).forEach((c) => { c.checked = v; c.onchange(); }); };
  if ($('#th-all')) { $('#th-all').onclick = () => all2(true); $('#th-none').onclick = () => all2(false); $('#th-go').textContent = `Appliquer les seuils cochés (${keep.size})`; }
  const goBtn = $('#th-go');
  if (goBtn) goBtn.onclick = async (e) => {
    const todo = changes.filter((r) => keep.has(r.p.id));
    if (!todo.length) return toast('Aucun seuil coché.', true);
    busy(e.target, true, 'Enregistrement…');
    let n = 0;
    for (const r of todo) {
      const { error } = await S.sb.from('stocks').update({ min_quantity: r.proposed }).eq('product_id', r.p.id).eq('site_id', site);
      if (error) { busy(e.target, false); return toast(errMsg(error), true); }
      if (r.p.stockBy[site]) r.p.stockBy[site].min_quantity = r.proposed;
      n += 1;
    }
    busy(e.target, false);
    toast(`${n} seuil${n > 1 ? 's' : ''} mis à jour`);
    render();
  };
}

function hbars(rows, fmtV, color = 'var(--sch)') {
  const max = Math.max(...rows.map((r) => r.v), 1);
  return `<div class="hbars">${rows.map((r) => `<div class="hb"><div class="hb-l">${r.icon || ''}<span>${esc(r.label)}</span></div>
    <div class="hb-t"><span style="width:${Math.max(2, (r.v / max) * 100).toFixed(1)}%;background:${r.color || color}"></span></div><div class="hb-v">${fmtV(r.v)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div></div>`).join('')}</div>`;
}
function monthChart(cur, prev, label) {
  const W = 340, H = 200, L = 40, R = 8, T = 12, B = 24;
  const max = Math.max(...cur, ...prev, 1) * 1.1;
  const x = (i) => L + (i + 0.5) * ((W - L - R) / 12);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - R) / 12 * 0.6;
  const step = (() => { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; })();
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  const months = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const short = (v) => (v >= 1000 ? `${fmt(round2(v / 1000))} k` : fmt(Math.round(v)));
  const prevLine = prev.some((v) => v) ? prev.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ') : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}" style="display:block;max-width:100%">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${short(v)}</text>`).join('')}
    ${cur.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y(0) - y(v)).toFixed(1)}" rx="3" fill="var(--sch)"><title>${months[i]} : ${short(v)}</title></rect><text x="${x(i)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${months[i]}</text>`).join('')}
    ${prevLine ? `<path d="${prevLine}" fill="none" stroke="#4a5466" stroke-width="2" stroke-dasharray="4 3"/>` : ''}
  </svg>`;
}
async function renderStats(tok) {
  const f = S.filters;

  f.stMode ||= 'eur';
  if (!isSecteur()) f.stSite = S.site; else if (f.stSite === undefined) f.stSite = S.site;
  const sites = f.stSite ? [f.stSite] : S.sites.map((x) => x.id);
  const [from, to] = yearBounds(f.stYear);
  const now = new Date();
  const cutoff = f.stYear === now.getFullYear() ? now : to;
  const prevFrom = new Date(f.stYear - 1, 0, 1), prevTo = new Date(f.stYear - 1, cutoff.getMonth(), cutoff.getDate() + 1);
  main.innerHTML = `${backLink('#/plus', 'Plus')}<div class="page-head"><h1>Statistiques</h1></div><div class="loading">Calcul…</div>`;
  const [outsAll, prevAll] = await Promise.all([fetchOuts(f.stSite || null, from, to), fetchOuts(f.stSite || null, new Date(f.stYear - 1, 0, 1), from)]);
  if (stale(tok)) return;
  const outs = outsAll.filter((m) => sites.includes(m.site_id));
  const prev = prevAll.filter((m) => sites.includes(m.site_id));
  const val = (m) => (f.stMode === 'eur' ? estAmount(m) : Number(m.quantity));
  const fmtV = (v) => (f.stMode === 'eur' ? money(v) : fmt(round2(v)));

  for (const m of prev) monthlyPrev[new Date(m.created_at).getMonth()] += val(m);
  const prevSame = prev.filter((m) => new Date(m.created_at) < prevTo);

  const evo = totPrev ? Math.round(((tot - totPrev) / totPrev) * 100) : null;

  // Top produits

  const top = Object.entries(byProd).sort((a, b) => (f.stMode === 'eur' ? b[1].e - a[1].e : b[1].q - a[1].q)).slice(0, 10);
  // Par agent

  // Par site

  const yrs = yearsList();
  main.innerHTML = `
    ${backLink('#/plus', 'Plus')}

    <div class="chips">${yrs.map((y) => `<button type="button" class="chip-btn" data-sy="${y}" aria-pressed="${y === f.stYear}">${y}</button>`).join('')}
      ${isSecteur() ? `${S.sites.map((x) => `<button type="button" class="chip-btn" data-ss="${x.id}" aria-pressed="${f.stSite === x.id}">${esc(x.short_name)}</button>`).join('')}<button type="button" class="chip-btn" data-ss="0" aria-pressed="${!f.stSite}">Les deux sites</button>` : ''}</div>
    <div class="seg" id="st-mode"><button type="button" data-kind="sortie" data-sm="eur" aria-pressed="${f.stMode === 'eur'}">Coût estimé</button><button type="button" data-kind="inventaire" data-sm="qty" aria-pressed="${f.stMode === 'qty'}">Quantités</button></div>
    <div class="kpis">
      <div class="kpi"><span class="n">${f.stMode === 'eur' ? money(tot).replace(/,\d\d\s/, ' ') : fmt(round2(units))}</span><span class="l">${f.stMode === 'eur' ? 'coût estimé HT' : 'unités sorties'}</span></div>

      <div class="kpi ${evo != null && evo > 10 ? 'alert' : ''}"><span class="n">${evo == null ? '—' : `${evo > 0 ? '+' : ''}${evo} %`}</span><span class="l">vs ${f.stYear - 1}, même période</span></div>
    </div>

function backupAgeDays() {
  if (!S.settings || !S.settings.last_backup) return null;

function homeSecteurNotices() {

  if (dbUpToDate() && !S.agentsReady) return `<div class="notice danger" style="display:block">La base de données doit être mise à jour pour la liste des agents : lancez le script « 4-agents » dans Supabase.</div>`;
  if (!dbUpToDate()) return `<div class="notice danger" style="display:block">La base de données doit être mise à jour pour le budget et la sauvegarde : lancez le script « 3-budget-sauvegarde » dans Supabase.</div>`;

function budgetChart(monthly, budget) {
  const W = 340, H = 210, L = 44, R = 10, T = 14, B = 26;
  const cum = []; let c = 0;
  for (const v of monthly) { c += v; cum.push(c); }
  const max = Math.max(budget || 0, c, ...monthly, 1) * 1.08;
  const x = (i) => L + (i + 0.5) * ((W - L - R) / 12);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - R) / 12 * 0.56;
  const step = (() => { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; })();
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  const months = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const short = (v) => (v >= 1000 ? `${fmt(round2(v / 1000))} k` : fmt(Math.round(v)));
  const line = cum.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dépenses mensuelles et cumul face au budget" style="display:block;max-width:100%">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${short(v)}</text>`).join('')}
    ${monthly.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y(0) - y(v)).toFixed(1)}" rx="2" fill="var(--accent)" fill-opacity="0.35"/><text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${months[i]}</text>`).join('')}
    ${budget ? `<line x1="${L}" x2="${W - R}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(budget) - 5}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--danger)">Budget ${short(budget)} €</text>` : ''}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round"/>
    ${cum.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="var(--accent)"/>`).join('')}
  </svg>`;
}

async function restoreData(data) {
      const { data: res, error } = await S.sb.rpc('restore_backup', { p: data });

async function fetchOuts(site, from, to) {
  return fetchAll(() => {
    let q = S.sb.from('movements').select('*').eq('kind', 'sortie').order('created_at');
    if (site) q = q.eq('site_id', site);
    if (from) q = q.gte('created_at', from.toISOString());
    if (to) q = q.lt('created_at', to.toISOString());
    return q;
  });
}
const estAmount = (m) => { const p = S.byId[m.product_id]; return p && p.unit_price != null ? Number(m.quantity) * Number(p.unit_price) : 0; };
function agentStats(outs) {
  const st = {};
  for (const m of outs) {
    const k = m.agent_id || 'none';
    const a = st[k] || (st[k] = { n: 0, qty: 0, eur: 0, prods: {} });
    a.n += 1; a.qty += Number(m.quantity); a.eur += estAmount(m);
    a.prods[m.product_id] = (a.prods[m.product_id] || 0) + Number(m.quantity);
  }
  return st;
}
async function exportAgentRecap(siteIds, from, to, filename, onlyAgent) {
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  let outs = [];
  for (const s of siteIds) outs = outs.concat(await fetchOuts(s, from, to));
  if (onlyAgent) outs = outs.filter((m) => (m.agent_id || 'none') === onlyAgent);
  if (!outs.length) throw new Error('Aucune sortie sur cette période.');
  outs.sort((a, b) => a.created_at.localeCompare(b.created_at));
  const nm = (m) => agentName(m.agent_id) || 'Non précisé';
  const X = window.XLSX;
  const wb = X.utils.book_new();
  const add = (name, rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); if (widths) ws['!cols'] = widths.map((w) => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
  const period = `Du ${dfShort.format(from)} au ${dfShort.format(new Date(to.getTime() - DAY))}`;
  // Synthèse
  const groups = new Map();
  for (const m of outs) {
    const key = `${m.site_id}|${m.agent_id || 'none'}`;
    const g = groups.get(key) || { site: m.site_id, name: nm(m), n: 0, qty: 0, eur: 0 };
    g.n += 1; g.qty += Number(m.quantity); g.eur += estAmount(m);
    groups.set(key, g);
  }
  const syn = [...groups.values()].sort((a, b) => a.site - b.site || a.name.localeCompare(b.name));
  add('Synthèse', [['Récapitulatif par agent — Gestion des stocks'], [period], [],
    ['Site', 'Agent', 'Nombre de sorties', 'Quantité totale', 'Montant estimé HT'],
    ...syn.map((g) => [siteShort(g.site), g.name, g.n, round2(g.qty), round2(g.eur)]),
    [], ['Montant estimé : quantité × dernier prix connu du produit.']], [10, 28, 18, 16, 18]);
  // Par produit
  const pp = new Map();
  for (const m of outs) {
    const key = `${m.site_id}|${m.agent_id || 'none'}|${m.product_id}`;
    const p = S.byId[m.product_id] || {};
    const g = pp.get(key) || { site: m.site_id, name: nm(m), code: p.code || '', prod: p.name || '', pack: p.packaging || '', qty: 0, eur: 0 };
    g.qty += Number(m.quantity); g.eur += estAmount(m);
    pp.set(key, g);
  }
  add('Par produit', [['Site', 'Agent', 'Code', 'Produit', 'Conditionnement', 'Quantité', 'Montant estimé HT'],
    ...[...pp.values()].sort((a, b) => a.site - b.site || a.name.localeCompare(b.name) || b.qty - a.qty).map((g) => [siteShort(g.site), g.name, g.code, g.prod, g.pack, round2(g.qty), round2(g.eur)])],
    [10, 24, 9, 40, 18, 10, 18]);
  // Détail
  const detail = (list) => [['Date', 'Site', 'Agent', 'Code', 'Produit', 'Conditionnement', 'Quantité', 'Montant estimé HT', 'Origine', 'Remis par', 'Note'],
    ...list.map((m) => { const p = S.byId[m.product_id] || {}; return [new Date(m.created_at), siteShort(m.site_id), nm(m), p.code || '', p.name || '', p.packaging || '', Number(m.quantity), round2(estAmount(m)), m.request_id ? 'Demande' : 'Sortie directe', personName(m.user_id), m.note === 'Demande' ? '' : m.note]; })];
  const cols = [16, 10, 22, 9, 40, 18, 10, 16, 14, 20, 24];
  add('Détail', detail(outs), cols);
  if (!onlyAgent) {
    const used = new Set(['Synthèse', 'Par produit', 'Détail']);
    const byAgent = new Map();
    for (const m of outs) { const k = m.agent_id || 'none'; if (!byAgent.has(k)) byAgent.set(k, []); byAgent.get(k).push(m); }
    if (byAgent.size <= 25) {
      for (const list of byAgent.values()) {
        let name = nm(list[0]).replace(/[\[\]:*?/\\]/g, ' ').trim().slice(0, 28) || 'Agent';
        let n = name, i = 2;
        while (used.has(n)) n = `${name.slice(0, 26)} ${i++}`;
        used.add(n);
        add(n, detail(list), cols);
      }
    }
  }
  X.writeFile(wb, filename);
  toast('Fichier Excel téléchargé');
}

async function buildQrPoster(sites) {

function qrSvg(text) {
  const qr = window.qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

          rows.push([siteShort(s), p.code, p.family, p.name, p.packaging, round2(a.out), a.n, round2(a.inn), round2(a.eur), round2(a.gap), Number(stockOf(p, s).quantity)]);
        }
      }
      download(`consommation-${tag()}-${$('#ex-from').value}-au-${$('#ex-to').value}.csv`, toCSV(rows));
    } catch (err) { toast(errMsg(err), true); }
    busy(btn, false);
  };
}

async function computeOrder(site, nextOrder, followingOrder) {
  const since = new Date(Date.now() - 180 * DAY);
  const mv = await fetchMovements(site, since);
  const first = await S.sb.from('movements').select('created_at').eq('site_id', site).order('created_at').limit(1);
  const start = first.data && first.data[0] ? new Date(Math.max(since.getTime(), new Date(first.data[0].created_at).getTime())) : null;
  const days = start ? Math.max(14, (Date.now() - start) / DAY) : 0;
  const months = Math.max(0, (followingOrder - new Date()) / DAY / 30.44);
  const out = {};
  for (const m of mv) if (m.kind === 'sortie') out[m.product_id] = (out[m.product_id] || 0) + Number(m.quantity);
  const lines = (siteHasList(site) ? siteProducts(site) : activeProducts()).map((p) => {
    const st = stockOf(p, site);
    const monthly = days ? (out[p.id] || 0) / days * 30.44 : 0;
    const need = monthly * months + Number(st.safety_margin) - Number(st.quantity);
    const units = Math.max(0, Math.ceil(need - 1e-9));
    return { p, monthly, stock: Number(st.quantity), margin: Number(st.safety_margin), units, proposed: packN(p) ? Math.ceil(units / packN(p) - 1e-9) : units };
  });
  return { lines, days, start, months };
}

// Entrées, sorties et corrections d'inventaire par produit sur [from, to[ ; stock début reconstitué
async function periodMoves(site, from, to) {
  const mv = await fetchMovements(site, from);
  const per = {}; let nIn = 0, nOut = 0;
  for (const m of mv) {
    const p = per[m.product_id] || (per[m.product_id] = { inn: 0, out: 0, adj: 0, after: 0 });
    const q = Number(m.quantity) || 0;
    const net = m.kind === 'entree' ? q : m.kind === 'sortie' ? -q : Number(m.delta) || 0;
    if (new Date(m.created_at) >= to) { p.after += net; continue; }
    if (m.kind === 'entree') { p.inn += q; nIn += 1; } else if (m.kind === 'sortie') { p.out += q; nOut += 1; } else p.adj += net;
  }
  return { per, nIn, nOut };
}
async function monthlyUse(site) {
  const since = new Date(Date.now() - 180 * DAY);
  const mv = await fetchMovements(site, since);
  const first = await S.sb.from('movements').select('created_at').eq('site_id', site).order('created_at').limit(1);
  const start = first.data && first.data[0] ? new Date(Math.max(since.getTime(), new Date(first.data[0].created_at).getTime())) : null;
  const days = start ? Math.max(14, (Date.now() - start) / DAY) : 0;
  const out = {};
  for (const m of mv) if (m.kind === 'sortie') out[m.product_id] = (out[m.product_id] || 0) + Number(m.quantity);
  const monthly = {};
  for (const id in out) monthly[id] = days ? out[id] / days * 30.44 : 0;
  return { monthly, days, start };
}

async function buildReport(kind, o) {
  await refreshStocks().catch(() => {});
  const R = { kind, title: REPORTS[kind].t, o, sites: [] };
  for (const sid of o.siteIds) {
    if (kind === 'etat') {
      const { per, nIn, nOut } = await periodMoves(sid, o.from, o.to);
      const scope = new Set(repProducts([sid], o.onlyUsed).map((p) => p.id));
      for (const id in per) if (S.byId[id] && (per[id].inn || per[id].out || per[id].adj)) scope.add(id);
      const rows = activeProducts().filter((p) => scope.has(p.id)).sort(repSort).map((p) => {
        const st = stockOf(p, sid), m = per[p.id] || { inn: 0, out: 0, adj: 0, after: 0 };
        const end = round2(Number(st.quantity) - m.after), start = round2(end - m.inn + m.out - m.adj);
        return { p, start, inn: round2(m.inn), out: round2(m.out), adj: round2(m.adj), end, min: Number(st.min_quantity) || 0, s: status(st), loc: st.location || '', pr: priceOf(p), qty: Number(st.quantity) };
      });
      R.sites.push({ sid, rows, nIn, nOut });
    } else {
      const use = await monthlyUse(sid);
      const months = Math.max(0, round2((o.horizon - new Date()) / DAY / 30.44));
      const rows = repProducts([sid], o.onlyUsed).sort(repSort).map((p) => {
        const st = stockOf(p, sid), q = Number(st.quantity), m = round2(use.monthly[p.id] || 0), marge = Number(st.safety_margin) || 0;
        const auto = m > 0 ? round2(Math.max(0, q) / m) : null;
        const rupt = m > 0 ? new Date(Date.now() + Math.max(0, q) / m * 30.44 * DAY) : null;
        return { p, q, m, marge, auto, rupt, late: !!(rupt && rupt < o.horizon), need: Math.max(0, Math.ceil(m * months + marge - q - 1e-9)), pr: priceOf(p), s: status(st) };
      });
      R.sites.push({ sid, rows, use, months });
    }
  }
  return R;
}

async function reportPdf(R) {
  for (const src of PDF_LIBS) await loadScript(src);
  const { jsPDF } = window.jspdf;
  const land = R.kind === 'projection';
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: land ? 'landscape' : 'portrait' });
  if (R.kind === 'etat') {
    if (R.sites.length > 1) pdfSynthese(doc, R);
    R.sites.forEach((s, i) => pdfEtatSite(doc, R, s, i === 0 && R.sites.length === 1));
  } else R.sites.forEach((s, i) => pdfProjection(doc, R, s, i === 0));
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setFillColor(...CITY.red); doc.rect(14, H - 11.5, 12, 0.9, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...CITY.ink); doc.text('Ville de Schiltigheim', 14, H - 7); const vw = doc.getTextWidth('Ville de Schiltigheim ');
    doc.setFont('helvetica', 'normal'); doc.setTextColor(...CITY.mid); doc.text(pdfTxt('· Secteur Est · Gestion des stocks'), 14 + vw, H - 7);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...CITY.red); doc.text(`${i} / ${pages}`, W - 14, H - 7, { align: 'right' });
  }
  return doc;
}

async function reportXlsx(R, filename) {
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const X = window.XLSX, wb = X.utils.book_new(), o = R.o;
  const sheet = (name, build, widths) => {
    const ws = {}; let r = 0, maxC = 0;
    const put = (c, v, extra) => {
      if (v == null || v === '') return; maxC = Math.max(maxC, c);
      const cell = typeof v === 'number' ? { t: 'n', v, z: '#,##0.##' } : { t: 's', v: String(v) };
      if (extra) Object.assign(cell, extra, extra.f ? { f: extra.f.replace(/\{r\}/g, r + 1) } : {});
      ws[X.utils.encode_cell({ r, c })] = cell;
    };
    const api = { put, row: () => r, next: (n = 1) => { r += n; }, ws };
    put(0, `${R.title} — Ville de Schiltigheim · Secteur Est`); r += 1;
    put(0, `${R.kind === 'etat' ? periodLabel(o) : `Projection jusqu'au ${dfDate.format(o.horizon)}`} · édité le ${dfTime.format(new Date())}${S.me?.full_name ? ` par ${S.me.full_name}` : ''}`); r += 2;
    build(api);
    ws['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(r, 1), c: maxC } });
    ws['!cols'] = widths.map((w) => ({ wch: w }));
    X.utils.book_append_sheet(wb, ws, name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31));
  };
  const EUR = { z: '#,##0.00 "€"' };
  if (R.kind === 'etat') {
    if (R.sites.length > 1) {
      sheet('Résumé', (a) => {
        ['Site', 'Produits en stock', 'Entrées', 'Sorties', 'Sous le seuil', 'Épuisés'].forEach((h, c) => a.put(c, h)); a.next();
        for (const s of R.sites) { const rows = s.rows; [siteName(s.sid), rows.filter((x) => x.qty > 0).length, round2(rows.reduce((t, x) => t + x.inn, 0)), round2(rows.reduce((t, x) => t + x.out, 0)), rows.filter((x) => x.s === 'bas').length, rows.filter((x) => x.s === 'rupture').length].forEach((v, c) => a.put(c, v)); a.next(); }
      }, [30, 18, 12, 12, 14, 10]);
      sheet('Stock général', (a) => {
        const head = ['Produit', 'Marque', 'Famille', 'Conditionnement', ...R.sites.map((s) => `Stock ${siteShort(s.sid)}`), 'Total'];
        head.forEach((h, c) => a.put(c, h)); a.next();
        const byId = new Map(); R.sites.forEach((s, i) => s.rows.forEach((x) => { const e = byId.get(x.p.id) || { p: x.p, q: R.sites.map(() => 0) }; e.q[i] = x.end; byId.set(x.p.id, e); }));
        const n = R.sites.length, last = X.utils.encode_col(3 + n);
        for (const e of [...byId.values()].sort((x, y) => repSort(x.p, y.p))) {
          [e.p.name, e.p.brand || '', e.p.family || '', e.p.packaging || '', ...e.q].forEach((v, c) => a.put(c, v));
          a.put(4 + n, e.q.reduce((t, v) => t + v, 0), { f: `SUM(E{r}:${last}{r})` }); a.next();
        }
      }, [42, 14, 18, 18, ...R.sites.map(() => 12), 10]);
    }
    for (const s of R.sites) {
      sheet(siteShort(s.sid), (a) => {
        const head = ['Produit', 'Marque', 'Famille', 'Conditionnement', 'Stock début', 'Entrées', 'Sorties', 'Inventaire (+/-)', 'Stock fin', 'Seuil', 'Statut', 'Emplacement', ...(o.prices ? ['Prix unit. HT', 'Valeur HT'] : [])];
        head.forEach((h, c) => a.put(c, h)); a.next();
        const first = a.row();
        for (const x of (o.onlyLow ? s.rows.filter((y) => y.s !== 'ok') : s.rows)) {
          [x.p.name, x.p.brand || '', x.p.family || '', x.p.packaging || '', x.start, x.inn, x.out, x.adj].forEach((v, c) => a.put(c, v));
          a.put(8, x.end, { f: 'E{r}+F{r}-G{r}+H{r}' }); a.put(9, x.min); a.put(10, PILL[x.s]); a.put(11, x.loc);
          if (o.prices && x.pr != null) { a.put(12, x.pr, EUR); a.put(13, round2(x.pr * Math.max(0, x.end)), { ...EUR, f: 'MAX(0,I{r})*M{r}' }); }
          a.next();
        }
        const last = a.row();
        a.next(); a.put(3, 'Totaux');
        ['E', 'F', 'G', 'H', 'I'].forEach((col, i) => a.put(4 + i, round2(s.rows.reduce((t, x) => t + [x.start, x.inn, x.out, x.adj, x.end][i], 0)), { f: `SUM(${col}${first + 1}:${col}${last})` }));
        if (o.prices) a.put(13, 0, { ...EUR, f: `SUM(N${first + 1}:N${last})` });
        a.ws['!autofilter'] = { ref: `A${first}:${o.prices ? 'N' : 'L'}${last}` };
      }, [40, 14, 18, 18, 11, 10, 10, 14, 10, 8, 11, 16, 12, 12]);
    }
  } else {
    for (const s of R.sites) {
      sheet(`Projection ${siteShort(s.sid)}`, (a) => {
        a.put(0, 'Mois à couvrir'); a.put(1, s.months); a.put(2, 'Modifiez ce nombre : les quantités à commander se recalculent.'); a.next(2);
        const head = ['Produit', 'Marque', 'Conditionnement', 'Stock', 'Conso / mois', 'Autonomie (mois)', 'Rupture estimée', 'Marge', 'À commander', 'Statut', ...(o.prices ? ['Prix unit. HT', 'Montant HT'] : [])];
        head.forEach((h, c) => a.put(c, h)); a.next();
        const first = a.row(), pr = a.row() - 2; // ligne du paramètre
        const P = `$B$${pr - 0}`;
        for (const x of (o.onlyLow ? s.rows.filter((y) => y.need > 0) : s.rows)) {
          [x.p.name, x.p.brand || '', x.p.packaging || '', x.q, x.m].forEach((v, c) => a.put(c, v));
          a.put(5, x.auto == null ? '-' : x.auto, { f: 'IF(E{r}>0,ROUND(MAX(0,D{r})/E{r},1),"-")' });
          a.put(6, x.rupt ? dfShort.format(x.rupt) : '-'); a.put(7, x.marge);
          a.put(8, x.need, { f: `MAX(0,ROUNDUP(E{r}*${P}+H{r}-D{r},0))` }); a.put(9, PILL[x.s]);
          if (o.prices && x.pr != null) { a.put(10, x.pr, EUR); a.put(11, round2(x.pr * x.need), { ...EUR, f: 'I{r}*K{r}' }); }
          a.next();
        }
        const last = a.row();
        if (o.prices) { a.next(); a.put(10, 'Budget HT'); a.put(11, 0, { ...EUR, f: `SUM(L${first + 1}:L${last})` }); }
        a.ws['!autofilter'] = { ref: `A${first}:${o.prices ? 'L' : 'J'}${last}` };
      }, [40, 14, 18, 9, 12, 15, 14, 8, 13, 11, 12, 12]);
    }
  }
  X.writeFile(wb, filename);
}

const PERIODS = [['mois', 'Ce mois-ci'], ['mois-1', 'Le mois dernier'], ['annee', 'Depuis le 1er janvier'], ['12m', 'Les 12 derniers mois'], ['perso', 'Choisir les dates']];
function periodRange(k, f, t) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth(), tomorrow = new Date(y, m, n.getDate() + 1);
  if (k === 'mois') return [new Date(y, m, 1), tomorrow];
  if (k === 'mois-1') return [new Date(y, m - 1, 1), new Date(y, m, 1)];
  if (k === 'annee') return [new Date(y, 0, 1), tomorrow];
  if (k === '12m') return [new Date(y - 1, m, n.getDate() + 1), tomorrow];
  const a = new Date(`${f}T00:00:00`), b = new Date(new Date(`${t}T00:00:00`).getTime() + DAY);
  if (isNaN(a) || isNaN(b) || b <= a) throw new Error('Période invalide.');
  return [a, b];
}
const periodLabel = (o) => `Du ${dfDate.format(o.from)} au ${dfDate.format(new Date(Math.min(o.to - DAY, Date.now())))}`;

// Quantité exprimée comme Adelya la livre : en cartons/paquets quand c'est un compte rond
function orderQty(p, units) {
  const n = packN(p);
  if (n && units % n === 0) return { q: units / n, cond: p.order_pack, mult: n };
  return { q: units, cond: (p && p.packaging) || 'unité', mult: 1 };
}
const orderFileName = (o) => `Bon de commande ${o.reference || o.order_date} - ${siteShort(o.site_id) || 'site'}.pdf`.replace(/[\\/:*?"<>|]+/g, '-');
async function buildOrderPdf(o) {
  for (const src of PDF_LIBS) await loadScript(src);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const lines = (o.order_lines || []).slice().sort((a, b) => {
    const pa = S.byId[a.product_id] || {}, pb = S.byId[b.product_id] || {};
    return (Number(pa.bpu_line) || 9999) - (Number(pb.bpu_line) || 9999) || String(pa.name).localeCompare(String(pb.name));
  });
  try { doc.addImage(LOGO_VILLE, 'PNG', M, 12, 22, 22.5); } catch { /* logo facultatif */ }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...RED);

  // Cadres émetteur / fournisseur / livraison
  const box = (x, y, w, h, title, body) => {

    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...RED); doc.text(title.toUpperCase(), x + 4, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(30, 30, 30);
    doc.text(doc.splitTextToSize(pdfTxt(body), w - 8), x + 4, y + 12);
  };

  box(M, 84, W - 2 * M, 20, 'Adresse de livraison', `${site.name || ''}${site.address ? ` - ${site.address}` : ''}`);
  let total = 0, unknown = 0;

// SUIVI DES FDS : date de révision, rappel au-delà de 3 ans, Quick-FDS, notice de poste
// ---------------------------------------------------------------------
const FDS_MAX_YEARS = 3;
const fdsLimit = () => { const d = new Date(); d.setFullYear(d.getFullYear() - FDS_MAX_YEARS); return isoDate(d); };
const quickFdsUrl = (p, brand) => `https://www.google.com/search?q=${encodeURIComponent(`site:quickfds.com ${p.name} ${brand || p.brand || (p.brands || [])[0] || ''}`.trim())}`;
const frDate = (iso) => (iso ? dfDate.format(new Date(iso + 'T00:00:00')) : '');
const MOIS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
// Date de révision lue sur la photo de la 1re page de la fiche
function guessRevisionDate(text) {
  const norm = (x) => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const lines = String(text || '').split(/\n/).map((l) => norm(l.trim())).filter(Boolean);
  const KEY = /revision|revisee|mise a jour|date d.?(?:emission|edition|etablissement|impression|creation)|remplace|version|revised|date\s*:/;
  const today = isoDate(new Date());
  const found = [];
  const scan = (l, weight) => {
    for (const m of l.matchAll(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4}|\d{2})(?!\d)/g)) {
      let [, d, mo, y] = m; if (y.length === 2) y = '20' + y;
      found.push([`${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`, weight]);
    }
    for (const m of l.matchAll(/(\d{4})-(\d{2})-(\d{2})/g)) found.push([`${m[1]}-${m[2]}-${m[3]}`, weight]);
    for (const m of l.matchAll(new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS.join('|')})\\s+(\\d{4})`, 'g'))) found.push([`${m[3]}-${String(MOIS.indexOf(m[2]) + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`, weight]);
  };
  lines.forEach((l, i) => { if (KEY.test(l)) { scan(l, 2); if (lines[i + 1]) scan(lines[i + 1], 1); } });
  const ok = found.filter(([d]) => { const t = new Date(d + 'T00:00:00'); return !Number.isNaN(t.getTime()) && d >= '1995-01-01' && d <= today && isoDate(t) === d; });
  if (!ok.length) return '';
  // Mot-clé sur la même ligne d'abord, puis la date la plus récente (la révision, pas la 1re édition)
  ok.sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]));
  return ok[0][0];
}
// État des fiches d'un produit (rempli par loadBrands)
const fdsState = (p) => {
  const g = p.sheetInfo || [];
  if (!g.length) return 'none';
  if (g.some((x) => x.date && x.date < fdsLimit())) return 'old';
  if (g.some((x) => !x.date)) return 'nodate';
  return 'ok';
};

// Pictogramme SGH en image (pour le PDF)
async function pictoPng(code, px = 240) {
  const svg = picto(code).replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" `);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const c = document.createElement('canvas'); c.width = px; c.height = px;
  c.getContext('2d').drawImage(img, 0, 0, px, px);
  return c.toDataURL('image/png');
}

  for (const src of PDF_LIBS) await loadScript(src);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 15, RED = [200, 16, 46];

  doc.setFontSize(10); doc.setTextColor(90, 90, 90); doc.setFont('helvetica', 'normal');

  let y = 40;
  doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  const title = doc.splitTextToSize(pdfTxt(p.name), W - 2 * M);
  doc.text(title, M, y); y += title.length * 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 90, 90);
  const brands = (p.sheetInfo || []).map((x) => x.brand).filter(Boolean);

  // Mention d'avertissement + pictogrammes
  if (p.signal_word) {
    const danger = p.signal_word === 'Danger';
    doc.setFillColor(...(danger ? RED : [240, 140, 0])); doc.roundedRect(M, y, W - 2 * M, 10, 2, 2, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text(p.signal_word.toUpperCase(), W / 2, y + 7, { align: 'center' }); y += 14;
  }
  const pics = (p.pictograms || []).filter((c) => PICTOS[c]);
  if (pics.length) {
    let x = M;
    for (const c of pics) {
      try { doc.addImage(await pictoPng(c), 'PNG', x, y, 21, 21); } catch { /* pictogramme non dessiné */ }
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(60, 60, 60);
      doc.text(doc.splitTextToSize(pdfTxt(PICTOS[c].label), 28), x + 10.5, y + 24.5, { align: 'center' });
      x += 29;
    }
    y += 31;
  }
  // Rubriques
  const sections = [
    ['Dangers', p.hazards],
    ['Protections obligatoires', (p.ppe || []).join(' · ')],
    ['Utilisation et dilution', p.usage],
    ['Ne jamais mélanger avec', p.incompat],
    ['Stockage', p.storage],
    ['En cas de déversement · élimination', p.spill],
    ['Premiers secours', p.first_aid],
  ];
  const block = (h, txt, opts = {}) => {
    const body = doc.splitTextToSize(pdfTxt(txt || 'Voir la fiche de données de sécurité.'), W - 2 * M - 8);
    const hh = 8 + body.length * 4.6 + 2;
    if (y + hh > 270) { doc.addPage(); y = 18; }
    doc.setFillColor(...(opts.fill || [250, 247, 247])); doc.setDrawColor(...(opts.line || [235, 220, 222]));
    doc.roundedRect(M, y, W - 2 * M, hh, 2, 2, 'FD');
    doc.setFillColor(...RED); doc.rect(M, y + 2, 1.6, hh - 4, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...RED); doc.text(pdfTxt(h.toUpperCase()), M + 5, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(txt ? 30 : 130, txt ? 30 : 130, txt ? 30 : 130);
    doc.text(body, M + 5, y + 11.5);
    y += hh + 2.5;
  };
  for (const [h, t] of sections) block(h, t);
  block('Urgences', 'SAMU : 15 · Pompiers : 18 · Numéro d\'urgence européen : 112\nCentre antipoison (Grand Est, Nancy) : 03 83 22 50 50\nPrévenir le responsable d\'installation et garder l\'emballage ou la fiche pour les secours.', { fill: [255, 241, 242], line: [240, 190, 196] });
  // Pied : source et visa
  if (y > 266) { doc.addPage(); y = 18; }
  const src = (p.sheetInfo || []).map((x) => `${x.brand || 'fiche'}${x.date ? ` révisée le ${frDate(x.date)}` : ''}`).join(' ; ');
  doc.setFontSize(8.5); doc.setTextColor(110, 110, 110);
  doc.text(doc.splitTextToSize(pdfTxt(`Établie d'après la fiche de données de sécurité${src ? ` (${src})` : ''}. Notice de poste prévue par le Code du travail (art. R4412-39). Édition du ${dfDate.format(new Date())}.`), W - 2 * M - 70), M, y + 4);
  doc.setDrawColor(220, 220, 220); doc.roundedRect(W - M - 62, y, 62, 18, 2, 2);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...RED); doc.text('VISA DU RESPONSABLE', W - M - 59, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(30, 30, 30); doc.text(pdfTxt(S.me.full_name), W - M - 59, y + 11);
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140, 140, 140); doc.text(pdfTxt(`Ville de Schiltigheim · Secteur Est · ${p.code}`), M, 290); doc.text(`${i} / ${pages}`, W - M, 290, { align: 'right' }); }
  return doc.output('blob');
}

function relanceText(orders) {
  const parts = orders.filter((o) => openLines(o).length).map((o) => {
    const lines = openLines(o).map((l) => {
      const p = S.byId[l.product_id];
      const ref = [p?.bpu_line ? `ligne BPU ${p.bpu_line}` : '', p?.adelya_ref ? `réf. ${p.adelya_ref}` : ''].filter(Boolean).join(', ');
      return `- ${fmt(lineLeft(l))} × ${p ? p.packaging : 'unité'}${packOfUnits(p, lineLeft(l))} : ${p ? p.name : 'Produit'}${ref ? ` (${ref})` : ''}`;
    });
    return `${o.reference ? `Bon de commande ${o.reference}` : 'Commande'} du ${dfShort.format(new Date(o.order_date + 'T00:00:00'))} :\n${lines.join('\n')}`;
  });
  const site = siteName(orders[0]?.site_id || S.site);
  return `Bonjour,\n\nSauf erreur de notre part, les produits suivants n'ont pas encore été livrés au ${site} :\n\n${parts.join('\n\n')}\n\nPouvez-vous nous indiquer leur date de livraison ?\n\nCordialement,\n${S.me.full_name}\nVille de Schiltigheim`;
}

      };
    });
  };
}

async function uploadOrderFiles(o, files, kind) {
  const list = Array.from(files || []);
  if (!list.length) return;
  toast(`Envoi de ${list.length} fichier${list.length > 1 ? 's' : ''}…`);
  try {
    for (const f of list) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (isPdf && f.size > 15 * 1024 * 1024) throw new Error('PDF trop lourd (15 Mo maximum).');
      const body = isPdf ? f : await compressImage(f);
      const path = `${o.id}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${isPdf ? 'pdf' : 'jpg'}`;
      const up = await S.sb.storage.from('bons-commande').upload(path, body, { contentType: isPdf ? 'application/pdf' : 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      const ins = await S.sb.from('order_files').insert({ order_id: o.id, kind, file_path: path, file_name: f.name || '', uploaded_by: S.me.id });
      if (ins.error) throw ins.error;
    }
    toast('Document ajouté');
  } catch (e) {
    toast(/bucket|not found/i.test(e.message || '') ? 'Le rangement des documents n\'est pas prêt : lancez le script « 5-commandes » dans Supabase.' : errMsg(e), true);
  }
  render();
}

async function renderOrderDetail(id, tok) {
  if (!S.ordersReady) { main.innerHTML = `${backLink('#/commandes', 'Bons de commande')}${ordersMissing()}`; return; }
  const { data: o, error } = await S.sb.from('orders').select('*, order_lines(*)').eq('id', id).maybeSingle();
  if (error) throw error;
  if (stale(tok)) return;
  if (!o) { main.innerHTML = `${backLink('#/commandes', 'Bons de commande')}<div class="empty">Ce bon de commande n'existe plus.</div>`; return; }
  const lines = (o.order_lines || []).slice().sort((a, b) => (S.byId[a.product_id]?.name || '').localeCompare(S.byId[b.product_id]?.name || ''));
  const lineIds = lines.map((l) => l.id);
  const [mv, files] = await Promise.all([
    lineIds.length ? S.sb.from('movements').select('*').in('order_line_id', lineIds).order('created_at', { ascending: false }) : { data: [] },
    S.sb.from('order_files').select('*').eq('order_id', o.id).order('created_at'),
  ]);
  if (mv.error) throw mv.error;

  if (stale(tok)) return;
  const manage = canManage(o.site_id);
  const left = openLines(o);
  const received = lines.some((l) => Number(l.qty_received) > 0);
  const [cls, lab] = ORDER_STATUS[o.status];
  let total = 0, rec = 0;

  const doc = (d, i) => {

  };
  main.innerHTML = `
    ${backLink('#/commandes', 'Bons de commande')}
    <div class="page-head">
      <span class="eyebrow">${esc(siteName(o.site_id))}</span>
      <h1>${esc(orderTitle(o))}</h1>
      <p class="muted">Commandé le ${esc(dfDate.format(new Date(o.order_date + 'T00:00:00')))}${o.note ? ` · ${esc(o.note)}` : ''}</p>
    </div>
    <div class="notice ${o.status === 'soldee' ? 'info' : o.status === 'annulee' ? 'danger' : ''}" style="display:block">
      ${o.status === 'a_valider' ? `<strong>À valider par le responsable de secteur</strong><br><span class="small">Préparé par ${esc(personName(o.created_by))}${total ? ` · ${money(total)} HT estimés` : ''}</span>`
        : o.status === 'en_cours' ? `<strong>${left.length} produit${left.length > 1 ? 's' : ''} toujours en attente de livraison</strong>` : `<strong>${lab}</strong>${o.refuse_reason ? `<br><span class="small">Refusé : ${esc(o.refuse_reason)}</span>` : ''}`}
      ${total && o.status !== 'a_valider' ? `<br><span class="small">Commandé ${money(total)} HT · reçu ${money(rec)} HT</span>` : ''}
      ${o.validated_by && o.status !== 'a_valider' ? `<br><span class="small">Validé par ${esc(personName(o.validated_by))}${o.validated_at ? ` le ${esc(dfDate.format(new Date(o.validated_at)))}` : ''}${o.sent_at ? ` · envoyé à Adelya le ${esc(dfDate.format(new Date(o.sent_at)))}` : ''}</span>` : ''}
    </div>
    ${o.status === 'a_valider' && isSecteur() ? `<button type="button" class="btn primary block" id="od-validate">Relire et valider le bon</button>` : ''}
    ${manage && (o.status === 'en_cours' || o.status === 'soldee') && 'sent_at' in o ? `<button type="button" class="btn ${o.sent_at ? '' : 'primary'} block" id="od-send">${ICON.file}${o.sent_at ? 'Renvoyer le bon PDF à Adelya' : 'Envoyer le bon PDF à Adelya'}</button>` : ''}
    ${manage && o.status === 'en_cours' ? `<button type="button" class="btn ${o.sent_at ? 'primary' : ''} block" id="od-receive">${ICON.in}Réceptionner une livraison</button>` : ''}
    ${left.length && o.status === 'en_cours' ? `<button type="button" class="btn block" id="od-relance">Relancer Adelya pour ce bon</button>` : ''}

    <section class="section"><h2>Produits</h2><div class="list">${lines.map((l) => {
      const p = S.byId[l.product_id];
      const r = lineLeft(l);
      const done = Number(l.qty_received) >= Number(l.qty_ordered);
      return `<div class="item"><span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit supprimé')}</span>
        <span class="sub">Commandé ${fmt(l.qty_ordered)}${p ? ` × ${esc(p.packaging)}${esc(packOfUnits(p, Number(l.qty_ordered)))}` : ''} · reçu ${fmt(l.qty_received)}</span>
        ${manage && o.status !== 'annulee' && !done ? `<span class="sub"><button type="button" class="linkish" data-close-line="${l.id}" data-closed="${l.closed ? 0 : 1}">${l.closed ? 'Attendre de nouveau ce produit' : 'Ne plus attendre ce produit'}</button></span>` : ''}</span>
        <span class="qty">${r ? `<span class="pill warn">Reste ${fmt(r)}</span>` : done ? '<span class="pill ok">Livré</span>' : '<span class="pill">Abandonné</span>'}</span></div>`;
    }).join('')}</div></section>

    <section class="section"><h2>Documents</h2>
      <p class="small muted">Photographiez le bon de commande et les bons de livraison pour les garder avec la commande.</p>
      ${docs.length ? `<div class="pages">${docs.map(doc).join('')}</div>` : ''}
      ${files.error ? ordersMissing() : manage ? `
      <div class="grid-2">
        <label class="btn" for="od-cam">${ICON.camera}Photographier</label>
        <label class="btn" for="od-file">${ICON.file}PDF ou image</label>
      </div>
      <input type="file" id="od-cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="od-file" accept="image/*,application/pdf" multiple hidden>` : ''}
    </section>

    <section class="section"><h2>Livraisons reçues</h2>
      ${mv.data.length ? `<div class="list">${mv.data.map((m) => movementItem(m)).join('')}</div>` : '<div class="empty">Rien n\'a encore été réceptionné sur ce bon.</div>'}
    </section>
    <div class="grid-2 no-print">
      <button type="button" class="btn" id="od-csv">${ICON.download}Exporter</button>
      ${manage && o.status !== 'annulee' && !received ? '<button type="button" class="btn danger" id="od-cancel">Annuler le bon</button>' : ''}
    </div>`;

  const rl = $('#od-relance');
  if (rl) rl.onclick = () => openRelance([o]);
  const cam = $('#od-cam'), file = $('#od-file');
  if (cam) cam.onchange = (e) => uploadOrderFiles(o, e.target.files, 'commande');
  if (file) file.onchange = (e) => uploadOrderFiles(o, e.target.files, received ? 'livraison' : 'commande');
  $$('[data-del-doc]', main).forEach((b) => {
    b.onclick = () => confirmSheet('Supprimer ce document ?', 'Supprimer', async () => {
      const d = docs.find((x) => x.id === b.dataset.delDoc);
      await S.sb.storage.from('bons-commande').remove([d.file_path]);
      const { error: err } = await S.sb.from('order_files').delete().eq('id', d.id);
      if (err) throw err;
      toast('Document supprimé');
      render();
    });
  });
  $$('[data-close-line]', main).forEach((b) => {
    b.onclick = async () => {
      const close = b.dataset.closed === '1';
      const run = async () => {
        const { error: err } = await S.sb.rpc('close_order_line', { p_line: b.dataset.closeLine, p_closed: close });
        if (err) throw err;
        toast(close ? 'Ce produit n\'est plus attendu' : 'Ce produit est de nouveau attendu');
        render();
      };
      if (close) confirmSheet('Ne plus attendre ce produit ? Il ne sera plus compté dans les reliquats.', 'Ne plus attendre', run);
      else run().catch((err) => toast(errMsg(err), true));
    };
  });
  const cancel = $('#od-cancel');
  if (cancel) cancel.onclick = () => confirmSheet('Annuler ce bon de commande ?', 'Annuler le bon', async () => {
    const { error: err } = await S.sb.rpc('cancel_order', { p_order: o.id });
    if (err) throw err;
    toast('Bon de commande annulé');
    render();
  });
  $('#od-csv').onclick = () => {
    const rows = [['Bon', 'Date', 'Site', 'Code', 'Produit', 'Conditionnement', 'Ligne BPU', 'Réf. Adelya', 'Commandé', 'Reçu', 'Reste à livrer', 'Prix unitaire HT', 'Statut']];
    for (const l of lines) {
      const p = S.byId[l.product_id] || {};
      const r = lineLeft(l);
      rows.push([o.reference, o.order_date, siteShort(o.site_id), p.code || '', p.name || '', p.packaging || '', p.bpu_line ?? '', p.adelya_ref || '', Number(l.qty_ordered), Number(l.qty_received), r, l.unit_price ?? '',
        r ? 'En attente' : Number(l.qty_received) >= Number(l.qty_ordered) ? 'Livré' : 'Abandonné']);
    }
    download(`bon-${(o.reference || o.order_date).replace(/[^\w-]+/g, '_')}.csv`, toCSV(rows));
  };
  const rc = $('#od-receive');
  if (rc) rc.onclick = () => openReceive(o, left);
  const vb = $('#od-validate');
  if (vb) vb.onclick = () => openValidateOrder(o);
  const sb = $('#od-send');
  if (sb) sb.onclick = () => openSendOrder(o);
}

function openReceive(o, left) {
  if (!left.length) return toast('Tout est déjà livré sur ce bon.');
  const qty = Object.fromEntries(left.map((l) => [l.id, lineLeft(l)]));
  const prices = Object.fromEntries(left.filter((l) => l.unit_price != null || S.byId[l.product_id]?.unit_price != null).map((l) => [l.id, Number(l.unit_price ?? S.byId[l.product_id].unit_price)]));
  openSheet(`<h2 id="sheet-title">Réceptionner une livraison</h2>
    <p class="muted small">${esc(orderTitle(o))} · ${esc(siteName(o.site_id))}</p>
    <div class="field"><label for="rc-ref">N° de bon de livraison</label><input type="text" id="rc-ref" autocomplete="off" placeholder="Facultatif"></div>
    <p class="small muted">Les quantités sont préremplies avec ce qui reste à livrer. Corrigez-les selon ce qui est vraiment arrivé ; mettez 0 pour un produit qui n'est pas là.</p>
    <div class="row" style="gap:8px;margin-bottom:8px"><button type="button" class="btn small" id="rc-all">Tout est arrivé</button><button type="button" class="btn small" id="rc-none">Tout à 0</button></div>
    <div class="list" id="rc-list"></div>
    <div class="notice info" id="rc-sum" style="display:block"></div>
    <button type="button" class="btn primary block" id="rc-ok">Enregistrer la réception</button>
    <button type="button" class="btn ghost block" data-close-sheet>Annuler</button>`,
  (root) => {
    const draw = () => {
      $('#rc-list', root).innerHTML = left.map((l) => {
        const p = S.byId[l.product_id];
        return `<div class="item"><span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit')}${brandHead(p)}</span>
          <span class="sub">Attendu ${fmt(lineLeft(l))}${p ? ` × ${esc(p.packaging)}${esc(packOfUnits(p, lineLeft(l)))}` : ''}</span>
          <span class="sub row" style="gap:6px"><input type="text" inputmode="decimal" class="price-in" data-rprice="${l.id}" value="${prices[l.id] != null ? fmt(prices[l.id]) : ''}" placeholder="€ HT" aria-label="Prix unitaire HT"> € HT l'unité${packN(p) ? ` (prix du ${esc((p.order_pack || '').split(' ')[0].toLowerCase())} ÷ ${fmt(packN(p))})` : ''}</span></span>
          ${miniStepper(l.id, qty[l.id])}</div>`;
      }).join('');
      sum();
    };
    const sum = () => {
      let got = 0, wait = 0, amount = 0;
      for (const l of left) {
        const q = qty[l.id] || 0;
        if (q > 0) { got += 1; if (prices[l.id] != null) amount += q * prices[l.id]; }
        if (q < lineLeft(l)) wait += 1;
      }
      $('#rc-sum', root).innerHTML = `${got} produit${got > 1 ? 's' : ''} reçu${got > 1 ? 's' : ''}${amount ? ` · ${money(amount)} HT` : ''}<br>${wait ? `<strong>${wait} produit${wait > 1 ? 's' : ''} resteront en attente</strong>` : 'Rien ne restera en attente : le bon sera soldé.'}`;
      $('#rc-ok', root).disabled = !got;
    };
    draw();
    bindMiniSteppers($('#rc-list', root), qty, sum);
    $('#rc-list', root).addEventListener('input', (e) => {
      const inp = e.target.closest('[data-rprice]');
      if (!inp) return;
      const v = parseNum(inp.value);
      if (inp.value.trim() !== '' && Number.isFinite(v) && v >= 0) prices[inp.dataset.rprice] = round2(v); else delete prices[inp.dataset.rprice];
      sum();
    });
    $('#rc-all', root).onclick = () => { for (const l of left) qty[l.id] = lineLeft(l); draw(); };
    $('#rc-none', root).onclick = () => { for (const l of left) delete qty[l.id]; draw(); };
    $('#rc-ok', root).onclick = async (e) => {
      const lines = left.filter((l) => qty[l.id] > 0).map((l) => ({ line_id: l.id, quantity: qty[l.id], unit_price: prices[l.id] ?? null }));
      if (!lines.length) return;
      busy(e.target, true);
      const { error } = await S.sb.rpc('receive_order', { p_order: o.id, p_lines: lines, p_reference: $('#rc-ref', root).value.trim() });
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      for (const l of lines) { const ol = left.find((x) => x.id === l.line_id); if (l.unit_price != null && S.byId[ol.product_id]) S.byId[ol.product_id].unit_price = l.unit_price; }
      await refreshStocks();
      closeSheet();
      const wait = left.filter((l) => (qty[l.id] || 0) < lineLeft(l)).length;
      toast(wait ? `Réception enregistrée · ${wait} produit${wait > 1 ? 's' : ''} encore en attente` : 'Réception enregistrée · bon soldé');
      render();
    };
  });
}

async function drawOpenOrdersNotice(el, site, tok, text) {
  if (!el || !S.ordersReady || !canManage(site)) return;
  try {
    const open = await fetchOrders(site, ['en_cours']);
    if (stale(tok)) return;
    const n = open.flatMap(openLines).length;
    if (!n) return;
    el.innerHTML = `<a class="notice" href="#/commandes" style="text-decoration:none">${ICON.order.replace('<svg', '<svg width="22" height="22"')}<span>${text(n, open)}</span></a>`;
  } catch { /* hors ligne */ }
}
