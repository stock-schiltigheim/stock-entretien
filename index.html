<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c6dcf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestion des stocks">
<title>Gestion des stocks</title>
<link rel="icon" href="stock-icone-192.png">
<link rel="apple-touch-icon" href="balai-180.png">
<link rel="manifest" href="balai.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Stock Entretien — signalétique de réserve : bleu cobalt, jaune sécurité.
   Mobile d'abord, gros boutons, chiffres en colonnes. */
:root {
  --bg: #EEF1F7;
  --surface: #FFFFFF;
  --surface-2: #F6F8FC;
  --ink: #141B2D;
  --muted: #586179;
  --line: #D5DBE8;
  --accent: #1F3F8F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9F7;
  --signal: #F4C430;
  --signal-ink: #1E1A06;
  --ok: #217A4B;
  --ok-soft: #E1F2E8;
  --warn: #A55E00;
  --warn-soft: #FBEFD9;
  --danger: #B42318;
  --danger-soft: #FCE8E6;
  --shadow: 0 1px 2px rgba(20, 27, 45, .06), 0 4px 16px rgba(20, 27, 45, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  --tabs-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1320;
    --surface: #161D2E;
    --surface-2: #1C2438;
    --ink: #E9EDF6;
    --muted: #9AA4BD;
    --line: #2A3450;
    --accent: #8EA9FF;
    --accent-ink: #0E1320;
    --accent-soft: #22305A;
    --signal: #F4C430;
    --signal-ink: #1E1A06;
    --ok: #5BCB8E;
    --ok-soft: #173426;
    --warn: #F2B04A;
    --warn-soft: #3A2A10;
    --danger: #FF7A6E;
    --danger-soft: #3D1A17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
p { margin: 0; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

/* ---------- Barre du haut ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--accent); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--accent); color: var(--accent-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { .topbar, body::before { background: #142453; } .topbar { color: #fff; } }
.topbar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%231F3F8F%22/%3E%3Cg transform=%22translate(256 256) scale(0.95) translate(-224.4 -272)%22%3E%3Cg transform=%22rotate(35 256 256)%22%3E%3Crect x=%22240%22 y=%2240%22 width=%2232%22 height=%22250%22 rx=%2216%22 fill=%22%23FFE07A%22/%3E%3Crect x=%22214%22 y=%22270%22 width=%2284%22 height=%2238%22 rx=%2210%22 fill=%22%23FFE07A%22/%3E%3Crect x=%22214%22 y=%22300%22 width=%2284%22 height=%2210%22 fill=%22%231F3F8F%22 opacity=%22.25%22/%3E%3Cpath d=%22M206 312 H306 L352 448 Q354 458 344 458 H168 Q158 458 160 448 Z%22 fill=%22%23FFE07A%22/%3E%3Cg stroke=%22%231F3F8F%22 stroke-width=%229%22 stroke-linecap=%22round%22 opacity=%22.55%22%3E%3Cline x1=%22214%22 y1=%22344%22 x2=%22198%22 y2=%22440%22/%3E%3Cline x1=%22240%22 y1=%22344%22 x2=%22234%22 y2=%22440%22/%3E%3Cline x1=%22272%22 y1=%22344%22 x2=%22278%22 y2=%22440%22/%3E%3Cline x1=%22298%22 y1=%22344%22 x2=%22314%22 y2=%22440%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3Cg fill=%22%23FFFFFF%22%3E%3Cpath d=%22M110 104 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 l26 -10 z%22/%3E%3Cpath d=%22M404 396 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 z%22 opacity=%22.85%22/%3E%3C/g%3E%3C/svg%3E") center / cover no-repeat; flex: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
.brand-text { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .brand-text { font-size: 18px; } .site-switch button { padding: 8px 8px; font-size: 14px; } }
.site-switch { display: flex; gap: 4px; background: rgba(255,255,255,.14); padding: 3px; border-radius: 10px; }
.site-switch button { border: 0; background: transparent; color: #fff; font: 600 15px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.site-switch button[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); }
.site-label { font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; background: rgba(255,255,255,.14); padding: 8px 10px; border-radius: 8px; white-space: nowrap; }

/* ---------- Contenu ---------- */
.main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tabs-h) + 32px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
  outline: none;
}
.loading { padding: 48px 0; text-align: center; color: var(--muted); }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 4px 0; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 700 16px/1.1 var(--f-body); text-decoration: none; cursor: pointer;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.signal { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn.block { width: 100%; }
.btn svg { width: 22px; height: 22px; flex: none; }

.big-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.big-action {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 18px;
  min-height: 112px; padding: 14px; border-radius: var(--r); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow);
  font: 700 18px/1.15 var(--f-body); cursor: pointer; text-align: left;
}
.big-action svg { width: 30px; height: 30px; }
.big-action small { display: block; font: 400 14px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.big-action.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.big-action.primary small { color: rgba(30, 26, 6, .75); }
.big-action.wide { grid-column: 1 / -1; min-height: 88px; flex-direction: row; align-items: center; justify-content: flex-start; }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-weight: 700; font-size: 15px; }
.field .hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=search], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 400 17px/1.3 var(--f-body);
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search { position: relative; }
.search input { padding-left: 42px; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 700 14px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; min-height: 44px; font: 700 16px/1 var(--f-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button[data-kind="sortie"][aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); }
.seg button[data-kind="entree"][aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); }

.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: stretch; }
.stepper button { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; font: 700 26px/1 var(--f-body); cursor: pointer; min-height: 56px; }
.stepper input { text-align: center; font: 700 26px/1 var(--f-body); font-variant-numeric: tabular-nums; min-height: 56px; }
.mini-stepper { display: inline-grid; grid-template-columns: 40px 52px 40px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
.mini-stepper button { border: 0; background: var(--surface-2); color: var(--ink); height: 40px; font: 700 20px/1 var(--f-body); cursor: pointer; }
.mini-stepper input { border: 0; min-height: 40px; height: 40px; padding: 0; text-align: center; font: 700 17px/1 var(--f-body); font-variant-numeric: tabular-nums; border-radius: 0; box-shadow: none; }
.mini-stepper.on { border-color: var(--accent); }

/* ---------- Listes ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 64px; background: var(--surface); width: 100%; text-align: left; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
button.item, a.item { cursor: pointer; }
.item .main-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .title { font-weight: 700; overflow-wrap: anywhere; }
.item .sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.item .qty { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .qty .n { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.item .qzones { flex: none; display: flex; flex-direction: row; gap: 5px; align-items: center; }
.item .qzones .more { font: 700 11px/1 var(--f-body); color: var(--muted); }
.group-label { padding: 10px 14px 6px; background: var(--surface-2); border-top: 1px solid var(--line); font: 600 14px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group-label:first-child { border-top: 0; }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--line); flex: none; }
.stripe.ok { background: var(--ok); } .stripe.vide { background: var(--line); } .stripe.bas { background: var(--warn); } .stripe.rupture { background: var(--danger); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font: 700 12.5px/1.3 var(--f-body); white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bas, .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.rupture, .pill.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
.kpi .n { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); line-height: 1.2; }
.kpi.alert .n { color: var(--danger); }
.kpi.attn { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }

/* ---------- Fiche produit ---------- */
.stock-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: end; }
.stock-hero .big { font: 700 64px/0.9 var(--f-display); font-variant-numeric: tabular-nums; }
.stock-hero .unit { color: var(--muted); font-size: 15px; }
.meter { grid-column: 1 / -1; height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--ok); border-radius: 8px; }
.meter.bas span { background: var(--warn); } .meter.rupture span { background: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 10px; padding: 10px; }
.fact .v { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.fact .k { font-size: 12.5px; color: var(--muted); }

.signal-band { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; font: 700 20px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.signal-band.danger { background: #B42318; color: #fff; }
.signal-band.attention { background: var(--signal); color: var(--signal-ink); }
.pictos { display: flex; flex-wrap: wrap; gap: 10px; }
.picto { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; text-align: center; font-size: 12.5px; line-height: 1.2; }
.picto svg { width: 64px; height: 64px; }
.ppe { display: flex; flex-wrap: wrap; gap: 8px; }
.ppe span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #1F5FBF; color: #fff; font-weight: 700; font-size: 14px; }
.ppe span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.safety-block { display: flex; flex-direction: column; gap: 4px; }
.safety-block h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.safety-block p { white-space: pre-line; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: 15px; }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.page-thumb { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-weight: 700; }
.page-thumb img { width: 100%; height: 100%; object-fit: cover; }
.page-thumb .del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 18px; cursor: pointer; }
.page-thumb .badge { position: absolute; left: 4px; bottom: 4px; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 6px; }

/* ---------- Mouvements ---------- */
.mv-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; font: 700 20px/1 var(--f-display); }
.mv-icon.sortie { background: var(--warn-soft); color: var(--warn); }
.mv-icon.entree { background: var(--ok-soft); color: var(--ok); }
.mv-icon.inventaire { background: var(--accent-soft); color: var(--accent); }
.delta { font: 700 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.delta.neg { color: var(--warn); } .delta.pos { color: var(--ok); }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font: 600 13px/1.2 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td input { min-height: 40px; padding: 6px 8px; font-size: 16px; width: 72px; text-align: right; }
@media (max-width: 480px) { th, td { padding: 8px 6px; } td input { width: 58px; } th, th.n { letter-spacing: .03em; white-space: normal; } }

/* ---------- Barre panier ---------- */
.cartbar {
  position: fixed; left: 0; right: 0; z-index: 25;

/* =====================================================================
   Charte de la Ville de Schiltigheim — même présentation que la
   Main courante technique et les Registres de sécurité
   ===================================================================== */
:root {
  --sch: #e83447; --sch-dk: #c8102e;
  --bg: #f6f4f4; --surface: #ffffff; --surface-2: #faf7f7; --ink: #2b2a2a; --muted: #5f5a5b; --line: #ece4e5;
  --accent: #c4223a; --accent-ink: #ffffff; --accent-soft: #fde7ea;

  --ok: #1d6b43; --ok-soft: #e5f3eb; --warn: #8a5a00; --warn-soft: #fdf4e3; --danger: #b81c33; --danger-soft: #fde7ea;
  --shadow: 0 1px 3px rgba(43,42,42,.07);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --tabs-h: 66px;

}

  :root { --bg: #161314; --surface: #211c1d; --surface-2: #2a2324; --ink: #f1eceb; --muted: #b3a9aa; --line: #3a3132;
    --accent: #ff8a96; --accent-ink: #2a0a0e; --accent-soft: #3a1a1e; --signal: #e83447; --signal-ink: #fff;
    --ok: #82c9a2; --ok-soft: #1d2a22; --warn: #f2b04a; --warn-soft: #3a2a10; --danger: #ff7a86; --danger-soft: #3a1a1e; }

.thit { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: #fff; border: 1px solid #f0e8e9; text-decoration: none; color: #2b2a2a; min-height: 64px; box-shadow: 0 1px 3px rgba(43,42,42,.06); }

@media (prefers-color-scheme: dark) { .thit { background: var(--surface); border-color: var(--line); color: var(--ink); } .thit small, .theme p.ts { color: var(--muted); } }
.compte { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 16px; background: #faf7f7; border: 1px solid #f0e8e9; }
.hero{display:flex;justify-content:center;padding:6px 0 4px}
.bulles{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 8px;padding:6px 0 10px;max-width:900px;margin:0 auto}
.bulles>.bul{width:150px}
.bul{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center;max-width:150px;-webkit-tap-highlight-color:transparent;cursor:pointer;background:none;border:none;padding:0;font:inherit;min-height:0}
.bul .rond{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2) 72%);box-shadow:0 10px 22px -6px var(--sh,rgba(0,0,0,.35)),inset 0 -6px 12px rgba(0,0,0,.18);transition:transform .15s cubic-bezier(.3,1.6,.6,1),box-shadow .15s}
.bul .rond::before{content:"";position:absolute;top:10%;left:18%;width:42%;height:26%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(-20deg)}
.bul .rond svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));position:relative}
.bul:hover .rond{transform:translateY(-3px) scale(1.04)}
.bul:active .rond{transform:scale(.9);box-shadow:0 4px 10px -4px var(--sh,rgba(0,0,0,.35)),inset 0 -4px 10px rgba(0,0,0,.2)}
.bul b{font-family:var(--display);font-size:1.02rem;font-weight:800;line-height:1.1}
.bul small{font-size:.78rem;color:var(--muted);margin-top:-5px;line-height:1.2}
.bul small.ko{color:#b81c33;font-weight:700}
.bul small.okk{color:#1d6b43;font-weight:700}
.bul .nb{position:absolute;top:2px;right:2px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:#E5252A;color:#fff;font:800 .95rem/26px var(--body);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:center}
.bul.big .rond{width:150px;height:150px}
.bul.big b{font-size:1.2rem}
.bul:focus-visible{outline:none}
.bul:focus-visible .rond{outline:3px solid var(--sch);outline-offset:4px}
@media (prefers-reduced-motion:no-preference){
  .bul{animation:pop .45s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

}
.bulsec{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin:6px 0 -6px}
@media (max-width:420px){.bulles{gap:18px 0}.bulles>.bul{width:33.3%}.bul .rond{width:86px;height:86px}.bul b{font-size:.9rem}.bul small{font-size:.7rem}.bul .nb{min-width:26px;height:26px;font-size:.82rem;line-height:22px;top:0;right:0}.bul.big .rond{width:128px;height:128px}.hello2 h2{font-size:1.4rem}}
/* ===== Signature sans responsable ===== */
.passbox{border:2px solid var(--sch);background:linear-gradient(180deg,#fff7f8,var(--paper))}
.passbox h3{font-size:1.1rem}
.orbite{position:relative;width:min(calc(100vw - 6px),700px);aspect-ratio:1;margin:4px 0 3cqw calc(50% - min(calc(100vw - 6px),700px) / 2);container-type:inline-size}
.orbite .anneau{position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(232,52,71,.28)}
.orbite .halo{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle,rgba(232,52,71,.10),rgba(232,52,71,0) 70%)}
.orbite .centre{position:absolute;left:30cqw;top:30cqw;width:40cqw;height:40cqw;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;text-decoration:none;
  box-shadow:0 2.5cqw 6cqw -1.5cqw rgba(200,30,50,.35),0 0 0 1.6cqw rgba(232,52,71,.08),inset 0 -1cqw 2cqw rgba(0,0,0,.04)}
.orbite .centre img{height:14cqw;width:auto}

.orbite .bul{--k:1;position:absolute;width:22cqw;left:calc(var(--x) - 11cqw);top:calc(var(--y) - var(--r) * var(--k) / 2);gap:.9cqw;max-width:none}
.orbite .bul .rond{width:calc(var(--r) * var(--k));height:calc(var(--r) * var(--k))}
.orbite .bul b{font-size:clamp(.62rem,2.5cqw,1.02rem);white-space:nowrap}
.orbite .bul small{display:none}
.orbite .bul .nb{min-width:clamp(20px,5.2cqw,32px);height:clamp(20px,5.2cqw,32px);line-height:calc(clamp(20px,5.2cqw,32px) - 4px);font-size:clamp(.62rem,2.3cqw,.95rem);padding:0 .9cqw;top:-.6cqw;right:-.6cqw}
.orbite .bul.big b{font-size:clamp(.7rem,2.8cqw,1.1rem)}
@container (max-width:460px){.orbite .bul{--k:1.12}.orbite .bul b,.orbite .bul.big b{font-size:3.1cqw}.orbite .centre .rs{font-size:2.6cqw}}
@media (prefers-reduced-motion:no-preference){
  .orbite .centre{animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}

  @keyframes tourne{to{transform:rotate(360deg)}}
}

.seg { border-radius: 999px; background: #f4eeee; border-color: transparent; }
.seg button { border-radius: 999px; }
.seg button[data-kind="sortie"][aria-pressed="true"] { background: var(--sch); color: #fff; box-shadow: 0 4px 10px rgba(232,52,71,.3); }
.seg button[data-kind="entree"][aria-pressed="true"] { background: #0a8a4c; color: #fff; }
.seg button[data-kind="inventaire"][aria-pressed="true"] { background: #1f5fd6; color: #fff; }
@media (prefers-color-scheme: dark) { .seg { background: var(--surface-2); } }

/* Photos des produits et bulles de famille */
.mosaic { flex: none; display: grid; gap: 2px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.mosaic.n1 { grid-template-columns: 1fr; }
.mosaic.n2 { grid-template-columns: 1fr 1fr; }
.mosaic.n3, .mosaic.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.mosaic.n3 img:first-child { grid-row: span 2; }
.mosaic img { width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #fff; display: block; }
.rub-gal { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 0 6px; margin: 4px 0 10px; }
.rub-gal button { flex: 0 0 auto; width: 96px; height: 96px; border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 6px; scroll-snap-align: start; cursor: zoom-in; }
.rub-gal img { width: 100%; height: 100%; object-fit: contain; display: block; }
.cropbox { position: relative; display: block; overflow: hidden; margin: auto; max-width: 100%; }
.viewer .cropbox { flex: 0 0 100%; scroll-snap-align: center; height: 50vh !important; background: #fff; border-radius: 14px; border: 1px solid var(--line); }
.viewer .cropbox img { border: 0; border-radius: 0; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow); }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.bhead .cnt { font-size: 13px; color: var(--muted); }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px; }
@media (min-width: 720px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pcard { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pcard .ph { position: relative; aspect-ratio: 1 / 1; background: #fff; border: 0; padding: 0; width: 100%; display: grid; place-items: center; cursor: zoom-in; }
.pcard .ph img { width: 100%; height: 100%; object-fit: contain; padding: 10px; box-sizing: border-box; }
.pcard .ph .more { position: absolute; right: 6px; bottom: 6px; background: rgba(20, 27, 45, .72); color: #fff; font: 700 11px/1 var(--f-body); border-radius: 10px; padding: 4px 7px; }
.pcard .noimg { cursor: default; color: var(--muted); font-size: 12px; text-align: center; gap: 6px; background: var(--surface-2); }
.pcard .noimg svg { width: 34px; height: 34px; opacity: .55; }
.pcard .bd { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; border-top: 1px solid var(--line); }
.pcard .nm { font-weight: 700; font-size: 14px; line-height: 1.25; }
.pcard .meta { font-size: 12px; line-height: 1.35; color: var(--muted); }
.pcard .fds { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font: 700 12px/1.2 var(--f-body); color: var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 5px 8px; text-decoration: none; }
.pcard .fds.miss { color: var(--warn); background: var(--warn-soft); }
.pcard .ed { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .94); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.pcard .ed svg { width: 16px; height: 16px; }
.viewer { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; }
.viewer img { flex: 0 0 100%; scroll-snap-align: center; max-height: 62vh; object-fit: contain; background: #fff; border-radius: 14px; border: 1px solid var(--line); }
.rc-prev { width: 100%; max-height: 190px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.rc-cand { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.rc-cand.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.rc-cand img, .rc-cand .ph0 { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 10px; border: 1px solid var(--line); flex: none; }
.rc-cand .t { font-weight: 700; line-height: 1.25; }
.rc-cand .s { font-size: 13px; color: var(--muted); }
.rc-score { font: 700 11px/1 var(--f-body); color: var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 3px 6px; }
.pthumb { flex: none; border-radius: 12px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); }
.pthumb.fam { border: 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, var(--c1), var(--c2) 75%); box-shadow: inset 0 -3px 6px rgba(0,0,0,.18); }
.pthumb.fam svg { width: 56%; height: 56%; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fam-lab { display: inline-flex; align-items: center; gap: 8px; }
.group-label .fam-lab { text-transform: none; letter-spacing: .02em; }
.phero { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.phero img { width: 120px; height: 120px; object-fit: cover; border-radius: 18px; border: 1px solid var(--line); display: block; }
.item .stripe + .pthumb { margin-left: 2px; }

/* Statistiques */
.hbars { display: grid; gap: 10px; }
.hb { display: grid; grid-template-columns: minmax(0, 42%) 1fr auto; align-items: center; gap: 10px; }
.hb-l { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 14px; }
.hb-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.hb-t span { display: block; height: 100%; border-radius: 6px; }
.hb-v { text-align: right; font: 700 15px/1.1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-v small { display: block; font: 400 11.5px/1.2 var(--f-body); color: var(--muted); }
.rank { width: 24px; flex: none; text-align: center; font: 800 18px/1 var(--f-display); color: var(--sch); }
.lg-bar { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--sch); margin: 0 4px 0 8px; vertical-align: -1px; }
.lg-dash { display: inline-block; width: 16px; border-top: 2px dashed #4a5466; margin: 0 4px 0 10px; vertical-align: 3px; }

/* Inventaire en équipe */
.inv-prog .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.inv-prog strong { font: 700 20px/1.2 var(--f-display); }
.ct-track { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 10px 0 8px; }
.ct-track span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4be39a, #0a8a4c); border-radius: 6px; transition: width .3s; }
.fam-h { font: 700 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 4px 6px; }
.ct-item .ct-in { width: 76px; flex: none; text-align: center; font: 700 20px/1 var(--f-display); padding: 10px 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; }
.ct-item .ct-in:focus { border-color: var(--sch, #c8102e); outline: none; }
.ct-item.done { background: color-mix(in srgb, #0a8a4c 7%, var(--surface)); }
.ct-item.done .ct-in { border-color: #0a8a4c; }
.ct-item .ct-by { color: #0a8a4c; font-weight: 600; font-size: 13px; }
.ct-rev { cursor: pointer; }
.ct-rev input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: #c8102e; }
.inv-notice { margin: 12px 0; }

/* Bandeau hors connexion */
.netbar { position: relative; z-index: 15; }
.netbar button { display: block; width: 100%; border: 0; font: 700 14px/1.3 var(--f-body, inherit); padding: 9px 14px; color: #fff; background: #4a5466; text-align: center; cursor: pointer; }
.netbar.off button { background: #b4530a; }
.netbar.sync button { background: #0a8a4c; }
.netbar.ko button { background: #c8102e; }
button.etat { border: 0; font: inherit; cursor: pointer; }
.qr-big { width: min(240px, 70vw); background: #fff; padding: 10px; border-radius: 14px; border: 3px solid var(--sch, #c8102e); }
.qr-big svg { display: block; width: 100%; height: auto; }

/* Produits expliqués aux agents */
.zb { flex: none; border-radius: 8px; display: inline-grid; place-items: center; background: var(--c2); }
.zb svg { width: 56%; height: 56%; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ptag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 6px; background: #2b2a2a; color: #fff; font: 700 13px/1.3 var(--f-body); }
.ptag svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.learn h2 { font-size: 1.25rem; }
.lq { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font: 800 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }

.lverb { font-weight: 700; font-size: 18px; }
.ltic { flex: none; width: 50px; height: 50px; border-radius: 14px; background: #2b2a2a; display: grid; place-items: center; }
.ltic svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lzones { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.lzone { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 6px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 14px; line-height: 1.2; }
.lmeth { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.lm { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 10px 8px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.lm svg, .ldose svg, .lsafe svg { width: 38px; height: 38px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.lsafe > span { display: flex; flex-direction: column; }
.lgold { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #2b2a2a; color: #fff; font-size: 15px; line-height: 1.3; }

#p-listen.on { background: var(--sch, #e83447); color: #fff; border-color: var(--sch, #e83447); }

.cl-types, .cl-zones { display: flex; flex-wrap: wrap; gap: 6px; }

.lhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }

.lcomps { display: grid; gap: 8px; }
.lpow { display: flex; align-items: center; gap: 10px; }

.findq svg { width: 24px; height: 24px; flex: none; }
.findq input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 17px var(--f-body); color: inherit; }
.ftiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ftile { display: flex; align-items: center; gap: 10px; padding: 10px; min-height: 62px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: inherit; font: 800 17px/1.1 var(--f-display); }
.ftile.wide { justify-content: center; min-height: 52px; }

.tg-head { display: flex; align-items: center; gap: 12px; }

/* Fiche d'utilisation : présentation sobre, type fiche technique */
.fx { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 6px 0 14px; }
.fx-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: #2b2a2a; color: #fff; }
.fx-title { font: 800 15px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.fx-top .btn { color: #fff; border-color: rgba(255,255,255,.35); background: transparent; min-height: 34px; padding: 4px 10px; }
.fx-top .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fx-s { padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.fx-s:first-of-type { border-top: 0; }
.fx-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.fx-h h3 { margin: 0; flex: 1; font: 800 15px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.fx-n { width: 22px; height: 22px; border-radius: 4px; background: var(--sch, #c8102e); color: #fff; display: grid; place-items: center; font: 800 13px/1 var(--f-display); }
.fx-h .ledit { min-height: 32px; padding: 4px 8px; font-size: 13px; }
.fx-zones { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.fx-zones li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-weight: 700; font-size: 15px; }
.fx-sw { flex: none; width: 30px; height: 30px; border-radius: 5px; background: var(--c); display: grid; place-items: center; }
.fx-sw svg, .fx-ic svg, .fx-m svg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fx-sw svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; }
.fx-tab { width: 100%; border-collapse: collapse; font-size: 15px; }
.fx-tab th, .fx-tab td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.fx-tab tr:last-child th, .fx-tab tr:last-child td { border-bottom: 0; }
.fx-tab th { width: 46%; font-weight: 800; white-space: nowrap; }
.fx-tab td { color: var(--muted); }
.fx-tab td strong { color: var(--fg, inherit); }
.fx-ic { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 8px; vertical-align: middle; border-radius: 5px; background: #2b2a2a; }
.fx-ic svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2.2; }
.fx-m { display: inline-flex; align-items: center; gap: 6px; margin: 2px 10px 2px 0; color: var(--fg, inherit); font-weight: 700; }
.fx-m svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; }
.fx-steps { margin: 10px 0 8px; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 6px; }
.fx-steps li { counter-increment: st; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4; }
.fx-steps li::before { content: counter(st); flex: none; width: 22px; height: 22px; border-radius: 4px; border: 1.5px solid #2b2a2a; display: grid; place-items: center; font: 800 12px/1 var(--f-display); }
.fx-warn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 4px solid #f2c200; background: #fffbea; }
.fx-warn > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.fx-warn > div + div { border-left: 1px solid #f0e2a8; }
.fx-wl { font: 800 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: #8a6d00; }
.fx-warn span:not(.fx-wl) { color: #5c4a00; }
.fx-todo { margin: 0; color: var(--muted); font-size: 14px; font-style: italic; }
.fx-safe > h2 { font: 800 15px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 10px 14px; margin: 0; background: #2b2a2a; color: #fff; border-radius: 10px 10px 0 0; }
.fx-safe > .card { border-radius: 0 0 10px 10px; margin-top: 0; }
.fx-safe .safety-block h3 { font: 800 13px/1 var(--f-display); letter-spacing: .1em; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.fx-safe .ppe span { border-radius: 5px; background: #1f5fbf; }
.fx-safe .ppe span::before { border-radius: 2px; }
@media (prefers-color-scheme: dark) { .fx-warn { background: #2a2610; } .fx-warn span:not(.fx-wl) { color: #f1e3a6; } .fx-wl { color: #f2c200; } }

.cl-opt:has(input:checked) .pgauge.p1 > span:nth-child(-n+1), .cl-opt:has(input:checked) .pgauge.p2 > span:nth-child(-n+2), .cl-opt:has(input:checked) .pgauge.p3 > span:nth-child(-n+3) { background: #fff; }
/* ================= STYLE GLACIER 3D (même famille que la Main courante « Ivoire 3D ») ================= */
:root{--bg:#cfe2f4;--surface:#ffffff;--surface-2:#f1f6fb;--sunk:#c3d9ee;--ink:#0f1a26;--muted:#4a5b6d;--line:#c4d7ea;
  --accent:#c8203a;--accent-ink:#fff;--accent-soft:#fbe6e8;--sch:#e83447;--sch-dk:#c8102e;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;--display:var(--f-display);
  --f-body:"Inter","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--body:var(--f-body);
  --ombre:inset 0 1px 0 rgba(255,255,255,.95),0 2px 4px rgba(20,50,80,.06),0 16px 34px rgba(20,50,80,.11);
  --shadow:0 24px 60px rgba(20,50,80,.20);
  --perle:radial-gradient(circle at 32% 26%,#ffffff 0%,#ffffff 30%,#ebf2f8 66%,#cddcea 100%);
  --perle-ombre:inset 0 -6px 11px rgba(70,110,150,.26),inset 0 5px 8px rgba(255,255,255,.95),0 14px 22px rgba(20,55,90,.20),0 3px 5px rgba(0,0,0,.10);
  --rubis:radial-gradient(circle at 32% 26%,#ff8a96 0%,#e83447 38%,#c21f34 72%,#8e1325 100%);
  --bouton:linear-gradient(180deg,#e23a4e 0%,#c8203a 100%);
  --plateau:radial-gradient(circle at 40% 30%,#ffffff 0%,#e6f0fa 50%,#b9d1e9 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1319;--surface:#151d26;--surface-2:#1b2530;--sunk:#1f2a36;--ink:#ecf2f7;--muted:#a3b1bf;--line:#2a3746;
  --accent:#ff6b7b;--accent-ink:#2a0a0e;--accent-soft:#3a1c22;
  --ombre:inset 0 1px 0 rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.3),0 16px 34px rgba(0,0,0,.38);--shadow:0 24px 60px rgba(0,0,0,.6);
  --perle:radial-gradient(circle at 32% 26%,#ffffff 0%,#f2f6fa 34%,#d3dfea 72%,#a9bccd 100%);
  --plateau:radial-gradient(circle at 40% 30%,#1f2a36 0%,#17212b 60%,#10171e 100%)}}
html,body{overflow-x:clip}
body{background:linear-gradient(180deg,#c6dcf2 0%,#d6e7f6 45%,#e3eef9 100%) fixed var(--bg);-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){body{background:linear-gradient(180deg,#0b1a2b 0%,#0d1622 100%) fixed var(--bg)}}
body::before{background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em}
.section-head h2,.page-head h1{font-weight:600}
/* en-tête en verre, filet rouge */
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent)!important;color:var(--ink)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 2px 0 var(--sch)}
.brand-tx{border-left:1px solid var(--line)}
.brand-text{font-family:var(--display);font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.logo-sch span{font-family:var(--body);font-weight:800;letter-spacing:.16em}
.bell,.site-label{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--ombre)}
.site-switch{background:var(--surface);border:1px solid var(--line);box-shadow:var(--ombre)}
.site-switch button{color:var(--ink);font-family:var(--body);font-weight:700}
.site-switch button[aria-pressed="true"]{background:var(--bouton);color:#fff;box-shadow:0 6px 14px rgba(200,32,58,.30),inset 0 1px 0 rgba(255,255,255,.28)}
/* cartes et listes en relief */
.card,.list{border-radius:20px;border:1px solid var(--line);box-shadow:var(--ombre);background:var(--surface)}
.item:hover{background:var(--surface-2)}
a.card:hover,button.card:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 8px rgba(20,50,80,.08),0 22px 40px rgba(20,50,80,.15)}
.notice{border-radius:18px;box-shadow:var(--ombre)}
/* boutons en relief */
.btn{border-radius:14px}
.btn.primary,.btn.signal{background:var(--bouton);border:0;color:#fff;box-shadow:0 8px 18px rgba(200,32,58,.28),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:active,.btn.signal:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(200,32,58,.28),inset 0 2px 4px rgba(0,0,0,.15)}
.btn:not(.primary):not(.signal):not(.ghost):not(.danger){background:var(--surface);border:1px solid var(--line);box-shadow:var(--ombre)}
input,select,textarea{border-radius:14px}
.seg{background:var(--sunk)}
.pill{border-radius:999px}
/* feuilles du bas */
.sheet .panel{border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(20,50,80,.18)}
/* barre du bas flottante */
@media (max-width:899px){
  .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 14px 34px rgba(20,50,80,.18);padding-bottom:0}
  body{padding-bottom:calc(var(--tabs-h) + 48px + env(safe-area-inset-bottom,0px))!important}
  .toast{bottom:calc(var(--tabs-h) + 40px + env(safe-area-inset-bottom,0px))}}
.tab{color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--sch)}
.tab.scan .scan-dot{background:var(--rubis);border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--sch),0 12px 24px rgba(212,42,63,.42),inset 0 -5px 9px rgba(90,0,15,.35)}
.tab.scan > span:last-child{color:var(--ink)}
.tab .badge-n{border-color:var(--surface)}
/* accueil */
.hello2 h2{font-family:var(--display);font-weight:600;font-size:2.1rem;letter-spacing:-.025em}
.hello2 .etat{box-shadow:var(--ombre)}
.hello2 .etat.ok{background:#e3f2ea;color:#1e6b43}
/* ===== bulles = perles en relief, contour rouge, picto de couleur ===== */
.bul{color:var(--ink)}
.bul .rond{background:var(--perle);border:2.5px solid var(--sch);box-shadow:var(--perle-ombre)}
.bul .rond::before{top:8%;left:16%;width:44%;height:24%;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,0));filter:blur(1px)}
.bul .rond svg{stroke:var(--c2);stroke-width:2.6;filter:drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 2px 2px rgba(0,0,0,.14))}
.bul.big .rond{background:var(--rubis);border:3px solid #fff;box-shadow:0 0 0 2px var(--sch),0 18px 30px rgba(212,42,63,.45),inset 0 -8px 14px rgba(90,0,15,.35),inset 0 6px 10px rgba(255,255,255,.35)}
.bul.big .rond::before{background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.bul.big .rond svg{stroke:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.bul .nb{background:var(--rubis);border:2px solid #fff;box-shadow:0 4px 8px rgba(212,42,63,.4);font-family:var(--body)}
.bul b{font-family:var(--body);font-weight:700}
.bul:active .rond{transform:translateY(2px) scale(.95);box-shadow:inset 0 -4px 8px rgba(70,110,150,.3),inset 0 3px 6px rgba(255,255,255,.9),0 6px 10px rgba(20,55,90,.18)}
/* ===== système solaire 3D ===== */
.orbite{transform:perspective(1100px) rotateX(var(--rx,12deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .35s ease-out}
.orbite .plateau{position:absolute;inset:5%;border-radius:50%;background:var(--plateau);box-shadow:0 6cqw 9cqw rgba(20,55,90,.18),0 2cqw 3cqw rgba(20,55,90,.10),inset 0 2px 0 #fff,inset 0 -2cqw 4cqw rgba(70,110,150,.18)}
.orbite .halo{display:none}
.orbite .anneau{inset:13%;border:1.5px dashed rgba(232,52,71,.45)}
.orbite .orbin{position:absolute;inset:22%;border-radius:50%;border:1px solid rgba(232,52,71,.22)}
.orbite .centre{border:2.5px solid var(--sch);background:var(--perle);box-shadow:0 4cqw 6cqw rgba(20,55,90,.22),inset 0 -1.5cqw 3cqw rgba(70,110,150,.18)}
.orbite .centre img{transform-style:preserve-3d}
.orbite .centre .se{font-family:var(--body);font-weight:800;color:var(--sch-dk)}
.orbite .centre .rs{color:#4d5a68}
.orbite .lunes,.orbite .lunes2{position:absolute;border-radius:50%;pointer-events:none}
.orbite .lunes{inset:22%}.orbite .lunes2{inset:5%}
.orbite .lunes i,.orbite .lunes2 i{position:absolute;border-radius:50%}
.orbite .lunes i:first-child{left:calc(50% - 2cqw);top:-2cqw;width:4cqw;height:4cqw;background:var(--rubis);box-shadow:0 1cqw 2cqw rgba(212,42,63,.45)}
.orbite .lunes i:last-child{left:calc(50% - 1.4cqw);bottom:-1.4cqw;width:2.8cqw;height:2.8cqw;background:var(--perle);border:1.5px solid var(--sch)}
.orbite .lunes2 i{right:-1.2cqw;top:calc(50% - 1.2cqw);width:2.4cqw;height:2.4cqw;background:var(--sch);opacity:.7}
.orbite .orb{position:absolute;inset:0;transform-style:preserve-3d}
.orbite .bul{width:34cqw;left:calc(var(--x) - 17cqw);gap:1.4cqw}
.orbite .bul b{background:var(--surface);color:var(--ink);padding:.28em .85em;border-radius:999px;box-shadow:0 4px 10px rgba(20,50,80,.14);font-size:clamp(.74rem,3.1cqw,1.12rem);position:relative;z-index:2}
.orbite .bul.big b{font-size:clamp(.8rem,3.5cqw,1.25rem);color:var(--sch-dk)}
@media all{
  .orbite .orb{animation:seOrbite 60s linear infinite;animation-delay:var(--od,0s)}
  .orbite .orb>.bul{animation:seContre 60s linear infinite;animation-delay:var(--od,0s);transform-origin:50% 50%}
  .orbite .centre{animation:seFlotte 5s ease-in-out infinite}
  .orbite .centre img{animation:sePiece 9s linear infinite;animation-delay:var(--pd,0s)}
  .orbite .lunes{animation:seContre 16s linear infinite;animation-delay:var(--ld,0s)}
  .orbite .lunes2{animation:seOrbite 26s linear infinite;animation-delay:var(--ld,0s)}
  .orbite .anneau{animation:none}
  .orbite .bul.big .rond{animation:seHalo 2.6s ease-out infinite}
  .orbite.pause .orb,.orbite.pause .orb>.bul,.orbite:has(.bul:hover) .orb,.orbite:has(.bul:hover) .orb>.bul{animation-play-state:paused}}
@keyframes seOrbite{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes seContre{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes sePiece{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes seFlotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2cqw)}}
@keyframes seHalo{0%,100%{box-shadow:0 0 0 2px var(--sch),0 18px 30px rgba(212,42,63,.45),inset 0 -8px 14px rgba(90,0,15,.35),0 0 0 0 rgba(232,52,71,.35)}50%{box-shadow:0 0 0 2px var(--sch),0 18px 30px rgba(212,42,63,.45),inset 0 -8px 14px rgba(90,0,15,.35),0 0 0 14px rgba(232,52,71,0)}}
/* connexion Glacier : fond bleu glacier, cercles d'orbite */
.auth-wrap{background:radial-gradient(circle at 50% 38%,#eaf3fb 0%,#cfe2f4 55%,#aecbe6 100%)}
.auth-wrap::before{background:none;border:1.5px dashed rgba(232,52,71,.30);border-radius:50%;inset:auto;width:min(150vw,900px);aspect-ratio:1;left:50%;top:40%;transform:translate(-50%,-50%)}
.auth-wrap::after{content:"";position:fixed;width:min(105vw,620px);aspect-ratio:1;left:50%;top:40%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(232,52,71,.18);pointer-events:none}
.auth-wrap .auth{border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(20,50,80,.06),0 40px 80px rgba(20,50,80,.20);z-index:1}
.auth-wrap .auth::before{height:4px}
@media (prefers-color-scheme:dark){.auth-wrap{background:radial-gradient(circle at 50% 38%,#1c2733 0%,#0d1319 70%)}
  .topbar{color:var(--ink)!important}.brand-text{color:var(--ink)}.orbite .centre .rs{color:#4d5a68}.orbite .bul b{color:var(--ink)}}
/* ===== TACTILE : boutons très sensibles (même bloc dans les 4 applications) ===== */
a,button,[role="button"],label,select,summary,input[type="checkbox"],input[type="radio"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.bul,.tab,.card,.item,.chip,.pill,a.tile,.tile{-webkit-user-select:none;user-select:none}
.btn,button.btn,a.btn{min-height:48px}
.btn:active,button:not(:disabled):active,a.card:active,button.card:active,.item:active,.tab:active,.tile:active,.chip:active{transform:scale(.96);transition:transform .06s}
.taped:not(.bul){transform:scale(.95)!important;transition:transform .06s!important}
/* plateau : seuls les ronds captent le doigt, le décor laisse passer */
.orbite .plateau,.orbite .anneau,.orbite .orbin,.orbite .halo,.orbite .lunes,.orbite .lunes2,.orbite .orb{pointer-events:none}
.orbite .bul,.orbite .centre{pointer-events:auto}
.orbite .bul{z-index:3}
.orbite .bul::after{content:"";position:absolute;left:50%;top:calc(var(--r,22cqw) * var(--k,1) / 2);width:calc(var(--r,22cqw) * var(--k,1) + 7cqw);height:calc(var(--r,22cqw) * var(--k,1) + 11cqw);transform:translate(-50%,-42%);border-radius:50%}
.orbite .bul .rond,.orbite .bul b{position:relative;z-index:1}
.orbite .bul.taped .rond{transform:scale(.9);box-shadow:0 0 0 6px rgba(232,52,71,.25)}

:root{--bg:#f6f3ee;--surface:#ffffff;--surface-2:#f8f5f0;--sunk:#f1ece4;--ink:#17181c;--muted:#5d5852;--line:#e7e1d7;
  --accent:#c8203a;--accent-ink:#fff;--accent-soft:#fbe6e8;--sch:#e83447;

  --perle:radial-gradient(circle at 32% 26%,#ffffff 0%,#ffffff 35%,#f4f0ea 70%,#e2dbd0 100%);

  --plateau:radial-gradient(circle at 40% 30%,#ffffff 0%,#f4f0ea 55%,#e6dfd4 100%);
  --ok:#17663d;--ok-soft:#e3f4ea;--warn:#8a5200;--warn-soft:#fdf0d8;--danger:#b81f33;--danger-soft:#fde8ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#f6f3ee;--surface:#ffffff;--surface-2:#f8f5f0;--sunk:#f1ece4;--ink:#17181c;--muted:#5d5852;--line:#e7e1d7;
  --accent:#c8203a;--accent-ink:#fff;--accent-soft:#fbe6e8;--sch:#e83447;
  --f-display:"Plus Jakarta Sans",system-ui,sans-serif;--display:var(--f-display);--f-body:"Plus Jakarta Sans",system-ui,sans-serif;--body:var(--f-body);

  --perle:radial-gradient(circle at 32% 26%,#ffffff 0%,#ffffff 35%,#f4f0ea 70%,#e2dbd0 100%);
  --perle-ombre:inset 0 -5px 10px rgba(90,80,60,.16),inset 0 5px 8px rgba(255,255,255,.95),0 10px 18px rgba(27,34,48,.14);
  --plateau:radial-gradient(circle at 40% 30%,#ffffff 0%,#f4f0ea 55%,#e6dfd4 100%);

html,body{background:radial-gradient(120% 70% at 70% 12%,#ffffff 0%,#f6f3ee 45%,#ece7df 100%) fixed!important;background-color:#f1ede6!important;color:var(--ink)}
body::before{background:transparent!important}
h1,h2,h3,.section-head h2,.page-head h1{font-family:var(--display)!important;font-weight:800!important;letter-spacing:-.015em}
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#decor .sports svg{position:absolute}
#decor .relief{position:absolute;right:-50px;top:96px;width:270px;height:270px;perspective:700px}
@media (min-width:900px){#decor .relief{right:4%;top:110px;width:430px;height:430px}#decor .sports svg{transform-origin:center}}
#decor .rel-in{position:absolute;inset:0;transform:rotateY(-22deg) rotateX(10deg);transform-style:preserve-3d}
#decor .rel-in img{position:absolute;left:28%;top:16%;height:72%;width:auto}
#decor .l-om{filter:brightness(0) blur(6px);opacity:.16;transform:translate(14px,18px)}
#decor .l-hi{filter:brightness(0) invert(1);opacity:.9;transform:translate(-2px,-2px)}
#decor .l-lo{opacity:.3}
#decor .orb1,#decor .orb2{position:absolute;border-radius:50%;transform:rotate(-14deg)}
#decor .orb1{left:-3%;top:36%;width:106%;height:36%;border:1.5px dashed rgba(232,52,71,.35)}
#decor .orb2{left:8%;top:42%;width:85%;height:24%;border:1px solid rgba(232,52,71,.25)}
#decor .pl1{position:absolute;left:21%;top:34%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a96,#d42a3f 60%,#9a1426);box-shadow:0 6px 12px rgba(212,42,63,.35)}
#decor .pl2{position:absolute;left:91%;top:59%;width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid #e83447}
#app,.main,#tabs{position:relative;z-index:1}


.topbar{background:rgba(255,255,255,.92)!important;position:sticky;top:0;z-index:30}
#tabs{position:fixed!important;z-index:40}
.brand-text{font-size:1.02rem!important;line-height:1.15!important;white-space:normal!important}
@media (max-width:480px){.brand-text{font-size:.8rem!important;overflow:visible!important;text-overflow:clip!important}.brand-tx{flex:1 1 auto!important;min-width:74px}.site-switch button{padding:6px 7px!important;font-size:12.5px!important}.top-right{gap:6px!important}}
.ep{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.ep-hello.hello2{align-items:flex-start;text-align:left}.ep-hello.hello2 h2{font-size:1.9rem}
.ep-hello small{color:var(--muted);text-transform:capitalize;font-size:.9rem}.ep-hello h2{margin:2px 0 8px;font-size:1.9rem}
.ep-etat{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem;text-decoration:none}
.ep-etat::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ep-etat.ok{background:#e3f4ea;color:#17663d}.ep-etat.ko{background:#fde8ea;color:#b81f33}
.ep-sig,.ep-t{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;cursor:pointer;border-radius:20px;position:relative;overflow:hidden;text-decoration:none}
.ep-sig{padding:18px;border:0;background:linear-gradient(180deg,#e23a4e,#c8203a);color:#fff;box-shadow:0 10px 22px rgba(200,32,58,.28)}
.ep-sig .ep-ic{background:rgba(255,255,255,.18);border:0}.ep-sig .ep-ic svg{stroke:#fff}
.ep-sig b{font-size:1.2rem;color:#fff}.ep-sig small{color:rgba(255,255,255,.92)}
.ep-ic{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--sch)}
.ep-ic svg{width:24px;height:24px;stroke:var(--tf,#c8203a);stroke-width:2.3}
.ep-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.ep-tx b{font-size:1.05rem}.ep-tx small{font-size:.86rem}
.ep-grid{display:grid;grid-template-columns:1fr;gap:10px}
.ep-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ep-duo .ep-t{flex-direction:column;align-items:flex-start;gap:8px;min-height:0}
@media (min-width:700px){.ep-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ep-t{padding:16px;min-height:80px;background:var(--tb);color:#1b2230;box-shadow:0 10px 24px rgba(27,34,48,.10);border:1px solid color-mix(in srgb,var(--tf) 18%,transparent)}
.ep-t::before{content:"";position:absolute;right:0;top:0;width:45%;height:100%;background-image:radial-gradient(color-mix(in srgb,var(--tf) 22%,transparent) 1.3px,transparent 1.5px);background-size:12px 12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.ep-t::after,.ep-sig::after{content:"";position:absolute;right:-16px;bottom:-26px;width:110px;height:112px;background:var(--logo) no-repeat center/contain;opacity:.08;transform:rotate(-10deg);pointer-events:none}
.ep-sig::after{opacity:.12;filter:brightness(0) invert(1)}
.ep-t>*,.ep-sig>*{position:relative;z-index:1}
.ep-t b{color:var(--tf)}.ep-t small{color:#3f4654}
.ep-chev{flex:none;width:20px;height:20px;fill:none;stroke:var(--tf);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ep-n,.ep-t .nb{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:#c8203a;color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem;position:static!important}
.ep-t .rond{display:contents}
.ep-indigo{--tb:#B4B6DE;--tf:#2D3183}.ep-peche{--tb:#E2BEA8;--tf:#8C4214}.ep-rouge{--tb:#f3c4ca;--tf:#9e1a2c}.ep-lav{--tb:#C6B8E1;--tf:#533689}.ep-gris{--tb:#cdd3dc;--tf:#2f3a4a}.ep-vert{--tb:#A3CAC5;--tf:#0B5A50}.ep-bleu{--tb:#AAC2EF;--tf:#184AA7}

/* ===== Charte « Schilick apaisé » : mêmes couleurs que le portail (bleu ardoise, rouge en touche, blanc) ===== */
.ep-t,.ep-bleu,.ep-peche,.ep-rouge,.ep-lav,.ep-gris,.ep-vert{--tb:#ffffff!important;--tf:var(--bt)!important}
.ep-t{border:1px solid #e3e6ee!important;border-left:4px solid #E73446!important;box-shadow:0 6px 18px rgba(var(--bs),.08)!important}
.ep-t::before{background-image:radial-gradient(rgba(var(--bs),.10) 1.3px,transparent 1.6px)!important}
.ep-ic{background:linear-gradient(150deg,var(--b1),var(--b2))!important;border:0!important;border-radius:16px!important;box-shadow:0 6px 14px rgba(var(--bs),.22)!important}
.ep-ic svg{stroke:#fff!important}
.ep-t b,.ep-sig b{font-family:'Raleway',system-ui,sans-serif!important;font-weight:800!important;letter-spacing:.005em}
.ep-t b{color:var(--bt)!important}.ep-t small{color:#5b6274!important}
.ep-chev{stroke:var(--bt)!important}
.ep-n{background:#eef1f8!important;color:var(--bt)!important}.ep-n.ko{background:#E73446!important;color:#fff!important}
.ep-sig{background:linear-gradient(150deg,var(--b1),var(--b2))!important;box-shadow:0 10px 22px rgba(var(--bs),.28)!important}
.ep-sig .ep-ic{background:rgba(255,255,255,.18)!important;box-shadow:none!important}
.ep-hello h1,.ep-hello h2,.hello h1,.hello h2{font-family:'Raleway',system-ui,sans-serif!important;font-weight:800!important;color:var(--bt)!important}
.bottomnav .centre .disc,.tabs .scan .scan-dot{background:linear-gradient(150deg,var(--b1),var(--b2))!important;box-shadow:0 8px 18px rgba(var(--bs),.32),0 0 0 4px #fff!important;border-color:#fff!important}
.bottomnav .center .disc{background:linear-gradient(150deg,var(--b1),var(--b2))!important;box-shadow:0 8px 18px rgba(var(--bs),.32),0 0 0 4px #fff!important}
.userbtn .av{background:linear-gradient(150deg,var(--b1),var(--b2))!important}
.site-switch button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--b2)!important;box-shadow:0 3px 8px rgba(var(--bs),.3)!important;color:#fff!important}
</style>

let toastTimer = 0;
function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 5000 : 2800);
}

let sheetCleanup = null;
function openSheet(html, mount) {
  const sheet = $('#sheet');
  $('#sheet-body').innerHTML = html;
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  sheetCleanup = mount ? mount($('#sheet-body')) || null : null;
  const f = $('#sheet-body [autofocus]');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() {
  const sheet = $('#sheet');
  if (sheet.hidden) return;
  sheet.hidden = true;
  document.body.style.overflow = '';
  $('#sheet-body').innerHTML = '';
  if (typeof sheetCleanup === 'function') sheetCleanup();
  sheetCleanup = null;
}
$('#sheet').addEventListener('click', (e) => {
  if (e.target.closest('[data-close-sheet]')) closeSheet();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = label || 'Enregistrement…'; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

function renderChrome() {
  const top = $('#topbar'), tabs = $('#tabs');
  top.hidden = false; tabs.hidden = false;
  const sw = $('#site-switch');
  if (isSecteur()) {
    sw.innerHTML = S.sites.map((s) => `<button type="button" data-site="${s.id}" aria-pressed="${s.id === S.site}">${esc(s.short_name)}</button>`).join('');
    sw.className = 'site-switch';
  } else {
    sw.className = '';
    sw.innerHTML = `<span class="site-label">${esc(siteShort(S.site))}</span>`;
  }
  renderTabs();
}
$('#site-switch').addEventListener('click', (e) => {
  const b = e.target.closest('[data-site]');
  if (!b) return;
  S.site = Number(b.dataset.site);
  S.draftIn = {}; S.draftInRef = '';
  lsSet('stock.site', S.site);
  renderChrome();
  refreshBadges();
  render();
});

async function loadCore() {

  S.sites = sites.data;

// Marques des fiches de sécurité de chaque produit (affichées partout en un coup d'œil)
async function loadBrands() {
  await loadRefs();
  if (!S.brandsReady) return;
  try {
    let rows;
    try { rows = await fetchAll(() => S.sb.from('safety_sheets').select('product_id, brand, revision_date').order('product_id')); S.sheetDatesReady = true; }
    catch { rows = await fetchAll(() => S.sb.from('safety_sheets').select('product_id, brand').order('product_id')); S.sheetDatesReady = false; }
    const by = {}, info = {};
    for (const r of rows) {
      (by[r.product_id] = by[r.product_id] || new Set()).add(r.brand || '');
      const k = info[r.product_id] = info[r.product_id] || {};
      const b = r.brand || '';
      if (!(b in k) || (r.revision_date && (!k[b] || r.revision_date > k[b]))) k[b] = r.revision_date || k[b] || null;
    }
    for (const p of S.products) {
      const fromRefs = (p.refs || []).map((r) => r.brand);
      const all = [...(by[p.id] ? [...by[p.id]] : []), ...fromRefs].filter(Boolean);
      const seen = new Set();
      p.brands = all.filter((b) => { const k = b.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => a.localeCompare(b));
      p.sheetInfo = S.sheetDatesReady && info[p.id] ? Object.entries(info[p.id]).map(([brand, date]) => ({ brand, date })) : [];
    }
    S.knownBrands = [...new Set([...rows.map((r) => r.brand), ...S.products.flatMap((p) => (p.refs || []).map((r) => r.brand))].filter(Boolean))].sort();
  } catch { /* hors ligne */ }
}
// Rubriques : marques et produits rattachés à chaque produit du stock
async function loadRefs() {
  if (!S.refsReady) return;
  try {
    const rows = await fetchAll(() => S.sb.from('product_refs').select('*').order('product_id'));
    const by = {};
    for (const r of rows) (by[r.product_id] = by[r.product_id] || []).push(r);
    for (const p of S.products) p.refs = (by[p.id] || []).sort((a, b) => a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name));
    S.refById = Object.fromEntries(rows.map((r) => [r.id, r]));
  } catch { /* hors ligne */ }
}

// Récupère toutes les lignes d'une requête (pages de 1 000)
async function fetchAll(build) {
  const out = [];
  for (let from = 0; from < 50000; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function refreshBadges() {
  if (!S.me || !isResp()) return;
  try {
    let q = S.sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'en_attente');
    q = q.eq('site_id', S.site);
    const { count } = await q;
    S.pending = count || 0;
    if (isSecteur()) {
      const r = await S.sb.from('profiles').select('id', { count: 'exact', head: true }).eq('active', false);
      S.pendingUsers = r.count || 0;
    }
    renderTabs();
  } catch { /* hors ligne */ }
}

// Sélecteur de quantité compact, lié à un objet {id: qty}
function bindMiniSteppers(root, store, onChange) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    const wrap = b.closest('.mini-stepper');
    const id = wrap.dataset.id;
    const inp = wrap.querySelector('input');
    let v = parseNum(inp.value);
    if (!Number.isFinite(v)) v = 0;
    v = Math.max(0, round2(v + Number(b.dataset.step)));
    inp.value = v ? fmt(v) : '';
    if (v) store[id] = v; else delete store[id];
    wrap.classList.toggle('on', !!v);
    onChange && onChange();
  });
  root.addEventListener('change', (e) => {
    const inp = e.target.closest('.mini-stepper input');
    if (!inp) return;
    const wrap = inp.closest('.mini-stepper');
    const v = parseNum(inp.value);
    if (Number.isFinite(v) && v > 0) { store[wrap.dataset.id] = round2(v); inp.value = fmt(v); }
    else { delete store[wrap.dataset.id]; inp.value = ''; }
    wrap.classList.toggle('on', !!store[wrap.dataset.id]);
    onChange && onChange();
  });
}
const miniStepper = (id, v) => `<span class="mini-stepper ${v ? 'on' : ''}" data-id="${id}"><button type="button" data-step="-1" aria-label="Moins">−</button><input type="text" inputmode="decimal" value="${v ? fmt(v) : ''}" placeholder="0" aria-label="Quantité"><button type="button" data-step="1" aria-label="Plus">+</button></span>`;

function stepperField(id, value, label) {
  return `<div class="field"><label for="${id}">${esc(label)}</label>
    <div class="stepper" data-stepper="${id}"><button type="button" data-d="-1" aria-label="Moins">−</button><input type="text" inputmode="decimal" id="${id}" value="${fmt(value)}"><button type="button" data-d="1" aria-label="Plus">+</button></div></div>`;
}
function bindStepper(root, id, onChange) {
  const wrap = root.querySelector(`[data-stepper="${id}"]`);
  const inp = wrap.querySelector('input');
  wrap.addEventListener('click', (e) => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    let v = parseNum(inp.value);
    if (!Number.isFinite(v)) v = 0;
    v = Math.max(0, round2(v + Number(b.dataset.d)));
    inp.value = fmt(v);
    onChange && onChange();
  });
  inp.addEventListener('input', () => onChange && onChange());
  inp.addEventListener('focus', () => inp.select());
  return () => parseNum(inp.value);
}

function download(filename, text, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCSV(rows) {
  const cell = (v) => {
    if (typeof v === 'number') return String(v).replace('.', ',');
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
}

function openRequest(r) {
  if (!r) return;
  const given = {};
  const lines = (r.request_items || []).map((it) => {
    const p = S.byId[it.product_id];
    const st = p ? Number(stockOf(p, r.site_id).quantity) : 0;
    given[it.id] = Math.min(Number(it.quantity), st);
    return { it, p, st };
  });
  openSheet(`
    <h2 id="sheet-title">Demande de ${esc(reqName(r))}</h2>
    <p class="muted small">${esc(dfTime.format(new Date(r.created_at)))} · ${esc(siteName(r.site_id))}</p>
    ${r.note ? `<p>« ${esc(r.note)} »</p>` : ''}
    <div class="list">${lines.map(({ it, p, st }) => `
      <div class="item">
        <span class="main-txt"><span class="title">${esc(p ? p.name : 'Produit')}${brandHead(p)}</span>
        <span class="sub">${esc(p?.packaging || '')} · demandé ${fmt(it.quantity)} · en stock ${fmt(st)}</span>
        ${st < Number(it.quantity) ? '<span class="sub" style="color:var(--warn);font-weight:700">Stock insuffisant pour tout remettre</span>' : ''}</span>
        ${miniStepper(it.id, given[it.id])}
      </div>`).join('')}</div>

    <div class="stack" id="rq-refuse-box" hidden>
      <div class="field"><label for="rq-reason">Motif du refus</label><input type="text" id="rq-reason" placeholder="Ex. : produit en rupture, déjà fourni hier"></div>
      <button type="button" class="btn danger block" id="rq-refuse-go">Confirmer le refus</button>
    </div>
    <button type="button" class="btn ghost block" id="rq-refuse">Refuser la demande</button>`,
  (root) => {
    bindMiniSteppers(root, given);
    $('#rq-refuse', root).onclick = (e) => { $('#rq-refuse-box', root).hidden = false; e.target.hidden = true; $('#rq-reason', root).focus(); };
    $('#rq-refuse-go', root).onclick = async (e) => {
      busy(e.target, true);
      const { error } = await S.sb.rpc('refuse_request', { p_request: r.id, p_reason: $('#rq-reason', root).value.trim() });
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      closeSheet(); toast('Demande refusée'); refreshBadges(); render();
    };
    $('#rq-ok', root).onclick = async (e) => {
      const payload = (r.request_items || []).map((it) => ({ item_id: it.id, given: given[it.id] || 0 }));
      if (!payload.some((x) => x.given > 0)) return toast('Rien à remettre : refusez plutôt la demande.', true);
      busy(e.target, true);
      const { error } = await S.sb.rpc('validate_request', { p_request: r.id, p_given: payload });
      busy(e.target, false);
      if (error) return toast(errMsg(error), true);
      if (S.agentsReady) await loadAgents();
      closeSheet(); toast('Demande validée, stock mis à jour'); refreshBadges(); render();
    };
  });
}
